<meta charset="utf-8">
<title>PC1 — starting</title>

<!--
  PC1 boot splash — standalone.

  One typographic lockup: the wordmark sits on a rule that fills with
  the machine's progress and then stays put as the wordmark's
  underline. No spinner, no glow, no bloom. The only colour on the
  screen is the blue in that rule, and the rule is the only thing that
  moves.

  Standalone in the sense that matters: it needs no network, no script
  but its own, and no stylesheet. It will USE Inter Tight if the font
  file happens to sit beside it (as it does in C:\ArcOS\web\), and
  falls back to Segoe UI Variable Display if not — the lockup is built
  from weight and spacing, so it survives the substitution.

  Query parameters:
    ?duration=7000   total sequence length in ms          (default 6400)
    ?next=index.html navigate here when the sequence ends  (default: hold)
    ?hold=1          loop the sequence instead of ending   (for long waits)
-->

<style>
@font-face{
  font-family:"Inter Tight";font-style:normal;font-weight:100 900;font-display:block;
  src:url("InterTight-latin.woff2") format("woff2");
}
@font-face{
  font-family:"Inter";font-style:normal;font-weight:100 900;font-display:block;
  src:url("Inter-latin.woff2") format("woff2");
}

:root{
  --void:#0b0b0d;
  --line:#2b2b32;
  --ice:#f4f5f7;
  --steel:#9c9da5;
  --dim:#6a6b73;
  --beam:#1a86ff;
  --display:"Inter Tight","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --sans:"Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --e-out:cubic-bezier(.16,.84,.24,1);

  /* Height-led scale, same rule as the shell: a console is read from a
     fixed distance and it is the panel's height that changes. */
  font-size:clamp(12px, min(1.62vh, 2.05vw), 40px);
  --edge:max(2.5rem, 2.6vw);
  --safe-y:max(1.6rem, 2.2vh);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;cursor:none;
  background:
    radial-gradient(64% 50% at 50% 44%, #131318 0%, rgba(11,11,13,0) 72%),
    var(--void);
  color:var(--ice);font-family:var(--sans);font-size:1rem;
  -webkit-font-smoothing:antialiased;
}

/* Centred on the screen, left-aligned inside itself: a splash that
   centres every line reads as a logo screen, and this one is meant to
   read as a machine reporting in. */
.core{
  position:fixed;inset:0;
  display:grid;place-content:center;justify-items:start;
  padding-bottom:1rem;
}
.lockup{width:24rem;max-width:74vw;display:grid}

.wordmark{
  display:flex;
  font-family:var(--display);font-size:4.25rem;font-weight:700;
  letter-spacing:-.045em;line-height:1;
}
.wordmark span{
  opacity:0;translate:0 .5rem;
  animation:letter .55s var(--e-out) forwards;
}
@keyframes letter{to{opacity:1;translate:0 0}}
@keyframes fade{to{opacity:1}}

.progress{
  width:100%;display:grid;gap:.75rem;margin-top:1.25rem;
  opacity:0;animation:fade .5s var(--e-out) .75s forwards;
}
.track{height:.125rem;background:var(--line);position:relative;overflow:hidden}
.fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:var(--beam);
  transition:width .5s var(--e-out);
}
.status{
  display:flex;justify-content:space-between;gap:1rem;
  font-size:.8125rem;color:var(--steel);
}
.status b{font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}

.meta{
  position:fixed;bottom:var(--safe-y);left:0;right:0;
  display:flex;justify-content:space-between;padding:0 var(--edge);
  font-size:.75rem;color:var(--dim);
  opacity:0;animation:fade .6s var(--e-out) 1.1s forwards;
}

/* Leaving is a fade, not a flash. */
body.out .core,body.out .meta{opacity:0;transition:opacity .4s ease-in}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.12s!important}
}
</style>

<div class="core">
  <div class="lockup">
    <div class="wordmark" id="wordmark" aria-label="PC1"></div>
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="status">
        <span id="stepText">Power-on self test</span>
        <b id="pctText">0%</b>
      </div>
    </div>
  </div>
</div>

<div class="meta">
  <span>PC1 OS 1.0</span>
  <span>Build 26100.4351</span>
</div>

<script>
"use strict";
const Q = new URLSearchParams(location.search);
const $ = (s) => document.querySelector(s);

const DURATION = Math.max(2000, Number(Q.get("duration")) || 6400);
const NEXT     = Q.get("next");
const HOLD     = Q.get("hold") === "1";

/* Steps are weighted, not evenly spaced — a real boot spends most of its
   time on drivers and services, and a bar that admits that reads as honest. */
const STEPS = [
  ["Power-on self test",      12, .10],
  ["Mounting NVMe volumes",   31, .13],
  ["Loading graphics driver", 54, .22],
  ["Starting PC1 shell",      78, .21],
  ["Restoring session",       94, .17],
  ["Ready",                  100, .17]
];

"PC1".split("").forEach((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch;
  s.style.animationDelay = (0.18 + i * 0.09) + "s";
  $("#wordmark").appendChild(s);
});

let timers = [];
function run(){
  timers.forEach(clearTimeout); timers = [];
  document.body.classList.remove("out");
  $("#fill").style.width = "0%";
  $("#pctText").textContent = "0%";
  $("#bar").setAttribute("aria-valuenow", "0");

  const lead = 900;
  const body = Math.max(800, DURATION - lead - 500);
  let at = lead;

  STEPS.forEach(([label, pct, share]) => {
    timers.push(setTimeout(() => {
      $("#stepText").textContent = label;
      $("#fill").style.width = pct + "%";
      $("#pctText").textContent = pct + "%";
      $("#bar").setAttribute("aria-valuenow", String(pct));
    }, at));
    at += body * share;
  });

  /* The filled rule holds for a beat before anything leaves: the
     lockup is the logo, and cutting the instant it completes never
     lets you see it as one. */
  timers.push(setTimeout(() => {
    if (HOLD){ run(); return; }
    document.body.classList.add("out");
    if (NEXT) setTimeout(() => { location.href = NEXT; }, 400);
  }, at + 420));
}
run();

/* Esc leaves the splash — an unattended kiosk still needs a way out. */
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && NEXT) location.href = NEXT;
});
</script>
