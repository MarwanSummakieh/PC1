<meta charset="utf-8">
<title>ARC OS — Starting PC1</title>

<!--
  ARC OS boot splash — standalone.

  Self-contained: no network, no fonts, no scripts beyond this file, so it
  renders identically whether it is shown by a kiosk browser at startup, an
  Electron splash window, or a full-screen frame during logon.

  Query parameters:
    ?duration=7000   total sequence length in ms          (default 6400)
    ?next=index.html navigate here when the sequence ends  (default: hold)
    ?hold=1          loop the sequence instead of ending   (for long waits)
-->

<style>
:root{
  --void:#04060b;
  --ice:#e6f0ff;
  --steel:#7f96b8;
  --dim:#33455f;
  --beam:#4c8dff;
  --beam-hot:#a6d4ff;
  --display:"Segoe UI Variable Display","Segoe UI Light","Segoe UI",system-ui,-apple-system,sans-serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --e-out:cubic-bezier(.16,.84,.24,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;cursor:none;
  background:radial-gradient(90% 70% at 50% 50%,#0a1220 0%,#04060b 62%,#020306 100%);
  color:var(--ice);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
#amb{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}

.core{
  position:fixed;inset:0;z-index:1;
  display:grid;place-content:center;justify-items:center;gap:34px;
  padding-bottom:24px;
}

.mark{width:min(132px,22vh);aspect-ratio:1}
.mark svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:#12203a;stroke-width:1.5}
.ring-arc{
  fill:none;stroke:url(#arcgrad);stroke-width:2.5;stroke-linecap:round;
  filter:drop-shadow(0 0 10px rgba(76,141,255,.55));
}
.ring-spin{transform-origin:50% 50%;animation:spin 1.5s linear infinite}
.node{fill:var(--beam-hot);filter:drop-shadow(0 0 8px rgba(166,212,255,.9))}
.mark.settled .ring-spin{animation:settle .9s var(--e-out) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes settle{to{transform:rotate(486deg)}}

.wordmark{
  display:flex;gap:.34em;
  font-family:var(--display);font-size:clamp(30px,4.6vh,46px);font-weight:200;
  letter-spacing:.30em;text-indent:.30em;
}
.wordmark span{opacity:0;translate:0 14px;filter:blur(6px);animation:letter .8s var(--e-out) forwards}
@keyframes letter{to{opacity:1;translate:0 0;filter:blur(0)}}

.sub{
  margin-top:-18px;font-size:11px;letter-spacing:.42em;text-transform:uppercase;
  color:var(--dim);opacity:0;animation:fade .9s var(--e-out) .9s forwards;
}
@keyframes fade{to{opacity:1}}

.progress{
  width:min(340px,64vw);display:grid;gap:14px;
  opacity:0;animation:fade .7s var(--e-out) 1.1s forwards;
}
.track{height:1.5px;background:#132038;border-radius:2px;position:relative;overflow:hidden}
.fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:linear-gradient(90deg,#1b3f8a,var(--beam) 60%,var(--beam-hot));
  box-shadow:0 0 14px rgba(76,141,255,.7);
  transition:width .5s var(--e-out);
}
.status{
  display:flex;justify-content:space-between;
  font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--steel);
}
.status b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}

.meta{
  position:fixed;bottom:26px;left:0;right:0;z-index:2;
  display:flex;justify-content:space-between;padding:0 34px;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  opacity:0;animation:fade 1s var(--e-out) 1.4s forwards;
}

#bloom{
  position:fixed;left:50%;top:50%;z-index:3;
  width:40vmax;height:40vmax;margin:-20vmax 0 0 -20vmax;border-radius:50%;
  background:radial-gradient(circle,#fff 0%,#cfe4ff 24%,rgba(76,141,255,.55) 46%,rgba(76,141,255,0) 72%);
  opacity:0;scale:.1;pointer-events:none;
}
#bloom.go{animation:bloom .85s var(--e-out) forwards}
@keyframes bloom{0%{opacity:0;scale:.1}22%{opacity:.95}100%{opacity:0;scale:5.2}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.12s!important}
}
</style>

<canvas id="amb"></canvas>

<div class="core">
  <div class="mark" id="mark">
    <svg viewBox="0 0 132 132" aria-hidden="true">
      <defs>
        <linearGradient id="arcgrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1b3f8a"/>
          <stop offset="55%" stop-color="#4c8dff"/>
          <stop offset="100%" stop-color="#a6d4ff"/>
        </linearGradient>
      </defs>
      <circle class="ring-track" cx="66" cy="66" r="52"/>
      <g class="ring-spin">
        <circle class="ring-arc" cx="66" cy="66" r="52" stroke-dasharray="196 131"/>
        <circle class="node" cx="66" cy="14" r="3.4"/>
      </g>
    </svg>
  </div>

  <div class="wordmark" id="wordmark" aria-label="ARC"></div>
  <div class="sub">Personal Console&nbsp;·&nbsp;PC1</div>

  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <div class="status">
      <span id="stepText">Power-on self test</span>
      <b id="pctText">0%</b>
    </div>
  </div>
</div>

<div class="meta">
  <span>ARC OS 1.0</span>
  <span>Build 26100.4351</span>
</div>

<div id="bloom"></div>

<script>
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const Q  = new URLSearchParams(location.search);
const $  = (s) => document.querySelector(s);

const DURATION = Math.max(2000, Number(Q.get("duration")) || 6400);
const NEXT     = Q.get("next");
const HOLD     = Q.get("hold") === "1";

/* Ambient field — the same drifting motes and light blooms as the shell,
   so the wipe into the home screen lands on a background already in motion. */
(function ambient(){
  const c = $("#amb"), ctx = c.getContext("2d");
  let w, h, dpr, motes = [];
  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px"; c.style.height = innerHeight + "px";
    motes = Array.from({length: Math.round(innerWidth * innerHeight / 30000)}, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: (Math.random() * 1.4 + .3) * dpr, v: (Math.random() * .15 + .04) * dpr,
      a: Math.random() * .4 + .1, p: Math.random() * Math.PI * 2
    }));
  }
  resize(); addEventListener("resize", resize);

  let t = 0;
  function blob(x, y, r, rgb, a){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${rgb},${a})`); g.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }
  (function frame(){
    t += RM ? 0 : .003;
    ctx.clearRect(0, 0, w, h);
    const R = Math.max(w, h);
    blob(w * .5, h * .46, R * .42, "27,63,138", ".34");
    blob(w * (.5 + Math.sin(t) * .1), h * (.5 + Math.cos(t * .8) * .08), R * .26, "76,141,255", ".12");
    for (const m of motes){
      if (!RM){
        m.y -= m.v; m.x += Math.sin(t * 3 + m.p) * .2 * dpr;
        if (m.y < -8){ m.y = h + 8; m.x = Math.random() * w; }
      }
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190,220,255,${m.a})`; ctx.fill();
    }
    requestAnimationFrame(frame);
  })();
})();

/* Steps are weighted, not evenly spaced — a real boot spends most of its
   time on drivers and services, and a bar that admits that reads as honest. */
const STEPS = [
  ["Power-on self test",      12, .10],
  ["Mounting NVMe volumes",   31, .13],
  ["Loading graphics driver", 54, .22],
  ["Starting ARC shell",      78, .21],
  ["Restoring session",       94, .17],
  ["Ready",                  100, .17]
];

"ARC".split("").forEach((ch, i) => {
  const s = document.createElement("span");
  s.textContent = ch;
  s.style.animationDelay = (0.42 + i * 0.11) + "s";
  $("#wordmark").appendChild(s);
});

let timers = [];
function run(){
  timers.forEach(clearTimeout); timers = [];
  $("#mark").classList.remove("settled");
  $("#bloom").classList.remove("go");
  $("#fill").style.width = "0%";
  $("#pctText").textContent = "0%";

  const lead = 1100;
  const body = Math.max(800, DURATION - lead - 500);
  let at = lead;

  STEPS.forEach(([label, pct, share]) => {
    timers.push(setTimeout(() => {
      $("#stepText").textContent = label;
      $("#fill").style.width = pct + "%";
      $("#pctText").textContent = pct + "%";
      $("#bar").setAttribute("aria-valuenow", String(pct));
    }, at));
    at += body * share;
  });

  timers.push(setTimeout(() => $("#mark").classList.add("settled"), at - 380));

  timers.push(setTimeout(() => {
    if (HOLD){ run(); return; }
    $("#bloom").classList.add("go");
    if (NEXT) setTimeout(() => { location.href = NEXT; }, 380);
  }, at + 120));
}
run();

/* Esc leaves the splash — an unattended kiosk still needs a way out. */
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && NEXT) location.href = NEXT;
});
</script>
