function fmtUptime(ms){
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + "d " + h + "h " + m + "m";
  if (h) return h + "h " + m + "m";
  return m + "m";
}
function fmtOffset(min){
  const sign = min < 0 ? "-" : "+", a = Math.abs(min);
  return "UTC" + sign + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}

/* ── Measured facts ─────────────────────────────────────── */
let measuredHz = 0;
function measureHz(){
  let n = 0;
  const t0 = performance.now();
  function step(){
    n++;
    if (performance.now() - t0 < 480) requestAnimationFrame(step);
    else measuredHz = Math.round(n / ((performance.now() - t0) / 1000));
  }
  requestAnimationFrame(step);
}
function displayFacts(){
  const dpr = devicePixelRatio || 1;
  return [
    ["Viewport",        innerWidth + " × " + innerHeight + " CSS px"],
    ["Device pixels",   Math.round(innerWidth * dpr) + " × " + Math.round(innerHeight * dpr)],
    ["Scale factor",    dpr.toFixed(2) + "×"],
    ["Screen",          screen.width + " × " + screen.height],
    ["Colour depth",    screen.colorDepth + "-bit"],
    ["Refresh rate",    measuredHz ? measuredHz + " Hz (measured)" : "measuring…"],
    ["Dynamic range",   matchMedia("(dynamic-range: high)").matches ? "High (HDR)" : "Standard"],
    ["Colour gamut",    matchMedia("(color-gamut: p3)").matches ? "Display-P3 or wider" : "sRGB"],
    ["Root scale",      remPx().toFixed(2) + " px / rem"]
  ];
}
function padFacts(){
  const out = [];
  try{
    const gp = navigator.getGamepads ? navigator.getGamepads() : [];
    let n = 0;
    for (const p of gp){
      if (!p) continue;
      n++;
      out.push(["Slot " + p.index, (p.id || "unknown").replace(/\s*\(.*$/, "")]);
      out.push(["Mapping", p.mapping || "(none)"]);
      out.push(["Controls", p.buttons.length + " buttons, " + p.axes.length + " axes"]);
    }
    if (!n) out.push(["Controllers", "none visible to the page"]);
  }catch(e){ out.push(["Controllers", "unavailable: " + e.message]); }
  out.push(["Host pad channel", Host.caps.nav
    ? "full (directions, face buttons, shoulders, phases)"
    : "legacy (left/right/cross/circle/L1/R1/options only)"]);
  out.push(["System channel", Host.caps.sys ? "live" : "not offered by this host build"]);
  return out;
}

/* ═══ Confirmation ═══════════════════════════════════════ */
/* The one place a power action is actually asked for, so the Power panel
   and the Settings category cannot drift apart — and so the sentence is
   the same one in both.

   That sentence is deliberately "asking", not "requested" and certainly
   not "done": Windows can refuse a suspend or a log-off and say nothing
   about it, in which case the host sends {type:"powerFail"} and Host.handle
   corrects this toast. Restart and shut down never come back at all — the
   process is gone — so nothing here claims an outcome. */
const POWER_ASK = {
  sleep:    "Asking Windows to go to rest mode…",
  restart:  "Asking Windows to restart…",
  shutdown: "Asking Windows to shut down…",
  signout:  "Asking Windows to sign out…"
};
function requestPower(action){
  Overlay.closeAll();
  Host.power(action);
  toast(POWER_ASK[action] || ("Asking Windows to " + action + "…"));
}

const POWER_COPY = {
  restart:  { title:"Restart the machine?",  sub:"Everything running closes. Anything unsaved is lost.", go:"Restart" },
  shutdown: { title:"Shut down the machine?", sub:"Everything running closes and the machine powers off.", go:"Shut down" },
  signout:  { title:"Sign out?",              sub:"This Windows session ends and the sign-in screen returns.", go:"Sign out" }
};
function confirmPower(action){
  const copy = POWER_COPY[action] || { title:"Are you sure?", sub:"", go:"Confirm" };
  const node = panelShell(copy.title, copy.sub, "Confirm");
  node.classList.add("confirm");
  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  /* Cancel is column 0 and takes focus: the safe answer is the one
     already selected, and confirming is a deliberate move sideways. */
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = "Cancel";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "back"; no.dataset.label = "cancel";
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = copy.go;
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "power"; go.dataset.arg = action;
  go.dataset.label = "confirm:" + action;
  [no, go].forEach(b => b.addEventListener("click", safe("confirm click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.querySelector(".panel-body").remove();
  node.appendChild(acts);
  pushPanel("confirm:" + action, node, { hints:["navLR", "confirm", "cancel"] });
}

/* ═══ Activation table ═══════════════════════════════════ */
const ACT = {
  noop(){},
  back(){ Focus.back(); },

  /* Rows built at runtime carry their behaviour as a closure on the
     element rather than a name in this table — a settings pane's rows
     depend on what the OS just said, and cannot be enumerated here. */
  run(el){
    if (typeof el.__mosRun !== "function"){ hostLog("run: no closure on " + (el.dataset.label || el.className)); return; }
    try{ el.__mosRun(el); }
    catch(err){ report("row " + (el.dataset.label || "action"), err); }
  },
  railPick(el){
    const i = [...$("#rail").children].indexOf(el);
    if (i >= 0) selectTile(i);
    doLaunch();
  },
  launch(){ doLaunch(); },
  appOptions(){ openAppOptions(); },

  ccPick(el){
    const p = el.dataset.panel;
    if (p) openPanel(p);
  },
  settingsCat(el){ ACT.settingsCatId(el.dataset.arg); },
  settingsCatId(id){
    if (Focus.top() && Focus.top().id === "panel:settings") return;   // the pane already follows focus
    if (Focus.has("panel:settings") && settingsGoto){
      Focus.popTo("panel:settings");
      settingsGoto(id);
      return;
    }
    if (!Focus.has("cc")) openCC("settings");
    Focus.popTo("cc");
    const sc = openPanel("settings");
    if (sc && settingsGoto) settingsGoto(id);
  },
  powerConfirm(el){ confirmPower(el.dataset.arg); },
  power(el){ requestPower(el.dataset.arg); },
  deviceName(){
    OSK.open({
      title: "Device name",
      value: deviceName,
      mode: "text",
      maxLength: 32,
      placeholder: "e.g. Living room",
      commitLabel: "Save",
      onCommit: safe("osk commit", (v) => setDeviceName(v)),
      onCancel: safe("osk cancel", () => hostLog("OSK cancelled — device name unchanged"))
    });
  },
  /* The file explorer. It is its own modal world with its own scope
     stack and its own hint bar, so the shell does not push a Focus
     scope for it — the router in Nav.action() is what makes it modal.

     What the shell does owe it is the way back. MarwanFiles calls onExit
     after it has torn its own DOM down, and Focus.repaint() puts the
     ring and the real DOM focus back on whatever was underneath: the
     Storage row in Settings, or the home tile, depending on where the
     human came in from. Without it the explorer closes onto a screen
     with no cursor and the next D-pad press goes nowhere visible. */
  openFiles(){
    const cameFrom = Focus.top() ? Focus.top().id : "(nothing)";
    Files.open({
      title: "Files",
      onExit: safe("files exit", () => {
        hostLog("files: closed, returning focus to " + cameFrom);
        Focus.repaint();
      })
    });
  },

  /* The browser. Same shape as openFiles(): its own modal world, its
     own controller model, and Focus.repaint() on the way out. */
  openBrowser(url){
    Browser.open(typeof url === "string" ? url : "");
  }
};

/* The launch path, unchanged in substance: #btnLaunch is still the
   thing that posts {type:launch} and the host still job-tracks the
   child and forces the foreground back afterwards. */
let launching = false;
/* The v2 shim owns a capture-phase Enter handler that posts {type:launch}
   before the page sees the key at all, and it cannot be unhooked from
   here. Rather than send a second message and spawn two children, note
   that it already fired and let it stand. v3 routes Enter through
   mosPad() like every other action and this window is never open. */
let shimEnterAt = -1e9;
function doLaunch(){
  if (performance.now() - shimEnterAt < 250){
    hostLog("launch already posted by the v2 shim's Enter handler — not duplicating");
    return;
  }
  if (launching) return;
  launching = true;
  setTimeout(() => { launching = false; }, 600);
  /* The press flash used to be on the hero button; that button is no
     longer drawn, so this is only kept because the v2 shim sets the same
     class on the same node and a null here would throw inside a launch. */
  const b = $("#btnLaunch");
  if (b){
    b.classList.add("pressed");
    setTimeout(() => { const el = $("#btnLaunch"); if (el) el.classList.remove("pressed"); }, 160);
  }

  /* A tile carrying `run` is built into the shell rather than being a
     child process — the explorer is the first of them. It must not
     reach {type:launch}, or the host would spawn the placeholder child
     underneath it. */
  const app = APPS[tab][idx];
  if (typeof app.run === "function"){
    hostLog("open (in-shell): " + app.id);
    try{ app.run(); }
    catch(err){ report("tile run " + app.id, err); }
    return;
  }
  /* Every tile the scan produces carries `run`, and so do the four the
     shell provides itself — so reaching here means a tile with nothing
     behind it. This used to post {type:"launch", target:""}, which makes
     the host spawn its default ChildCommand: notepad. A console that opens
     Notepad when you press Cross on a game is not a fallback, it is a lie
     with a window, so the shell says what is true and starts nothing. */
  hostLog("launch refused: " + (app.id || "(no id)") + " carries no run and no target");
  toast("This tile has nothing to open.");
}

/* Options for the focused title. It used to be one working row and two
   that only toasted the word "Stub", under a subtitle that admitted as
   much — three rows of navigation practice. What is left is what the
   shell can genuinely do with a title: start it, go back to it, close
   it, and show what the scan actually knows about it. There is no
   "Pin to the front" because there is nothing to pin to and no
   "App settings" because a title has none that this shell owns. */
function openAppOptions(){
  const app = APPS[tab][idx];
  const live = isRunningId(app.id);
  const node = panelShell(app.title, app.desc || "", "Options");
  const body = node.querySelector(".panel-body");

  let n = 0;
  body.appendChild(rowEl(
    live ? { label:"Resume",  sub:"Go back to " + app.name, icon:"play", act:"appResume" }
         : { label: app.action || "Launch", sub: (app.action || "Launch") + " " + app.name,
             icon: app.icon || "play", act:"launchFromPanel" }, n++, 0));
  if (live)
    body.appendChild(rowEl({ label:"Close", sub:"Quit " + app.name + " and everything it started",
                             icon:"stop", act:"appClose", tone:"danger" }, n++, 0));

  /* Whatever the library scan knows. `facts` is the same table the hero
     shows on the right; here it is the whole point of the panel rather
     than a strip under the buttons. */
  if (app.facts && app.facts.length) body.appendChild(factsEl(app.facts));
  if (app.tags && app.tags.length)
    body.appendChild(factsEl([["Capabilities", app.tags.join(" · ")]]));

  pushPanel("appOptions", node, { hints:["navUD", "select", "back"] });
}
ACT.launchFromPanel = function(){ Overlay.closeAll(); doLaunch(); };

/* ═══ What is running ════════════════════════════════════
   The host publishes; this subscribes. It is never polled — the
   page cannot see the process table and any interval it invented
   here would either lag or burn a scan the host has already done.

   Message shape (host -> page), pushed on every change:

     {type:"apps",
      running:[{id,title,kind,pid,tracked,foreground,pids}],
      background:[{name,category,pid,procs,actionable}]}

   `running` is zero or one entry: the app the shell has yielded to
   and can Resume, Minimise or Close. `background` is everything
   worth naming that is up, whether the shell started it or not —
   Steam, Discord, Vanguard — each with a friendly name, a category
   (game | launcher | social | media | capture | service | anticheat)
   and `actionable`, which is false for the things a shell must not
   offer to kill.

   This module is the data and nothing else. paintRunning() below
   turns Apps.background() into the status bar's chips, and draws
   nothing at all until a message has actually arrived. */
const Apps = (function(){
  let running = null;
  let background = [];
  const listeners = [];

  function emit(){
    listeners.forEach(fn => { try{ fn(running, background); }catch(err){ report("apps listener", err); } });
  }

  return {
    handle(m){
      const was = running && running.id;
      running = (m.running && m.running.length) ? m.running[0] : null;
      background = m.background || [];
      if ((running && running.id) !== was)
        hostLog("apps: running = " + (running ? running.title + " (pid " + running.pid +
                (running.tracked ? ", tracked" : ", untracked") + ")" : "nothing"));
      applyRunningMarks();
      try{ paintRunning(); }catch(err){ report("running status", err); }
      emit();
    },
    /* True for the library id of the app that is open right now. The rail
       and the hero both ask this; nothing else should need to. */
    isRunning(id){ return !!(running && id && running.id === id); },
    current(){ return running; },
    background(){ return background.slice(); },
    onChange(fn){ listeners.push(fn); try{ fn(running, background); }catch(e){} },
    ask(){ Host.post({ type:"app", cmd:"state" }); }
  };
})();

/* The rail and the hero both ask "is this one open?" — from buildRail(),
   which runs during boot, and from MarwanLibrary.onUpdate, which can fire
   at any moment. Naming the const directly from either of those is a
   temporal-dead-zone ReferenceError, and paintHero()'s safe() wrapper
   swallowed it AFTER writing the title and BEFORE writing the tags, the
   fact table and the class that fades the block back in: the hero
   rendered half-drawn, permanently, and nothing on screen said so.
   The try/catch is the point — it is the only construct that survives a
   TDZ read. */
function isRunningId(id){
  try{ return Apps.isRunning(id); }
  catch(e){ return false; }
}

/* ── What is running, in the status bar ───────────────────
   Rendered from Apps.background() and from nothing else. The host is
   the only thing in this system that can see the process table; if it
   has not spoken, this draws NOTHING — no skeleton, no example, no
   "Steam · Discord" placeholder that a photograph of the screen would
   turn into a lie. An empty status bar is the honest state of a shell
   that has not been told.

   Chips are focusables in row 0 of the home scope, where the gear and
   the power glyph used to be, so pressing up from the tabs still lands
   on the top right. */
const RUN_MAX = 3;          // beyond this, one "+N" chip that opens the list

function paintRunning(){
  const wrap = $("#running"), list = $("#runningList");
  if (!wrap || !list) return;
  const bg = Apps.background();

  list.innerHTML = "";
  if (!bg.length){
    /* Nothing running, or nothing said. Either way there is nothing to
       show, and a "Nothing running" label on a television is a row of
       text that never changes. */
    wrap.hidden = true;
    refreshHomeItems();
    return;
  }
  wrap.hidden = false;

  const shown = bg.slice(0, RUN_MAX);
  shown.forEach((b, i) => list.appendChild(runChip(b, i)));
  if (bg.length > shown.length){
    const more = document.createElement("button");
    more.className = "runchip more";
    more.setAttribute("data-nav", "0," + shown.length);
    more.dataset.act = "run";
    more.dataset.label = "running:more";
    more.innerHTML = "<b></b>";
    more.querySelector("b").textContent = "+" + (bg.length - shown.length) + " more";
    more.setAttribute("aria-label", (bg.length - shown.length) + " more running");
    more.__mosRun = () => runningListPanel();
    wireRunChip(more);
    list.appendChild(more);
  }
  refreshHomeItems();
}

function runChip(b, i){
  const el = document.createElement("button");
  el.className = "runchip k-" + (b.category || "service");
  el.setAttribute("data-nav", "0," + i);
  el.dataset.act = "run";
  el.dataset.label = "running:" + (b.name || "?");
  el.setAttribute("aria-label", (b.name || "Unknown") + " — " + runCategoryWord(b.category));
  el.innerHTML = "<i></i><b></b>";
  el.querySelector("b").textContent = b.name || "Unknown";
  el.__mosRun = () => runningPanel(b);
  wireRunChip(el);
  return el;
}

function wireRunChip(el){
  el.addEventListener("click", safe("runchip click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(el); Focus.activate();
  }));
}

/* The host's category vocabulary, spelled for a human. Unknown values
   are passed through rather than mapped to "Other": a category this
   page has not heard of is the host telling us something new, and
   swallowing it would hide it. */
const RUN_CATEGORY = {
  game:"Game", launcher:"Launcher", social:"Social", media:"Media",
  capture:"Capture", service:"Service", anticheat:"Anti-cheat"
};
function runCategoryWord(c){ return RUN_CATEGORY[c] || (c || "Running"); }

/* One background app, named and explained. What it can DO with it is
   decided by what the host can actually carry out: resume and close
   exist for the one app the shell has yielded to and is tracking, and
   for nothing else — there is no close-this-pid command, and a Close
   that quietly terminated a different process tree would be far worse
   than no Close at all. */
function runningPanel(b){
  const cur = Apps.current();
  const isTracked = !!(cur && (cur.pid === b.pid || (cur.title || "") === (b.name || "")));
  const node = panelShell(b.name || "Running",
    isTracked ? "This is the app the shell is in front of."
              : "Running behind the shell. The host reported it; the shell did not start it.",
    "Running");
  const body = node.querySelector(".panel-body");

  body.appendChild(factsEl([
    ["Kind",       runCategoryWord(b.category)],
    ["Process id", b.pid ? String(b.pid) : "—"],
    ["Processes",  typeof b.procs === "number" ? String(b.procs) : "—"],
    ["Foreground", isTracked ? (cur && cur.foreground ? "Yes" : "No — the shell is in front") : "No"]
  ]));

  let n = 0;
  if (isTracked){
    [
      { label:"Resume",   sub:"Go back to " + (b.name || "it"),                 icon:"play",  act:"appResume" },
      { label:"Minimise", sub:"Stay here. " + (b.name || "It") + " keeps running.", icon:"shell", act:"appMinimise" },
      { label:"Close",    sub:"Quit it and everything it started",              icon:"stop",  act:"appClose", tone:"danger" }
    ].forEach(o => body.appendChild(rowEl(o, n++, 0)));
  }
  body.appendChild(actionRow({
    label:"Refresh", sub:"Ask the host what is running right now", icon:"update",
    run: () => { Apps.ask(); toast("Asked the host for the running list."); }
  }, n++, 0));

  if (!isTracked){
    body.appendChild(noteEl(b.actionable
      ? "The shell can only resume or close the app it launched and is tracking. " +
        "<b>" + escHTML(b.name || "This") + " came up on its own</b>, so there is nothing here that " +
        "could close it without the host growing a close-by-process-id command."
      : "<b>" + escHTML(b.name || "This") + " cannot be closed from a menu.</b> The host reports it as " +
        "not actionable — an anti-cheat driver or a Windows service is not something a living-room " +
        "shell gets to terminate."));
  }
  return pushPanel("running", node, { hints:["navUD", "select", "back"] });
}

/* Everything, when there is more than the status bar has room for. */
function runningListPanel(){
  const bg = Apps.background();
  pickerPanel({
    id:"runningAll", eyebrow:"Running", title:"Running in the background",
    sub:"Everything the host can see that is worth naming. It is a curated list, not the process table.",
    items: bg.map(b => ({
      bg: b, label: b.name || "Unknown",
      sub: [runCategoryWord(b.category), b.pid ? "pid " + b.pid : null,
            typeof b.procs === "number" ? b.procs + (b.procs === 1 ? " process" : " processes") : null]
           .filter(Boolean).join(" · "),
      icon: b.category === "game" ? "play" : (b.category === "anticheat" ? "info" : "shell")
    })),
    emptyText:"Nothing is running.",
    onPick: (it) => { if (it.bg) runningPanel(it.bg); }
  });
}

/* Paint the running state onto the rail and the hero. Cheap and
   idempotent: called on every apps message and after every rail
   rebuild, because a rebuild throws the marks away with the tiles. */
function applyRunningMarks(){
  const list = APPS[tab] || [];
  [...$("#rail").children].forEach((t, n) => {
    const app = list[n];
    const on = !!(app && Apps.isRunning(app.id));
    t.classList.toggle("running", on);
    let pill = t.querySelector(".tile-live");
    if (on && !pill){
      pill = document.createElement("span");
      pill.className = "tile-live";
      pill.textContent = "Running";
      t.appendChild(pill);
    } else if (!on && pill){
      pill.remove();
    }
  });
  const app = list[idx];
  if (app){
    const on = Apps.isRunning(app.id);
    /* #btnLaunch is not drawn any more, but it is still the host shim's
       click target and still the thing the trace names, so its label
       stays true. What the HUMAN reads is the tile's Running pill above
       and the Cross chip in the hint bar below. */
    const lbl = $("#launchLabel");
    if (lbl) lbl.textContent = on ? "Resume" : (app.action || "Launch");
    const b = $("#btnLaunch");
    if (b) b.dataset.label = on ? "resume" : "launch";
  }
  /* The Cross chip reads "Resume" for a running title, so a change in
     the running set has to redraw the hint bar. Nothing else does it:
     no focus moved. */
  try{ Hints.render(); }catch(e){}
}

/* ═══ The guide menu ═════════════════════════════════════
   What a short press of PS opens when something is running. Three
   rows and no cleverness: the thing you almost always want (Resume)
   is focused, the thing that loses work (Close) is last and behind a
   confirmation. It is an ordinary panel on the existing focus stack,
   so Circle backs out of it exactly like every other panel and the
   pad hints are the ones the human already knows. */
/* ── Pointer mode's keyboard ──────────────────────────────
   The whole of the shell's involvement in pointer mode. The host has
   already brought this window forward and is holding the target window's
   handle; all this does is put the keyboard up and hand back what was
   typed. Two ways to finish, because out there they are different
   outcomes: "Done" types the text and stops, "Done + ⏎" types it and
   presses Enter, which is how a sign-in form is submitted once the shell
   has gone away again. Circle cancels and the host simply goes back.

   Nothing here is stored, echoed to the log, or kept after the message
   is posted — the obvious use is a sign-in field. */
function openPointerKeyboard(title){
  const where = title ? ("Type into “" + title + "”") : "Type into the window in front";
  hostLog("pointer mode asked for the keyboard" + (title ? " for '" + title + "'" : ""));
  Overlay.closeAll();
  OSK.open({
    title: where,
    mode: "send",
    value: "",
    placeholder: "Done types it · Done + ⏎ types it and presses Enter",
    onCommit: safe("ptr commit", (v, meta) => {
      Host.post({ type:"ptr", cmd:"text", text: String(v == null ? "" : v),
                  enter: (meta && meta.enter) ? 1 : 0 });
      hostLog("pointer mode: " + String(v == null ? "" : v).length + " characters sent to the host" +
              ((meta && meta.enter) ? " with Enter" : ""));
    }),
    onCancel: safe("ptr cancel", () => {
      Host.post({ type:"ptr", cmd:"cancel" });
      hostLog("pointer mode: keyboard cancelled, going back to the window");
    })
  });
}

function openGuideMenu(app){
  const a = app || Apps.current();
  if (!a){
    /* The host only sends this with something running, so arriving
       here means the app exited between the press and the message.
       Say so rather than opening an empty menu. */
    toast("Nothing is running.");
    return;
  }
  Overlay.closeAll();
  const node = panelShell(a.title, a.tracked
    ? "This app is open. The shell is in front of it."
    : "This app is open, but the shell could not attach to it — it will not know when the app closes.",
    "Guide");
  const body = node.querySelector(".panel-body");
  [
    { label:"Resume",   sub:"Go back to " + a.title, icon:"play",  act:"appResume" },
    { label:"Minimise", sub:"Stay here. " + a.title + " keeps running.", icon:"shell", act:"appMinimise" },
    { label:"Close",    sub:"Quit " + a.title + " and everything it started", icon:"stop",
      act:"appClose", tone:"danger" }
  ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
  pushPanel("guide", node, { hints:["navUD", "select", "back"] });
  hostLog("guide menu opened for " + a.title);
}

ACT.appResume = function(){
  const a = Apps.current();
  Overlay.closeAll();
  hostLog("guide: resume " + (a ? a.title : "(nothing)"));
  Host.post({ type:"app", cmd:"resume" });
};

ACT.appMinimise = function(){
  Overlay.closeAll();
  hostLog("guide: minimise — staying in the shell");
  Host.post({ type:"app", cmd:"minimise" });
};

/* Close terminates a process tree. A game does not get to save first,
   so this is the one guide action that asks. Cancel is the default. */
ACT.appClose = function(){
  const a = Apps.current();
  const name = a ? a.title : "this app";
  confirmAction({
    id:"appClose",
    eyebrow:"Close",
    title:"Close " + name + "?",
    sub:"It will be shut down immediately, together with everything it started. " +
        "Anything unsaved is lost.",
    goLabel:"Close it",
    cancelLabel:"Keep it open",
    onConfirm(){
      Overlay.closeAll();
      hostLog("guide: close " + name + " (confirmed)");
      Host.post({ type:"app", cmd:"close" });
    }
  });
};

/* ═══ Semantic action router ═════════════════════════════
   One table, whatever the source: host pad message, Gamepad API
   fallback, or keyboard. Everything returns a short string so the
   host log reads as a trace of what the page actually did. */
const Nav = (function(){
  const table = {
    left:  () => Focus.move(-1, 0) ? "moved left"  : "no target to the left",
    right: () => Focus.move( 1, 0) ? "moved right" : "no target to the right",
    up:    () => Focus.move(0, -1) ? "moved up"    : "no target above",
    down:  () => Focus.move(0,  1) ? "moved down"  : "no target below",
    launch:   () => Focus.activate(),
    select:   () => Focus.activate(),
    back:     () => Focus.back(),
    /* "cc" is the wire name the host uses for the Options button (and
       for a touchpad click — HostForm sends "cc" for both). The name is
       the host's and cannot be changed from here; what it DOES is ours,
       and it is now the app-options menu for the focused title, not the
       control centre. The control centre moved to PS — see `guide`.
       Guarded exactly like `triangle`, because a title's options make no
       sense from three panels deep. The explorer, the browser and the
       keyboard each swallow this action before it ever reaches here. */
    cc:       () => { if (Focus.depth() > 1) return "options is a home-screen control"; openAppOptions(); return "opened app options"; },
    /* L1 and R1. The host sends these two names and only these two —
       tabPlay for L1, tabMedia for R1 — so with a third view they stop
       naming a destination and start meaning "the one before" and "the one
       after". The chip has always read "Switch view", which is now what it
       does. tabApps is here for completeness: nothing on the wire sends it,
       but the shim vocabulary is a public surface and a name that exists
       should work. */
    tabPlay:  () => { if (Focus.depth() > 1) return "tabs are a home-screen control"; return "tab=" + cycleTab(-1); },
    tabMedia: () => { if (Focus.depth() > 1) return "tabs are a home-screen control"; return "tab=" + cycleTab(1); },
    tabApps:  () => { if (Focus.depth() > 1) return "tabs are a home-screen control"; setTabTo("apps"); return "tab=" + tab; },
    square:   () => { openAppOptions(); return "opened details"; },
    /* Triangle is deliberately NOT a second way into app options. One
       action, one button: the Options button (the wire name is `cc`)
       owns it, which is where a console player looks for a menu. Two
       buttons doing the same thing taught nothing and made the hint bar
       claim two glyphs for one outcome. */
    triangle: () => "triangle is unbound",
    /* PS. Unchanged in code and now the ONLY way in: it opens the
       control centre, and pressing it again (or from inside a panel)
       closes the whole overlay. The host reaches here only when nothing
       is running — with a live app a short PS opens the guide menu
       instead, which the host asks for by message, not by action. */
    guide:    () => { toggleOverlay(); return "guide -> control centre"; }
  };
  function action(name, phase, button){
    /* The keyboard is modal and comes first. */
    try{
      const took = OSK.route(name, phase, button);
      if (took !== null) return took;
    }catch(err){ report("osk route " + name, err); }

    /* Then a permission, if one is waiting. Above the explorer and the
       browser, and below the keyboard only because nothing on this
       sheet can want typing. It has to come before the browser in
       particular: the browser is modal and takes every action once it
       is open, so a permission raised BY a page would never see a
       single press if it were asked after. */
    try{
      const took = Grant.route(name, phase, button);
      if (took !== null) return took;
    }catch(err){ report("grant route " + name, err); }

    /* Then the explorer, which is modal over the whole shell but under
       the keyboard: renaming a file puts the keyboard on top of it. */
    try{
      const took = Files.route(name, phase, button);
      if (took !== null) return took;
    }catch(err){ report("files route " + name, err); }

    /* Then the browser, on the same terms. The two are never up at once
       (each is reached from the home rail, and each is modal), so their
       order here is only a formality — but it has to be after the
       keyboard, because typing an address is the keyboard over the
       browser and the keyboard must get the keys. */
    try{
      const took = Browser.route(name, phase, button);
      if (took !== null){ sync(); return took; }
    }catch(err){ report("browser route " + name, err); }

    let out;
    if (phase === "release") out = "release (the shell acts on press)";
    else {
      const fn = table[name];
      if (!fn) out = "unknown action '" + name + "'";
      else {
        try{ out = String(fn()); }
        catch(err){ report("action " + name, err); out = "action " + name + " failed (contained)"; }
      }
    }
    sync();
    return out;
  }

  /* Whatever just happened may have opened or closed a shell overlay, and
     if the browser is up it has to step aside for exactly as long as one is
     on screen. It cannot be done inside toggleOverlay() alone: Circle at
     the root of the control centre, Overlay.closeAll() from a power row and
     a panel popping itself all close it without going near that function.
     The end of the router is the one place they all pass through. */
  function sync(){
    try{ Browser.syncOverlay(); }catch(err){ report("browser overlay sync", err); }
  }
  return { action, table };
})();

/* ═══ Sensory layer ════════════════════════
   ui/sfx.js wraps Nav.action(). It reads what just happened out of the
   action's own return string and the change in focus depth, so sound and
   haptics stay in step with the shell without the shell having to
   announce anything. No file, no behaviour: the shell runs silent rather
   than failing. */
try{
  if (window.MarwanFeel){ MarwanFeel.setLogger(hostLog); MarwanFeel.attach(Nav, Focus); }
  else hostLog("MarwanFeel missing; the shell will run silent");
}catch(e){ report("sensory layer attach", e); }

/* window.mosPad is the v3 shim's single entry point. phase is
   press/repeat/release and button is the literal pad button, both
   absent on the v2 host. */
window.mosPad = function(action, phase, button){
  Host.hostOwned.add(action);
  return Input.pad(action, phase, button);
};

/* ── v2 shim adapters ─────────────────────────────────────
   The shipping host drives these four names directly. Keeping them as
   thin adapters onto the focus manager is what lets the new UI run on
   the binary that is already the Windows shell.

   Note the naming: the shell's own functions are selectTile /
   setTabTo / toggleOverlay, never select / setTab / toggleCC. A
   top-level function declaration and window.<same name> are one
   binding, so an adapter that called the "internal" name would call
   itself until the stack ran out. */
window.select = safe("shim select", function(i, instant){
  Input.set("pad");
  const cur = idx;
  const d = i - cur;
  const sc = Focus.top();
  const onRail = sc === homeScope && (Focus.current(sc) || {}).el &&
                 Focus.current(sc).el.classList.contains("tile");
  if (sc && sc.id === "home" && !onRail && (d === 1 || d === -1))
    return Nav.action(d > 0 ? "right" : "left");
  selectTile(i, instant);
  const el = $("#rail").children[idx];
  if (sc && sc.id === "home" && el) Focus.focusEl(el);
  return "rail index " + idx;
});
window.setTab   = safe("shim setTab",   function(name){ Input.set("pad"); setTabTo(name); return "tab=" + tab; });
window.toggleCC = safe("shim toggleCC", function(){ Input.set("pad"); return toggleOverlay(); });
window.closeCC  = safe("shim closeCC",  function(){ Input.set("pad"); return Focus.back(); });

/* ═══ Gamepad API supplement ═════════════════════════════
   WebView2 does surface the DualSense through navigator.getGamepads
   (the host log confirms it: standard mapping, 18 buttons). The host's
   raw-HID path is authoritative, so this only ever emits actions the
   host has never sent — which on the v2 binary means up/down and the
   remaining face buttons, and on v3 means nothing at all. */
(function gamepadSupplement(){
  const MAP = { 2:"square", 3:"triangle", 12:"up", 13:"down", 16:"guide" };
  const AXIS_V = 1, DEAD = .55;
  const FIRST = 400, NEXT = 200;
  let prev = {}, vDir = 0, vAt = 0;

  function emit(action, phase){
    if (Host.hostOwned.has(action)) return;      // the host owns it; never double-fire
    const r = Input.pad(action, phase, action);
    if (phase !== "release" && phase !== "repeat")
      hostLog("pad(gamepad-api) " + action + " -> " + r);
  }

  function poll(){
    try{
      const gp = navigator.getGamepads ? navigator.getGamepads() : null;
      if (gp){
        let pad = null;
        for (const p of gp) if (p && p.connected){ pad = p; break; }
        if (pad){
          for (const k in MAP){
            const i = +k, down = !!(pad.buttons[i] && pad.buttons[i].pressed);
            if (down && !prev[i]) emit(MAP[i], "press");
            else if (!down && prev[i]) emit(MAP[i], "release");
            prev[i] = down;
          }
          const ay = pad.axes.length > AXIS_V ? pad.axes[AXIS_V] : 0;
          const dir = ay <= -DEAD ? -1 : (ay >= DEAD ? 1 : 0);
          const now = performance.now();
          if (dir !== vDir){
            const was = vDir;
            vDir = dir;
            if (dir){ emit(dir < 0 ? "up" : "down", "press"); vAt = now + FIRST; }
            else if (was) emit(was < 0 ? "up" : "down", "release");
          } else if (dir && now >= vAt){
            emit(dir < 0 ? "up" : "down", "repeat");
            vAt = now + NEXT;
          }
        }
      }
    }catch(e){ /* a poll must never be able to stop the loop */ }
    setTimeout(poll, 40);
  }
  poll();
})();

/* ═══ Clock ══════════════════════════════════════════════ */
function tick(){
  const d = new Date();
  $("#clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ═══ Keyboard ═══════════════════════════════════════════
   Still a debugging convenience, per the brief. Synthetic events
   (isTrusted === false) are the v2 shim relaying the pad, so they must
   not flip the hint bar to key caps. */
addEventListener("keydown", safe("keydown", (e) => {
  if (e.isTrusted !== false) Input.set("key"); else Input.set("pad");

  /* MarwanOSK installs its own capture-phase handler and stops the keys it
     uses. The ones it does not use must still not reach the shell, or
     "c" would open the control centre behind an open keyboard. */
  if (OSK.isOpen()) return;

  switch (e.key){
    case "Escape":    e.preventDefault(); Nav.action("back"); return;
    case "ArrowLeft": e.preventDefault(); Nav.action("left"); return;
    case "ArrowRight":e.preventDefault(); Nav.action("right"); return;
    case "ArrowUp":   e.preventDefault(); Nav.action("up"); return;
    case "ArrowDown": e.preventDefault(); Nav.action("down"); return;
    case "Enter":
      e.preventDefault();
      if (e.isTrusted && window.__mosShim && !Host.caps.nav) shimEnterAt = performance.now();
      Nav.action("launch");
      return;
    case " ":         e.preventDefault(); Nav.action("select"); return;
    case "Tab":
      /* One key, so it goes forwards — the same direction R1 walks. */
      e.preventDefault();
      Nav.action("tabMedia");
      return;
  }
  const k = e.key.toLowerCase();
  /* The key caps follow the SCREEN, not the wire name. "C" has always
     been the control centre and still is — which after the pad remap
     means it routes to "guide" (PS), because "cc" is the Options button
     and the Options button now opens a title's options. "O" and the
     Options button. Triangle is unbound, so O routes to `cc` — the wire
     name the host sends for the Options button — and the hint chip shows
     that one glyph alone. */
  if (k === "c"){ e.preventDefault(); Nav.action("guide"); return; }
  if (k === "x"){ e.preventDefault(); Nav.action("square"); return; }
  if (k === "o"){ e.preventDefault(); Nav.action("cc"); return; }
  if (k === "g"){ e.preventDefault(); Nav.action("guide"); return; }
}));

/* ═══ Wiring ═════════════════════════════════════════════ */
document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", safe("tab click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key");
    setTabTo(t.dataset.tab);
    Focus.focusEl(t);
  })));

/* #btnLaunch keeps its id and its meaning even though it is no longer
   drawn. The v2 shim calls .click() on it for Cross, which arrives as a
   synthetic click (detail === 0) — that must mean "activate whatever is
   focused", not "always launch", now that Cross also drives menus.
   Registering here, at parse time, puts this listener ahead of the
   shim's own, and stopping propagation keeps exactly one launch message
   on the wire. A real mouse click can no longer happen (the element is
   display:none), so there is only the synthetic path left; the guard
   stays anyway rather than trusting the stylesheet with correctness. */
$("#btnLaunch").addEventListener("click", safe("launch click", (ev) => {
  ev.stopImmediatePropagation();
  ev.preventDefault();
  Input.set(ev.detail === 0 ? "pad" : "key");
  Nav.action("launch");
}), false);

/* #btnOptions is gone from the document entirely, and unlike #btnLaunch
   nothing outside this page ever referred to it — the host shim knows
   only #btnLaunch. Its job is now the pad's Options button, routed
   through Nav's "cc" action to openAppOptions(). */

/* The status bar's gear and power glyph used to be wired here. Both
   screens are one press away in the control centre (PS on the pad, "C"
   on the keyboard), which is where the whole of Settings and the whole
   of Power already lived; the top right is now the one thing neither of
   them could tell you, which is what is running behind this screen. */
$("#cc").addEventListener("click", safe("cc backdrop", (e) => {
  if (e.target.id === "cc"){ Input.set("key"); Overlay.closeAll(); }
}));
let resizeTimer = 0;
addEventListener("resize", safe("resize", () => {
  centre();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(safe("resize settle", () => {
    centre();
    const sc = Focus.top();
    if (sc && sc.id === "panel:display"){ Focus.pop(); openPanel("display"); }
  }), 220);
}));

/* ═══ Go ═════════════════════════════════════════════════ */
buildRail();
buildCC();
paintUser();
paintHero(APPS.play[0], true);
tick();
setInterval(tick, 15000);
measureHz();

Focus.push(homeScope);
refreshHomeItems();
(function focusRailFirst(){
  const el = $("#rail").children[idx];
  if (el) Focus.focusEl(el, true);
})();
Overlay.sync();
Hints.render();

Host.post({ type:"sysinfo" });          // v3 answers; v2 logs it as unhandled
Host.onSysinfo(safe("apply sysinfo", (s) => {
  hostUser = s.user || hostUser;
  paintUser();
  if (s.netType){ $("#chipNet").textContent = s.netType; setNetIcon(s.netType); }
}));

/* One glyph per kind of connection. Called from both places that can
   change the label, so the picture and the word are never allowed to
   disagree — a wireless fan over the word "Wired" is the kind of thing
   only a human looking at the screen ever catches. */
const NET_ICON = {
  wifi: '<path d="M2.4 8.6a15 15 0 0 1 19.2 0"/><path d="M5.8 12.1a10 10 0 0 1 12.4 0"/>'
      + '<path d="M9.2 15.6a5 5 0 0 1 5.6 0"/><circle cx="12" cy="19.1" r="1"/>',
  wired:'<rect x="3.2" y="13.4" width="17.6" height="7.4" rx="1.6"/><path d="M12 13.4V9.2"/>'
      + '<path d="M7.6 9.2h8.8"/><path d="M7.6 9.2V6.4M16.4 9.2V6.4"/>',
  none: '<circle cx="12" cy="12" r="8.6"/><path d="m8.4 8.4 7.2 7.2"/>'
};
function setNetIcon(kind){
  const k = /wi-?fi/i.test(kind || "") ? "wifi"
          : /offline|not connected/i.test(kind || "") ? "none" : "wired";
  const el = $("#chipNetIcon");
  if (el) el.innerHTML = NET_ICON[k];
}

/* The status bar's one remaining chip, from the same system channel the
   Settings screen uses — so the summary and the detail can never disagree.
   It keeps whatever the host's cheaper sysinfo put there if this fails.
   Free space left the status bar with the storage chip; it lives in
   Settings → Storage, which is the only place it was ever actionable. */
function refreshChips(){
  /* Who Windows thinks we are, and what it is running. Both are facts
     about the machine and both have exactly one honest source. hostUser
     is only the FALLBACK for the status bar — a name the human has set
     in Settings → Profile always wins. */
  Sys.call("sys.info", {}, { timeout: 8000 }).then(i => {
    if (i.userName){ hostUser = i.userName; paintUser(); }
  }, () => {});
  Sys.call("net.status", {}, { timeout: 8000 }).then(n => {
    const r = n.reachability || {};
    const kind = n.connectionType === "wifi" ? "Wi-Fi" : (n.connectionType === "ethernet" ? "Wired" : "Network");
    const label = r.internet ? kind : (r.connected ? kind + " · local only" : "Offline");
    $("#chipNet").textContent = label;
    setNetIcon(label);
  }, () => {});
}
setTimeout(safe("chips", refreshChips), 1500);
setInterval(safe("chips", refreshChips), 120000);

/* Ask once, early, whether this machine has a privileged-action broker.
   Nothing on screen depends on the answer arriving — every screen that
   offers a brokered action asks again for itself — but Sys.say() cannot
   wait on a promise, and "this needs administrator rights, which the
   shell does not have" is the wrong half of the truth on a console
   where the shell can have it done. One call, at the same point the
   status chips are read, so a machine with no host still says nothing. */
setTimeout(safe("broker probe", () => { Admin.status(); }), 1800);

hostLog("shell ready — focus manager live, " + (Input.device) + " hints, root scale " + remPx().toFixed(2) + "px"
      + ", viewport " + innerWidth + "x" + innerHeight
      + ", keyboard " + (window.MarwanOSK ? ("MarwanOSK " + (window.MarwanOSK.version || "?")) : "NOT LOADED (osk.js missing)")
      + ", explorer " + (window.MarwanFiles ? ("MarwanFiles " + (window.MarwanFiles.version || "?")) : "NOT LOADED (files.js missing)")
      + ", browser " + (window.MarwanBrowser ? ("MarwanBrowser " + (window.MarwanBrowser.version || "?")) : "NOT LOADED (browser.js missing)"));

/* Connect the explorer to the host now rather than on first open, so the
   choice of transport is a startup fact in the host log instead of a
   surprise the first time somebody presses Cross on the Files tile. */
try{
  Files.install();
  if (window.MarwanFiles && typeof MarwanFiles.probe === "function"){
    const p = MarwanFiles.probe();
    hostLog("MarwanFiles bridge confirmed: transport=" + p.transport + " connected=" + p.connected);
  }
}catch(err){ report("files install", err); }

try{ Browser.install(); }catch(err){ report("browser install", err); }

/* The boot signature — fired once, and ONLY when this page is the end of
   a boot. It is the cue "the shell resolves on as the home screen wipes
   in", and on a cold start that is exactly this frame: boot.html has
   just handed over and everything above has built the home screen.

   On a relaunch there is no boot to resolve. The host loads this page
   directly (see ResolveStartUrl in ShellHostWeb.cs), and a shell that
   announced itself every time Shell Launcher restarted it would make
   crash recovery audible. The referrer is how this page knows which of
   the two just happened: boot.html navigates here with location.href
   from the same origin, so it arrives in document.referrer, and a host
   that opened index.html itself leaves it empty. No flag, no storage,
   nothing to get out of step with what actually loaded.

   MarwanFeel.boot() — the low swell that used to run UNDER the shell's
   own sequence — has no sequence left to run under. boot.html loads no
   script but its own by design, so the swell is gone rather than fired
   a few milliseconds before the thing it existed to lead into. One cue,
   on arrival. */
const CAME_FROM_BOOT = /\/boot\.html(\?|$)/.test(document.referrer || "");
hostLog("start-up: " + (CAME_FROM_BOOT
  ? "arrived from the boot splash; playing the signature"
  : "loaded directly (shell relaunch); no boot cue"));
if (CAME_FROM_BOOT){
  try{ if (window.MarwanFeel) MarwanFeel.bootDone(); }catch(err){ report("boot cue", err); }
}
Focus.repaint();
</script>
