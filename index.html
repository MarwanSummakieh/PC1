<title>MarwanOS</title>

<!-- The on-screen keyboard ships as a real same-origin stylesheet and script:
     the page is served over https://marwanos.local/ from the host's virtual host
     mapping, and the CSP there rejects injected style elements. -->
<link rel="stylesheet" href="osk.css">
<script src="sfx.js"></script>
<script src="osk.js"></script>

<!-- The file explorer, on the same terms: a real stylesheet and a real script,
     both same-origin, because the CSP here forbids injected style elements and
     forbids anything off this host. files.js defines one global, MarwanFiles. -->
<link rel="stylesheet" href="files.css">
<script src="files.js"></script>

<!-- The browser's chrome — tab strip, address bar, start page, history.
     The web pages themselves are drawn by a SECOND WebView2 that the host
     owns and positions over the rectangle browser.js reserves; see the
     BrowserHost comment in ShellHostWeb.cs. Nothing here ever loads a
     remote origin, and this document's CSP is unchanged by its existence. -->
<link rel="stylesheet" href="browser.css">
<script src="browser.js"></script>

<!-- The home rail's contents. library.js replaces the old hardcoded APPS
     fixture with a real scan of what is installed, performed by the host
     (MarwanOs.Library.LibraryApi). It defines one global, MarwanLibrary.
     library.css only styles cover art painted into the existing .tile-art;
     with no covers it does nothing, which is the empty machine's case. -->
<link rel="stylesheet" href="library.css">
<!-- homeart.js turns one cover into the three things the home screen is
     made of: the stretched downsample behind everything, the colour the
     shell takes its accent from, and a generated portrait for a title
     that has no cover at all. It defines one global, MarwanArt, and must
     load BEFORE library.js, which is its only caller. -->
<script src="homeart.js"></script>
<script src="library.js"></script>

<style>
/* ─────────────────────────────────────────────────────────────
   MarwanOS — the console shell for PC1

   SIZING RULE: nothing outside :root is expressed in px. The root
   font-size is derived from the viewport, everything else is rem,
   so 1080p / 1440p / ultrawide / 4K are the same layout at
   different scales rather than four separate designs.

   MATERIAL: neutral black, one flat blue that never glows, and a
   white selection ring. Nothing here is lit from within — depth
   comes from surface steps and hairlines, not from bloom. Colour
   appears in exactly three places: the primary action, semantic
   state, and the cover art itself.
   ───────────────────────────────────────────────────────────── */

   Inter: same origin, no CDN, no network, font-display:block.
   Licences in OFL-Bangers.txt, Apache-PermanentMarker.txt and

:root{
  /* ── WALL AND CHALK ────────────────────────────────────────
     The shell wears marwansummakieh.me, which is where this project
     has been documented since the Linux version, and which is
     already called MarwanOS. Its ground is not a console's cold
     navy-black; it is a wall — near-black, warm-neutral, with no
     blue in it at all — and its type is CHALK, a cream, not a cold
     white. That single swap is most of the identity: the same
     layout under a warm light instead of a cold one.

     The names are kept from the old sheet on purpose. osk.css,
     files.css and browser.css each read these through
     var(--void, <literal>), so retokenising here re-skins the
     keyboard, the file explorer and the browser chrome without
     touching a rule in any of them. */
  --void:      #070707;   /* wall       */
  --deep:      #17181a;   /* concrete   — panels, cards, chips */
  --haze:      #202124;   /* concrete-2 — rows, hovers */
  --line:      #34353a;
  --line-soft: #26272b;

  /* Chalk. #efe9d6 at three opacities, exactly as the site sets it —
     the dim and mute steps are the SAME pigment thinned, not three
     different greys, which is what stops a warm page from going
     muddy where the type gets quiet. */
  --ice:       #efe9d6;
  --steel:     #cdc7b4;
  --dim:       #9d998c;

  /* Spray green. It fills the primary action and nothing else — it
     is never a glow, never a border, never a focus ring. It is the
     one saturated thing on the wall, and it is the site's accent. */
  --beam:      #50e380;
  --beam-hot:  #7cee9f;
  --beam-deep: #1fb85a;

  /* Selection is still white. On a television a white ring survives
     any cover art behind it, and the site's own cards are outlined
     in white — so the shell's focus model and the identity happen
     to want the same thing. */
  --sel:       #ffffff;

  /* Semantic state, taken from the site's secondary set rather than
     invented: cream-green for good, peach for caution, pink for
     destructive. Nothing here is a stock traffic light. */
  --good:      #7cee9f;
  --warn:      #ffb27a;   /* peach */
  --bad:       #ff4d8d;   /* pink — destructive only: delete, disconnect, fail */

  /* Ink, for type sitting ON the accent. The site never puts chalk
     on spray green; it puts black on it, and outlines the whole
     thing in black. */
  --ink:       #000000;

  /* Secondary pigments. Used only by the stickers, so a screen can
     have one coloured label without the shell growing a second
     accent. */
  --violet:    #6d5cff;
  --peach:     #ffb27a;
  --pink:      #ff4d8d;

  /* ── Three voices ─────────────────────────────────────────
     --sans     Geist. Every control, row, number and paragraph.
     --display  ALSO Geist, semibold. This token is read by things
                that are headings at UI SIZE — a tab, a cover's
                name, a row's title — and a poster face at 13px is
                a legibility bug. Bangers does not go here.
     --poster   Bangers. Applied by hand, and only to type that is
                large enough to be an image of a word rather than a
                word: the hero title, a panel's title, the mark.
     --marker   Permanent Marker. The stickers, and nothing else. */
  --sans:    "Geist","Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display: "Geist","Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;
  --poster:  "Bangers","Impact","Arial Black","Haettenschweiler",sans-serif;
  --marker:  "Permanent Marker","Bangers","Comic Sans MS",cursive;

  /* Near-sharp, at the site's own .25rem and below. The old sheet
     had already left pills behind for cards; this takes the last of
     the softness out, because a rounded rectangle is an app icon
     and a square one is a print on a wall. Covers are the one
     argument against it and they are handled at .tile, where the
     radius stays small but non-zero — a 3:4 box at exactly 0 reads
     as an un-styled image. */
  --r-s: .0625rem;
  --r-m: .125rem;
  --r-l: .1875rem;

  /* The sticker. Every eyebrow in the shell is one of these: a
     coloured rectangle with a hard black keyline, a hard black
     shadow with no blur at all, and a degree or two of rotation.
     It is the site's most recognisable object and the cheapest
     piece of the identity to carry across. */
  --sticker-shadow: .1875rem .1875rem 0 0 var(--ink);

  --e-out: cubic-bezier(.16,.84,.24,1);
  --e-in:  cubic-bezier(.6,0,.9,.4);

  /* ── Root scale ───────────────────────────────────────────
     17.5px at 1920×1080, 23.3px at 1440p (incl. 3440×1440),
     35px at 2160p. Height-led because a console UI is read at a
     fixed distance and height is what changes with the panel;
     the vw term only bites on wide-and-short or portrait
     viewports, so an odd aspect ratio shrinks instead of
     overflowing.

     The height term was 1.4815vh until a human looked at a
     3440×1440 panel and reported the whole design reading as a
     small cluster in the left third. Reading distance did not
     change, so the type scale is only lifted ~9%; the rest of
     the answer is the ultrawide block at the bottom of this
     sheet, which spends the extra WIDTH rather than inflating
     everything uniformly. */
  font-size: clamp(12px, min(1.62vh, 2.05vw), 40px);

  /* Overscan / bezel safe area. Percent-of-viewport floors keep
     content off the extreme edge. Both sides, always: the right
     inset is the one that gets forgotten, and a control cut in
     half by the panel edge is indistinguishable from a bug. */
  --edge:   max(2.5rem, 2.6vw);
  --safe-y: max(1.6rem, 2.2vh);

  /* Rail geometry as unitless multipliers of 1rem. Two reasons they are
     bare numbers: JS can compute the scroll offset exactly at any scale
     (railStep()), and a custom property whose value is calc(… * 1rem)
     is resolved once against the root font-size and is NOT re-resolved
     when a viewport-driven root font-size changes — the multiplication
     has to happen at the point of use, below, or the rail keeps the
     scale it had at first layout.

     Covers are 3:4 portrait — box art, not icons. Only the WIDTHS are
     tokens; every height is width × 4/3 at the point of use, so the
     aspect ratio cannot drift out of sync with itself. The rail's
     scroll step reads --cover-u alone, because every cover ahead of
     the focused one sits at its collapsed width. */
  --cover-u: 9.25;
  --cover-active-u: 13.5;
  --gap-u: 1;

  /* The reading column. Everything to the right of it is artwork, so
     this number is the one that decides how much of the screen the UI
     is allowed to take. Capped in rem rather than left at a percentage
     because a 3440-wide panel does not want a 1200px paragraph — it
     wants the same column and more picture. */
  --col: max(22rem, 50vw);

  /* Set by paintHero from the focused cover's dominant chroma. The
     default is the shell's own blue, which is what an empty machine
     and the boot screen get. Everything that reads this is a hairline
     or a rule — never text, never a fill behind text — so a title
     with an unhelpful palette can change the mood of the screen
     without ever being able to break its contrast. */
  --accent: #50e380;

  /* How far the rail is allowed to sit in from the left edge. The rail
     scrolls by translating, so covers BEFORE the focused one pass under
     the screen edge; --rail-lead is the strip they are allowed to occupy
     and .rail-wrap masks it, so a partial cover reads as "there is more
     that way" instead of as a cover drawn wrong. */
  --rail-lead: calc(var(--edge) * .62);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--ice);
  font-family:var(--sans);
  font-size:1rem;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:none}

/* ── Focus treatment ──────────────────────────────────────────
   One rule, one ring, one curve. data-focus="on" is the live
   cursor; "stale" is a scope further down the stack — still shown,
   because on a TV a user must always be able to see where they
   will land when they back out.

   The ring is white and hard-edged. It used to be a blue halo,
   which had two problems on a television: it washed out against
   any bright artwork behind it, and its blur made the exact
   boundary of the focused thing ambiguous from across a room.
   White at full opacity survives every cover in the catalogue. */
[data-focus]{outline:none}
[data-focus="on"]{
  box-shadow:0 0 0 .125rem var(--sel);
  transition:box-shadow .28s var(--e-out),background .28s var(--e-out),
             color .28s var(--e-out),transform .28s var(--e-out);
}
[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.3)}

/* ── The sticker ──────────────────────────────────────────────
   One object, used wherever the shell needs to say what KIND of
   thing you are looking at: a coloured rectangle, a hard black
   keyline, a hard black shadow with no blur in it at all, a degree
   or two off square, and one or two words of Permanent Marker
   inside. It is the most recognisable thing on the site and the
   cheapest piece of the identity to bring across.

   Permanent Marker lives HERE and nowhere else. On the site it also
   sets the body copy, which is delightful at arm's length on a
   laptop and would be punishing in a settings row read from three
   metres — so it is kept as a label face, at label lengths, at a
   size where its stroke is an asset rather than noise.

   The keyline and the shadow are both --ink rather than a shade of
   the wall: a sticker is stuck ON the surface, and what sells that
   is a shadow darker than anything behind it. */
.sticker{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.16rem .5rem .26rem;
  font-family:var(--marker);font-weight:400;
  font-size:.8125rem;line-height:1.2;letter-spacing:.01em;text-transform:none;
  color:var(--ink);background:var(--beam);
  border:.125rem solid var(--ink);border-radius:var(--r-s);
  box-shadow:var(--sticker-shadow);
  rotate:-2deg;transform-origin:left center;
  /* A sticker is a label, never a control: nothing that carries this
     class is focusable, so it never has to be reconciled with the
     white ring. */
}
.sticker.violet{background:var(--violet);color:#fff}
.sticker.peach {background:var(--peach)}
/* Black on pink, where the site uses white. Measured: white on #ff4d8d is
   3.14:1, which is a fail for anything that is not large text and is not a
   risk worth taking at three metres; black on the same pink is 6.63:1. */
.sticker.pink  {background:var(--pink);color:var(--ink)}
.sticker.chalk {background:var(--ice)}
.sticker.right {rotate:1.5deg}
/* A static tilt is not motion, but a shell that has been asked for
   less decoration gets its stickers sitting square anyway. */
@media (prefers-reduced-motion:reduce){ .sticker{rotate:0deg} }

/* ── Ground ────────────────────────────────────────────────────
   What is left of the shell's own background once the artwork is
   doing the work: a single soft lift under the status bar so the
   screen is never a flat rectangle of #070707 when there is no art
   to put on it. Everything else on this layer is the title. */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(140% 88% at 50% -8%, #101012 0%, var(--void) 62%);
}

/* ── Stage ─────────────────────────────────────────────────── */
.stage{position:fixed;inset:0;z-index:2}

/* ═══ SHELL ════════════════════════════════════════════════ */
/* THE SHELL IS LIVE FROM ITS FIRST PAINT, and nothing has to add a
   class to make it so. It used to start at opacity:0 with
   pointer-events:none and be revealed by a boot sequence that ran HERE
   — a second sequence, immediately after boot.html had just finished
   playing the identical one, so the machine booted twice in front of
   you. boot.html is now the only boot, and this document is what it
   hands over TO: the first frame this page paints is already the home
   screen. There is no overlay above it to fade out and no state to
   arrive at, which is also why there is no window in which a boot
   layer could flash. */
#shell{
  position:fixed;inset:0;z-index:10;
  display:grid;grid-template-rows:auto auto 1fr auto;
}

/* ── Status bar ───────────────────────────────────────────── */
/* Every band that runs the full width of the screen is a flex row of
   things that would rather not shrink, and a flex row that cannot
   shrink runs off the right edge instead — which is what "the zoom
   control and the Menu button are cut in half" is, in every screen it
   happens on. So the rule for all of them, here and in browser.css and
   files.css, is the same: the row may shrink, its groups may shrink,
   the text inside ellipses, and the least important chip leaves first.
   min-width:0 is not optional on a flex child that contains text — the
   default min-width:auto is exactly what pushes the row wider than its
   container. */
.statusbar{
  display:flex;align-items:center;gap:1.625rem;min-width:0;
  padding:var(--safe-y) var(--edge) 0;
}
.user{display:flex;align-items:center;gap:.625rem;min-width:0;flex:0 1 auto}
.user-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-right{min-width:0;flex:0 1 auto}
.status-chip{min-width:0}
.status-chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-chip svg,.avatar{flex:0 0 auto}
/* Narrow viewports drop the least load-bearing thing rather than push the
   clock off the panel. What is running outranks the network chip: the
   network has a whole settings category, a background app has only this. */
@media (max-width:900px){ .statusbar .running-eyebrow{display:none} }
@media (max-width:640px){ .statusbar .status-chip{display:none} }
/* The avatar is the one round thing left in the shell, and the only
   place the accent appears as a fill outside the primary action —
   a person is not a card. */
.avatar{
  width:1.875rem;height:1.875rem;border-radius:50%;
  background:var(--beam);
  display:grid;place-items:center;
  font-family:var(--display);
  font-size:.8125rem;font-weight:800;color:var(--ink);
}
.user-name{font-size:.875rem;font-weight:500;letter-spacing:0}
.status-spacer{flex:1}
.status-right{display:flex;align-items:center;gap:1.125rem;color:var(--steel)}
.status-chip{display:flex;align-items:center;gap:.44rem;font-size:.8125rem;letter-spacing:0}
.status-chip svg{width:.94rem;height:.94rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.clock{
  font-size:.875rem;font-weight:500;
  letter-spacing:0;color:var(--ice);font-variant-numeric:tabular-nums;
}
/* ── What is running, in the status bar ───────────────────────
   The top right used to be storage, a gear and a power glyph: two
   shortcuts to screens the control centre already opens in one press,
   and a number that is only ever acted on inside Settings → Storage.
   What a console actually wants there is the answer to "what is behind
   this screen" — Steam, Discord, the anti-cheat that came up with the
   machine — because that is the thing you cannot otherwise see.

   Every chip is a real focusable in row 0 of the home scope, so the
   cursor reaches them by pressing up from the tabs, exactly the way it
   reached the gear. Nothing is drawn at all until the host has said
   what is running: see paintRunning(). */
.running{display:flex;align-items:center;gap:.6rem;min-width:0}
.running[hidden]{display:none}
.running-eyebrow{
  flex:0 0 auto;font-size:.6875rem;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.running-list{display:flex;align-items:center;gap:.4rem;min-width:0}
.runchip{
  display:flex;align-items:center;gap:.44rem;min-width:0;max-width:11rem;
  padding:.22rem .55rem .22rem .5rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);background:var(--deep);
  color:var(--steel);font-size:.8125rem;letter-spacing:0;
  transition:background .2s,color .2s,border-color .2s,box-shadow .28s var(--e-out);
}
.runchip b{
  font-weight:500;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.runchip:hover{background:var(--haze);color:var(--ice)}
.runchip[data-focus="on"]{
  background:var(--haze);color:var(--ice);
  border-color:transparent;box-shadow:0 0 0 .125rem var(--sel);
}
.runchip[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.3)}
/* One dot per category. A colour rather than seven more glyphs: at TV
   distance a 15px icon of "anti-cheat" is a smudge, and the categories
   only have to separate into "yours to close", "the machine's", and
   "the thing you are playing". */
.runchip i{
  flex:0 0 auto;width:.44rem;height:.44rem;border-radius:50%;
  background:var(--steel);
}
.runchip.k-game i{background:var(--beam-hot)}
.runchip.k-launcher i,.runchip.k-social i,
.runchip.k-media i,.runchip.k-capture i{background:var(--good)}
.runchip.k-anticheat i{background:var(--warn)}
.runchip.k-service i{background:var(--dim)}
/* The overflow chip. Never a count on its own — "+3" with nothing to
   press would be a readout pretending to be a control. */
.runchip.more{max-width:none;color:var(--dim)}

/* ── Tabs ─────────────────────────────────────────────────────
   Wide-tracked thin caps became compact semibold sentence case:
   Mythos sets navigation at UI size and lets weight, not spacing,
   carry the emphasis. The underline is a solid 2px white rule
   with no glow — it either marks the tab or it doesn't. */
/* Navigation follows the site's nav, not its headings: Geist, uppercase,
   heavy, widely tracked. Bangers is deliberately kept OUT of here — the
   tabs are a control, they sit at UI size, and a poster face at 18px
   turns two words that must be read instantly into two shapes that must
   be recognised. */
.tabs{display:flex;gap:2rem;padding:1.25rem var(--edge) 0}
.tab{
  position:relative;padding:.125rem .4375rem .5rem;
  font-family:var(--display);font-size:.9375rem;font-weight:800;
  letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
  transition:color .25s,background .25s;
  border-radius:var(--r-s) var(--r-s) 0 0;
}
.tab::after{
  content:"";position:absolute;left:0;right:100%;bottom:0;height:.125rem;
  background:var(--sel);
  transition:right .35s var(--e-out);
}
.tab[aria-selected="true"]{color:var(--ice)}
.tab[aria-selected="true"]::after{right:0}
.tab:hover{color:var(--steel)}
.tab[aria-selected="true"]:hover{color:var(--ice)}
/* Tabs opt OUT of the global white ring. Focusing a tab already switches to
   it, so the underline is the selection; a second hard rectangle drawn round
   the word said the same thing twice and boxed in a piece of running text.
   What the cursor still has to show is which ROW it is on, and a filled
   ground does that without outlining letterforms. */
.tab[data-focus="on"]{
  color:var(--ice);
  background:var(--haze);
  box-shadow:none;
}
.tab[data-focus="stale"]{box-shadow:none;background:rgba(32,33,36,.5)}

/* ── Hero ─────────────────────────────────────────────────────
   The hero block is centred in the band between the tabs and the
   rail rather than pinned under the tabs. The band is tall by
   design — it is where the focused cover's colour lives — and a
   short block pinned to its top reads as a layout that ran out of
   content rather than one that left room on purpose. */
/* The hero band is centred in what is left between the tabs and the
   rail, with a floor under the padding so the eyebrow never ends up
   sitting on the tab underline on a short panel. */
.main{
  position:relative;overflow:hidden;display:grid;align-content:center;
  /* Trimmed from clamp(1rem,3.5vh,3rem). The poster face is taller per
     line than the grotesk it replaced, and this band is the only place
     in the shell that clips rather than scrolls — so the padding it can
     spare is spare. */
  padding-block:clamp(.6rem,2.4vh,2.2rem);
}

/* ── The backdrop ─────────────────────────────────────────────
   The screen's ground IS the focused title. Four layers, every one
   of them driven by ui/homeart.js out of a single image:

     .art-wash   the cover downsampled to 32×48 and stretched over
                 the whole panel. Blowing a 32×48 texture across
                 3440 pixels IS a blur, performed by the bilinear
                 filter the compositor was going to run on that
                 layer anyway. No filter pass, no canvas per frame,
                 and nothing running at all while nobody is
                 touching the pad — which matters on a machine
                 whose entire job is to hand its frames to a game.

     .art-key    the same cover at full resolution, tall, anchored
                 past the top and right edges so it is CROPPED by
                 the screen rather than framed by it. Its mask is
                 one radial gradient, so it dissolves into the wash
                 on the left and the floor instead of ending at a
                 border. This is the layer that makes the right two
                 thirds of an ultrawide panel worth having.

     .art-veil   the contrast guarantee, and the reason none of the
                 above can make the type unreadable: near-solid
                 down the left where the words are, open across the
                 right where the art is, solid again at the floor
                 so the rail always sits on clean ground.

   art sits on its own fixed layer above the ground and below the
   shell, so it bleeds behind the status bar instead of seaming at
   the tabs. */
.hero-art{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}

.art-wash{
  position:absolute;inset:-12%;
  background-position:50% 32%;background-size:cover;background-repeat:no-repeat;
  opacity:0;scale:1.08;
  transition:opacity .9s var(--e-out),scale 1.5s var(--e-out);
}
.art-wash.on{opacity:.9;scale:1}

.art-veil{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,
      var(--void) 0%, rgba(7,7,7,.9) 17%, rgba(7,7,7,.52) 36%,
      rgba(7,7,7,.2) 58%, rgba(7,7,7,.12) 80%, rgba(7,7,7,.36) 100%),
    linear-gradient(0deg, var(--void) 1%, rgba(7,7,7,.62) 20%, rgba(7,7,7,0) 50%);
}

/* The panel is cut to the COVER'S OWN 2:3, not to a share of the
   screen. A panel shaped by the viewport and filled with `cover` crops
   a portrait to whatever aspect the machine happens to be, which on an
   ultrawide meant a random 40% of the middle of the picture blown up
   past 1:1 — the artwork was on screen and its composition was not.
   Sized off vh it is the same crop at every resolution: the top and
   bottom run off the screen, the sides are whole. */
/* Anchored high and run well past the bottom of the screen on purpose.
   Portrait key art puts its cast along the bottom edge, and with the
   panel ending near the floor those figures landed at full brightness
   directly behind the rail and the hint bar — two busy things fighting
   over the same corner. Hiding the lower quarter below the screen keeps
   the part of the composition that reads at three metres, and gives the
   rail a clean corner to sit in. */
.art-key{
  position:absolute;top:-10vh;right:-1.5vw;
  height:148vh;width:calc(148vh * 2 / 3);
  background-position:50% 50%;background-size:cover;background-repeat:no-repeat;
  /* A horizontal fade, not a radial. The radial version left a hard
     vertical seam down the artwork's left edge: an ellipse sized as a
     percentage of the element is still 55% opaque where the element
     stops, so the mask faded the picture without ever reaching zero,
     and what you saw was a dimmed panel with a straight edge. The top,
     bottom and right edges do not need masking at all — they are
     cropped by the screen, which is the point of the layer — so the
     only edge that has to dissolve is the one facing the type. */
  --key-mask:linear-gradient(90deg,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.22) 15%, rgba(0,0,0,.72) 36%, #000 62%);
  mask-image:var(--key-mask);
  -webkit-mask-image:var(--key-mask);
  opacity:0;translate:1.6rem 0;scale:1.03;
  transition:opacity .55s var(--e-out),translate .85s var(--e-out),scale .85s var(--e-out);
}
.art-key.on{opacity:.88;translate:0 0;scale:1}

/* Crown and floor are drawn ABOVE the artwork rather than under it, so
   the picture dissolves into the shell's chrome instead of running
   underneath it. The crown is not decoration: the status bar is white
   text with no plate behind it, and a bright sky arriving under the
   clock is the difference between a legible strip and an unreadable
   one. Both are soft over a long distance, so neither reads as a bar. */
.art-crown{
  position:absolute;inset:0 0 auto 0;height:19%;
  background:linear-gradient(180deg,rgba(7,7,7,.94) 0%,rgba(7,7,7,.62) 30%,
             rgba(7,7,7,.22) 66%,rgba(7,7,7,0) 100%);
}
.art-floor{
  position:absolute;inset:auto 0 0 0;height:58%;
  background:linear-gradient(0deg,var(--void) 6%,rgba(7,7,7,.95) 26%,
             rgba(7,7,7,.62) 48%,rgba(7,7,7,0) 100%);
}

/* ── Hero ─────────────────────────────────────────────────────
   One reading column, hard left, vertically centred in the band
   between the tabs and the rail. The facts that used to sit in a
   bordered card on the right are now a spec strip under the
   actions: the same information, but the right-hand two thirds of
   the screen is given to the artwork instead of to a widget. That
   is the whole answer to "the layout does not use the screen" —
   the extra width is not for more UI, it is for the cover. */
.hero{
  position:relative;z-index:1;
  padding:0 var(--edge);
  display:grid;grid-template-columns:minmax(0,var(--col)) minmax(0,1fr);
}
.hero-main{grid-column:1;min-width:0}
.hero-side{grid-column:1;min-width:0}

/* The eyebrow IS the sticker — the label on the piece, saying where
   this title came from. It was a tracked cap-height line with a short
   rule in the focused title's own colour on its left; that rule has
   moved to the spec strip below (see .hero-facts), so the ambient
   colour still touches the type column exactly once and the eyebrow
   gets to be the identity's signature object instead.

   Deliberately NOT tinted with --accent: --accent is sampled from
   whatever the focused cover happens to be, and the sticker puts
   BLACK type on it. A guaranteed-contrast fill matters more here
   than one more surface following the artwork. */
.eyebrow{
  display:inline-flex;align-items:center;gap:.4rem;
  padding:.16rem .5rem .26rem;
  font-family:var(--marker);font-weight:400;
  font-size:.8125rem;line-height:1.2;letter-spacing:.01em;text-transform:none;
  color:var(--ink);background:var(--beam);
  border:.125rem solid var(--ink);border-radius:var(--r-s);
  box-shadow:var(--sticker-shadow);
  rotate:-2deg;transform-origin:left center;
  margin:0 0 1.05rem;
}
@media (prefers-reduced-motion:reduce){ .eyebrow{rotate:0deg} }
/* The poster face. Bangers is shorter and narrower per em than Inter
   Tight was, so the same block of screen wants a bigger number — and
   its tracking goes POSITIVE: it is drawn to be spaced, and the
   -.035em that suited a grotesk display face welds it shut. */
/* Sized off --col, NOT off a bare rem, and this is not a refinement —
   it is the fix for a real defect. .main is `align-content:center` with
   `overflow:hidden`, so content taller than its track is clipped at BOTH
   ends: at 3440×1440 a flat 5.6rem wrapped "Counter-Strike 2" onto two
   lines, the block grew past the band, and what fell off was the eyebrow
   at the top and the spec strip's VALUES at the bottom — while the
   labels above them stayed. It read as two unrelated elements failing to
   render and it was one block overflowing.

   The column is what the title actually has to fit inside, so the column
   is what its size is expressed in. The rem cap keeps it sane on a small
   panel; the vw cap keeps it sane on a short wide one. */
.hero-title{
  font-family:var(--poster);font-weight:400;
  font-size:min(5rem, calc(var(--col) / 7.6), 11vw);line-height:.92;
  letter-spacing:.02em;margin:0;text-wrap:balance;color:var(--ice);
  text-shadow:0 .125rem 1.5rem rgba(0,0,0,.6);
}
/* Three lines, then it stops. The full sentence is still there for
   the details panel; a television is not where you read a paragraph. */
.hero-desc{
  margin:clamp(.55rem,1.7vh,1.1rem) 0 0;max-width:none;
  font-size:.9375rem;line-height:1.62;color:var(--steel);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;
}
.hero-meta{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:clamp(.7rem,2vh,1.25rem)}
/* The site's tag: small, hard-cornered, uppercase Geist, tracked wide,
   over a hole punched in whatever is behind it. GODOT 4 / BOOTC /
   SYSTEMD on the wall; "Started by the client" / "Update pending"
   here. Bold and tracked rather than large, so a row of them reads as
   one texture instead of as six competing labels. */
.chip{
  padding:.28rem .55rem;border-radius:var(--r-s);
  border:.0625rem solid rgba(239,233,214,.18);background:rgba(0,0,0,.35);
  font-size:.6875rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--steel);
}
.chip.live{border-color:rgba(124,238,159,.45);color:var(--good)}

/* ── The spec strip ──────────────────────────────────────────
   Was a bordered card of label/value rows pinned to the right of
   the screen. It is now a row of small stacked pairs under the
   buttons, separated by hairlines: the same four facts, reading as
   a caption rather than as a dashboard, and taking no width away
   from the artwork.

   Named hero-fact*, NOT fact*: the panels already own a .facts /
   .fact read-only list further down this sheet. */
/* One line, never two. A fact here costs horizontal space, and a strip
   that wraps puts its hairline separators in the wrong places and drops
   a stray value under the rest — so the row does not wrap, the items
   may shrink, and a value that runs out of room ellipses. */
/* This rule is now where the focused title's own colour touches the
   type column — it used to be the short dash to the left of the
   eyebrow, which the sticker took over. Same idea, same one place,
   and a full-width hairline carries a sampled colour better than a
   28px stub did. */
.hero-facts{
  display:flex;flex-wrap:nowrap;align-items:flex-start;
  margin-top:clamp(1rem,2.6vh,1.9rem);padding-top:.9rem;
  border-top:.0938rem solid var(--accent);
  transition:border-color .6s var(--e-out);
  max-width:100%;
}
.hero-fact{
  display:grid;gap:.2rem;min-width:0;flex:0 1 auto;
  padding-right:1.4rem;margin-right:1.4rem;
  border-right:.0625rem solid var(--line-soft);
}
.hero-fact:last-child{border-right:0;margin-right:0;padding-right:0}
.hero-fact-k{
  font-size:.6875rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
}
.hero-fact-v{
  font-size:.875rem;font-weight:600;color:var(--ice);
  font-variant-numeric:tabular-nums;
  max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hero-fact.live .hero-fact-v{color:var(--good)}

/* The hero's action row is not drawn any more — the rail card is the
   play button. The wrapper survives only as the host shim's click
   target (see the long note in the markup), so it is taken out of the
   layout here rather than deleted from the document. `display:none`
   beats the [hidden] attribute's UA rule on specificity, so it has to
   be said explicitly or the buttons come back. */
.hero-actions{display:none}
/* The site's call to action, exactly: a hard-cornered block, a two-pixel
   BLACK keyline, uppercase Geist tracked to .14em, and a hard black
   shadow offset down and right with no blur in it. Nothing about this
   glows; it is printed. */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.8125rem 1.375rem;border-radius:var(--r-s);
  font-size:.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:.125rem solid var(--ink);
  box-shadow:var(--sticker-shadow);
  transition:box-shadow .28s var(--e-out),background .2s,color .2s,translate .12s var(--e-out);
}
.btn svg{width:.875rem;height:.875rem;fill:currentColor}
/* The one saturated fill in the shell, and black on it — the site never
   puts chalk on spray green, and at 13:1 neither should this. */
.btn-primary{flex:1.5 1 0;background:var(--beam);color:var(--ink)}
.btn-primary:hover{background:var(--beam-hot)}
.btn-ghost{flex:1 1 0;background:var(--deep);color:var(--ice);border-color:var(--ice)}
.btn-ghost:hover{background:var(--haze)}
/* The global ring is a single box-shadow and would REPLACE the printed
   one, so both are restated here: the cursor lands on a button that is
   still stuck to the wall rather than one that suddenly flattened. The
   button also presses INTO its own shadow, which is the one piece of
   motion the site's buttons have. */
.btn[data-focus="on"]{
  box-shadow:0 0 0 .1875rem var(--sel),var(--sticker-shadow);
  translate:.0625rem .0625rem;
}
.btn[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.4),var(--sticker-shadow)}

/* fade group when focus changes */
.swap{transition:opacity .28s var(--e-out),translate .38s var(--e-out)}
.swap.out{opacity:0;translate:0 .625rem}

/* ── Rail ─────────────────────────────────────────────────── */
/* The rail scrolls by translating, so covers before the focused one
   pass under the left screen edge. Cut off dead straight by the viewport
   they read as covers drawn wrong; faded out over the safe-area strip
   they read as a row that continues off-screen — which is what they are.
   The same fade is applied on the right, because the rail continues that
   way too and a hard edge there tells the same lie. The focused cover
   sits at --edge, outside the fade, so its selection ring is never
   touched. */
.rail-wrap{
  position:relative;z-index:1;
  padding:clamp(.7rem,3.2vh,2.4rem) 0 clamp(.7rem,2.6vh,1.9rem);
  overflow:hidden;
  --rail-fade:linear-gradient(to right,
      rgba(0,0,0,0) 0,
      #000 var(--rail-lead),
      #000 calc(100% - var(--rail-lead)),
      rgba(0,0,0,0) 100%);
  mask-image:var(--rail-fade);
  -webkit-mask-image:var(--rail-fade);
}
.rail{
  display:flex;align-items:flex-end;gap:calc(var(--gap-u) * 1rem);
  padding-left:var(--edge);
  transition:transform .45s var(--e-out);
  will-change:transform;
}
/* Covers are 3:4 portrait. Height is always width × 4/3 computed at
   the point of use — never a second token — so the two can never
   disagree about what the aspect ratio is. */
.tile{
  position:relative;flex:0 0 auto;
  width:calc(var(--cover-u) * 1rem);
  height:calc(var(--cover-u) * 1rem * 4 / 3);
  /* JUDGEMENT CALL, and not the site's answer copied.
     The site puts .25rem on everything and it is right there: a
     near-square corner turns a tile from an app icon into a print on
     a wall, which is the whole metaphor. But a game cover is not a
     project card — box art is drawn to a printed convention, it has
     its own margins and its own logo placement, and squaring it off
     completely made the rail read as un-styled <img> tags rather than
     as a deliberately sharp design. So the rail keeps a corner that
     is small but visible (.1875rem, half the old .375rem) and gets
     the rest of its "print" from the hard shadow below, which is the
     part of the treatment that actually does the work. */
  border-radius:.1875rem;
  overflow:hidden;cursor:pointer;padding:0;
  border:.0625rem solid rgba(239,233,214,.1);
  transition:width .42s var(--e-out),height .42s var(--e-out),
             box-shadow .42s var(--e-out),border-color .3s;
  box-shadow:.1875rem .1875rem 0 0 rgba(0,0,0,.85);
}
/* Unfocused covers are dimmed by a layer of their own rather than by
   the tile's opacity. Opacity on the tile fades its drop shadow and
   its selection ring with it, which is how a rail ends up looking
   washed out; a flat scrim over the art dims the picture and leaves
   the structure at full strength. */
.tile-dim{
  position:absolute;inset:0;background:rgba(4,4,4,.58);
  opacity:1;transition:opacity .42s var(--e-out);
}
.tile[aria-current="true"] .tile-dim{opacity:0}
.tile:hover .tile-dim{opacity:.55}
/* A cover is art plus a legible name. The scrim exists so the name
   is readable over whatever the art does at the bottom edge. */
.tile-sheen{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.34) 24%,rgba(0,0,0,0) 50%);
}
.tile-glyph{
  position:absolute;left:0;right:0;top:0;bottom:2.6rem;
  display:grid;place-items:center;color:rgba(255,255,255,.92);
}
.tile-glyph svg{
  width:2.25rem;height:2.25rem;fill:none;stroke:currentColor;
  stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 .125rem .5rem rgba(0,0,0,.5));
  transition:width .42s var(--e-out),height .42s var(--e-out);
}
/* The name is part of the cover, always visible — box art has its
   title printed on it. It no longer fades in on selection. */
.tile-name{
  position:absolute;left:.75rem;right:.75rem;bottom:.7rem;
  font-family:var(--display);font-weight:600;
  font-size:.8125rem;line-height:1.2;letter-spacing:-.01em;
  color:#fff;opacity:1;
  transition:font-size .42s var(--e-out);
}
.tile:hover{border-color:rgba(239,233,214,.26)}
/* The focused cover is the piece that has been taken off the wall and
   held up: bigger, undimmed, and standing on a hard offset shadow with
   no blur in it — the site's card treatment, at cover scale. */
.tile[aria-current="true"]{
  width:calc(var(--cover-active-u) * 1rem);
  height:calc(var(--cover-active-u) * 1rem * 4 / 3);
  border-color:rgba(239,233,214,.34);
  box-shadow:.5rem .5rem 0 0 rgba(0,0,0,.9);
}
.tile[aria-current="true"] .tile-glyph svg{width:3.25rem;height:3.25rem}
.tile[aria-current="true"] .tile-name{font-size:1.0625rem}
/* Selection is a white rule drawn INSIDE the cover, so it never
   inflates the box and never has to be reconciled with the layout —
   the rail's arithmetic stays exact. */
.tile[data-focus="on"]{
  border-color:transparent;
  box-shadow:.5rem .5rem 0 0 rgba(0,0,0,.9),inset 0 0 0 .1875rem var(--sel);
}
.tile[data-focus="stale"]{
  box-shadow:.5rem .5rem 0 0 rgba(0,0,0,.9),inset 0 0 0 .125rem rgba(255,255,255,.32);
}
.tile-badge{
  position:absolute;top:.5rem;right:.5rem;
  min-width:1.125rem;height:1.125rem;padding:0 .3rem;border-radius:var(--r-s);
  background:var(--beam);color:var(--ink);
  border:.0625rem solid var(--ink);
  font-size:.66rem;font-weight:800;line-height:1.0625rem;text-align:center;
}
/* "This is open right now." Bottom-left so it never collides with the
   count badge top-right, and a live dot rather than a colour alone so
   it survives a colour-blind reading and a photograph of the screen. */
.tile-live{
  position:absolute;left:.5rem;bottom:.5rem;
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.1rem .4rem .1rem .3rem;border-radius:var(--r-s);
  background:rgba(0,0,0,.62);color:#fff;
  font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:inset 0 0 0 .0625rem rgba(255,255,255,.22);
}
.tile-live::before{
  content:"";width:.4rem;height:.4rem;border-radius:50%;
  background:var(--good,#7cee9f);
  box-shadow:0 0 .35rem var(--good,#7cee9f);
}
@media (prefers-reduced-motion:no-preference){
  .tile-live::before{animation:tileLivePulse 2.4s ease-in-out infinite}
}
@keyframes tileLivePulse{0%,100%{opacity:1}50%{opacity:.45}}
.tile.running .tile-dim{opacity:.15}

/* ── Hint bar ─────────────────────────────────────────────── */
.hints{
  display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
  padding:0 var(--edge) var(--safe-y);
  font-size:.78rem;letter-spacing:.05em;color:var(--steel);
  min-height:2.4rem;
}
.hint-set{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.hint{display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.hint-glyphs{display:inline-flex;align-items:center;gap:.25rem}
/* Pad glyphs. Unlike every other icon in this sheet these are FILLED
   outlines, not strokes: PromptFont draws each prompt as the button
   cap with its mark knocked out, so the whole glyph is one filled
   path with an even-odd hole in it. The stroke language the rest of
   the sheet uses would draw the outline of the hole instead.

   The L1/R1/L2/R2 labels used to be <text> elements styled by this
   sheet, which meant a hint bar that depended on a webfont having
   arrived to say which trigger it meant. The labels are outlines in
   the glyph now, so that dependency is gone. */
.glyph{
  width:1.4rem;height:1.4rem;display:block;
  fill:currentColor;stroke:none;
  color:var(--ice);
}
.glyph .solid{fill:currentColor;stroke:none}
.key{
  display:inline-grid;place-items:center;min-width:1.375rem;height:1.375rem;padding:0 .375rem;
  border:.0625rem solid var(--line);border-radius:var(--r-s);
  background:var(--deep);
  font-size:.69rem;font-weight:500;color:var(--ice);
}
.hints-spacer{flex:1}

/* ── Overlay: control centre + panels ─────────────────────── */
#cc{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(5,5,5,.76);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
#cc.open{opacity:1;pointer-events:auto}
#cc[data-view="panel"]{align-items:center}
#cc[data-view="panel"] .cc-panel{display:none}
#cc[data-view="cc"] .panel-stack{display:none}

.cc-panel{
  width:100%;padding:0 var(--edge) calc(var(--safe-y) + 1rem);
  translate:0 1.875rem;transition:translate .42s var(--e-out);
}
#cc.open .cc-panel{translate:0 0}
/* Big enough to be an image of a word rather than a word, so the poster
   face earns its place: this line changes as the cursor crosses the row
   and is read at a glance, never studied. */
.cc-label{
  text-align:center;font-family:var(--poster);font-weight:400;
  font-size:1.9rem;line-height:1;letter-spacing:.02em;color:var(--ice);
  min-height:2rem;margin-bottom:1.5rem;
}
.cc-label small{display:block;font-family:var(--sans);font-weight:400;font-size:.8125rem;letter-spacing:0;color:var(--steel);margin-top:.4rem}
.cc-row{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap}
/* Squares, not circles. The rest of the shell is built from cards and
   hairlines now, and a row of discs was the last thing on screen still
   speaking the old language. */
.cc-item{
  width:4.5rem;height:4.5rem;border-radius:var(--r-m);
  display:grid;place-items:center;
  border:.0625rem solid var(--line);background:var(--deep);
  color:var(--steel);
  transition:transform .25s var(--e-out),border-color .25s,color .25s,background .25s,box-shadow .28s var(--e-out);
}
.cc-item svg{width:1.625rem;height:1.625rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cc-item:hover,.cc-item[aria-current="true"]{
  transform:translateY(-.25rem);color:var(--ice);
  border-color:#43444a;background:var(--haze);
}
.cc-item[data-focus="on"]{
  transform:translateY(-.25rem);color:var(--ice);background:var(--haze);
  border-color:transparent;
  box-shadow:0 0 0 .125rem var(--sel);
}

/* ── Panels ───────────────────────────────────────────────── */
.panel-stack{width:100%;display:flex;justify-content:center;padding:0 var(--edge)}
/* A boxed panel is a piece pinned to the wall: concrete, a two-pixel
   chalk keyline, and the site's stacked hard shadow — a black offset
   behind it and a thin chalk edge behind THAT, so it reads as a printed
   card lifted off the surface rather than as a floating pane of glass.
   Stated in rem so it scales with the root like everything else. */
.panel{
  width:min(64rem,100%);
  background:var(--deep);
  border:.125rem solid var(--ice);border-radius:var(--r-s);
  box-shadow:.4375rem .4375rem 0 0 var(--ink),
             .4375rem .4375rem 0 .0938rem rgba(239,233,214,.5);
  overflow:hidden;
  translate:0 1.25rem;opacity:0;
  transition:translate .38s var(--e-out),opacity .3s var(--e-out);
}
.panel.in{translate:0 0;opacity:1}
.panel.behind{display:none}
.panel-head{padding:1.5rem 1.75rem 1rem;border-bottom:.0625rem solid var(--line)}
/* The breadcrumb above a panel's title is a sticker too — violet, the
   pigment the site gives its own wordmark, so "where am I" is a
   different colour from "what does this do". */
.panel-eyebrow{
  display:inline-flex;align-items:center;
  padding:.16rem .5rem .26rem;margin:0 0 .6rem;
  font-family:var(--marker);font-weight:400;
  font-size:.75rem;line-height:1.2;letter-spacing:.01em;
  color:#fff;background:var(--violet);
  border:.125rem solid var(--ink);border-radius:var(--r-s);
  box-shadow:var(--sticker-shadow);
  rotate:-1.5deg;transform-origin:left center;
}
@media (prefers-reduced-motion:reduce){ .panel-eyebrow{rotate:0deg} }
.panel-title{font-family:var(--poster);font-weight:400;font-size:2.25rem;line-height:.96;margin:0;letter-spacing:.02em;color:var(--ice)}
.panel-sub{margin:.4rem 0 0;font-size:.875rem;color:var(--steel);max-width:56ch}
.panel-body{padding:1.1rem 1.25rem 1.5rem;max-height:52vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.panel-body::-webkit-scrollbar{width:.4rem}
.panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.row{
  display:flex;align-items:center;gap:.875rem;width:100%;
  padding:.75rem .875rem;border-radius:var(--r-m);
  border:.0625rem solid transparent;background:var(--haze);
  margin-bottom:.375rem;color:var(--ice);
  transition:background .25s,border-color .25s,box-shadow .28s var(--e-out);
}
.row:hover{background:#292a2e}
/* No translateX on focus. A row that slides when it is selected makes the
   left edge of the list ragged as the cursor moves down it. */
.row[data-focus="on"]{background:#292a2e;border-color:transparent;box-shadow:0 0 0 .125rem var(--sel)}
.row[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.3)}
.row[aria-disabled="true"]{opacity:.5}
.row-ico{
  flex:0 0 auto;width:2.25rem;height:2.25rem;border-radius:var(--r-s);display:grid;place-items:center;
  background:#2b2c30;color:var(--steel);
}
.row[data-focus="on"] .row-ico{color:var(--ice)}
.row-ico svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.row-text{flex:1;min-width:0}
.row-text b{display:block;font-weight:500;font-size:.9375rem;letter-spacing:0}
.row-text small{display:block;font-size:.8125rem;color:var(--steel);margin-top:.0625rem}
.row-tail{flex:0 0 auto;font-size:.8125rem;color:var(--steel);font-variant-numeric:tabular-nums}
/* Danger keeps a colour of its own — this is the one place where the ring
   carrying meaning beats the ring being uniformly white. */
.row.danger[data-focus="on"]{box-shadow:0 0 0 .125rem var(--warn)}
.row.danger .row-ico{color:var(--warn)}

/* fact list — read-only values, never focusable. Same table as the
   home screen's hero-facts, minus the card: a panel is already one.
   Hairlines rather than zebra striping — the stripes were doing the
   work of separating rows that a single rule does more quietly. */
.facts{display:grid;padding:.2rem .3rem .8rem}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.5rem .45rem}
.fact + .fact{border-top:.0625rem solid var(--line-soft)}
.fact span{font-size:.8125rem;color:var(--dim)}
.fact b{font-size:.8125rem;font-weight:500;color:var(--ice);font-variant-numeric:tabular-nums;text-align:right}
.note{
  margin:.5rem .3rem 0;padding:.6rem .8rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);border-left:.1875rem solid var(--warn);
  background:var(--haze);
  font-size:.8125rem;color:var(--steel);letter-spacing:0;
}
.note b{color:var(--warn);font-weight:500}

/* profile header inside its panel */
.profile{display:flex;align-items:center;gap:1.25rem;padding:.4rem .6rem 1.1rem}
.profile .avatar{width:4.4rem;height:4.4rem;font-size:1.6rem}
.profile-id b{display:block;font-family:var(--poster);font-weight:400;font-size:2rem;line-height:1;letter-spacing:.02em;color:var(--ice)}
.profile-id small{display:block;font-size:.8125rem;color:var(--steel);margin-top:.2rem}

/* A picture, when one is chosen. The image is set as backgroundImage —
   the LONGHAND, never the `background` shorthand, because the shorthand
   also resets background-size and would silently un-cover every avatar
   the same way it once un-covered every tile in the rail. */
.avatar.has-pic{
  background-color:var(--haze);
  background-size:cover;background-position:center;background-repeat:no-repeat;
  color:transparent;
}

/* The built-in pictures: a row of focusable discs. They are drawn here,
   in the shell's own vocabulary — a two-tone field — rather than
   shipped as files, so the set costs no bytes and cannot go missing. */
.avpick{display:flex;flex-wrap:wrap;gap:.55rem;padding:.3rem .3rem .7rem}
.avopt{
  flex:0 0 auto;width:3.4rem;height:3.4rem;border-radius:50%;
  display:grid;place-items:center;overflow:hidden;padding:0;
  border:.0625rem solid var(--line);background:var(--haze);
  transition:border-color .25s,box-shadow .28s var(--e-out);
}
.avopt svg{width:100%;height:100%;display:block}
.avopt[aria-current="true"]{border-color:rgba(255,255,255,.55)}
.avopt[data-focus="on"]{border-color:transparent;box-shadow:0 0 0 .125rem var(--sel)}
.avopt[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.3)}
/* The "none" option is the monogram the shell falls back to, shown as
   itself rather than as an empty hole. */
.avopt.mono{
  background:var(--beam);color:var(--ink);
  font-family:var(--poster);font-weight:400;font-size:1.7rem;
}

/* settings: category rail + content pane, both pad-navigable */
.settings{display:grid;grid-template-columns:minmax(12rem,17rem) 1fr;gap:1rem;min-height:20rem}
/* overflow-y:auto makes overflow-x compute to auto too, so this scroller
   clips on ALL FOUR sides at its padding box - and .row's focus ring is a
   SPREAD box-shadow painted outside the border box, which does not count
   as scrollable overflow. With padding 0 the ring's left stroke was sliced
   off every category row, and its TOP stroke off the first one — which is
   where the cursor lands every single time Settings opens.

   Both axes are fixed the same way: padding gives the ring room, an equal
   negative margin gives the space straight back, so nothing on screen
   moves (measured: row.left 422.98 -> 422.98). The negative margin is what
   makes the block axis safe too — bare padding-top would fight
   max-height + border-box and push the whole list down 4.36px, which is
   the objection that kept the top edge broken. */
.set-cats{
  border-right:.0625rem solid var(--line);
  padding:.25rem .75rem 0 .25rem;margin:-.25rem 0 0 -.25rem;
  overflow-y:auto;max-height:46vh;scrollbar-width:thin;
}
.set-cats .row{margin-bottom:.25rem;padding:.625rem .75rem}
.set-cats .row[aria-current="true"]{background:#2b2c30}
/* Same treatment, same reason: .2rem of block padding was 1.2px of clearance
   for a 2px ring, which is inside the rounding error rather than inside the
   budget. .3rem with the margin returned is the ring's room, not a gap. */
.set-pane{
  padding:.3rem .4rem;margin-top:-.3rem;
  overflow-y:auto;max-height:46vh;scrollbar-width:thin;
}
.set-pane h3{font-family:var(--poster);font-weight:400;font-size:1.6rem;line-height:1;letter-spacing:.02em;color:var(--ice);margin:.2rem 0 .35rem}
.set-pane p{font-size:.875rem;color:var(--steel);margin:.2rem 0 .9rem;max-width:56ch}

/* ── Settings, full screen ─────────────────────────────────────
   Settings is not a dialogue about the shell, it IS a screen of the
   shell, so it gets the whole panel instead of a card floating in the
   middle of one. .panel.behind{display:none} guarantees only one panel
   is ever visible, so a picker pushed on top of this still draws as an
   ordinary centred card over it — the full-bleed treatment belongs to
   the panel, not to the stack.

   Everything below is a modifier on the SAME .panel/.set-cats/.set-pane
   objects the boxed panels use. Nothing here is a second settings
   screen; it is the one settings screen given room. */
#cc[data-view="panel"]{align-items:stretch}
/* --hint-h is measured by Overlay.sync() and is the height of the shell's
   own hint bar. Ending the overlay there is what keeps the hints lit and
   unblurred under a full-screen panel: see the note in sync(). */
#cc.full{
  bottom:var(--hint-h,0px);
  background:rgba(6,6,6,.95);backdrop-filter:blur(28px);
}
.panel-stack{align-items:center;justify-content:center}
.panel.panel-full{
  width:100%;max-width:none;height:100%;
  background:transparent;border:0;border-radius:0;box-shadow:none;
  display:grid;grid-template-rows:auto minmax(0,1fr);
  padding-block:var(--safe-y);
  overflow:visible;                 /* the ring room below is real, not clipped */
}
.panel-full .panel-head{padding:0 0 1rem}
.panel-full .panel-title{font-size:3.4rem}
.panel-full .panel-sub{max-width:70ch}
/* height, not max-height: the body IS the second grid track, and the two
   panes inside it scroll independently within it. */
.panel-full .panel-body{
  max-height:none;height:100%;min-height:0;
  padding:1.25rem 0 0;overflow:visible;
}
.panel-full .settings{
  height:100%;min-height:0;
  grid-template-columns:clamp(13rem,17vw,20rem) minmax(0,1fr);
  gap:clamp(1rem,2.2vw,3rem);
}
.panel-full .set-cats,
.panel-full .set-pane{max-height:none;height:100%;min-height:0}
.panel-full .set-cats{padding-right:clamp(.75rem,1.4vw,1.5rem)}
.panel-full .set-pane{padding-right:.75rem}
/* Rows do not need to be 2000px wide to fill a screen; the screen is
   filled by the three zones, not by stretching one of them. */
.panel-full .set-pane > *{max-width:72rem}
/* The 34rem cap on a slider track is right inside a 64rem card and wrong
   inside a full-screen row: the track stopped a third of the way across
   while its percentage sat at the far right, so the number looked like it
   belonged to something else. In here the track IS the row's width. */
.panel-full .slider-track{max-width:none}

/* The category's name and its blurb, lifted out of the content column.
   In a boxed panel they are simply the first two things in the pane, as
   they always were. */
.set-mast h3{margin-top:0}

/* ── 21:9 settings ─────────────────────────────────────────────
   The extra width buys a THIRD zone rather than a wider list: the
   category rail, the category's masthead, and the controls. The
   masthead holds no focusables, so the focus model is untouched — it is
   still two columns of rows with left/right crossing between them. */
@media (min-aspect-ratio:2/1){
  .panel-full .set-pane{
    display:grid;
    grid-template-columns:minmax(15rem,21rem) minmax(0,1fr);
    column-gap:clamp(1.5rem,2.6vw,3.5rem);
    align-content:start;
  }
  .panel-full .set-mast{
    grid-column:1;grid-row:1 / span 999;
    align-self:start;position:sticky;top:0;
  }
  .panel-full .set-mast h3{font-size:2.4rem;line-height:1}
  .panel-full .set-mast p{max-width:none;font-size:.9375rem}
  .panel-full .set-pane > :not(.set-mast){grid-column:2;max-width:none}
}

/* ── Settings content: real state, and the vocabulary for showing it ──
   Every atom here exists to make the difference between "read from the
   OS", "still reading" and "could not read" visible at TV distance. */
.panel-body h4{
  font-size:.75rem;letter-spacing:.02em;color:var(--dim);
  margin:1.1rem .3rem .45rem;font-weight:500;
}
.panel-body h4:first-child,.set-pane h4:first-of-type{margin-top:.2rem}
.set-pane .facts{padding-bottom:.4rem}

/* a line of status under a heading — "Scanning…", "3 networks", an error */
.stat{
  display:flex;align-items:center;gap:.5rem;
  margin:.1rem .3rem .5rem;font-size:.78rem;color:var(--steel);letter-spacing:.02em;
}
.stat.bad{color:#ffcda6}
.stat.good{color:var(--good)}

/* the spinner. One ring, the accent, the same curve as everything else. */
.spin{
  width:.85rem;height:.85rem;flex:0 0 auto;border-radius:50%;
  border:.11rem solid var(--line);border-top-color:var(--beam);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* an error the human can act on: what failed, what the OS said, what to do.
   Same shape as .note — a hairline card with a coloured left edge — so
   "here is a caveat" and "here is a failure" are the same object in two
   severities rather than two unrelated inventions. */
.err{
  margin:.5rem .3rem;padding:.7rem .9rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);border-left:.1875rem solid var(--warn);
  background:var(--haze);
  font-size:.8125rem;color:#f3e4cd;letter-spacing:0;
}
.err b{display:block;font-weight:600;color:var(--warn);margin-bottom:.15rem}
.err code{font-family:var(--sans);font-size:.75rem;color:var(--steel)}

/* right-hand column of a row: chips that carry state, not decoration.
   Same object as the hero's .chip — small rect, hairline, sentence case. */
.tag{
  display:inline-block;padding:.16rem .45rem;border-radius:var(--r-s);
  border:.0625rem solid rgba(239,233,214,.18);background:rgba(0,0,0,.35);
  font-size:.6875rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--steel);
  margin-left:.35rem;vertical-align:middle;
}
.tag.on{color:var(--good);border-color:rgba(124,238,159,.45)}
.tag.warn{color:var(--warn);border-color:rgba(255,178,122,.45)}

/* signal strength — five bars, filled to the measured level */
.sig{display:inline-flex;align-items:flex-end;gap:.09rem;height:.8rem;vertical-align:middle}
.sig i{width:.16rem;background:#43444a}
.sig i:nth-child(1){height:26%}
.sig i:nth-child(2){height:45%}
.sig i:nth-child(3){height:64%}
.sig i:nth-child(4){height:82%}
.sig i:nth-child(5){height:100%}
.sig i.lit{background:var(--ice)}

/* used/free bar for a drive */
.bar{height:.375rem;border-radius:var(--r-s);background:#2b2c30;overflow:hidden;margin:.35rem 0 .2rem}
.bar i{display:block;height:100%;background:var(--beam)}
.bar.hot i{background:var(--warn)}
.drive{padding:.7rem .875rem;border-radius:var(--r-m);background:var(--haze);margin-bottom:.375rem}
.drive-top{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.drive-top b{font-weight:500;font-size:.9375rem}
.drive-top span{font-size:.8125rem;color:var(--steel);font-variant-numeric:tabular-nums}
.drive-sub{font-size:.75rem;color:var(--dim);letter-spacing:0}

/* A slider that is a focusable row: left/right adjust, and the track is
   drawn under the label rather than beside it so it survives narrow panes.

   sliderRow() builds the track and the hint as <span>s, so every one of
   them needs an explicit display. Without it the track is an INLINE box:
   `height` and `overflow` do not apply to inline non-replaced elements,
   so the .5rem track was ignored and .slider-fill — a block inside an
   inline, with height:100% resolved against the row — grew into a
   ~1300×600 slab. That is what "the microphone and speaker sliders are
   too big" was: not a taste call, a layout bug that only shows up once
   somebody looks at the screen. The height is now stated on the fill as
   well as the track so a percentage can never be the thing that decides
   it. */
.row.slider{display:block;padding:.75rem 1rem}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.slider-head b{font-weight:500;font-size:.9375rem}
.slider-head span{font-size:.875rem;color:var(--steel);font-variant-numeric:tabular-nums}
.row.slider[data-focus="on"] .slider-head span{color:var(--ice)}
.slider-track{
  display:block;height:.375rem;width:100%;max-width:34rem;
  border-radius:var(--r-s);background:#2b2c30;
  overflow:hidden;margin:.5rem 0 .3125rem;
}
.slider-fill{
  display:block;height:.375rem;border-radius:var(--r-s);background:var(--beam);
  transition:width .12s linear;
}
.row.slider.muted .slider-fill{background:var(--dim)}
.slider-hint{display:block;font-size:.75rem;color:var(--dim);letter-spacing:0}

/* the display-mode countdown. Amber, because the default answer is revert. */
.countdown{
  font-family:var(--poster);font-weight:400;font-size:4rem;line-height:1;
  letter-spacing:.02em;
  color:var(--warn);font-variant-numeric:tabular-nums;margin:.6rem 0 .2rem;
}
.countdown-sub{font-size:.8125rem;color:var(--steel);margin-bottom:.2rem}

/* confirmation — never one press away from powering off a console.
   The two buttons are the only place a focus ring is allowed to carry
   meaning: amber round the destructive one, white round the safe one,
   because here the difference between them is the whole point. */
.confirm{width:min(34rem,100%);text-align:center}
.confirm .panel-head{border-bottom:0;padding-bottom:.4rem}
.confirm-actions{display:flex;gap:.5rem;justify-content:center;padding:.6rem 1.5rem 1.75rem}
.cbtn{
  padding:.6875rem 1.5rem;border-radius:var(--r-s);
  font-size:.8125rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  border:.125rem solid var(--ink);background:var(--haze);color:var(--ice);
  box-shadow:var(--sticker-shadow);
  transition:background .25s,border-color .25s,box-shadow .28s var(--e-out);
}
.cbtn.go[data-focus="on"]{background:rgba(255,178,122,.14);box-shadow:0 0 0 .1875rem var(--warn),var(--sticker-shadow)}
.cbtn.no[data-focus="on"]{background:#2b2c30;box-shadow:0 0 0 .1875rem var(--sel),var(--sticker-shadow)}

/* ── The grant sheet ───────────────────────────────────────────
   MarwanOS's own consent surface: the sheet that stands in for the
   UAC dialogue (which lives on the secure desktop, discards synthetic
   input and cannot be answered from a controller) and for Edge's own
   permission bubble (which is Microsoft UI drawn inside the content
   view, where no pad can reach it).

   It is the .confirm family with two differences that carry the whole
   meaning: Deny holds the focus, and Allow has to be HELD. A stray
   Cross must not be able to hand a web page a microphone or an
   administrator a package to install, and a hold is the one gesture a
   pad has that cannot happen by accident.

   Its own layer, not the panel stack. #cc sits at z-index 40, and the
   browser's chrome is at 820 — a permission raised by a web page has
   to be drawn OVER that, and under the on-screen keyboard at 900,
   which osk.css asks every new full-screen surface to stay below. The
   content WebView is a child window and cannot be covered at all, so
   browser.js hides it for as long as this is up; see suspendContent(). */
.grant-layer{
  position:fixed;inset:0;z-index:880;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--safe-y) var(--edge);
  background:rgba(5,5,5,.84);backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transition:opacity .25s var(--e-out);
}
.grant-layer.open{opacity:1;pointer-events:auto}
.panel.grant{width:min(41rem,100%)}
/* Amber, not the violet the rest of the shell stickers its breadcrumbs
   with: this eyebrow is not saying where you are, it is saying that
   something is being asked of you. */
.grant .panel-eyebrow{background:var(--warn);color:var(--ink)}
/* danger: the sheet's own keyline goes amber. Not the eyebrow (which is
   amber on every permission — being asked is the constant), and not the
   buttons (Deny must keep the white ring that means "this is the safe
   one"). Reserved for what cannot be taken back quietly: a camera, a
   microphone, where the console is, an administrator installing
   something across the whole machine. A notification prompt is not that
   and does not get to look like it. */
.grant.danger{border-color:var(--warn)}
.grant .panel-body{text-align:left;padding-bottom:.4rem}
.grant .facts{padding-bottom:.2rem}
.grant-note{
  margin:.2rem 1.5rem 1.25rem;font-size:.75rem;letter-spacing:0;
  color:var(--dim);text-align:center;
}
/* The hold. Two readings of the same number, because one of them is
   always the wrong size for the seat you are in: a wash across the
   button that can be seen from the sofa, and a rule along its bottom
   edge that says precisely how far through it is. Neither is
   transitioned — the fill IS the clock, and a transition would make it
   lag the finger holding it. */
.cbtn.hold{position:relative;overflow:hidden}
.cbtn.hold .hold-fill{
  position:absolute;inset:0;
  background:var(--warn);opacity:.22;
  transform:scaleX(var(--hold,0));transform-origin:left center;
  transition:none;pointer-events:none;
}
.cbtn.hold::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:.1875rem;
  background:var(--warn);
  transform:scaleX(var(--hold,0));transform-origin:left center;
  transition:none;pointer-events:none;
}
.cbtn.hold .cbtn-t{position:relative}
.grant.holding .cbtn.hold{box-shadow:0 0 0 .1875rem var(--warn),var(--sticker-shadow)}
/* The remember row is an ordinary .row, one line above the buttons. */
.grant-toggle{margin:.2rem .3rem .6rem}
/* The sheet carries its own hint bar, in the same place on the screen as
   the shell's and rendered by the same renderer, because the shell's own
   is not available in either scope this sheet appears in: inside #shell
   (z-index 10) it is behind the browser's chrome, and behind this
   layer's own scrim it is blurred out. Same chips, one renderer, so the
   two can never teach different gestures. */
.grant-hints{
  position:absolute;left:0;right:0;bottom:var(--safe-y);
  display:flex;align-items:center;justify-content:center;gap:1.5rem;flex-wrap:wrap;
  padding:0 var(--edge);
  font-size:.78rem;letter-spacing:.05em;color:var(--steel);
}

/* toast — a panel failing must never be silent, and must never be fatal */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-y) + 3.6rem);translate:-50% 1rem;z-index:60;
  max-width:44rem;padding:.7rem 1.1rem;border-radius:var(--r-m);
  background:var(--deep);border:.0625rem solid var(--line);border-left:.1875rem solid var(--warn);
  color:#f3e4cd;
  font-size:.8125rem;letter-spacing:0;opacity:0;pointer-events:none;
  transition:opacity .25s var(--e-out),translate .25s var(--e-out);
}
#toast.show{opacity:1;translate:-50% 0}

/* On a short display the description is the first thing to go — the
   primary action must never be the thing that gets squeezed out. */
@media (max-height:620px){
  .hero-desc{display:none}
  .eyebrow{margin-bottom:.5rem}
  .panel-body{max-height:44vh}
}
/* Portrait / very narrow: the rail and hints wrap rather than clip. */
@media (max-aspect-ratio:1/1){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hints{gap:1rem}
  .art-key{width:96vw;right:-12vw;opacity:.55}
  .art-key.on{opacity:.55}
}

/* ── 21:9 ──────────────────────────────────────────────────────
   What the extra width is FOR, stated once. Not "the same layout
   with more black either side": the reading column stays the width
   a column should be, the artwork gets wider, and the rail gets
   bigger covers — so an ultrawide panel shows more art at a larger
   size rather than the same UI further apart. 3440×1440 is 2.39:1
   and lands here; 2560×1440 is 1.78:1 and does not. */
@media (min-aspect-ratio:2/1){
  :root{
    --cover-u: 10.25;
    --cover-active-u: 15;
    --col: 50vw;
  }
  /* More room across, so the cover is shown larger rather than merely
     further from the text. */
  .art-key{height:156vh;width:calc(156vh * 2 / 3);top:-13vh}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001s !important;animation-delay:0s !important;
    transition-duration:.12s !important;
  }
}

   television. Every entry point from the outside world — host
   messages, key events, pad actions, panel builders — goes through
   safe(), which logs to the host and shows a toast instead of
   unwinding into nothing. */
let toastTimer = 0;
function toast(msg){
  try{
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 5200);
  }catch(e){}
}
function hostLog(s){
  try{ if (typeof window.mosPost === "function") window.mosPost({type:"log", target:s}); }catch(e){}
  try{ console.log("[mos] " + s); }catch(e){}
}
function report(where, err){
  const msg = where + ": " + (err && err.message ? err.message : String(err));
  hostLog("ERROR " + msg + (err && err.stack ? " | " + String(err.stack).split("\n")[1] : ""));
  toast(msg);
}
function safe(where, fn){
  return function(){
    try { return fn.apply(this, arguments); }
    catch(err){ report(where, err); }
  };

function glyphSVG(name){
  const d = PAD_GLYPH[name];

  return '<svg class="glyph" viewBox="0 0 24 24" aria-hidden="true">' + d + "</svg>";
}

/* One row of the interaction table, rendered either as pad glyphs or
   as key caps depending on what the human last touched.

   `label` may be a function, evaluated at render time. Exactly one row
   needs it — see launchWord() — and it needs it because the hero button
   that used to carry the word "Resume" is no longer drawn, so the Cross
   chip is where that word lives now.

   Two rows changed hands when the hero buttons went:
