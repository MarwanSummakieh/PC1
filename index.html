  b.dataset.label = o.label;
  if (o.disabled) b.setAttribute("aria-disabled", "true");
  b.innerHTML =
    (o.icon ? '<span class="row-ico"><svg viewBox="0 0 24 24">' + (ICON[o.icon] || "") + "</svg></span>" : "") +
    '<span class="row-text"><b></b>' + (o.sub ? "<small></small>" : "") + "</span>" +
    (o.tail ? '<span class="row-tail"></span>' : "");
  b.querySelector(".row-text b").textContent = o.label;
  if (o.sub)  b.querySelector(".row-text small").textContent = o.sub;
  if (o.tail) b.querySelector(".row-tail").textContent = o.tail;
  b.addEventListener("click", safe("row click", (ev) => {
    if (ev.detail === 0) return;                 // synthetic click: the pad path handles it
    Input.set("key");
    Focus.focusEl(b);
    Focus.activate();
  }));
  return b;
}

function factsEl(pairs){
  const d = document.createElement("div");
  d.className = "facts";
  pairs.forEach(([k, v]) => {
    const f = document.createElement("div");
    f.className = "fact";
    const s = document.createElement("span"); s.textContent = k;
    const b = document.createElement("b");    b.textContent = v;
    f.appendChild(s); f.appendChild(b);
    d.appendChild(f);
  });
  return d;
}
function noteEl(html){
  const n = document.createElement("div");
  n.className = "note";
  n.innerHTML = html;
  return n;
}

function pushPanel(id, node, opts){
  const stackEl = $("#panelStack");
  [...stackEl.children].forEach(c => c.classList.add("behind"));
  stackEl.appendChild(node);
  requestAnimationFrame(() => node.classList.add("in"));

  const items = Focus.collect(node);
  /* opts may carry its own teardown as onClose. It must not be able to
     replace onPop, or a panel that wanted a callback would leak its
     node into the DOM forever. */
  const extra = Object.assign({}, opts || {});
  const onClose = extra.onClose;
  delete extra.onClose;
  delete extra.onPop;
  const sc = Focus.push(Object.assign({
    id: "panel:" + id,
    items,
    index: 0,
    hints: ["navUD", "select", "back"],
    onPop(){
      try{ if (onClose) onClose(); }catch(err){ report("panel " + id + " onClose", err); }
      node.remove();
      const rest = $("#panelStack").children;
      if (rest.length) rest[rest.length - 1].classList.remove("behind");
      Overlay.sync();
    }
  }, extra));
  Overlay.sync();
  return sc;
}

function openPanel(id){
  let node;
  try{
    const build = PANEL_BUILD[id];
    if (!build) throw new Error("no panel named '" + id + "'");
    const r = build();
    node = r.node;
    return pushPanel(id, node, r.scope);
  }catch(err){
    report("panel " + id, err);
    const fail = panelShell("Panel unavailable", "This panel failed to open. The rest of the shell is unaffected.", "Error");
    fail.querySelector(".panel-body").appendChild(
      rowEl({ label:"Back", sub:String(err && err.message ? err.message : err), icon:"info", act:"back" }, 0, 0));
    return pushPanel(id + ":error", fail, { hints:["select","back"] });
  }
}

/* ── Device name ──────────────────────────────────────────
   The one setting in this tree that is genuinely editable, and the
   proof that the on-screen keyboard round-trips: open() -> the human
   types -> onCommit -> stored -> shown. It is deliberately a
   shell-local label, not the Windows computer name; renaming a
   machine is a privileged operation and belongs to the host, not to
   a text field in a placeholder panel. */
let deviceName = "";
try{ deviceName = localStorage.getItem("marwanos.deviceName") || ""; }catch(e){}

let settingsRepaint = null;             // set while the settings panel is up
let settingsGoto = null;                // jump the open settings panel to a category

function setDeviceName(v){
  deviceName = (v || "").trim().slice(0, 32);
  try{
    if (deviceName) localStorage.setItem("marwanos.deviceName", deviceName);
    else localStorage.removeItem("marwanos.deviceName");
  }catch(e){ hostLog("device name not persisted: " + e); }
  hostLog("device name committed: '" + deviceName + "'");
  toast(deviceName ? ("Device name set to “" + deviceName + "”") : "Device name cleared");
  try{ if (settingsRepaint) settingsRepaint(); }catch(err){ report("settings repaint", err); }
  Focus.repaint();
}

/* ═══ Profile ════════════════════════════════════════════
   The name and the picture on the status bar, and the only two
   settings in this shell that are about the person rather than the
   machine.

   THEY ARE THE SHELL'S, NOT WINDOWS'. Renaming a Windows account needs
   elevation this process deliberately does not have, and the Shell
   Launcher mapping that makes this program the shell is keyed by the
   account's SID — a rename would not break the mapping, but it is one
   privileged write away from a machine that boots to a black screen
   with no shell and no way in, and there is no version of "I would like
   to be called something else" that is worth that. So the name lives in
   the shell's own storage and the Windows account underneath keeps the
   name it was provisioned with. Settings → About still shows the real
   account, unchanged, so the two are never confused.

   "The shell's own storage" is localStorage, which under this host is
   %LOCALAPPDATA%\ArcOS\WebView2 — the same folder that holds the
   browser profile and the library cache. ArcOS, not MarwanOS: the
   product was renamed, the machine was not.

   The picture is stored as a data URI, either one of the built-ins
   below (an SVG string, a few hundred bytes) or a PNG the host
   re-encoded from a file the human picked in the explorer. Nothing here
   ever points at a path: a file that is moved or unplugged would leave
   a broken picture on the status bar with nothing to explain it. */
const PROFILE_KEY = { name:"marwanos.profile.name", pic:"marwanos.profile.pic" };

let profileName = "";
let profilePic  = "";                   // "" | "builtin:<id>" | a data: URI
let hostUser    = "";                   // what Windows says, for the fallback and About

try{
  profileName = localStorage.getItem(PROFILE_KEY.name) || "";
  profilePic  = localStorage.getItem(PROFILE_KEY.pic)  || "";
}catch(e){ hostLog("profile not read from storage: " + e); }

/* The built-in pictures. Drawn, not shipped: one two-tone field, at
   eight hues, so the set is part of the design language rather than
   eight PNGs that can go missing next to index.html. */
const AVATARS = [
  { id:"ember",  h:14  }, { id:"amber", h:38  }, { id:"moss",  h:96  },
  { id:"teal",   h:168 }, { id:"beam",  h:214 }, { id:"iris",  h:258 },
  { id:"plum",   h:296 }, { id:"rose",  h:338 }
];

/* Returned as markup rather than as a data: URI on purpose — an inline
   <svg> is a DOM subtree the CSP has no opinion about, and it scales
   with the root font-size instead of being resampled.

   The tone break is struck from ONE centre well outside the box
   (-30, 90) at r=85, so what you see is a shallow sweep across the disc
   rather than a circle sitting on it — a picture of something, and the
   wrong thing. What separates the eight is hue, not drawing. */
function avatarSVG(h){
  const lit  = "hsl(" + h + " 46% 46%)";
  const dark = "hsl(" + ((h + 24) % 360) + " 38% 20%)";
  return '<svg viewBox="0 0 64 64" aria-hidden="true">' +
    '<rect width="64" height="64" fill="' + lit + '"/>' +
    '<circle cx="-30" cy="90" r="85" fill="' + dark + '"/>' +
    "</svg>";
}
function avatarById(id){ return AVATARS.filter(a => a.id === id)[0] || null; }

/* The one place that decides what a picture IS, so the status bar, the
   profile panel and the picker can never disagree about it. */
function avatarPaint(el, pic, initial){
  el.classList.remove("has-pic");
  el.style.backgroundImage = "";
  el.innerHTML = "";
  if (pic && pic.indexOf("builtin:") === 0){
    const a = avatarById(pic.slice(8));
    if (a){ el.classList.add("has-pic"); el.innerHTML = avatarSVG(a.h); return; }
  } else if (pic){
    /* backgroundImage, the longhand. The `background` shorthand resets
       background-size and would kill the `cover` in the stylesheet. */
    el.classList.add("has-pic");
    el.style.backgroundImage = 'url("' + pic + '")';
    return;
  }
  el.textContent = (initial || "?").toUpperCase();
}

function displayName(){ return profileName || hostUser || "Player"; }

function paintUser(){
  const n = displayName();
  const nameEl = $("#userName"), avEl = $("#avatarSmall");
  if (nameEl) nameEl.textContent = n;
  if (avEl){
    avEl.innerHTML = "";
    avatarPaint(avEl, profilePic, n[0]);
    /* An inline <svg> inside a 1.875rem disc needs no sizing of its own —
       .avatar is a grid whose only child fills it. */
    const s = avEl.querySelector("svg");
    if (s){ s.style.width = "100%"; s.style.height = "100%"; }
  }
}

function setProfileName(v){
  profileName = (v || "").trim().slice(0, 24);
  try{
    if (profileName) localStorage.setItem(PROFILE_KEY.name, profileName);
    else localStorage.removeItem(PROFILE_KEY.name);
  }catch(e){ hostLog("profile name not persisted: " + e); }
  hostLog("profile name committed: '" + profileName + "'");
  toast(profileName ? ("You are now “" + profileName + "”") : "Name cleared — the Windows account name is used instead.");
  paintUser();
  refreshProfileUI();
}

function setProfilePic(v){
  profilePic = v || "";
  try{
    if (profilePic) localStorage.setItem(PROFILE_KEY.pic, profilePic);
    else localStorage.removeItem(PROFILE_KEY.pic);
  }catch(e){
    /* A 256px PNG is ~60-120 KB as base64 and localStorage is capped
       around 5 MB, so this is only ever reached on a quota that is
       already full of something else. Say so rather than leaving a
       picture on screen that will be gone after a restart. */
    hostLog("profile picture not persisted: " + e);
    toast("The picture is set for this session but could not be saved.");
  }
  paintUser();
  refreshProfileUI();
}

/* Both editors — the control-centre panel and the Settings category —
   are built from the same rows, so a change made in one redraws the
   other. Neither knows the other exists. */
function refreshProfileUI(){
  try{ if (settingsRepaint) settingsRepaint(); }catch(err){ report("settings repaint", err); }
  const sc = Focus.top();
  if (sc && sc.id === "panel:profile"){ Focus.pop(); openPanel("profile"); return; }
  Focus.repaint();
}

/* ═══ Settings atoms ═════════════════════════════════════
   Small builders shared by every category, so "reading…",
   "unavailable" and "this is what the OS said" look the same
   everywhere and can never be confused with a real reading. */

function statEl(text, kind, spinning){
  const d = document.createElement("div");
  d.className = "stat" + (kind ? " " + kind : "");
  if (spinning){ const s = document.createElement("span"); s.className = "spin"; d.appendChild(s); }
  const t = document.createElement("span"); t.textContent = text;
  d.appendChild(t);
  d.__text = t;
  return d;
}
function setStat(el, text, kind, spinning){
  if (!el) return;
  el.className = "stat" + (kind ? " " + kind : "");
  const spin = el.querySelector(".spin");
  if (spinning && !spin) el.insertBefore(Object.assign(document.createElement("span"), { className:"spin" }), el.firstChild);
  if (!spinning && spin) spin.remove();
  if (el.__text) el.__text.textContent = text;
}

/* An error card. Always three things: what failed, what the system
   said, and the machine-readable code — never a bare HRESULT alone. */
function errEl(title, e){
  const d = document.createElement("div");
  d.className = "err";
  const b = document.createElement("b"); b.textContent = title;
  const p = document.createElement("div"); p.textContent = Sys.say(e);
  d.appendChild(b); d.appendChild(p);
  if (e && e.code){
    const c = document.createElement("code");
    c.textContent = e.code;
    d.appendChild(c);
  }
  return d;
}

/* A row whose action is a closure rather than a name in ACT. */
function actionRow(o, r, c){
  const spec = Object.assign({}, o, { act: o.run ? "run" : (o.act || "noop") });
  if (o.tailHTML && !spec.tail) spec.tail = " ";      // rowEl only makes the tail span if asked
  const b = rowEl(spec, r, c);
  if (o.run) b.__mosRun = o.run;
  if (o.tailHTML) b.querySelector(".row-tail").innerHTML = o.tailHTML;
  return b;
}

/* Five bars, filled to the measured level. bars is 0-4 as Windows
   reports it (wlan signal quality bucketed), so 0 lights one bar. */
function sigHTML(bars){
  let out = '<span class="sig">';
  for (let i = 0; i < 5; i++) out += '<i class="' + (i <= bars ? "lit" : "") + '"></i>';
  return out + "</span>";
}
function tagHTML(text, cls){
  return '<span class="tag' + (cls ? " " + cls : "") + '">' + escHTML(text) + "</span>";
}
function escHTML(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtBytes(n){
  if (typeof n !== "number" || !isFinite(n) || n < 0) return "—";
  if (n >= 1099511627776) return (n / 1099511627776).toFixed(2) + " TB";
  if (n >= 1073741824)    return (n / 1073741824).toFixed(1)  + " GB";
  if (n >= 1048576)       return (n / 1048576).toFixed(0)     + " MB";
  return n + " B";
}
function fmtHz(v){
  if (typeof v !== "number" || !isFinite(v) || v <= 0) return "—";
  return (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(3).replace(/0+$/, "")) + " Hz";
}
function orDash(v){ return (v === null || v === undefined || v === "") ? "—" : String(v); }

/* A drive card: name, label, a bar, and the numbers under it. */
function driveEl(d){
  const box = document.createElement("div");
  box.className = "drive";
  const pct = typeof d.usedPercent === "number" ? d.usedPercent : 0;
  const top = document.createElement("div");
  top.className = "drive-top";
  const b = document.createElement("b");
  b.textContent = (d.name || "?") + (d.label ? "  " + d.label : "");
  const s = document.createElement("span");
  s.textContent = fmtBytes(d.freeBytes) + " free of " + fmtBytes(d.totalBytes);
  top.appendChild(b); top.appendChild(s);
  const bar = document.createElement("div");
  bar.className = "bar" + (pct >= 90 ? " hot" : "");
  const fill = document.createElement("i");
  fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  bar.appendChild(fill);
  const sub = document.createElement("div");
  sub.className = "drive-sub";
  sub.textContent = [
    (d.driveType || "?"),
    d.removable ? "removable" : "internal",
    (d.fileSystem || ""),
    pct + "% used"
  ].filter(Boolean).join(" · ");
  box.appendChild(top); box.appendChild(bar); box.appendChild(sub);
  return box;
}

/* ── A slider that is a focusable row ─────────────────────
   Left/right adjust it, and it claims those directions through
   __mosAdjust so the focus manager stays generic. Cross toggles mute
   where the caller supplies one. The write is debounced: the pad can
   emit repeats faster than an audio endpoint wants to be written. */
function sliderRow(o, r, c){
  const b = document.createElement("button");
  b.className = "row slider" + (o.muted ? " muted" : "");
  b.setAttribute("data-nav", r + "," + c);
  b.dataset.act = "run";
  b.dataset.label = o.label;
  b.innerHTML =
    '<span class="slider-head"><b></b><span></span></span>' +
    '<span class="slider-track"><i class="slider-fill"></i></span>' +
    '<span class="slider-hint"></span>';
  const nameEl = b.querySelector(".slider-head b");
  const valEl  = b.querySelector(".slider-head span");
  const fillEl = b.querySelector(".slider-fill");
  const hintEl = b.querySelector(".slider-hint");
  nameEl.textContent = o.label;
  hintEl.textContent = o.hint || "";

  let value = Math.max(0, Math.min(1, typeof o.value === "number" ? o.value : 0));
  let pendingTimer = 0, inflight = false, dirty = false;

  function paint(){
    const pct = Math.round(value * 100);
    valEl.textContent = o.muted ? pct + "%  ·  muted" : pct + "%";
    fillEl.style.width = pct + "%";
    b.classList.toggle("muted", !!o.muted);
  }
  paint();

  function flush(){
    if (!o.commit) return;
    if (inflight){ dirty = true; return; }
    inflight = true;
    const v = value;
    Promise.resolve()
      .then(() => o.commit(v))
      .catch(e => { toast(Sys.say(e)); hostLog("slider '" + o.label + "' commit failed: " + Sys.say(e)); })
      .then(() => {
        inflight = false;
        if (dirty){ dirty = false; flush(); }
      });
  }

  b.__mosAdjust = function(dx){
    if (!dx) return false;                       // up/down still leave the row
    const step = o.step || 0.05;
    const next = Math.max(0, Math.min(1, Math.round((value + dx * step) * 1000) / 1000));
    /* At the end of the track the press is NOT consumed. In a two-pane
       layout that is the escape hatch: pushing left at 0% crosses back
       to the category list instead of doing nothing at all. */
    if (Math.abs(next - value) < 1e-6) return false;
    value = next;
    paint();
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(flush, 120);
    return true;
  };
  b.__mosRun = function(){ if (o.activate) o.activate(b); };
  b.__mosSetMuted = function(m){ o.muted = m; paint(); };
  b.addEventListener("click", safe("slider click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  }));
  return b;
}

/* ── A pushed list to choose from ─────────────────────────
   Wi-Fi networks, display modes, time zones, output devices: all the
   same shape, so all the same navigation. Its own scope, so Circle
   means "never mind" and lands you back exactly where you were. */
function pickerPanel(o){
  const node = panelShell(o.title, o.sub, o.eyebrow || "Settings");
  const bodyEl = node.querySelector(".panel-body");
  const head = o.status ? bodyEl.appendChild(statEl(o.status, o.statusKind, o.statusSpin)) : null;
  const list = document.createElement("div");
  bodyEl.appendChild(list);

  /* items === undefined means "leave the rows alone, only the status
     line changed" — a scan ticking its elapsed time must not blank the
     list it has already found. */
  function paint(items, statusText, statusKind, spinning){
    if (items !== undefined){
      list.innerHTML = "";
      items.forEach((it, i) => {
        list.appendChild(actionRow({
          label: it.label, sub: it.sub, tail: it.tail, tailHTML: it.tailHTML,
          icon: it.icon, tone: it.tone, disabled: it.disabled,
          run: o.readOnly ? null : (() => { if (o.onPick) o.onPick(it, i); })
        }, i, 0));
      });
      if (!items.length) list.appendChild(statEl(o.emptyText || "Nothing to show.", "bad"));
    }
    if (head && statusText !== undefined) setStat(head, statusText, statusKind, spinning);
    const sc = Focus.top();
    if (sc && sc.id === "panel:" + (o.id || "picker")){
      Focus.syncItems(sc, Focus.collect(node), (Focus.current(sc) || {}).el);
      Focus.repaint();
    }
  }
  paint(o.items || []);
  if (o.note) bodyEl.appendChild(noteEl(o.note));

  /* readOnly: the rows are still focusable, because on a pad the cursor
     IS the scroll position and a 140-row list you cannot walk is a list
     you cannot read. What they are not is selectable — so the hint bar
     does not offer a Select that would do nothing, which is the whole
     difference between a readout and a broken control.

     A press on one still has to ANSWER, though, and it used to answer
     "activated <label>" because the row carried ACT.noop: the success
     chime for a button that did nothing. The scope answers instead, in a
     sentence ui/sfx.js already classifies as a refusal, so the pad gives
     the nudge it gives everywhere else nothing is bound. */
  const sc = pushPanel(o.id || "picker", node, Object.assign(
    { hints: o.readOnly ? ["navUD", "back"] : ["navUD", "select", "back"] },
    o.readOnly ? { activate(){ return "no action bound to a readout row"; } } : null));
  return { scope: sc, node, paint, close(){ if (Focus.top() === sc) Focus.pop(); } };
}

/* ── A yes/no that is not about power ─────────────────────
   Same shape as the power confirmation and the same safe default:
   Cancel is focused, confirming is a deliberate move sideways. */
function confirmAction(o){
  const node = panelShell(o.title, o.sub, o.eyebrow || "Confirm");
  node.classList.add("confirm");
  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = o.cancelLabel || "Cancel";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "run"; no.dataset.label = "cancel";
  no.__mosRun = () => { Focus.back(); if (o.onCancel) o.onCancel(); };
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = o.goLabel || "Confirm";
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "run"; go.dataset.label = "confirm";
  go.__mosRun = () => { Focus.back(); if (o.onConfirm) o.onConfirm(); };
  [no, go].forEach(b => b.addEventListener("click", safe("confirm click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.querySelector(".panel-body").remove();
  node.appendChild(acts);
  return pushPanel("confirm:" + (o.id || "action"), node, { hints:["navLR", "confirm", "cancel"] });
}

/* ═══ Grant — the console's own consent sheet ═════════════
   ONE primitive, used for two things that look nothing alike from the
   outside and are exactly the same question underneath:

     Grant.ask(opts) -> Promise<{ allow, remember }>

   * a privileged action the shell cannot do itself and the broker can
     (install a package, install Windows updates, forget a network);
   * a permission a web page asked for (camera, microphone, location),
     which Edge would otherwise draw its own bubble for, inside a child
     window no controller can reach.

   opts: { scope:"system"|"web", title, sub, facts:[[label,value],…],
           allowLabel, denyLabel, rememberLabel, rememberSub, danger,
           holdMs }
   A rememberLabel is what puts the remember row on the sheet; without
   one the answer is for this time only. The promise never rejects: the
   sheet being dismissed for any reason at all — Circle, a popped
   scope, the browser closing underneath it — resolves as a Deny,
   because the one answer that must never be inferred from silence is
   yes.

   Two design rules, and they are the whole point of the sheet:

     Deny holds the focus. The safe answer is the one already selected;
     saying yes is a deliberate move sideways, exactly as it is on the
     power confirmation.

     Allow must be HELD, ~800 ms, with the fill on the button counting
     it out. A press is something a thumb does by accident on a sofa; a
     hold is not. This gesture is what replaces the secure desktop —
     Windows' guarantee is that the input reached a trusted screen,
     ours is that the input cannot have been an accident.

   Holding needs to know when the button came UP, and the shell gets
   that in three different ways depending on which host it is running
   on. All three are handled, because a hold that never completes and a
   hold that completes on its own are both worse than no hold at all:

     v3 host    sends phase "press" / "repeat" / "release" through
                window.mosPad. The release ends the hold; nothing else
                is needed. This is what the shipping host does.
     keyboard   fires keydown (with .repeat on the way) and keyup. The
                sheet installs its own capture-phase pair while it is
                up, so Enter reaches the hold rather than the shell's
                own launch action.
     v2 host    relays Cross as a SYNTHETIC Enter keydown and never
                sends anything on release at all. There is no up event
                to wait for, so the hold instead requires continuous
                evidence: the Gamepad API's own view of the DualSense
                (WebView2 does expose it, see the supplement below) or
                a fresh repeat within 450 ms. Lose both and the hold is
                cancelled, which is the failure that is safe.

   The sheet is NOT in the panel stack. It is its own fixed layer above
   the browser's chrome, because a permission raised by a web page has
   to be readable while the browser is on screen; see .grant-layer in
   the stylesheet, and browser.js for the content view it has to hide
   before any of this can be seen at all. */
const Grant = (function(){
  const HOLD_MS = 800;
  let layer = null;
  let cur   = null;      // the job on screen
  let hold  = null;      // the hold in progress
  let keyed = false;     // our capture-phase key listeners are installed
  const queue = [];

  function now(){ return performance.now(); }

  function ensureLayer(){
    if (layer && layer.isConnected) return layer;
    layer = document.createElement("div");
    layer.id = "grantLayer";
    layer.className = "grant-layer";
    layer.innerHTML = '<div class="grant-hints" id="grantHints"></div>';
    document.body.appendChild(layer);
    return layer;
  }

  /* ── The hold ─────────────────────────────────────────── */
  function stopTimers(){
    if (!hold) return;
    if (hold.raf) cancelAnimationFrame(hold.raf);
    if (hold.timer) clearInterval(hold.timer);
  }
  /* rAF for smoothness AND an interval, because a headless capture
     advances timers under a virtual clock but is not guaranteed to
     produce animation frames — and because a hold that stops counting
     when the compositor pauses would be a hold that never completes. */
  function loop(){ if (!hold) return; tick(); if (hold) hold.raf = requestAnimationFrame(loop); }

  function padCrossDown(){
    try{
      const gp = navigator.getGamepads ? navigator.getGamepads() : null;
      if (!gp) return false;
      for (const p of gp){
        if (p && p.connected && p.buttons && p.buttons[0] && p.buttons[0].pressed) return true;
      }
    }catch(e){}
    return false;
  }

  function beginHold(src){
    if (hold || !cur) return;
    hold = { t0: now(), ev: now(), blind: src === "blind", src: src };
    cur.node.classList.add("holding");
    hostLog("grant: hold started (" + src + ")");
    hold.timer = setInterval(safe("grant hold", tick), 40);
    hold.raf = requestAnimationFrame(loop);
    tick();
  }

  function cancelHold(why){
    if (!hold) return;
    stopTimers();
    hold = null;
    if (cur){
      cur.node.classList.remove("holding");
      cur.allow.style.setProperty("--hold", "0");
    }
    hostLog("grant: hold cancelled — " + why);
    try{ if (window.MarwanFeel) MarwanFeel.play("nudge"); }catch(e){}
  }

  function tick(){
    if (!hold || !cur) return;
    if (hold.blind){
      if (padCrossDown()) hold.ev = now();
      else if (now() - hold.ev > 450){ cancelHold("nothing is holding it down"); return; }
    }
    const p = Math.min(1, (now() - hold.t0) / (cur.holdMs || HOLD_MS));
    cur.allow.style.setProperty("--hold", p.toFixed(3));
    if (p < 1) return;
    stopTimers();
    hold = null;
    cur.node.classList.remove("holding");
    settle(true);
  }

  /* ── Answering ────────────────────────────────────────── */
  function settle(allow){
    const job = cur;
    if (!job || job.done) return;
    job.done = true;
    job.answer = { allow: !!allow, remember: !!job.remember };
    hostLog("grant: " + (allow ? "ALLOWED" : "DENIED") + " — " + (job.opts.title || "")
            + (job.answer.remember ? " (remembered)" : ""));
    try{ if (window.MarwanFeel) MarwanFeel.play(allow ? "launch" : "back"); }catch(e){}
    dismiss(job);
  }

  /* Pop the scope if it is ours to pop; the scope's onPop does the rest,
     so there is exactly one teardown path however the sheet ended. */
  function dismiss(job){
    const sc = Focus.top();
    if (sc && sc.id === "grant") Focus.pop();
    else teardown(job);
  }

  function teardown(job){
    cancelHold("the sheet closed");
    keys(false);
    if (job.node && job.node.parentNode) job.node.remove();
    if (cur === job){
      cur = null;
      if (layer) layer.classList.remove("open", "own-hints");
    }
    if (!job.done){
      job.done = true;
      job.answer = { allow:false, remember:false };
      hostLog("grant: dismissed without an answer — treated as Deny");
    }
    try{ job.resolve(job.answer); }catch(err){ report("grant resolve", err); }
    /* Out of this turn: the next sheet must not push a scope while the
       focus manager is still inside the pop that closed the last one. */
    setTimeout(safe("grant next", next), 0);
  }

  function next(){
    if (cur || !queue.length) return;
    show(queue.shift());
  }

  /* ── Input ────────────────────────────────────────────── */
  function accept(src){
    if (!cur) return "grant: nothing to answer";
    const it = Focus.current(Focus.top());
    if (!it) return "grant: nothing focused";
    if (it.el !== cur.allow){
      Focus.activate();
      return "grant: " + (it.el.dataset.label || "acted");
    }
    if (hold){ hold.ev = now(); return "grant: holding"; }
    beginHold(src);
    return "grant: hold to allow";
  }

  function onKey(e){
    if (!cur) return;
    if (e.key !== "Enter" && e.key !== " ") return;
    /* Ours, not the shell's: without stopping it here the same press
       would also reach the shell's keydown handler and fire launch. */
    e.preventDefault(); e.stopPropagation();
    Input.set(e.isTrusted === false ? "pad" : "key");
    if (e.type === "keyup"){ cancelHold("key released"); return; }
    /* A synthetic Enter is the v2 shim relaying Cross, and nothing will
       ever arrive to say it came back up. */
    accept(e.isTrusted === false ? "blind" : "key");
  }

  function keys(on){
    if (on === keyed) return;
    keyed = on;
    if (on){
      addEventListener("keydown", onKey, true);
      addEventListener("keyup", onKey, true);
    } else {
      removeEventListener("keydown", onKey, true);
      removeEventListener("keyup", onKey, true);
    }
  }

  /* ── The sheet ────────────────────────────────────────── */
  function show(job){
    const o = job.opts || {};
    cur = job;
    job.remember = !!o.rememberDefault;
    job.holdMs = o.holdMs || HOLD_MS;

    const node = panelShell(o.title || "Allow this?", o.sub || "", o.eyebrow || "Permission");
    node.classList.add("confirm", "grant");
    if (o.scope === "web") node.classList.add("web");
    if (o.danger) node.classList.add("danger");
    const body = node.querySelector(".panel-body");
    if (o.facts && o.facts.length) body.appendChild(factsEl(o.facts));

    if (o.rememberLabel){
      const t = actionRow({
        label: o.rememberLabel,
        sub: o.rememberSub || "Kept until you clear it",
        icon: "info",
        tailHTML: tagHTML(job.remember ? "on" : "off", job.remember ? "on" : ""),
        run(el){
          job.remember = !job.remember;
          el.querySelector(".row-tail").innerHTML =
            tagHTML(job.remember ? "on" : "off", job.remember ? "on" : "");
          try{ if (window.MarwanFeel) MarwanFeel.toggle(job.remember); }catch(e){}
        }
      }, 0, 0);
      t.classList.add("grant-toggle");
      body.appendChild(t);
    }

    const acts = document.createElement("div");
    acts.className = "confirm-actions";
    const no = document.createElement("button");
    no.className = "cbtn no";
    no.textContent = o.denyLabel || "Deny";
    no.setAttribute("data-nav", "1,0");
    no.dataset.act = "run"; no.dataset.label = "deny";
    no.__mosRun = () => settle(false);
    const go = document.createElement("button");
    go.className = "cbtn go hold";
    go.setAttribute("data-nav", "1,1");
    go.dataset.act = "noop"; go.dataset.label = "allow";
    go.innerHTML = '<i class="hold-fill"></i><span class="cbtn-t"></span>';
    go.querySelector(".cbtn-t").textContent = o.allowLabel || "Allow";
    go.style.setProperty("--hold", "0");
    /* A mouse is not a pad and cannot hold anything meaningful here, so
       a click on Allow starts the same hold rather than granting: the
       press-and-hold is the gesture, whatever pressed it. */
    [no, go].forEach(b => b.addEventListener("click", safe("grant click", (ev) => {
      if (ev.detail === 0) return;
      Input.set("key");
      Focus.focusEl(b);
      if (b === go) accept("blind"); else settle(false);
    })));
    acts.appendChild(no); acts.appendChild(go);
    node.appendChild(acts);

    const note = document.createElement("p");
    note.className = "grant-note";
    note.textContent = "Allow has to be held for " + (job.holdMs / 1000).toFixed(1)
                     + " seconds. A press on its own does nothing.";
    node.appendChild(note);

    ensureLayer();
    layer.insertBefore(node, layer.firstChild);
    layer.classList.add("open");
    /* Its own hint bar, always: the shell's is behind the browser in one
       scope and behind this layer's scrim in both. Hints.chip is the
       shell's renderer, so these are the same glyphs, in the same
       vocabulary, taught by the same code. */
    const hintIds = (o.rememberLabel ? ["navAll"] : ["navLR"]).concat(["holdOK", "deny"]);
    try{ $("#grantHints").innerHTML = hintIds.map(id => Hints.chip(id)).join(""); }
    catch(e){ report("grant hints", e); }
    requestAnimationFrame(() => node.classList.add("in"));

    job.node = node; job.allow = go; job.deny = no;
    const items = Focus.collect(node);
    let denyAt = 0;
    for (let i = 0; i < items.length; i++) if (items[i].el === no){ denyAt = i; break; }
    keys(true);
    Focus.push({
      id: "grant",
      items,
      index: denyAt,                 // the safe answer holds the focus
      hints: hintIds,
      onPop(){ teardown(job); }
    });
    hostLog("grant: asking — " + (o.scope || "system") + " / " + (o.title || ""));
  }

  return {
    ask(opts){
      return new Promise(resolve => {
        const job = { opts: opts || {}, resolve, done:false };
        if (cur){
          queue.push(job);
          hostLog("grant: queued '" + (job.opts.title || "") + "' behind the sheet on screen");
          return;
        }
        show(job);
      });
    },
    isOpen(){ return !!cur; },
    depth(){ return (cur ? 1 : 0) + queue.length; },

    /* Take a question back off the screen because the thing that asked
       it has gone: a web page navigated away, closed its tab, or the
       host's own 60-second deadline expired and it answered Deny
       itself. The sheet that is left behind is worse than useless —
       answering it does nothing, and it is standing in front of
       whatever the human moved on to. Matched by the caller's own
       token, resolved as a Deny like every other dismissal. */
    drop(token){
      if (!token) return 0;
      let n = 0;
      for (let i = queue.length - 1; i >= 0; i--){
        if (queue[i].opts && queue[i].opts.token === token){
          const job = queue.splice(i, 1)[0];
          job.done = true; job.answer = { allow:false, remember:false };
          n++;
          try{ job.resolve(job.answer); }catch(e){ report("grant drop resolve", e); }
        }
      }
      if (cur && cur.opts && cur.opts.token === token){
        hostLog("grant: '" + token + "' withdrawn by whatever asked it");
        settle(false);
        n++;
      }
      return n;
    },

    /* Modal, on the same terms as the keyboard and the explorer: while a
       permission is on screen NOTHING behind it moves, including the
       browser, which would otherwise swallow every action before the
       shell's own table ever saw it. Returns a string when it consumed
       the action and null when there is nothing to consume. */
    route(action, phase, button){
      if (!cur) return null;
      const a = String(button || action || "").toLowerCase();
      if (phase === "release"){
        if (hold) cancelHold("released before " + (cur.holdMs || HOLD_MS) + " ms");
        return "grant: release";
      }
      if (a === "cross" || action === "launch" || action === "select")
        return accept(phase === "press" || phase === "repeat" ? "pad" : "blind");
      if (a === "circle" || action === "back"){ settle(false); return "grant: denied"; }
      if (action === "up")    return Focus.move(0, -1) ? "grant: moved up"    : "grant: no target above";
      if (action === "down")  return Focus.move(0,  1) ? "grant: moved down"  : "grant: no target below";
      if (action === "left")  return Focus.move(-1, 0) ? "grant: moved left"  : "grant: no target to the left";
      if (action === "right") return Focus.move( 1, 0) ? "grant: moved right" : "grant: no target to the right";
      return "grant: ignored " + a + " (a permission is waiting for an answer)";
    }
  };
})();

/* ═══ Asking the broker to do something ══════════════════
   Everything privileged the shell offers goes through here, so the
   whole vocabulary of it — what is said while it runs, what is said
   when it fails, what is written to the log — exists once.

   Never rejects. Callers get { ok, status, res, err } and render it;
   a REJECTED or FAILED result is not an error in the transport sense
   (the broker answered, and what it answered was no), and the one
   thing this must never do is turn the broker saying no into a
   stack trace. */
function brokerRun(args, o){
  o = o || {};
  const alive = o.alive || (() => true);
  const say = o.say || function(t, kind){ if (kind === "bad") toast(t); };
  let cancelled = false;

  hostLog("broker: requesting " + args.verb + " " + JSON.stringify(args));
  say("Handing the request to the broker…", null, true);

  return Admin.request(args, {
    isCancelled: () => cancelled || !alive(),
    onProgress(p){
      if (!alive()){ cancelled = true; return; }
      const secs = Math.round((p.elapsedMs || 0) / 1000);
      /* The worker's own latest log line, when there is one. It is the
         difference between a spinner and evidence. */
      const head = p.line || (p.phase === "queued"
        ? "Waiting for the broker to pick it up"
        : "Working");
      say(head + "  ·  " + secs + " s", null, true);
    }
  }).then(res => {
    const ok = !!(res && res.status === "OK");
    hostLog("broker: " + args.verb + " -> " + ((res && res.status) || "?")
            + " exit " + ((res && res.exitcode) !== undefined ? res.exitcode : "?")
            + " — " + ((res && res.detail) || ""));
    if (alive()) say(ok ? (o.okText ? o.okText(res) : "Done.") : brokerFailText(res), ok ? "good" : "bad", false);
    return { ok, status:(res && res.status) || "", res, err:null };
  }, e => {
    hostLog("broker: " + args.verb + " failed — " + Sys.say(e));
    if (alive()) say("The broker could not do it: " + Sys.say(e), "bad", false);
    return { ok:false, status:"", res:null, err:e };
  });
}

/* status is the broker's word, detail is the worker's. Both, always:
   "it did not work" with nothing after it is the failure mode this
   whole screen exists to avoid. */
function brokerFailText(res){
  const st = res && res.status ? res.status : "no answer";
  const d  = (res && res.detail) || "the broker gave no detail";
  if (st === "REJECTED") return "The broker refused it: " + d;
  if (st === "FAILED")   return "It failed: " + d
    + ((res && res.exitcode) ? " (exit code " + res.exitcode + ")" : "");
  return "The broker answered '" + st + "': " + d;
}

/* The four facts every system-scope grant carries. Who is being asked,
   what it will do, and under whose authority — written out rather than
   implied, because "administrator" is the word the human is agreeing
   to and it must be on the screen they agree on. */
function brokerRunsAs(){
  /* Deliberately not the task path: the sentence a human is agreeing to
     is "an administrator, authorised when this was set up", and the
     registered task name is a fact for the screen you came from, not a
     line to read while deciding. Settings → Add software shows it. */
  return "the MarwanOS broker (administrator, authorised at setup)";
}

/* What to do when the host says "elevation_required".

   This is the whole point of the broker as far as the rest of the shell
   is concerned: a command that Windows refuses to the shell's account
   is not the end of the road on a console that had a broker authorised
   at setup. It is a question — the same question the grant sheet exists
   to ask — followed by the same operation done by something that is
   allowed to do it.

   Any other failure is still a failure and is toasted as it always was.
   And where there is no broker, so is this one: Sys.say() then reads
   the pessimistic sentence, which is the true one for that machine. */
function brokerFallback(e, o){
  if (!e || e.code !== "elevation_required"){ toast(Sys.say(e)); return; }
  Admin.status().then(adm => {
    if (!adm || !adm.available){ toast(Sys.say(e)); return; }
    hostLog("broker: offering to do '" + o.args.verb + "' that Windows refused to this account");
    return Grant.ask({
      scope: "system",
      title: o.title,
      sub:   o.sub,
      facts: (o.facts || []).concat([["Runs as", brokerRunsAs()]]),
      allowLabel: o.allowLabel || "Do it",
      danger: true
    }).then(ans => {
      if (!ans.allow){ toast("Nothing was changed."); return; }
      const busy = busyPanel(o.busyTitle || o.title, "The broker is doing it — this can take a moment.");
      let gone = false;
      return brokerRun(o.args, {
        alive: () => !gone,
        say(t, k, s){ busy.say(t, k, s); }
      }).then(out => {
        gone = true;
        busy.close();
        toast(out.ok ? (o.okText || "Done.") : (out.err ? Sys.say(out.err) : brokerFailText(out.res)));
        if (out.ok && o.onOk) o.onOk();
      });
    });
  });
}

/* Settings → System → Install pending updates. */
function installUpdates(ctx, st, count){
  const n = count || 0;
  Grant.ask({
    scope: "system",
    title: "Install " + n + " Windows update" + (n === 1 ? "" : "s") + "?",
    sub:   "Windows Update downloads and installs them through the broker. Nothing else on this console is touched.",
    facts: [
      ["Install",  n + " pending Windows update" + (n === 1 ? "" : "s")],
      ["Runs as",  brokerRunsAs()],
      ["Source",   "Windows Update"],
      ["Note",     "may need a restart"]
    ],
    allowLabel: "Install",
    danger: true
  }).then(ans => {
    if (!ans.allow){ if (ctx.alive()) setStat(st, "Nothing was installed.", null, false); return; }
    return brokerRun({ verb:"updates.install" }, {
      alive: () => ctx.alive(),
      say(t, k, s){ if (ctx.alive()) setStat(st, t, k, s); },
      okText(res){
        const n2 = (res && typeof res.installed === "number") ? res.installed : null;
        return (n2 === null ? "Installed." : ("Installed " + n2 + " update" + (n2 === 1 ? "" : "s") + "."))
             + (res && res.rebootRequired ? " A restart is needed to finish." : "");
      }
    }).then(out => {
      if (!out.ok || !ctx.alive()) return;
      /* The existing power confirmation, not a second one: restarting is
         the same decision here as it is anywhere else in the shell, and
         Cancel holds the focus there too. */
      if (out.res && out.res.rebootRequired) confirmPower("restart");
    });
  });
}

/* Settings → Add software → one row.

   `row` is the row that was pressed, and it is updated in place rather
   than by rebuilding the pane. Rebuilding is what the rest of Settings
   does after a change, and it is wrong here: the cursor is ON this row,
   a rebuild throws the node away, and the focus manager quite correctly
   falls back to the nearest survivor — which is a category in the rail,
   so finishing an install teleported the human to another screen. */
function installPackage(ctx, pkg, st, row){
  const name = pkg.name || pkg.id;
  /* interactive = the broker verifies the installer, then opens the
     installer's OWN window on this screen, elevated, and the person finishes
     there (Riot: sign in, install, and its elevated agent puts Vanguard in
     with no UAC prompt). Say so on the sheet — it is the one case where
     "allow" is not silent, and it needs a mouse/keyboard or the pad's cursor. */
  const inter = !!pkg.interactive;
  const facts = [
    ["Install",   name],
    ["Publisher", (pkg.publisher || "not stated") + " (signature verified before it runs)"],
    ["Runs as",   brokerRunsAs()],
    /* admin.catalog computes this: the HOST of the manifest's url, because
       that is where the bytes actually come from. It used to print the
       wingetId, which named a package manager neither of these machines
       has — on the one screen whose entire job is to say truthfully what
       is about to happen. */
    ["Source",    pkg.source || pkg.type || "the approved list on this machine"]
  ];
  if (inter) facts.push(["Then", "its own setup window opens on this screen — you sign in and finish there; close it when it is done"]);
  Grant.ask({
    scope: "system",
    title: "Install " + name + "?",
    sub:   inter
           ? "The broker fetches and verifies it, then opens the installer on this screen with administrator rights, so nothing it needs later can be blocked by a prompt this console cannot answer."
           : "It is fetched and installed by the broker from the list an administrator approved for this console.",
    facts: facts,
    allowLabel: inter ? "Open installer" : "Install"
  }).then(ans => {
    if (!ans.allow){ if (ctx.alive()) setStat(st, "Nothing was installed.", null, false); return; }
    return brokerRun({ verb:"install", package: pkg.id }, {
      alive: () => ctx.alive(),
      say(t, k, s){ if (ctx.alive()) setStat(st, t, k, s); },
      okText(){ return inter ? name + " — setup finished and closed." : name + " is installed."; }
    }).then(out => {
      if (!out.ok || !row) return;
      const tail = row.querySelector(".row-tail");
      if (tail) tail.innerHTML = tagHTML("installed", "on");
    });
  });
}

/* A modal "working…" card for an operation that has to finish before
   the human can do anything else (connecting to Wi-Fi, pairing). */
function busyPanel(title, sub){
  const node = panelShell(title, sub, "Working");
  const body = node.querySelector(".panel-body");
  const st = statEl("Starting…", null, true);
  body.appendChild(st);
  /* Deliberately no focusables: Circle still pops the scope, so the
     human is never trapped, but there is nothing to press by mistake. */
  const sc = pushPanel("busy", node, { hints:["cancel"], items:[] });
  return {
    scope: sc,
    say(text, kind, spinning){ setStat(st, text, kind, spinning === undefined ? true : spinning); },
    close(){ if (Focus.top() === sc) Focus.pop(); }
  };
}

const PANEL_BUILD = {

  /* Power. Restart and shut down are two presses, never one: a stray
     Cross on a console must not take the machine down mid-game. */
  power(){
    const node = panelShell("Power", "Rest keeps the session in memory. Restart and shut down ask again before they act.");
    const body = node.querySelector(".panel-body");
    [
      { label:"Rest mode",  sub:"Suspend to RAM — wake with the controller or the power button", icon:"rest",    act:"power",  arg:"sleep" },
      { label:"Restart",    sub:"Close everything and reboot the machine",                        icon:"restart", act:"powerConfirm", arg:"restart",  tone:"danger" },
      { label:"Shut down",  sub:"Close everything and power off",                                 icon:"shut",    act:"powerConfirm", arg:"shutdown", tone:"danger" },
      { label:"Sign out",   sub:"End this Windows session and return to the sign-in screen",      icon:"signout", act:"powerConfirm", arg:"signout",  tone:"danger" }
    ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
    if (!Host.caps.power)
      body.appendChild(noteEl("Restart and shut down route through the host's Shell Launcher exit codes on this build. " +
        "<b>Rest mode and sign out need host build v3</b> and will say so if the running host cannot do them."));
    return { node };
  },

  /* Profile. An editor, not a readout: the two things on this screen
     that are about the person rather than the machine, and both of them
     writable. What Windows thinks the account is called is a fact about
     the machine and lives in Settings → About with the rest of them. */
  profile(){
    const node = panelShell("Profile",
      "Your name and picture on this console. Both are the shell's own — the Windows account is not touched.");
    fillAsync(node, "profile", (ctx) => { profileEditor(ctx); });
    return { node };
  },

  /* Settings. A category rail on the left, a content pane on the right,
     both pad-navigable, left/right crossing between them — and every
     pane reading and writing the real machine through Sys. */
  settings(){
    /* The eyebrow names the machine, not the route in. On a card the
       default "Control centre" reads as a breadcrumb; on a full screen it
       reads as a mislabel, because by then the control centre is not on
       screen and is not what you are in. */
    const node = panelShell("Settings",
      "Everything here reads the running machine. Anything the hardware cannot do says so instead of pretending.",
      deviceName || "MarwanOS");
    /* Settings is a screen, not a dialogue about the shell: it gets the
       whole panel. Everything about how that is drawn is one class and
       the .panel-full block in the stylesheet — the markup, the focus
       model and every category builder are unchanged. */
    node.classList.add("panel-full");
    const body = node.querySelector(".panel-body");
    const wrap = document.createElement("div");
    wrap.className = "settings";
    const cats = document.createElement("nav"); cats.className = "set-cats";
    const pane = document.createElement("div"); pane.className = "set-pane";
    wrap.appendChild(cats); wrap.appendChild(pane);
    body.appendChild(wrap);

    SET_CATS.forEach((c, i) => {
      cats.appendChild(rowEl({ label:c.label, sub:c.sub, icon:c.icon, act:"settingsCat", arg:c.id }, i, 0));
    });

    let shownCat = null;
    let paintSeq = 0;                     // guards a late async render of a pane you left
    let stale = false;                    // the pane changed while a picker sat on top of us

    /* Re-collect the scope's focusables after the pane's DOM changed.
       withRepaint is false while we are INSIDE repaint() (the scope's
       own onFocus hook calls paintPane) and true from an async
       continuation, which is not.

       A pane very often changes while something is stacked above it —
       a picker commits a setting and asks for a repaint before it pops.
       Syncing then would be syncing the wrong scope, so it is deferred:
       the flag is cleared the moment this scope is the top one again. */
    function sync(withRepaint){
      const sc0 = Focus.top();
      if (!sc0 || sc0.id !== "panel:settings"){ stale = true; return; }
      const keep = (Focus.current(sc0) || {}).el;
      Focus.syncItems(sc0, Focus.collect(node), keep && keep.isConnected ? keep : null);
      stale = false;
      if (withRepaint) Focus.repaint();
    }

    /* Called from the scope's onFocus hook, so it must be idempotent and
       must not re-enter repaint() during its synchronous part. */
    function paintPane(catId, force){
      const cat = SET_CATS.find(c => c.id === catId) || SET_CATS[0];
      if (cat.id === shownCat && !force) return;
      shownCat = cat.id;
      const mySeq = ++paintSeq;

      const sc0 = Focus.top();
      const keep = sc0 && sc0.id === "panel:settings" ? (Focus.current(sc0) || {}).el : null;
      pane.innerHTML = "";                       // read `keep` first: this removes nodes
      /* The category's name and blurb, wrapped so the ultrawide layout
         can lift them into a column of their own. In every other
         viewport the wrapper is a plain block and they read as the first
         two things in the pane, exactly as they always did. It holds no
         focusables, so the focus model never sees it. */
      const mast = document.createElement("div"); mast.className = "set-mast";
      const h = document.createElement("h3"); h.textContent = cat.label;
      const p = document.createElement("p");  p.textContent = cat.blurb;
      mast.appendChild(h); mast.appendChild(p);
      pane.appendChild(mast);
      cats.querySelectorAll(".row").forEach((r, i) =>
        r.setAttribute("aria-current", String(SET_CATS[i].id === cat.id)));

      let rowN = 0;
      const ctx = {
        pane,
        /* alive() is the whole reason a slow pane cannot corrupt a fast
           one: every async continuation checks it before touching the
           DOM, so walking down the category list while Wi-Fi is still
           scanning simply abandons the scan's render. */
        alive(){ return mySeq === paintSeq && pane.isConnected; },
        sec(title){ const e = document.createElement("h4"); e.textContent = title; pane.appendChild(e); return e; },
        add(el){ if (el) pane.appendChild(el); return el; },
        facts(pairs){ const e = factsEl(pairs); pane.appendChild(e); return e; },
        stat(text, kind, spinning){ const e = statEl(text, kind, spinning); pane.appendChild(e); return e; },
        note(html){ const e = noteEl(html); pane.appendChild(e); return e; },
        err(title, e){ const n = errEl(title, e); pane.appendChild(n); return n; },
        /* Rows are numbered as they are appended, all in column 1: the
           pane is one vertical list beside the category list. */
        row(o){ const b = actionRow(o, rowN++, 1); pane.appendChild(b); return b; },
        slider(o){ const b = sliderRow(o, rowN++, 1); pane.appendChild(b); return b; },
        sync(){ if (ctx.alive()) sync(true); },
        refresh(){ if (ctx.alive()) paintPane(cat.id, true); }
      };

      /* The synchronous part is done; hand the pane to the category and
         let it fill in from the OS. Nothing below can throw into the
         focus manager: a builder that fails renders an error card and
         the rest of the shell is untouched. */
      sync(false);
      Promise.resolve()
        .then(() => cat.build(ctx))
        .then(() => { if (ctx.alive()) sync(true); })
        .catch(e => {
          if (!ctx.alive()) return;
          hostLog("settings pane '" + cat.id + "' failed: " + (e && e.code ? e.code : "") + " " + (e && e.message));
          ctx.err("This section could not be read", e);
          sync(true);
        });
    }

    paintPane(SET_CATS[0].id);
    /* Let an action that changes what a pane shows (committing a name
       through the keyboard, applying a setting) force a redraw without
       knowing anything about this closure. */
    settingsRepaint = function(){ if (shownCat) paintPane(shownCat, true); };
    settingsGoto = function(id){
      const i = SET_CATS.findIndex(c => c.id === id);
      if (i < 0) return false;
      const el = cats.children[i];
      if (!el) return false;
      Focus.focusEl(el);
      return true;
    };

    return {
      node,
      scope: {
        hints: ["navAll", "select", "back"],
        crossColumns: true,             // category list | content pane
        onClose(){ settingsRepaint = null; settingsGoto = null; },
        onFocus(it){
          const el = it.el;
          /* First focus after a picker popped: the pane may have been
             rebuilt underneath us while it was on top. Re-collect before
             anything else, or half the rows are nodes that no longer
             exist and the cursor falls into a gap. */
          if (stale){
            stale = false;
            const sc0 = Focus.top();
            if (sc0 && sc0.id === "panel:settings")
              Focus.syncItems(sc0, Focus.collect(node), el.isConnected ? el : null);
          }
          if (el.parentElement === cats){
            const i = [...cats.children].indexOf(el);
            if (SET_CATS[i]) paintPane(SET_CATS[i].id);
          }
          Focus.ensureVisible(el);
        }
      }
    };
  },

  /* The control-centre quick panels are the same real state as the
     Settings categories, cut down to what you would want without
     leaving what you were doing. They share the builders, so the two
     can never drift apart. */
  display(){
    const node = panelShell("Display", "What Windows is driving this panel with, right now.");
    fillAsync(node, "display", (ctx) =>
      Sys.call("display.list").then(d => {
        const m = (d.displays || [])[0];
        if (!m){ ctx.stat("Windows reported no displays.", "bad"); return; }
        const hdr = m.hdr || {};
        ctx.facts([
          ["Display",    orDash(m.name)],
          ["Resolution", orDash(m.resolution)],
          ["Refresh",    fmtHz(m.refreshHz)],
          ["Scale",      m.scalePercent ? m.scalePercent + "%" : "—"],
          ["HDR",        !hdr.queryable ? "not exposed" : (!hdr.supported ? "unsupported" : (hdr.enabled ? "On" : "Off"))]
        ]);
        ctx.row({ label:"Resolution and refresh rate", sub:"Reverts itself unless you confirm the change",
                  tail:m.resolution, icon:"info", run: () => displayModePicker(m) });
        ctx.row({ label:"All display settings", sub:"Opens Settings → Display", icon:"gear",
                  run: () => ACT.settingsCatId("display") });
      }).catch(e => { ctx.err("Displays could not be read", e); }));
    return { node };
  },

  net(){
    const node = panelShell("Network", "The connection this console is actually using.");
    fillAsync(node, "net", (ctx) =>
      Sys.call("net.status").then(n => {
        const r = n.reachability || {};
        const up = (n.adapters || []).filter(a => a.up && !a.isVirtual);
        const primary = up.filter(a => a.routable)[0] || up[0] || null;
        ctx.facts([
          ["Internet",  r.internet ? "Reachable" : (r.connected ? "Local only" : "Not connected")],
          ["Type",      n.connectionType === "wifi" ? "Wi-Fi" : (n.connectionType === "ethernet" ? "Wired" : orDash(n.connectionType))],
          ["Adapter",   primary ? primary.name : "— none up"],
          ["Address",   primary && primary.ipv4 && primary.ipv4[0] ? primary.ipv4[0].address : "—"],
          ["Speed",     primary ? orDash(primary.linkSpeedText) : "—"]
        ]);
        ctx.row({ label:"All network settings", sub:"Opens Settings → Network", icon:"gear",
                  run: () => ACT.settingsCatId("network") });
      }).catch(e => { ctx.err("The network state could not be read", e); }));
    return { node };
  },

  sound(){
    const node = panelShell("Sound", "The Windows mixer. Left and right adjust the volume.");
    fillAsync(node, "sound", (ctx) =>
      Sys.call("audio.devices").then(a => {
        const outs = a.outputs || [];
        const cur = outs.filter(o => o.isDefault)[0] || outs[0];
        if (!cur){ ctx.stat("Windows reports no active output device.", "bad"); return; }
        ctx.slider({
          label:"Volume", value:cur.volume || 0, muted:!!cur.muted, step:0.05,
          hint:"Left and right adjust · Cross toggles mute · " + cur.shortName,
          commit(v){ return Sys.call("audio.setVolume", { id:cur.id, level:v }, { timeout:8000 }); },
          activate(el){
            const next = !cur.muted;
            Sys.call("audio.setMute", { id:cur.id, muted:next }, { timeout:8000 }).then(
              () => { cur.muted = next; el.__mosSetMuted(next); toast(next ? "Output muted." : "Output unmuted."); },
              e  => toast(Sys.say(e)));
          }
        });
        outs.forEach(o => ctx.row({
          label:o.name, sub:o.formFactor || "Endpoint",
          tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
          icon:"info",
          run: () => {
            if (o.isDefault){ toast(o.shortName + " is already the default output."); return; }
            Sys.call("audio.setDefault", { id:o.id, flow:"output", role:"all" }, { timeout:12000 }).then(
              () => { toast("Output switched to " + o.shortName + "."); Focus.pop(); openPanel("sound"); },
              e  => toast(Sys.say(e)));
          }
        }));
        ctx.row({ label:"All sound settings", sub:"Opens Settings → Sound", icon:"gear",
                  run: () => ACT.settingsCatId("sound") });
      }).catch(e => { ctx.err("The mixer could not be read", e); }));
    return { node };
  },

  mic(){
    const node = panelShell("Microphone", "The Windows capture endpoint — the real one, not a shell flag.");
    fillAsync(node, "mic", (ctx) =>
      Sys.call("audio.devices").then(a => {
        const ins = a.inputs || [];
        const cur = ins.filter(o => o.isDefault)[0] || ins[0];
        if (!cur){
          ctx.stat("Windows reports no active capture device.", "bad");
          ctx.note("Nothing to mute: this machine has <b>no active microphone endpoint</b>. " +
            "A headset or a webcam would make one appear.");
          return;
        }
        ctx.facts([
          ["Device", cur.name],
          ["Level",  Math.round((cur.volume || 0) * 100) + "%"],
          ["State",  cur.muted ? "Muted" : "Live"]
        ]);
        ctx.row({ label: cur.muted ? "Unmute the microphone" : "Mute the microphone",
                  sub:"Sets mute on the endpoint itself, so every app sees it",
                  tailHTML: cur.muted ? tagHTML("muted", "warn") : tagHTML("live", "on"),
                  icon:"info",
                  run: () => Sys.call("audio.setMute", { id:cur.id, flow:"input", muted:!cur.muted }, { timeout:8000 })
                    .then(() => { toast(cur.muted ? "Microphone unmuted." : "Microphone muted."); Focus.pop(); openPanel("mic"); },
                          e  => toast(Sys.say(e))) });
        ctx.slider({
          label:"Input level", value:cur.volume || 0, step:0.05,
          hint:"Left and right adjust · " + cur.shortName,
          commit(v){ return Sys.call("audio.setVolume", { id:cur.id, flow:"input", level:v }, { timeout:8000 }); }
        });
      }).catch(e => { ctx.err("The capture endpoint could not be read", e); }));
    return { node };
  }
};

/* Fill a control-centre panel from the OS after it is already on
   screen. The panel opens instantly with a spinner rather than waiting
   on the system — a control centre that stalls before it appears is
   worse than one that fills in. */
function fillAsync(node, panelId, fn){
  const body = node.querySelector(".panel-body");
  const loading = statEl("Reading…", null, true);
  body.appendChild(loading);
  let n = 0;
  const ctx = {
    alive(){ return body.isConnected; },
    add(el){ if (el) body.appendChild(el); return el; },
    facts(pairs){ return ctx.add(factsEl(pairs)); },
    sec(t){ const e = document.createElement("h4"); e.textContent = t; return ctx.add(e); },
    stat(t, k, s){ return ctx.add(statEl(t, k, s)); },
    note(h){ return ctx.add(noteEl(h)); },
    err(t, e){ return ctx.add(errEl(t, e)); },
    row(o){ return ctx.add(actionRow(o, n++, 0)); },
    slider(o){ return ctx.add(sliderRow(o, n++, 0)); },
    sync(){
      const sc = Focus.top();
      if (!sc || sc.id !== "panel:" + panelId) return;
      Focus.syncItems(sc, Focus.collect(node), (Focus.current(sc) || {}).el);
      Focus.repaint();
    }
  };
  Promise.resolve()
    .then(() => fn(ctx))
    .then(() => { loading.remove(); if (ctx.alive()) ctx.sync(); })
    .catch(err => {
      loading.remove();
      if (!ctx.alive()) return;
      report("panel " + panelId + " content", err);
      ctx.err("This panel could not be read", err);
      ctx.sync();
    });
  return ctx;
}

/* ═══ The nine settings categories ═══════════════════════
   Each one owns an async build(ctx) that reads the machine through
   Sys and writes what it finds. The rules every category obeys:

     * a value on screen was read from this machine, or it is labelled;
     * a control that cannot work here is absent or says why, never a
       button that fails when pressed;
     * a failure renders as a sentence, not as an empty section.       */

const SET_CATS = [

  /* ── 0. Profile ─────────────────────────────────────────
     First because it is the only category about the person, and the
     first thing anybody wants to change on a console they have just
     been handed. Exactly the rows the control centre's Profile panel
     draws — one builder, two homes. */
  { id:"profile", label:"Profile", sub:"Your name and picture", icon:"info",
    blurb:"What this console calls you, and the picture beside it. Both are the shell's own and are stored with its settings; the Windows account underneath is left alone.",
    build(ctx){ profileEditor(ctx); } },

  /* ── 1. Network ─────────────────────────────────────────
     The bench is wired with no Wi-Fi radio at all, so the
     "no adapter" path is a first-class state here, not an error. */
  { id:"network", label:"Network", sub:"Wi-Fi, wired, address", icon:"info",
    blurb:"Connection state read from Windows. Wi-Fi controls appear only if this machine has a radio.",
    build(ctx){
      const loading = ctx.stat("Reading network state…", null, true);
      return Sys.call("net.status").then(net => {
        if (!ctx.alive()) return;
        loading.remove();

        const r = net.reachability || {};
        const adapters = (net.adapters || []).filter(a => a.up && !a.isVirtual);
        const primary = adapters.filter(a => a.routable)[0] || adapters[0] || null;

        ctx.sec("Connection");
        ctx.facts([
          ["Internet", r.internet ? "Reachable" : (r.connected ? "Local network only" : "Not connected")],
          ["Type",     net.connectionType === "wifi" ? "Wi-Fi" : (net.connectionType === "ethernet" ? "Wired Ethernet" : orDash(net.connectionType))],
          ["Adapter",  primary ? primary.name : "— none up"],
          ["Hardware", primary ? primary.description : "—"],
          ["IPv4",     primary && primary.ipv4 && primary.ipv4[0] ? (primary.ipv4[0].address + "/" + primary.ipv4[0].prefixLength) : "—"],
          ["Gateway",  primary && primary.gateways && primary.gateways[0] ? primary.gateways[0] : "—"],
          ["DNS",      primary && primary.dns && primary.dns.length ? primary.dns.slice(0, 2).join(", ") : "—"],
          ["Link speed", primary ? orDash(primary.linkSpeedText) : "—"],
          ["Host name", orDash(net.hostName)]
        ]);

        ctx.row({ label:"All adapters", sub:(net.adapters || []).length + " known to Windows, including virtual ones",
                  icon:"info", run: () => showAdapters(net) });

        return Sys.call("wifi.status").then(w => ({ w:w, net:net }), e => ({ err:e, net:net }));
      }).then(res => {
        if (!ctx.alive() || !res) return;
        ctx.sec("Wi-Fi");

        /* The two ways there is no Wi-Fi: the WLAN service refused us
           (wifi_unavailable) or it answered with no interfaces. Both
           are ordinary states on a wired console, and both say so. */
        const noRadio = res.err
          ? (res.err.code === "wifi_unavailable" || res.err.code === "no_wifi_adapter")
          : !(res.w && res.w.present && (res.w.interfaces || []).length);

        if (noRadio){
          ctx.stat("No Wi-Fi adapter found on this machine.", "bad");
          ctx.note("This console is on <b>wired Ethernet</b> and has no wireless radio, so there is nothing to scan, " +
            "connect to or forget. Wi-Fi controls are hidden rather than shown as buttons that would fail.");
          if (res.err && res.err.code !== "wifi_unavailable" && res.err.code !== "no_wifi_adapter")
            ctx.err("Windows reported", res.err);
          return;
        }
        if (res.err){ ctx.err("Wi-Fi state could not be read", res.err); return; }

        const iface = (res.w.interfaces || [])[0] || {};
        const conn = iface.connection || null;
        ctx.facts([
          ["Adapter",  orDash(iface.description)],
          ["State",    orDash(iface.state)],
          ["Network",  conn && conn.connected ? conn.ssid : "not associated"],
          ["Security", conn && conn.connected ? orDash(conn.security) : "—"],
          ["Signal",   conn && conn.connected ? (conn.signal + "%  (" + conn.rssiDbm + " dBm)") : "—"],
          ["Rate",     conn && conn.connected && conn.rxRateKbps ? Math.round(conn.rxRateKbps / 1000) + " Mbps" : "—"]
        ]);

        ctx.row({ label:"Available networks", sub:"Scan for networks in range and join one",
                  icon:"info", run: () => wifiBrowser() });
        ctx.row({ label:"Saved networks",
                  sub:(iface.savedProfiles || []).length + " profile" + ((iface.savedProfiles || []).length === 1 ? "" : "s") + " stored on this machine",
                  icon:"disk", run: () => wifiProfiles(iface.savedProfiles || []) });
        if (conn && conn.connected)
          ctx.row({ label:"Disconnect from " + conn.ssid, sub:"Drops the wireless association; wired links are untouched",
                    icon:"signout", tone:"danger",
                    run: () => confirmAction({
                      id:"wifi-disconnect", title:"Disconnect from " + conn.ssid + "?",
                      sub:"Anything using this connection loses it immediately.",
                      goLabel:"Disconnect",
                      onConfirm: () => Sys.call("wifi.disconnect").then(
                        () => { toast("Disconnected from " + conn.ssid + "."); if (settingsRepaint) settingsRepaint(); },
                        e  => toast(Sys.say(e)))
                    }) });
      });
    } },

  /* ── 2. Display ─────────────────────────────────────────
     Every mode change goes through confirm-or-revert. On a television
     a bad mode is a black screen with no way back, so the default
     answer is always "put it back". */
  { id:"display", label:"Display", sub:"Resolution, refresh, HDR", icon:"info",
    blurb:"Read from Windows through the display configuration API. Mode changes revert themselves unless you confirm.",
    build(ctx){
      const loading = ctx.stat("Reading displays…", null, true);
      return Sys.call("display.list").then(d => {
        if (!ctx.alive()) return;
        loading.remove();
        const list = d.displays || [];
        if (!list.length){ ctx.stat("Windows reported no displays.", "bad"); return; }

        list.forEach(m => {
          ctx.sec(m.name ? m.name : ("Display " + (m.index + 1)));
          const hdr = m.hdr || {};
          ctx.facts([
            ["Connection",  orDash(m.connection)],
            ["Resolution",  orDash(m.resolution)],
            ["Refresh",     fmtHz(m.refreshHz)],
            ["Scale",       m.scalePercent ? m.scalePercent + "%  (" + m.dpi + " DPI)" : "—"],
            ["Position",    m.positionX + ", " + m.positionY + (m.primary ? "  (primary)" : "")],
            ["HDR",         !hdr.queryable ? "not exposed by this driver"
                            : (!hdr.supported ? "not supported by this display"
                            : (hdr.enabled ? "On" : "Off"))],
            ["Colour",      (hdr.colorEncoding || "—") + (hdr.bitsPerColorChannel ? "  " + hdr.bitsPerColorChannel + "-bit" : "")]
          ]);

          ctx.row({ label:"Resolution and refresh rate",
                    sub:"Pick a mode — it reverts automatically unless you confirm it",
                    tail:m.resolution + " @ " + Math.round(m.refreshHz) + " Hz",
                    icon:"info", run: () => displayModePicker(m) });

          if (hdr.queryable && hdr.supported){
            ctx.row({ label:hdr.enabled ? "Turn HDR off" : "Turn HDR on",
                      sub:"Toggles Windows advanced colour for this display",
                      tail:hdr.enabled ? "On" : "Off", icon:"paint",
                      run: () => Sys.call("display.setHdr", { display:m.gdiName, enabled:!hdr.enabled }, { timeout:20000 })
                        .then(() => { toast("HDR " + (hdr.enabled ? "off" : "on") + "."); if (settingsRepaint) settingsRepaint(); },
                              e => toast(Sys.say(e))) });
          } else {
            ctx.stat(hdr.queryable
              ? "HDR: this display reports advanced colour as unsupported, so there is nothing to switch."
              : "HDR: this driver does not expose advanced colour to Windows.", "bad");
          }
        });

        ctx.sec("As the page sees it");
        ctx.facts(displayFacts());
        ctx.row({ label:"Re-measure the page", sub:"Re-read the viewport and time the real refresh rate",
                  icon:"update", run: () => { measureHz(); setTimeout(() => { if (settingsRepaint) settingsRepaint(); }, 700); } });
      });
    } },

  /* ── 3. Sound ───────────────────────────────────────────── */
  { id:"sound", label:"Sound", sub:"Output device, volume", icon:"info",
    blurb:"The Windows mixer, live. The volume slider is adjusted with left and right.",
    build(ctx){
      const loading = ctx.stat("Reading audio endpoints…", null, true);

      /* The shell's cues are synthesised in the page and owe nothing to the
         Windows mixer, so this is a function called on both the success and
         the failure path rather than a block buried in the success one: a
         machine whose audio endpoints cannot be read must still be able to
         turn the shell's own clicks down. */
      const shellSound = () => {
        if (!(window.MarwanSfx && window.MarwanFeel)) return;
        ctx.sec("Shell sound");
        ctx.stat("The shell's own cues. Synthesised in the page, so there are no sound files on this "
          + "machine to go missing and nothing to load before the first click.", null);
        const ui = ctx.slider({
          label:"UI sound", value: MarwanSfx.volume, muted: MarwanSfx.muted, step:0.05,
          hint:"Left and right adjust · Cross mutes · every change plays itself",
          commit(v){ MarwanSfx.setVolume(v); MarwanFeel.play("activate"); return Promise.resolve(); },
          activate(el){
            const next = !MarwanSfx.muted;
            MarwanSfx.setMuted(next);
            el.__mosSetMuted(next);
            if (!next) MarwanFeel.play("activate");
            toast(next ? "Shell sound muted." : "Shell sound on.");
          }
        });
        ui.setAttribute("aria-label", "UI sound volume");
        ctx.row({ label:"Follow the Windows volume",
                  sub:"Cues track the system level and go silent when Windows is muted",
                  tailHTML: MarwanSfx.followsSystem ? tagHTML("on", "on") : tagHTML("off"),
                  icon:"info",
                  run: () => { const n = !MarwanSfx.followsSystem;
                               MarwanSfx.setFollowsSystem(n); MarwanFeel.toggle(n);
                               toast(n ? "Following the system volume." : "Independent of the system volume.");
                               if (settingsRepaint) settingsRepaint(); } });
        ctx.row({ label:"Play the boot signature",
                  sub:"The cue the shell resolves on as the home screen wipes in",
                  icon:"info", run: () => MarwanFeel.play("bootDone") });
      };

      return Sys.call("audio.devices").then(a => {
        if (!ctx.alive()) return;
        loading.remove();
        const outs = a.outputs || [];
        const cur = outs.filter(o => o.isDefault)[0] || outs[0] || null;

        /* Devices first, volume second — deliberately. Crossing into this
           pane from the category list lands on the first row, and that
           first row must be one where "left" still means "go back",
           not one where it means "quieter". */
        ctx.sec("Output devices");
        if (!outs.length) ctx.stat("No active output endpoints.", "bad");
        outs.forEach(o => {
          ctx.row({
            label:o.name, sub:(o.formFactor || "Endpoint") + " · " + Math.round((o.volume || 0) * 100) + "%"
                 + (o.muted ? " · muted" : ""),
            tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
            icon:"info",
            run: () => {
              if (o.isDefault){ toast(o.shortName + " is already the default output."); return; }
              Sys.call("audio.setDefault", { id:o.id, flow:"output", role:"all" }, { timeout:12000 }).then(
                () => { toast("Output switched to " + o.shortName + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)));
            }
          });
        });

        ctx.sec("Volume");
        if (!cur){
          ctx.stat("Windows reports no active output device.", "bad");
        } else {
          const sl = ctx.slider({
            label:"Volume", value: typeof cur.volume === "number" ? cur.volume : 0,
            muted: !!cur.muted, step:0.05,
            hint:"Left and right adjust · Cross toggles mute · " + cur.shortName,
            commit(v){ return Sys.call("audio.setVolume", { id:cur.id, level:v }, { timeout:8000 }); },
            activate(el){
              const next = !cur.muted;
              Sys.call("audio.setMute", { id:cur.id, muted:next }, { timeout:8000 }).then(() => {
                cur.muted = next;
                el.__mosSetMuted(next);
                toast(next ? "Output muted." : "Output unmuted.");
              }, e => toast(Sys.say(e)));
            }
          });
          sl.setAttribute("aria-label", "Volume");
        }

        const ins = a.inputs || [];
        ctx.sec("Input");
        if (!ins.length) ctx.stat("No active capture endpoints.", "bad");
        ins.forEach(o => {
          ctx.row({
            label:o.name, sub:(o.formFactor || "Endpoint") + " · " + Math.round((o.volume || 0) * 100) + "%"
                 + (o.muted ? " · muted" : ""),
            tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
            icon:"info",
            run: () => {
              if (o.isDefault){
                const next = !o.muted;
                Sys.call("audio.setMute", { id:o.id, flow:"input", muted:next }, { timeout:8000 }).then(
                  () => { toast(next ? "Microphone muted." : "Microphone unmuted."); if (settingsRepaint) settingsRepaint(); },
                  e  => toast(Sys.say(e)));
                return;
              }
              Sys.call("audio.setDefault", { id:o.id, flow:"input", role:"all" }, { timeout:12000 }).then(
                () => { toast("Input switched to " + o.shortName + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)));
            }
          });
        });

        /* The shell's cues sit under whatever the television is doing, and this
           pane is the only place that already knows the Windows level. */
        if (window.MarwanSfx && cur) MarwanSfx.setSystemVolume(cur.volume, cur.muted);
        shellSound();
      }, e => { loading.remove(); ctx.err("Audio endpoints could not be read", e); shellSound(); });
    } },

  /* ── 4. Controllers ─────────────────────────────────────
     Two independent views: what the host's raw-HID reader has (which
     is where the battery comes from) and what Bluetooth knows. The
     bench has no Bluetooth hardware, so that half says so. */
  { id:"pad", label:"Controllers", sub:"Pads, battery, Bluetooth", icon:"pad",
    blurb:"The pad this shell is reading, and the Bluetooth radio it would pair new ones with.",
    build(ctx){
      const loading = ctx.stat("Reading controllers…", null, true);
      return padSnapshot(0).then(p => {
        if (!ctx.alive()) return;
        loading.remove();
        ctx.sec("Connected pad");
        if (p && p.connected){
          const facts = [
            ["Model",     orDash(p.model)],
            ["Connection", p.transport === "BT" ? "Bluetooth" : (p.transport === "USB" ? "USB cable" : orDash(p.transport))],
            ["Hardware ID", "VID 0x" + (p.vid || 0).toString(16).toUpperCase().padStart(4, "0")
