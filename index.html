<meta charset="utf-8">
<title>ARC OS — PC1</title>

<!-- The on-screen keyboard ships as a real same-origin stylesheet and script:
     the page is served over https://arcos.local/ from the host's virtual host
     mapping, and the CSP there rejects injected style elements. -->
<link rel="stylesheet" href="osk.css">
<script src="osk.js"></script>

<!-- The file explorer, on the same terms: a real stylesheet and a real script,
     both same-origin, because the CSP here forbids injected style elements and
     forbids anything off this host. files.js defines one global, ArcFiles. -->
<link rel="stylesheet" href="files.css">
<script src="files.js"></script>

<!-- The browser's chrome — tab strip, address bar, start page, history.
     The web pages themselves are drawn by a SECOND WebView2 that the host
     owns and positions over the rectangle browser.js reserves; see the
     BrowserHost comment in ShellHostWeb.cs. Nothing here ever loads a
     remote origin, and this document's CSP is unchanged by its existence. -->
<link rel="stylesheet" href="browser.css">
<script src="browser.js"></script>

<style>
/* ─────────────────────────────────────────────────────────────
   ARC OS — console shell for PC1
   Single committed visual world: every color painted explicitly.

   SIZING RULE: nothing outside :root is expressed in px. The root
   font-size is derived from the viewport, everything else is rem,
   so 1080p / 1440p / ultrawide / 4K are the same layout at
   different scales rather than four separate designs.
   ───────────────────────────────────────────────────────────── */

:root{
  --void:      #04060b;
  --deep:      #0c1422;
  --haze:      #17253c;
  --line:      #24344f;

  --ice:       #e6f0ff;
  --steel:     #7f96b8;
  --dim:       #4e6183;

  --beam:      #4c8dff;
  --beam-hot:  #a6d4ff;
  --beam-deep: #1b3f8a;

  --good:      #56d6a0;
  --warn:      #ffb457;

  --sans: "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display: "Segoe UI Variable Display","Segoe UI Light","Segoe UI",system-ui,-apple-system,sans-serif;

  --e-out: cubic-bezier(.16,.84,.24,1);
  --e-in:  cubic-bezier(.6,0,.9,.4);

  /* ── Root scale ───────────────────────────────────────────
     16px at 1920×1080, 21.3px at 1440p (incl. 3440×1440),
     32px at 2160p. Height-led because a console UI is read at a
     fixed distance and height is what changes with the panel;
     the vw term only bites on absurdly wide-and-short viewports
     so an odd aspect ratio shrinks instead of overflowing. */
  font-size: clamp(11px, min(1.4815vh, 2.3vw), 34px);

  /* TV overscan safe area. Percent-of-viewport floors keep content
     off the extreme edge on a set that overscans ~3–5%. */
  --edge:   max(2.5rem, 2.6vw);
  --safe-y: max(1.6rem, 2.2vh);

  /* Rail geometry as unitless multipliers of 1rem. Two reasons they are
     bare numbers: JS can compute the scroll offset exactly at any scale
     (railStep()), and a custom property whose value is calc(… * 1rem)
     is resolved once against the root font-size and is NOT re-resolved
     when a viewport-driven root font-size changes — the multiplication
     has to happen at the point of use, below, or the rail keeps the
     scale it had at first layout. */
  --tile-u: 7.375;
  --tile-active-u: 11;
  --gap-u: 1;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--ice);
  font-family:var(--sans);
  font-size:1rem;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:none}

/* ── Focus treatment ──────────────────────────────────────────
   One rule, one accent, one curve. data-focus="on" is the live
   cursor; "stale" is a scope further down the stack — still shown,
   because on a TV a user must always be able to see where they
   will land when they back out. */
[data-focus]{outline:none}
[data-focus="on"]{
  box-shadow:0 0 0 .125rem var(--beam), 0 0 1.5rem rgba(76,141,255,.42);
  transition:box-shadow .28s var(--e-out),background .28s var(--e-out),
             color .28s var(--e-out),transform .28s var(--e-out);
}
[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(76,141,255,.3)}

/* ── Ambient field ─────────────────────────────────────────── */
#amb{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 40%, rgba(4,6,11,0) 40%, rgba(4,6,11,.72) 100%);
}

/* ── Stage ─────────────────────────────────────────────────── */
.stage{position:fixed;inset:0;z-index:2}

/* ═══ BOOT ═════════════════════════════════════════════════ */
#boot{
  position:fixed;inset:0;z-index:20;
  display:grid;place-items:center;
  background:radial-gradient(90% 70% at 50% 50%, #0a1220 0%, #04060b 62%, #020306 100%);
  transition:opacity .5s var(--e-in);
}
#boot.gone{opacity:0;pointer-events:none}

.boot-core{display:grid;justify-items:center;gap:2.125rem;translate:0 -.75rem}

/* the mark: a broken ring whose gap carries an orbiting node */
.mark{width:8.25rem;height:8.25rem;position:relative}
.mark svg{width:100%;height:100%;overflow:visible}
.ring-track{fill:none;stroke:#12203a;stroke-width:1.5}
.ring-arc{
  fill:none;stroke:url(#arcgrad);stroke-width:2.5;stroke-linecap:round;
  filter:drop-shadow(0 0 10px rgba(76,141,255,.55));
}
.ring-spin{transform-origin:50% 50%;animation:spin 1.5s linear infinite}
.node{fill:var(--beam-hot);filter:drop-shadow(0 0 8px rgba(166,212,255,.9))}
.mark.settled .ring-spin{animation:settle .9s var(--e-out) forwards}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes settle{to{transform:rotate(486deg)}}

.wordmark{
  display:flex;gap:.34em;
  font-family:var(--display);font-size:2.75rem;font-weight:200;
  letter-spacing:.30em;text-indent:.30em;color:var(--ice);
}
.wordmark span{
  opacity:0;translate:0 .875rem;filter:blur(6px);
  animation:letter .8s var(--e-out) forwards;
}
@keyframes letter{to{opacity:1;translate:0 0;filter:blur(0)}}

.boot-sub{
  font-size:.6875rem;letter-spacing:.42em;text-transform:uppercase;
  color:var(--dim);margin-top:-1.125rem;opacity:0;
  animation:fade .9s var(--e-out) .9s forwards;
}
@keyframes fade{to{opacity:1}}

.boot-progress{
  width:21.25rem;max-width:78vw;display:grid;gap:.875rem;justify-items:center;
  opacity:0;animation:fade .7s var(--e-out) 1.1s forwards;
}
.track{width:100%;height:.0938rem;background:#132038;position:relative;overflow:hidden;border-radius:.125rem}
.fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:linear-gradient(90deg,var(--beam-deep),var(--beam) 60%,var(--beam-hot));
  box-shadow:0 0 .875rem rgba(76,141,255,.7);
  transition:width .5s var(--e-out);
}
.boot-status{
  display:flex;justify-content:space-between;width:100%;
  font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;color:var(--steel);
}
.boot-status b{font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}

.boot-meta{
  position:fixed;bottom:var(--safe-y);left:0;right:0;z-index:21;
  display:flex;justify-content:space-between;padding:0 var(--edge);
  font-size:.6875rem;letter-spacing:.18em;text-transform:uppercase;
  color:#33455f;opacity:0;animation:fade 1s var(--e-out) 1.4s forwards;
}
#boot.gone .boot-meta{opacity:0}

/* bloom wipe out of boot */
#bloom{
  position:fixed;left:50%;top:50%;z-index:30;
  width:40vmax;height:40vmax;margin:-20vmax 0 0 -20vmax;border-radius:50%;
  background:radial-gradient(circle,#ffffff 0%,#cfe4ff 24%,rgba(76,141,255,.55) 46%,rgba(76,141,255,0) 72%);
  opacity:0;scale:.1;pointer-events:none;
}
#bloom.go{animation:bloom .85s var(--e-out) forwards}
@keyframes bloom{
  0%{opacity:0;scale:.1}
  22%{opacity:.95}
  100%{opacity:0;scale:5.2}
}

/* ═══ SHELL ════════════════════════════════════════════════ */
#shell{
  position:fixed;inset:0;z-index:10;
  display:grid;grid-template-rows:auto auto 1fr auto;
  opacity:0;scale:1.05;filter:blur(14px);pointer-events:none;
}
#shell.live{
  opacity:1;scale:1;filter:blur(0);pointer-events:auto;
  transition:opacity .7s var(--e-out),scale .9s var(--e-out),filter .7s var(--e-out);
}

/* ── Status bar ───────────────────────────────────────────── */
.statusbar{
  display:flex;align-items:center;gap:1.625rem;
  padding:var(--safe-y) var(--edge) 0;
}
.user{display:flex;align-items:center;gap:.75rem}
.avatar{
  width:2.125rem;height:2.125rem;border-radius:50%;
  background:conic-gradient(from 210deg,#2b5fd0,#4c8dff,#a6d4ff,#2b5fd0);
  display:grid;place-items:center;
  font-size:.8125rem;font-weight:600;color:#04060b;
  box-shadow:0 0 0 .0625rem rgba(166,212,255,.35),0 .25rem .875rem rgba(0,0,0,.5);
}
.user-name{font-size:.875rem;letter-spacing:.02em}
.status-spacer{flex:1}
.status-right{display:flex;align-items:center;gap:1.25rem;color:var(--steel)}
.status-chip{display:flex;align-items:center;gap:.44rem;font-size:.8125rem;letter-spacing:.04em}
.status-chip svg{width:.94rem;height:.94rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.clock{
  font-family:var(--display);font-size:1.1875rem;font-weight:300;
  letter-spacing:.04em;color:var(--ice);font-variant-numeric:tabular-nums;
}
.icon-btn{
  width:2.125rem;height:2.125rem;border-radius:50%;display:grid;place-items:center;
  color:var(--steel);transition:background .2s,color .2s,box-shadow .28s var(--e-out);
}
.icon-btn:hover{background:rgba(166,212,255,.12);color:var(--ice)}
.icon-btn[data-focus="on"]{background:rgba(28,46,76,.9);color:var(--ice)}
.icon-btn svg{width:1.06rem;height:1.06rem;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ── Tabs ─────────────────────────────────────────────────── */
.tabs{display:flex;gap:2.125rem;padding:1.375rem var(--edge) 0}
.tab{
  position:relative;padding:0 .25rem .56rem;
  font-family:var(--display);font-size:.94rem;font-weight:300;
  letter-spacing:.26em;text-transform:uppercase;color:var(--dim);
  transition:color .25s,box-shadow .28s var(--e-out);
  border-radius:.25rem;
}
.tab::after{
  content:"";position:absolute;left:0;right:100%;bottom:0;height:.0938rem;
  background:linear-gradient(90deg,var(--beam),var(--beam-hot));
  box-shadow:0 0 .625rem rgba(76,141,255,.8);
  transition:right .35s var(--e-out);
}
.tab[aria-selected="true"]{color:var(--ice)}
.tab[aria-selected="true"]::after{right:0}
.tab:hover{color:var(--steel)}
.tab[aria-selected="true"]:hover{color:var(--ice)}
.tab[data-focus="on"]{color:var(--ice)}

/* ── Hero ─────────────────────────────────────────────────── */
.main{position:relative;overflow:hidden}

/* art sits on its own fixed layer above the ambient field and below the
   shell, so it bleeds behind the status bar instead of seaming at the tabs */
.hero-art{position:fixed;inset:0;z-index:3;pointer-events:none}
.hero-layer{
  position:absolute;inset:0;opacity:0;
  transition:opacity .7s var(--e-out);
  mask-image:linear-gradient(to bottom,#000 0%,#000 52%,transparent 88%);
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 52%,transparent 88%);
}
.hero-layer.on{opacity:1}

.hero{
  position:relative;z-index:1;
  padding:clamp(.75rem,5vh,3.4rem) var(--edge) 0;max-width:47.5rem;
  display:grid;gap:0;align-content:start;
}
.eyebrow{
  font-size:.6875rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--beam-hot);margin-bottom:1rem;
}
.hero-title{
  font-family:var(--display);font-weight:200;
  font-size:min(4rem,8vw);line-height:1.02;
  letter-spacing:-.015em;margin:0;text-wrap:balance;
  text-shadow:0 .375rem 2.5rem rgba(4,6,11,.9);
}
.hero-desc{
  margin:clamp(.5rem,1.7vh,1.1rem) 0 0;max-width:52ch;
  font-size:.97rem;line-height:1.62;color:#b9c8e0;
}
.hero-meta{display:flex;flex-wrap:wrap;gap:.625rem;margin-top:clamp(.7rem,2.2vh,1.5rem)}
.chip{
  padding:.375rem .8rem;border-radius:99px;
  border:.0625rem solid var(--line);background:rgba(12,20,34,.6);
  font-size:.75rem;letter-spacing:.06em;color:var(--steel);
  backdrop-filter:blur(8px);
}
.chip.live{border-color:rgba(86,214,160,.4);color:var(--good)}
.hero-actions{display:flex;gap:.75rem;margin-top:clamp(.9rem,2.8vh,1.9rem)}
.btn{
  display:inline-flex;align-items:center;gap:.625rem;
  padding:.75rem 1.625rem;border-radius:99px;
  font-size:.875rem;letter-spacing:.05em;
  transition:transform .2s var(--e-out),box-shadow .28s var(--e-out),background .25s;
}
.btn svg{width:.94rem;height:.94rem;fill:currentColor}
.btn-primary{
  background:linear-gradient(180deg,#f2f7ff,#cfe0fb);color:#06101f;font-weight:600;
  box-shadow:0 .5rem 1.6rem rgba(120,170,255,.28);
}
.btn-primary:hover{transform:translateY(-.0625rem);box-shadow:0 .75rem 2.1rem rgba(120,170,255,.4)}
.btn-ghost{border:.0625rem solid var(--line);color:var(--ice);background:rgba(12,20,34,.5)}
.btn-ghost:hover{background:rgba(36,52,79,.6)}
.btn[data-focus="on"]{transform:translateY(-.125rem)}
.btn-primary[data-focus="on"]{box-shadow:0 0 0 .125rem var(--beam-hot),0 .75rem 2.4rem rgba(120,170,255,.55)}

/* fade group when focus changes */
.swap{transition:opacity .28s var(--e-out),translate .38s var(--e-out)}
.swap.out{opacity:0;translate:0 .625rem}

/* ── Rail ─────────────────────────────────────────────────── */
.rail-wrap{position:relative;z-index:1;padding:clamp(.7rem,3.2vh,2.4rem) 0 clamp(.7rem,2.6vh,1.9rem);overflow:hidden}
.rail{
  display:flex;align-items:flex-end;gap:calc(var(--gap-u) * 1rem);
  padding-left:var(--edge);
  transition:transform .45s var(--e-out);
  will-change:transform;
}
.tile{
  position:relative;flex:0 0 auto;
  width:calc(var(--tile-u) * 1rem);height:calc(var(--tile-u) * 1rem);border-radius:.875rem;
  overflow:hidden;cursor:pointer;padding:0;
  border:.0625rem solid rgba(255,255,255,.07);
  transition:width .42s var(--e-out),height .42s var(--e-out),
             border-radius .42s var(--e-out),box-shadow .42s var(--e-out),border-color .3s;
  box-shadow:0 .5rem 1.4rem rgba(2,4,9,.6);
}
.tile-art{position:absolute;inset:0}
.tile-sheen{
  position:absolute;inset:0;
  background:linear-gradient(150deg,rgba(255,255,255,.18),rgba(255,255,255,0) 42%),
             linear-gradient(0deg,rgba(4,6,11,.55),rgba(4,6,11,0) 55%);
}
.tile-glyph{
  position:absolute;inset:0;display:grid;place-items:center;
  color:rgba(255,255,255,.94);
}
.tile-glyph svg{
  width:2.125rem;height:2.125rem;fill:none;stroke:currentColor;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 .125rem .5rem rgba(0,0,0,.55));
  transition:width .42s var(--e-out),height .42s var(--e-out);
}
.tile-name{
  position:absolute;left:0;right:0;bottom:.7rem;
  text-align:center;font-size:.6875rem;letter-spacing:.05em;
  color:rgba(255,255,255,.9);opacity:0;transition:opacity .3s;
  text-shadow:0 .0625rem .375rem rgba(0,0,0,.8);
}
.tile:hover{border-color:rgba(166,212,255,.35)}
.tile[aria-current="true"]{
  width:calc(var(--tile-active-u) * 1rem);height:calc(var(--tile-active-u) * 1rem);border-radius:1.125rem;
  border-color:rgba(166,212,255,.5);
  box-shadow:0 1.1rem 2.9rem rgba(2,4,9,.75),0 0 0 .0625rem rgba(166,212,255,.22),
             0 0 2.5rem rgba(76,141,255,.24);
}
.tile[aria-current="true"] .tile-glyph svg{width:2.875rem;height:2.875rem}
.tile[aria-current="true"] .tile-name{opacity:1}
/* the rail's own focus ring is the accent border, not a generic halo —
   the tile is already 176px of signal, it only needs to say "live" */
.tile[data-focus="on"]{
  border-color:var(--beam-hot);
  box-shadow:0 1.1rem 2.9rem rgba(2,4,9,.75),0 0 0 .1875rem var(--beam),
             0 0 3.4rem rgba(76,141,255,.55);
}
.tile[data-focus="stale"]{box-shadow:0 1.1rem 2.9rem rgba(2,4,9,.75),0 0 0 .125rem rgba(76,141,255,.35)}
.tile-badge{
  position:absolute;top:.56rem;right:.56rem;
  min-width:1.125rem;height:1.125rem;padding:0 .3rem;border-radius:99px;
  background:var(--beam);color:#04060b;
  font-size:.66rem;font-weight:700;line-height:1.125rem;text-align:center;
  box-shadow:0 0 .75rem rgba(76,141,255,.7);
}

/* ── Hint bar ─────────────────────────────────────────────── */
.hints{
  display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
  padding:0 var(--edge) var(--safe-y);
  font-size:.78rem;letter-spacing:.05em;color:var(--steel);
  min-height:2.4rem;
}
.hint-set{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.hint{display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.hint-glyphs{display:inline-flex;align-items:center;gap:.25rem}
/* pad glyphs: same 24×24 stroke language as every other icon here */
.glyph{
  width:1.4rem;height:1.4rem;display:block;
  fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;
  color:var(--beam-hot);
}
.glyph .solid{fill:currentColor;stroke:none}
.glyph .lbl{fill:currentColor;stroke:none;font-size:8.2px;font-family:var(--sans);letter-spacing:.02em}
.key{
  display:inline-grid;place-items:center;min-width:1.375rem;height:1.375rem;padding:0 .375rem;
  border:.0625rem solid var(--line);border-radius:.3rem;
  background:rgba(12,20,34,.7);
  font-size:.69rem;color:var(--beam-hot);
}
.hints-spacer{flex:1}
.replay{color:var(--dim);font-size:.75rem;letter-spacing:.05em;transition:color .2s;border-radius:.3rem;padding:.2rem .4rem}
.replay:hover{color:var(--beam-hot)}
.replay[data-focus="on"]{color:var(--beam-hot)}

/* ── Overlay: control centre + panels ─────────────────────── */
#cc{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(2,4,9,.55);backdrop-filter:blur(18px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
#cc.open{opacity:1;pointer-events:auto}
#cc[data-view="panel"]{align-items:center}
#cc[data-view="panel"] .cc-panel{display:none}
#cc[data-view="cc"] .panel-stack{display:none}

.cc-panel{
  width:100%;padding:0 var(--edge) calc(var(--safe-y) + 1rem);
  translate:0 1.875rem;transition:translate .42s var(--e-out);
}
#cc.open .cc-panel{translate:0 0}
.cc-label{
  text-align:center;font-family:var(--display);font-weight:300;
  font-size:1.375rem;letter-spacing:.02em;color:var(--ice);
  min-height:2rem;margin-bottom:1.625rem;
}
.cc-label small{display:block;font-family:var(--sans);font-size:.78rem;letter-spacing:.06em;color:var(--steel);margin-top:.125rem}
.cc-row{display:flex;justify-content:center;gap:.875rem;flex-wrap:wrap}
.cc-item{
  width:4.625rem;height:4.625rem;border-radius:50%;
  display:grid;place-items:center;
  border:.0625rem solid var(--line);background:rgba(12,20,34,.72);
  color:var(--steel);
  transition:transform .25s var(--e-out),border-color .25s,color .25s,background .25s,box-shadow .28s var(--e-out);
}
.cc-item svg{width:1.625rem;height:1.625rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cc-item:hover,.cc-item[aria-current="true"]{
  transform:translateY(-.375rem);color:var(--ice);
  border-color:rgba(166,212,255,.55);background:rgba(28,46,76,.8);
  box-shadow:0 .75rem 1.9rem rgba(2,4,9,.7),0 0 1.6rem rgba(76,141,255,.25);
}
.cc-item[data-focus="on"]{
  transform:translateY(-.375rem);color:var(--ice);background:rgba(28,46,76,.9);
  border-color:var(--beam-hot);
  box-shadow:0 0 0 .1875rem var(--beam),0 .75rem 2.2rem rgba(2,4,9,.8),0 0 2.2rem rgba(76,141,255,.5);
}
.cc-item.on{color:var(--good);border-color:rgba(86,214,160,.45)}

/* ── Panels ───────────────────────────────────────────────── */
.panel-stack{width:100%;display:flex;justify-content:center;padding:0 var(--edge)}
.panel{
  width:min(64rem,100%);
  background:linear-gradient(180deg,rgba(14,23,39,.95),rgba(8,13,23,.97));
  border:.0625rem solid var(--line);border-radius:1.25rem;
  box-shadow:0 2rem 5rem rgba(2,4,9,.8),0 0 0 .0625rem rgba(166,212,255,.06);
  overflow:hidden;
  translate:0 1.25rem;opacity:0;
  transition:translate .38s var(--e-out),opacity .3s var(--e-out);
}
.panel.in{translate:0 0;opacity:1}
.panel.behind{display:none}
.panel-head{padding:1.75rem 2rem 1.1rem;border-bottom:.0625rem solid rgba(36,52,79,.7)}
.panel-eyebrow{font-size:.66rem;letter-spacing:.34em;text-transform:uppercase;color:var(--beam-hot);margin-bottom:.5rem}
.panel-title{font-family:var(--display);font-weight:200;font-size:2rem;line-height:1.1;margin:0;letter-spacing:-.01em}
.panel-sub{margin:.4rem 0 0;font-size:.85rem;color:var(--steel);max-width:52ch}
.panel-body{padding:1.1rem 1.25rem 1.5rem;max-height:52vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.panel-body::-webkit-scrollbar{width:.4rem}
.panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.row{
  display:flex;align-items:center;gap:1rem;width:100%;
  padding:.85rem 1rem;border-radius:.75rem;
  border:.0625rem solid transparent;background:rgba(12,20,34,.4);
  margin-bottom:.5rem;color:var(--ice);
  transition:background .25s,border-color .25s,transform .28s var(--e-out),box-shadow .28s var(--e-out);
}
.row:hover{background:rgba(28,46,76,.55)}
.row[data-focus="on"]{background:rgba(28,46,76,.9);border-color:var(--beam-hot);transform:translateX(.25rem)}
.row[data-focus="stale"]{border-color:rgba(76,141,255,.3)}
.row[aria-disabled="true"]{opacity:.55}
.row-ico{
  flex:0 0 auto;width:2.4rem;height:2.4rem;border-radius:.6rem;display:grid;place-items:center;
  background:rgba(36,52,79,.5);color:var(--steel);
}
.row[data-focus="on"] .row-ico{color:var(--beam-hot)}
.row-ico svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.row-text{flex:1;min-width:0}
.row-text b{display:block;font-weight:400;font-size:1rem;letter-spacing:.01em}
.row-text small{display:block;font-size:.78rem;color:var(--steel);margin-top:.125rem}
.row-tail{flex:0 0 auto;font-size:.8rem;color:var(--steel);font-variant-numeric:tabular-nums}
.row.danger[data-focus="on"]{border-color:var(--warn);box-shadow:0 0 0 .125rem var(--warn),0 0 1.5rem rgba(255,180,87,.3)}
.row.danger .row-ico{color:var(--warn)}

/* fact list — read-only values, never focusable */
.facts{display:grid;gap:.1rem;padding:.3rem .3rem .8rem}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.5rem .7rem;border-radius:.4rem}
.fact:nth-child(odd){background:rgba(12,20,34,.45)}
.fact span{font-size:.82rem;color:var(--steel)}
.fact b{font-size:.82rem;font-weight:400;color:var(--ice);font-variant-numeric:tabular-nums;text-align:right}
.note{
  margin:.4rem .3rem 0;padding:.6rem .8rem;border-radius:.5rem;
  border:.0625rem dashed rgba(126,150,184,.45);
  font-size:.76rem;color:var(--steel);letter-spacing:.02em;
}
.note b{color:var(--warn);font-weight:400}

/* profile header inside its panel */
.profile{display:flex;align-items:center;gap:1.25rem;padding:.4rem .6rem 1.1rem}
.profile .avatar{width:4.4rem;height:4.4rem;font-size:1.6rem}
.profile-id b{display:block;font-family:var(--display);font-weight:300;font-size:1.5rem}
.profile-id small{display:block;font-size:.82rem;color:var(--steel);margin-top:.2rem}

/* settings: category rail + content pane, both pad-navigable */
.settings{display:grid;grid-template-columns:minmax(12rem,17rem) 1fr;gap:1rem;min-height:20rem}
.set-cats{border-right:.0625rem solid rgba(36,52,79,.7);padding-right:.75rem;overflow-y:auto;max-height:46vh;scrollbar-width:thin}
.set-cats .row{margin-bottom:.3rem;padding:.7rem .85rem}
.set-cats .row[aria-current="true"]{background:rgba(28,46,76,.7)}
.set-pane{padding:.2rem .4rem;overflow-y:auto;max-height:46vh;scrollbar-width:thin}
.set-pane h3{font-family:var(--display);font-weight:300;font-size:1.25rem;margin:.2rem 0 .2rem}
.set-pane p{font-size:.85rem;color:var(--steel);margin:.2rem 0 .9rem;max-width:52ch}

/* ── Settings content: real state, and the vocabulary for showing it ──
   Every atom here exists to make the difference between "read from the
   OS", "still reading" and "could not read" visible at TV distance. */
.panel-body h4{
  font-size:.66rem;letter-spacing:.28em;text-transform:uppercase;color:var(--beam-hot);
  margin:1rem .3rem .45rem;font-weight:400;
}
.panel-body h4:first-child,.set-pane h4:first-of-type{margin-top:.2rem}
.set-pane .facts{padding-bottom:.4rem}

/* a line of status under a heading — "Scanning…", "3 networks", an error */
.stat{
  display:flex;align-items:center;gap:.5rem;
  margin:.1rem .3rem .5rem;font-size:.78rem;color:var(--steel);letter-spacing:.02em;
}
.stat.bad{color:#ffcf9a}
.stat.good{color:var(--good)}

/* the spinner. One ring, the accent, the same curve as everything else. */
.spin{
  width:.85rem;height:.85rem;flex:0 0 auto;border-radius:50%;
  border:.11rem solid rgba(126,150,184,.35);border-top-color:var(--beam-hot);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* an error the human can act on: what failed, what the OS said, what to do */
.err{
  margin:.4rem .3rem;padding:.7rem .9rem;border-radius:.55rem;
  border:.0625rem solid rgba(255,180,87,.5);background:rgba(40,22,6,.55);
  font-size:.8rem;color:#ffdcae;letter-spacing:.02em;
}
.err b{display:block;font-weight:400;color:var(--warn);margin-bottom:.15rem}
.err code{font-family:var(--sans);font-size:.72rem;color:#e2b98a;opacity:.85}

/* right-hand column of a row: chips that carry state, not decoration */
.tag{
  display:inline-block;padding:.12rem .45rem;border-radius:99px;
  border:.0625rem solid var(--line);background:rgba(12,20,34,.6);
  font-size:.66rem;letter-spacing:.09em;text-transform:uppercase;color:var(--steel);
  margin-left:.35rem;vertical-align:middle;
}
.tag.on{color:var(--good);border-color:rgba(86,214,160,.5)}
.tag.warn{color:var(--warn);border-color:rgba(255,180,87,.5)}

/* signal strength — five bars, filled to the measured level */
.sig{display:inline-flex;align-items:flex-end;gap:.09rem;height:.8rem;vertical-align:middle}
.sig i{width:.16rem;background:rgba(126,150,184,.3);border-radius:.04rem}
.sig i:nth-child(1){height:26%}
.sig i:nth-child(2){height:45%}
.sig i:nth-child(3){height:64%}
.sig i:nth-child(4){height:82%}
.sig i:nth-child(5){height:100%}
.sig i.lit{background:var(--beam-hot)}

/* used/free bar for a drive */
.bar{height:.42rem;border-radius:99px;background:rgba(36,52,79,.7);overflow:hidden;margin:.35rem 0 .2rem}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--beam-deep),var(--beam))}
.bar.hot i{background:linear-gradient(90deg,#8a5a1b,var(--warn))}
.drive{padding:.7rem 1rem;border-radius:.75rem;background:rgba(12,20,34,.4);margin-bottom:.5rem}
.drive-top{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.drive-top b{font-weight:400;font-size:.95rem}
.drive-top span{font-size:.76rem;color:var(--steel);font-variant-numeric:tabular-nums}
.drive-sub{font-size:.72rem;color:var(--dim);letter-spacing:.02em}

/* a slider that is a focusable row: left/right adjust, and the track is
   drawn under the label rather than beside it so it survives narrow panes */
.row.slider{display:block;padding:.75rem 1rem}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.slider-head b{font-weight:400;font-size:1rem}
.slider-head span{font-size:.9rem;color:var(--steel);font-variant-numeric:tabular-nums}
.row.slider[data-focus="on"] .slider-head span{color:var(--beam-hot)}
.slider-track{height:.5rem;border-radius:99px;background:rgba(36,52,79,.8);overflow:hidden;margin:.5rem 0 .25rem}
.slider-fill{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--beam-deep),var(--beam-hot));transition:width .12s linear}
.row.slider.muted .slider-fill{background:rgba(126,150,184,.45)}
.slider-hint{font-size:.7rem;color:var(--dim);letter-spacing:.03em}

/* the display-mode countdown. Amber, because the default answer is revert. */
.countdown{
  font-family:var(--display);font-weight:200;font-size:3.2rem;line-height:1;
  color:var(--warn);font-variant-numeric:tabular-nums;margin:.6rem 0 .2rem;
}
.countdown-sub{font-size:.8rem;color:var(--steel);margin-bottom:.2rem}

/* confirmation — never one press away from powering off a console */
.confirm{width:min(34rem,100%);text-align:center}
.confirm .panel-head{border-bottom:0;padding-bottom:.4rem}
.confirm-actions{display:flex;gap:.75rem;justify-content:center;padding:.6rem 1.5rem 1.9rem}
.cbtn{
  padding:.8rem 1.9rem;border-radius:99px;font-size:.92rem;letter-spacing:.04em;
  border:.0625rem solid var(--line);background:rgba(12,20,34,.7);color:var(--ice);
  transition:background .25s,border-color .25s,box-shadow .28s var(--e-out),transform .28s var(--e-out);
}
.cbtn[data-focus="on"]{transform:translateY(-.125rem)}
.cbtn.go[data-focus="on"]{background:rgba(255,180,87,.16);border-color:var(--warn);box-shadow:0 0 0 .125rem var(--warn),0 0 1.8rem rgba(255,180,87,.35)}
.cbtn.no[data-focus="on"]{background:rgba(28,46,76,.9);border-color:var(--beam-hot);box-shadow:0 0 0 .125rem var(--beam),0 0 1.8rem rgba(76,141,255,.4)}

/* toast — a panel failing must never be silent, and must never be fatal */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-y) + 3.6rem);translate:-50% 1rem;z-index:60;
  max-width:44rem;padding:.7rem 1.1rem;border-radius:.6rem;
  background:rgba(20,10,4,.94);border:.0625rem solid var(--warn);color:#ffdcae;
  font-size:.8rem;letter-spacing:.02em;opacity:0;pointer-events:none;
  transition:opacity .25s var(--e-out),translate .25s var(--e-out);
}
#toast.show{opacity:1;translate:-50% 0}

/* On a short display the description is the first thing to go — the
   primary action must never be the thing that gets squeezed out. */
@media (max-height:620px){
  .hero-desc{display:none}
  .eyebrow{margin-bottom:.5rem}
  .panel-body{max-height:44vh}
}
/* Portrait / very narrow: the rail and hints wrap rather than clip. */
@media (max-aspect-ratio:1/1){
  .hero{max-width:none}
  .hints{gap:1rem}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001s !important;animation-delay:0s !important;
    transition-duration:.12s !important;
  }
}

<script>
"use strict";
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $  = (s) => document.querySelector(s);

/* ═══ Failure containment ════════════════════════════════════
   This process IS the Windows shell: an escaped exception blanks a
   television. Every entry point from the outside world — host
   messages, key events, pad actions, panel builders — goes through
   safe(), which logs to the host and shows a toast instead of
   unwinding into nothing. */
let toastTimer = 0;
function toast(msg){
  try{
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 5200);
  }catch(e){}
}
function hostLog(s){
  try{ if (typeof window.arcPost === "function") window.arcPost({type:"log", target:s}); }catch(e){}
  try{ console.log("[arc] " + s); }catch(e){}
}
function report(where, err){
  const msg = where + ": " + (err && err.message ? err.message : String(err));
  hostLog("ERROR " + msg + (err && err.stack ? " | " + String(err.stack).split("\n")[1] : ""));
  toast(msg);
}
function safe(where, fn){
  return function(){
    try { return fn.apply(this, arguments); }
    catch(err){ report(where, err); }
  };
}
addEventListener("error", (e) => hostLog("window error: " + (e.message || "?")));

/* ═══ Ambient field ══════════════════════════════════════════
   Slow drifting motes over two wandering light blooms — the
   "living background" a console shell needs so a static screen
   never feels frozen. */
(function ambient(){
  const c = $("#amb"), ctx = c.getContext("2d");
  let w, h, dpr, motes = [];

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = c.width  = innerWidth  * dpr;
    h = c.height = innerHeight * dpr;
    c.style.width = innerWidth + "px";
    c.style.height = innerHeight + "px";
    const count = Math.round((innerWidth * innerHeight) / 26000);
    motes = Array.from({length: count}, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      r: (Math.random() * 1.5 + .35) * dpr,
      v: (Math.random() * .16 + .04) * dpr,
      d: Math.random() * .5 - .25,
      a: Math.random() * .45 + .12,
      p: Math.random() * Math.PI * 2
    }));
  }
  resize();
  addEventListener("resize", resize);

  let t = 0;
  function blob(x, y, r, hue, alpha){
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${hue},${alpha})`);
    g.addColorStop(1, `rgba(${hue},0)`);
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function frame(){
    t += RM ? 0 : .0032;
    ctx.clearRect(0, 0, w, h);

    const R = Math.max(w, h);
    blob(w * (.24 + Math.sin(t) * .07),        h * (.30 + Math.cos(t * .8) * .07),  R * .55, "27,63,138",  ".40");
    blob(w * (.80 + Math.cos(t * .7) * .06),   h * (.72 + Math.sin(t * .9) * .06),  R * .48, "12,32,70",   ".55");
    blob(w * (.55 + Math.sin(t * 1.3) * .10),  h * (.12 + Math.cos(t * 1.1) * .05), R * .34, "76,141,255", ".13");

    for (const m of motes){
      if (!RM){
        m.y -= m.v;
        m.x += Math.sin(t * 3 + m.p) * .22 * dpr + m.d * .05;
        if (m.y < -8) { m.y = h + 8; m.x = Math.random() * w; }
      }
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(190,220,255,${m.a})`;
      ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();

/* ═══ Catalogue ═══════════════════════════════════════════ */
const G = {
  play:  ["#2b5fd0", "#0a1730"],
  arcade:["#7a3bd6", "#180d33"],
  disc:  ["#1f8f7a", "#06201c"],

};

const ICON = {
  steam:  '<circle cx="9" cy="9" r="4.2"/><circle cx="9" cy="9" r="1.4"/><path d="M12.6 11.4 20 18.4"/><circle cx="18.6" cy="17.2" r="2.6"/>',
  library:'<rect x="3.5" y="4" width="4" height="16" rx="1.2"/><rect x="9.5" y="4" width="4" height="16" rx="1.2"/><path d="M16.6 5.4l3.6 1.1-3.4 13.1-3.6-1.1z"/>',
  arcade: '<rect x="3" y="7" width="18" height="10" rx="4"/><path d="M7.4 10.8v2.4M6.2 12h2.4"/><circle cx="15.6" cy="11.2" r="1.05"/><circle cx="17.8" cy="13.2" r="1.05"/>',
  remote: '<path d="M6.4 5.6a9 9 0 0 0 0 12.8M17.6 5.6a9 9 0 0 1 0 12.8"/><path d="M9.4 8.8a5 5 0 0 0 0 6.4M14.6 8.8a5 5 0 0 1 0 6.4"/><circle cx="12" cy="12" r="1.6"/>',
  dl:     '<path d="M12 4v10.5"/><path d="m7.8 10.6 4.2 4.2 4.2-4.2"/><path d="M4.5 18.5h15"/>',

const runBoot = safe("runBoot", function(){
  bootTimers.forEach(clearTimeout);
  bootTimers = [];

  const boot = $("#boot"), mark = $("#mark"), fill = $("#fill");
  boot.classList.remove("gone");
  mark.classList.remove("settled");
  fill.style.width = "0%";
  $("#pctText").textContent = "0%";
  $("#stepText").textContent = STEPS[0][0];
  $("#shell").classList.remove("live");
  $("#bloom").classList.remove("go");
  Overlay.closeAll();
  paintWordmark();

  const scale = RM ? 0.25 : 1;
  let at = 1100 * scale;

  STEPS.forEach(([label, pct, hold]) => {
    bootTimers.push(setTimeout(safe("bootStep", () => {
      $("#stepText").textContent = label;
      fill.style.width = pct + "%";
      $("#pctText").textContent = pct + "%";
    }), at));

/* ═══ Host bridge ═════════════════════════════════════════
   The native host injects a shim at document-created time that owns
   window.arcPost and forwards semantic pad actions. Two host
   generations are supported:

     v2 (shipping)  drives the page's own functions — select(),
                    setTab(), toggleCC(), closeCC() — and synthesises
                    arrow keys while an overlay is open. Those four
                    entry points are kept as adapters onto the focus
                    manager so the live binary keeps working.
     v3 (this tree) calls window.arcPad(action) for everything and
                    understands {type:"power"} and {type:"sysinfo"}.

   Anything the host does not send is picked up from the Gamepad API,
   which WebView2 does expose for the DualSense — but only for actions
   the host has never sent, so the two paths can never double-fire. */
let padInfo = null, padInfoAt = -1e9;
const padInfoWaiters = [];

const Host = (function(){
  const caps = { power:false, sysinfo:false, nav:false, sys:false, padinfo:false, fs:false,
                 browser:false, known:false };
  const hostOwned = new Set(["left","right","launch","back","tabPlay","tabMedia","cc"]);
  let sysinfo = null;
  const sysListeners = [];

  function post(o){
    try{
      if (typeof window.arcPost === "function"){ window.arcPost(o); return true; }
      if (window.chrome && window.chrome.webview){
        window.chrome.webview.postMessage(JSON.stringify(o));
        return true;
      }
    }catch(e){}
    hostLog("post dropped (no host): " + JSON.stringify(o));
    return false;
  }

  function onSysinfo(fn){
    sysListeners.push(fn);
    if (sysinfo) { try{ fn(sysinfo); }catch(e){} }
  }

  function handle(m){
    if (!m || !m.type) return;
    if (m.type === "hostinfo"){
      caps.power   = !!(m.caps && m.caps.indexOf("power")   >= 0);
      caps.sysinfo = !!(m.caps && m.caps.indexOf("sysinfo") >= 0);
      caps.nav     = !!(m.caps && m.caps.indexOf("nav")     >= 0);
      caps.sys     = !!(m.caps && m.caps.indexOf("sys")     >= 0);
      caps.padinfo = !!(m.caps && m.caps.indexOf("padinfo") >= 0);
      caps.fs      = !!(m.caps && m.caps.indexOf("fs")      >= 0);
      caps.browser = !!(m.caps && m.caps.indexOf("browser") >= 0);
      if (caps.nav) ["up","down","square","triangle","guide"].forEach(a => hostOwned.add(a));
      caps.known = true;
      hostLog("hostinfo caps=" + (m.caps || []).join(","));
      return;
    }
    if (m.type === "sysinfo"){
      sysinfo = m.data || m;
      hostLog("sysinfo received");
      sysListeners.forEach(fn => { try{ fn(sysinfo); }catch(e){} });
      return;
    }
    /* The system-control channel. The payload is SystemApi's own envelope,
       correlated by the reqId it echoes back. */
    if (m.type === "sysres"){ Sys._settle(m.payload); return; }
    /* The file-system channel. The message IS FileApi's envelope with a
       type bolted on; Files hands it to the explorer untouched. */
    if (m.type === "fs.reply"){ Files._settle(m); return; }
    /* The browser's channel. Tab state, navigation, crashes, and every
       message the injected navigation layer sends from inside a web page,
       relayed by the host with the tab stamped on it. */
    /* --browse=<url> on the host's command line. An automation hook, not a
       product feature: the pad vocabulary cannot type an address, so this is
       how an unattended run gets inside a real web page to test navigation
       on it. It goes through the ordinary ACT entry point, so what it
       exercises is exactly what a human pressing Cross exercises. */
    if (m.type === "browse"){
      hostLog("host asked for the browser at " + m.url);
      ACT.openBrowser(m.url || "");
      return;
    }
    if (m.type === "browser"){
      try{ if (window.ArcBrowser) ArcBrowser.hostMessage(m); }
      catch(err){ report("browser message", err); }
      return;
    }
    if (m.type === "padinfo"){
      padInfo = m.data || null;
      padInfoAt = performance.now();
      padInfoWaiters.splice(0).forEach(fn => { try{ fn(padInfo); }catch(e){} });
      return;
    }
    if (m.type === "powerAck"){ caps.power = true; return; }
    /* pad messages: only ours to handle when no shim is present.
       The v2/v3 shims consume them and call back into the page. */
    if (m.type === "pad" && !window.__arcShim) Input.pad(m.action);
  }

  /* Restart and shut down have a legacy path: the host maps process
     exit 2 -> restart device and exit 3 -> shut down via Shell
     Launcher. If the running host has no power channel, fall back to
     it rather than leaving a dead button. Sleep and sign-out have no
     legacy equivalent and say so instead of pretending. */
  const LEGACY_EXIT = { restart:2, shutdown:3 };
  function power(action){
    hostLog("power request: " + action);
    post({ type:"power", action:action });
    if (caps.power) return;
    const code = LEGACY_EXIT[action];
    setTimeout(safe("powerFallback", () => {
      if (caps.power) return;
      if (code != null){
        hostLog("power " + action + ": host has no power channel, using legacy exit " + code);
        post({ type:"exit", code:code, target:"power:" + action });
      } else {
        toast("Sleep and sign out need host build v3 — this host has no power channel.");
        hostLog("power " + action + ": unsupported on this host build");
      }
    }), 900);
  }

  return { post, handle, power, caps, hostOwned, onSysinfo, get sys(){ return sysinfo; } };
})();

try{
  if (window.chrome && window.chrome.webview){
    window.chrome.webview.addEventListener("message", safe("hostMessage", (ev) => {
      let d = ev ? ev.data : null;
      if (typeof d !== "string"){ try{ d = JSON.stringify(d); }catch(e){ return; } }
      let m = null;
      try{ m = JSON.parse(d); }catch(e){ return; }
      Host.handle(m);
    }));

    /* Ask for the capability list now, because only now can we hear the
       answer.

       The host's shim posts {type:"ready"} at document-created time and the
       host replies with hostinfo immediately — but *this* listener does not
       exist until this inline script runs, a hundred-odd milliseconds later.
       A host->page message that lands before any listener is attached is not
       queued by WebView2; it is dropped. So on a slow first paint the reply
       is simply lost, and every Host.caps stays false on a host that has the
       lot: the About panel reports an older host than the one running, the
       fs/browser/system channels are declared missing, and Host.power()
       takes its legacy exit-code path instead of the power channel.

       It is intermittent, which is the worst version of it. On the bench,
       bench-v5-settings.log has the shim's ready at 04:55:40.886 and the
       page's "shell ready" at 04:55:41.011 with no hostinfo line at all,
       while bench-v5-rail.log got the reply 138 ms after ready and was fine.

       Sending "ready" rather than inventing a request verb is deliberate:
       every shipped host from v2 on answers "ready" with hostinfo, so this
       repairs the binaries already deployed instead of only the ones rebuilt
       from this tree. Handling it twice costs nothing — handle() just
       re-reads the same caps — so the unsolicited reply stays harmless on
       the runs where it does arrive in time. */
    hostLog("asking host for capabilities — page listener attached");
    Host.post({ type:"ready", target: location.href });
  }
}catch(e){ hostLog("could not attach host message listener: " + e); }

/* ═══ System-control client ══════════════════════════════
   The page's half of the SystemApi bridge.

     Sys.call("audio.setVolume", {level:.4})   -> Promise<data>
     Sys.job("wifi.scan", {}, {onProgress})    -> Promise<result>

   Three properties this has to have, because the alternative on a
   television is a screen that has silently stopped meaning anything:

   * Nothing here can freeze the shell. Every request is a message plus
     a callback; the host answers on its own thread. Slow commands come
     back immediately as a jobId and Sys.job polls them, so even a
     two-minute Windows Update search leaves the pad live throughout.
   * Every request has a deadline. A host that never answers produces a
     rejected promise with a sentence in it, not a spinner forever.
   * No failure is silent. Rejections carry .code and .detail from the
     OS, and Sys.say() turns both into something a human can act on —
     a bare HRESULT is never the only thing on screen. */
const Sys = (function(){
  let seq = 0;
  const pending = new Map();

  function err(code, detail, data){
    const e = new Error(detail || code);
    e.code = code || "error";
    e.detail = detail || "";
    if (data) e.data = data;
    return e;
  }

  /* Codes SystemApi returns that mean something specific to a human.
     Anything not listed falls back to the detail string, which the API
     writes in English on purpose. */
  const SAY = {
    wifi_unavailable:  "No Wi-Fi adapter found on this machine.",
    no_wifi_adapter:   "No Wi-Fi adapter found on this machine.",
    no_such_interface: "That wireless adapter is no longer present.",
    bt_unavailable:    "No Bluetooth radio found on this machine.",
    no_bt_radio:       "No Bluetooth radio found on this machine.",
    elevation_required:"This needs administrator rights, which the shell does not have.",
    access_denied:     "Windows refused this to the shell's account.",
    mode_not_supported:"The display rejected that mode, so nothing was changed.",
    hdr_unsupported:   "This display or its driver does not expose HDR to Windows.",
    no_search_yet:     "No update search has run yet in this session.",
    timeout:           "The host did not answer in time.",
    no_host:           "This page is not running inside the ARC OS host.",
    sys_unavailable:   "The host could not start its system-control thread.",
    unknown_command:   "This build of the host does not know that command.",
    host_too_old:      "The running host build has no system channel — it cannot read or change Windows.",
    bad_json:          "The host could not parse the request (a bug in the shell).",
    no_such_job:       "That background job is no longer known to the host."
  };

  /* One sentence, always. code + detail, never a bare HRESULT alone. */
  function say(e){
    if (!e) return "Unknown failure.";
    const code = e.code || "error";
    const head = SAY[code] || null;
    const detail = (e.detail || e.message || "").trim();
    if (head && detail && detail.toLowerCase() !== head.toLowerCase())
      return head + " (" + detail + ")";
    if (head) return head;
    if (detail) return detail + " [" + code + "]";
    return "Failed: " + code;
  }

  function call(cmd, args, opts){
    opts = opts || {};
    const ms = opts.timeout || 20000;
    return new Promise((resolve, reject) => {
      /* An older host answers nothing at all to {"type":"sys"} — it just
         logs it as unhandled. Waiting twenty seconds to discover that is
         not a failure mode worth having, and the host has already told us
         what it can do. Say it now, in one sentence, instead. */
      if (Host.caps.known && !Host.caps.sys){
        reject(err("host_too_old",
          "this host build answers pad and power but has no system channel; "
          + "'" + cmd + "' cannot be run until the shell is repointed at a host that has one"));
        return;
      }
      const id = "s" + (++seq);
      const msg = Object.assign({}, args || {}, { type:"sys", reqId:id, cmd:cmd });
      const rec = { resolve, reject, cmd };
      rec.timer = setTimeout(safe("sys timeout", () => {
        if (!pending.has(id)) return;
        pending.delete(id);
        hostLog("sys TIMEOUT " + cmd + " after " + ms + " ms");
        reject(err("timeout", "'" + cmd + "' did not answer within " + Math.round(ms / 1000) + " seconds"));
      }), ms);
      pending.set(id, rec);
      if (!Host.post(msg)){
        clearTimeout(rec.timer);
        pending.delete(id);
        reject(err("no_host", "no host bridge on this page — system settings need the ARC OS host"));
      }
    });
  }

  /* Called from Host.handle when a {"type":"sysres"} arrives. */
  function _settle(payload){
    try{
      if (!payload || typeof payload !== "object"){
        hostLog("sys response with no payload — dropped");
        return;
      }
      const id = payload.reqId;
      const rec = id ? pending.get(id) : null;
      if (!rec){
        /* A late answer to something that already timed out. Log it —
           silence here is how a "nothing happens" bug hides. */
        hostLog("sys response for unknown reqId '" + id + "' (late or duplicate) — dropped");
        return;
      }
      pending.delete(id);
      clearTimeout(rec.timer);
      if (payload.ok) rec.resolve(payload.data || {});
      else rec.reject(err(payload.error, payload.detail, payload.data));
    }catch(e){ report("sys settle", e); }
  }

  /* Start a job command and poll it to completion.
     onProgress({percent, phase, elapsedMs}) fires on every poll, so a
     panel can show real movement rather than an indeterminate wait. */
  function job(cmd, args, opts){
    opts = opts || {};
    const every = opts.pollMs || 700;
    const deadline = performance.now() + (opts.timeout || 150000);
    return call(cmd, args, { timeout: opts.startTimeout || 20000 }).then(d => {
      if (!d || !d.jobId) return d;               // not actually async on this build
      const jobId = d.jobId;
      if (opts.onStart) { try{ opts.onStart(jobId); }catch(e){} }
      return new Promise((resolve, reject) => {
        let stopped = false;
        const cancelled = () => opts.isCancelled && opts.isCancelled();
        function tick(){
          if (stopped) return;
          if (cancelled()){ stopped = true; reject(err("cancelled", "the panel moved on before the job finished")); return; }
          if (performance.now() > deadline){
            stopped = true;
            reject(err("timeout", "'" + cmd + "' was still running after "
              + Math.round((opts.timeout || 150000) / 1000) + " seconds"));
            return;
          }
          call("job.status", { jobId: jobId }, { timeout: 15000 }).then(j => {
            if (stopped) return;
            if (opts.onProgress){
              try{ opts.onProgress({ percent:j.percent|0, phase:j.phase || "", elapsedMs:j.elapsedMs|0 }); }
              catch(e){}
            }
            if (j.state === "running"){ setTimeout(tick, every); return; }
            stopped = true;
            if (j.state === "done") resolve(j.result || {});
            else if (j.state === "cancelled") reject(err("cancelled", "the job was cancelled"));
            else reject(err(j.error || "job_failed", j.detail || ("job ended in state '" + j.state + "'")));
          }).catch(e => { if (!stopped){ stopped = true; reject(e); } });
        }
        setTimeout(tick, 250);
      });
    });
  }

  function cancel(jobId){
    if (!jobId) return Promise.resolve({});
    return call("job.cancel", { jobId: jobId }, { timeout: 8000 }).catch(() => ({}));
  }

  return { call, job, cancel, say, _settle, get inflight(){ return pending.size; } };
})();

/* The pad the HOST is reading over raw HID — battery included, which no
   web API exposes. Resolves to null on a host that cannot answer, and
   the Controllers panel says so rather than leaving a blank. */
function padSnapshot(maxAgeMs){
  return new Promise(resolve => {
    if (padInfo && performance.now() - padInfoAt < (maxAgeMs || 2000)){ resolve(padInfo); return; }
    let done = false;
    padInfoWaiters.push(d => { if (!done){ done = true; resolve(d); } });
    Host.post({ type:"padinfo" });
    setTimeout(() => { if (!done){ done = true; resolve(padInfo); } }, 1200);
  });
}

/* ═══ Input device tracking ══════════════════════════════
   The hint bar teaches whichever device the human is actually
   holding. Synthetic keyboard events (isTrusted === false) come from
   the v2 shim translating pad input, so they count as pad, not key. */
const Input = (function(){
  let device = "pad";                 // the shipped device has no keyboard
  function set(d){
    if (d === device) return;
    device = d;
    hostLog("input device -> " + d);
    Hints.render();
  }
  function pad(action, phase, button){
    set("pad");
    return Nav.action(action, phase, button);
  }
  return { pad, set, get device(){ return device; } };
})();

/* ═══ On-screen keyboard bridge ══════════════════════════
   ArcOSK is a modal: while it is up it gets every action first and
   nothing behind it moves, even for actions it does not recognise.

   It is given the literal button rather than the shell's semantic
   action wherever the host tells us one, because the two disagree on
   purpose: L1/R1 switch views in the shell and move the text caret in
   the keyboard, Options opens the control centre in the shell and
   commits the field in the keyboard. ArcOSK's own alias table maps
   both spellings, so a host that sends only the semantic name still
   works — this just makes the shoulder buttons do the right thing.

   Directions are not given to beginRepeat(): the host is already the
   repeat authority for those and sends a stream of "repeat" phases.
   Square (backspace) is the one that wants holding, and the host does
   not auto-repeat face buttons, so that one is handed over properly. */
const OSK_HOLD = new Set(["square", "backspace"]);
const OSK = {
  isOpen(){
    try{ return !!(window.ArcOSK && window.ArcOSK.isOpen()); }
    catch(e){ return false; }
  },
  /* returns a string when it consumed the action, null when it did not */
  route(action, phase, button){
    if (!this.isOpen()) return null;
    const a = button || action;
    if (phase === "release"){
      try{ window.ArcOSK.endRepeat(); }catch(e){}
      return "osk: release";
    }
    if (phase === "press" && OSK_HOLD.has(a)){
      window.ArcOSK.beginRepeat(a);
      return "osk: " + a + " (hold to repeat)";
    }
    const took = window.ArcOSK.handleAction(a);
    return took ? ("osk: " + a) : ("osk: ignored " + a + " (modal, not passed through)");
  },
  open(cfg){
    if (!window.ArcOSK){
      toast("On-screen keyboard is not loaded — osk.js missing next to index.html.");
      hostLog("ArcOSK missing; cannot open '" + (cfg && cfg.title) + "'");
      return false;
    }
    hostLog("OSK open: " + (cfg && cfg.title));
    return window.ArcOSK.open(cfg);
  }
};

/* ═══ File explorer bridge ═══════════════════════════════
   ArcFiles is modal on exactly the same terms as ArcOSK, one layer
   further in: the keyboard can be up *over* the explorer (renaming a
   file), so the keyboard is still asked first and the explorer only
   sees what the keyboard did not take.

   Like the keyboard, it is handed the literal pad button where the
   host gives us one. The two vocabularies disagree deliberately —
   L1/R1 switch tabs on the home screen and page the list in the
   explorer, Square opens app details on the home screen and marks a
   file in the explorer — and ArcFiles' own alias table understands
   both spellings, so a host that only sends semantic names still
   works.

   Directions are not passed to beginRepeat(): the host owns repeat and
   sends a stream of "repeat" phases, and doubling that up would scroll
   at two different speeds at once. Nothing in the explorer wants a
   held face button (a long Cross would open a folder and then open
   whatever landed under the cursor inside it), so unlike the keyboard
   there is no hold set here at all — but endRepeat() is still called on
   release, because a host that does auto-repeat face buttons must not
   leave a timer running behind a closed explorer. */
const Files = (function(){

  /* ── The wire ────────────────────────────────────────────
     ArcFiles can auto-detect its own transport, and here it must not be
     allowed to. Its second probe is `chrome.webview.hostObjects.arcFiles`,
     and under WebView2 that check can never fail: hostObjects is a
     JavaScript Proxy that manufactures a property for any name asked of
     it, so a host object that was never registered is indistinguishable
     from one that was. Left to itself the explorer selects a bridge that
     does not exist and every command dies at call time with a COM error,
     instead of at detection time with a sentence a human can read. The
     bench log for the first v5 run says exactly that:
     "transport=hostObject connected=true" from a host that registered no
     such object.

     Even when the host object IS registered (--file-host-object) it is
     the wrong transport for this process. AddHostObjectToScript
     dispatches the call onto the host's UI thread, and FileApi blocks —
     one directory sweep and the television is frozen with a live pad
     going nowhere.

     So the shell hands the explorer a transport instead of letting it
     guess: the host's {type:"fs"} message channel, answered from a
     background worker thread. This is the same protocol files.js would
     have chosen third; writing it here is what makes the choice
     deterministic. */
  let seq = 0;
  const pending = new Map();
  const TIMEOUT = 45000;      // a sweep of a cold 2 TB disk is allowed to be slow

  function send(cmd){
    return new Promise((resolve, reject) => {
      const id = "fs-" + (++seq);
      cmd.reqId = id;                       // the host echoes it back inside the envelope
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("The host did not answer '" + (cmd.cmd || "?") + "' within "
                         + (TIMEOUT / 1000) + " seconds."));
      }, TIMEOUT);
      pending.set(id, { resolve, timer });
      if (!Host.post({ type:"fs", reqId:id, command:cmd })){
        clearTimeout(timer);
        pending.delete(id);
        reject(new Error("There is no host to ask. The file explorer needs the ShellHostWeb "
                       + "build that carries FileApi."));
      }
    });
  }

  /* Called by Host.handle for every {type:"fs.reply"}. The envelope is
     handed over as-is: ArcFiles reads .ok/.data/.error/.detail off it and
     turns a failure into prose itself, so nothing is interpreted here. */
  function settle(m){
    if (!m || !m.reqId) return;
    const p = pending.get(m.reqId);
    if (!p){ hostLog("fs: reply for unknown reqId " + m.reqId + " (timed out already?)"); return; }
    pending.delete(m.reqId);
    clearTimeout(p.timer);
    p.resolve(m);
  }

  let installed = false;
  function install(){
    if (installed || !window.ArcFiles) return installed;
    try{
      window.ArcFiles.setTransport(send);
      installed = true;
      hostLog("ArcFiles bridge: shell-supplied transport over the host's {type:\"fs\"} channel"
            + " (answered on the host's FileApi worker thread, not its UI thread)");
    }catch(err){ report("files setTransport", err); }
    return installed;
  }

  return {
    _settle: settle,
    install,

    isOpen(){
      try{ return !!(window.ArcFiles && window.ArcFiles.isOpen()); }
      catch(e){ return false; }
    },

    /* returns a string when it consumed the action, null when it did not */
    route(action, phase, button){
      if (!this.isOpen()) return null;
      const a = button || action;
      if (phase === "release"){
        try{ window.ArcFiles.endRepeat(); }catch(e){}
        return "files: release";
      }
      const took = window.ArcFiles.handleAction(a);
      return took ? ("files: " + a) : ("files: ignored " + a + " (modal, not passed through)");
    },

    open(cfg){
      if (!window.ArcFiles){
        toast("File explorer is not loaded — files.js missing next to index.html.");
        hostLog("ArcFiles missing; cannot open the explorer");
        return false;
      }
      if (!install()){
        toast("The file bridge could not be connected.");
        return false;
      }
      /* Only worth a line when the host actually told us its capabilities
         and "fs" was not among them. A host that never got its hostinfo
         through has said nothing either way, and guessing out loud would
         be a false alarm on a bridge that then works. Either way the
         explorer opens: its own error text is a better explanation than
         anything this can predict. */
      if (Host.caps.known && !Host.caps.fs)
        hostLog("Files: this host does not advertise the fs capability; opening anyway");
      hostLog("Files open");
      return window.ArcFiles.open(cfg);
    }
  };
})();

/* ═══ Browser bridge ═════════════════════════════════════
   ArcBrowser draws the browser's chrome in this WebView; the pages
   themselves live in a second WebView2 the host owns. From the
   shell's point of view it is one more modal layer, ordered
   between the keyboard (which can be up over it, to type an
   address) and the explorer (which cannot be up at the same time
   as it).

   Everything it needs from the shell it gets through one bridge
   object, handed over once at startup: how to reach the host, how
   to open the keyboard, and where to write a log line. That is the
   whole coupling — browser.js has no other knowledge of this file. */
const Browser = {
  ready: false,

  install(){
    if (this.ready || !window.ArcBrowser) return this.ready;
    ArcBrowser.attach({
      post:      (o) => Host.post(o),
      osk:       (cfg) => OSK.open(cfg),
      oskIsOpen: () => OSK.isOpen(),
      log:       (t) => hostLog(t),
      toast:     (t) => toast(t)
    });
    this.ready = true;
    hostLog("ArcBrowser " + (ArcBrowser.version || "?") + " attached");
    return true;
  },

  isOpen(){
    try{ return !!(window.ArcBrowser && ArcBrowser.isOpen()); }
    catch(e){ return false; }
  },

  /* returns a string when it consumed the action, null when it did not.
     The browser is modal: once it is up it takes everything, including
     actions it has no meaning for, because the home rail must not move
     underneath a web page. */
  route(action, phase, button){
    if (!this.isOpen()) return null;
    const a = button || action;
    const took = ArcBrowser.handleAction(a, phase);
    return took ? ("browser: " + a) : ("browser: passed " + a);
  },

  open(url){
    if (!window.ArcBrowser){
      toast("Browser is not loaded — browser.js missing next to index.html.");
      hostLog("ArcBrowser missing; cannot open the browser");
      return false;
    }
    if (Host.caps.known && !Host.caps.browser){
      toast("This host build has no browser channel.");
      hostLog("browser: host does not advertise the browser capability");
      return false;
    }
    this.install();
    hostLog("Browser open" + (url ? ": " + url : ""));
    return ArcBrowser.open({
      url: url || "",
      onExit: safe("browser exit", () => {
        hostLog("browser: closed, restoring shell focus");
        Focus.repaint();
      })
    });
  }
};

/* ═══ Focus manager ══════════════════════════════════════
   A stack of scopes. Each scope owns an ordered set of focusables
   carrying explicit grid metadata (data-nav="row,col"); "back" always
   means "pop this scope". Geometric position is only consulted when a
   focusable declares data-nav="auto", so a list never depends on
   guessing where its rows landed. */
const Focus = (function(){
  const stack = [];

  function top(){ return stack.length ? stack[stack.length - 1] : null; }
  function isLive(it){ return it.el.isConnected && it.el.getAttribute("aria-disabled") !== "true"; }
  function live(sc){ return sc.items.filter(isLive); }

  /* sc.index indexes sc.items, NOT the filtered live list. Indexing the
     filtered list looks tidier and is a trap: removing one node from the
     DOM silently renumbers every item after it, so the cursor jumps to a
     neighbour without anything having moved. If the focused item has
     gone away, take the nearest surviving one in declaration order. */
  function current(sc){
    sc = sc || top();
    if (!sc || !sc.items.length) return null;
    const it = sc.items[sc.index];
    if (it && isLive(it)) return it;
    for (let d = 1; d <= sc.items.length; d++){
      const after = sc.items[sc.index + d], before = sc.items[sc.index - d];
      if (after && isLive(after)) return after;
      if (before && isLive(before)) return before;
    }
    return null;
  }

  /* Collect focusables under a root. Explicit grid metadata wins;
     data-nav="auto" falls back to measured position, bucketed so
     items on the same visual line share a row. */
  function collect(root){
    const out = [];
    root.querySelectorAll("[data-nav]").forEach(el => {
      const raw = (el.getAttribute("data-nav") || "").trim();
      let r = NaN, c = NaN;
      if (raw && raw !== "auto"){
        const p = raw.split(",");
        r = parseFloat(p[0]); c = parseFloat(p[1]);
      }
      if (!isFinite(r) || !isFinite(c)){
        const b = el.getBoundingClientRect();
        r = Math.round(b.top / Math.max(8, b.height || 8));
        c = Math.round(b.left / 8);
      }
      out.push({ el, r, c });
    });
    out.sort((a, b) => (a.r - b.r) || (a.c - b.c));
    return out;
  }

  function indexOfEl(sc, el){
    for (let i = 0; i < sc.items.length; i++) if (sc.items[i].el === el) return i;
    return -1;
  }

  function push(sc){
    sc.items = sc.items || [];
    sc.index = sc.index || 0;
    stack.push(sc);
    hostLog("scope push " + sc.id + " (" + live(sc).length + " focusables, depth " + stack.length + ")");
    repaint();
    return sc;
  }

  function pop(){
    if (stack.length <= 1) return false;
    const sc = stack.pop();
    hostLog("scope pop " + sc.id + " -> " + (top() ? top().id : "(none)"));
    try{ if (sc.onPop) sc.onPop(); }catch(err){ report("scope " + sc.id + " onPop", err); }
    repaint();
    return true;
  }

  function popTo(id){
    let guard = 0;
    while (stack.length > 1 && top().id !== id && guard++ < 16) pop();
  }

  function replaceItems(sc, items, keepEl){
    syncItems(sc, items, keepEl);
    repaint();
  }

  /* Same thing without the repaint, for callers that are already inside
     one — an onFocus hook that rebuilds part of its own scope (the
     settings content pane) must not re-enter repaint(), which would
     call the hook again, and again. keepEl should be read BEFORE the
     caller touches the DOM. */
  function syncItems(sc, items, keepEl){
    const keep = keepEl || (current(sc) || {}).el;
    sc.items = items;
    const i = keep ? indexOfEl(sc, keep) : -1;
    sc.index = i >= 0 ? i : Math.min(sc.index, Math.max(0, items.length - 1));
  }

  function focusEl(el, silent){
    const sc = top(); if (!sc) return;
    const i = indexOfEl(sc, el);
    if (i < 0) return;
    sc.index = i;
    const it = sc.items[i];
    if (it){ sc.memo = sc.memo || {}; sc.memo[it.r] = it.c; }
    repaint(silent);
  }

  /* Directional step.

     Horizontal stays on its own row. Wrapping is opt-in per row —
     the rail has always wrapped, but a two-item row like Play/Media
     must not, or "left" visibly moves the cursor to the right.

     Vertical picks the nearest row in that direction, then the column
     it remembers for that row (falling back to the nearest column).
     The memory is what makes leaving the rail and coming back land on
     the tile you left rather than on the first one. */
  function move(dx, dy){
    const sc = top(); if (!sc) return false;
    const l = live(sc); if (!l.length) return false;
    const cur = current(sc); if (!cur) return false;
    sc.memo = sc.memo || {};

    /* A focusable may claim an axis for itself — a volume slider wants
       left/right to mean "quieter/louder", not "leave this row". It is
       a property on the element rather than a special case in here, so
       the focus manager still knows nothing about sliders. Returning
       true means consumed; the handler owns its own repaint. */
    if (typeof cur.el.__arcAdjust === "function"){
      try{
        if (cur.el.__arcAdjust(dx, dy) === true){
          /* Say what actually happened: "moved right" would be a lie in
             the trace when the press changed a value instead. */
          hostLog("adjust " + describe(cur.el) + " " + (dx > 0 ? "up" : "down"));
          return true;
        }
      }catch(err){ report("adjust " + describe(cur.el), err); return true; }
    }

    let best = null;

    sc.memoRow = sc.memoRow || {};

    if (dx && sc.crossColumns){
      /* Two-pane layouts (a settings category list beside its content
         pane) are two independent vertical lists that happen to sit
         side by side. Their row numbers are their own, so "same row"
         means nothing across them: move to the nearest column in the
         direction, landing on the row remembered for that column, or
         at its top the first time. */
      let col = null;
      for (const it of l){
        const dc = it.c - cur.c;
        if (Math.sign(dc) !== Math.sign(dx)) continue;
        if (col === null || Math.abs(dc) < Math.abs(col - cur.c)) col = it.c;
      }
      if (col !== null){
        const remembered = sc.memoRow[col];
        let bestD = Infinity;
        for (const it of l){
          if (it.c !== col) continue;
          if (remembered != null){
            const d = Math.abs(it.r - remembered);
            if (d < bestD){ bestD = d; best = it; }
          } else if (!best || it.r < best.r) best = it;
        }
      }
    } else if (dx){
      let bestD = Infinity;
      for (const it of l){
        if (it === cur || it.r !== cur.r) continue;
        const dc = it.c - cur.c;
        if (Math.sign(dc) !== Math.sign(dx)) continue;
        if (Math.abs(dc) < bestD){ bestD = Math.abs(dc); best = it; }
      }
      const wraps = sc.wrapX === true || (Array.isArray(sc.wrapX) && sc.wrapX.indexOf(cur.r) >= 0);
      if (!best && wraps){
        for (const it of l){
          if (it === cur || it.r !== cur.r) continue;
          if (!best || (dx > 0 ? it.c < best.c : it.c > best.c)) best = it;
        }
      }
    } else {
      // In a two-pane scope, up/down stays inside the pane it is in.
      const lock = !!sc.crossColumns;
      let row = null;
      for (const it of l){
        if (lock && it.c !== cur.c) continue;
        const dr = it.r - cur.r;
        if (Math.sign(dr) !== Math.sign(dy)) continue;
        if (row === null || Math.abs(dr) < Math.abs(row - cur.r)) row = it.r;
      }
      if (row === null && sc.wrapY){
        for (const it of l){
          if (lock && it.c !== cur.c) continue;
          if (it.r === cur.r) continue;
          if (row === null || (dy > 0 ? it.r < row : it.r > row)) row = it.r;
        }
      }
      if (row !== null){
        const want = lock ? cur.c : (sc.memo[row] != null ? sc.memo[row] : cur.c);
        let bestD = Infinity;
        for (const it of l){
          if (it.r !== row) continue;
          if (lock && it.c !== cur.c) continue;
          const d = Math.abs(it.c - want);
          if (d < bestD){ bestD = d; best = it; }
        }
      }
    }
    if (!best) return false;

    sc.memo[best.r] = best.c;
    sc.memoRow[best.c] = best.r;
    sc.index = indexOfEl(sc, best.el);
    repaint();
    return true;
  }

  function activate(){
    const sc = top(); if (!sc) return "no scope";
    const it = current(sc); if (!it) return "nothing focused";
    if (it.el.getAttribute("aria-disabled") === "true") return "focused item is disabled";
    if (sc.activate){
      const r = sc.activate(it);
      if (r !== false) return r || ("activated " + describe(it.el));
    }
    const act = it.el.dataset.act;
    if (act && ACT[act]){ ACT[act](it.el, it); return "activated " + describe(it.el); }
    return "no action bound to " + describe(it.el);
  }

  function back(){
    const sc = top();
    if (sc && sc.onBack){
      const r = sc.onBack();
      if (r !== false) return r || ("left " + sc.id);
    }
    if (stack.length > 1){ const id = sc.id; pop(); return "left " + id; }
    return "already at the shell root";
  }

  function describe(el){
    return (el.id ? "#" + el.id : "") + (el.dataset.label ? " " + el.dataset.label : "")
         + (!el.id && !el.dataset.label ? (el.className || el.tagName) : "");
  }

  function ensureVisible(el){
    try{
      if (!el.scrollIntoView) return;
      el.scrollIntoView({ block:"nearest", inline:"nearest", behavior: RM ? "auto" : "smooth" });
    }catch(e){
      try{ el.scrollIntoView(false); }catch(e2){}
    }
  }

  let lastKey = "";
  function repaint(silent){
    try{
      document.querySelectorAll("[data-focus]").forEach(e => e.removeAttribute("data-focus"));
      stack.forEach((sc, i) => {
        const it = current(sc);
        if (!it) return;
        sc.index = indexOfEl(sc, it.el);          // normalise after any DOM churn
        it.el.setAttribute("data-focus", i === stack.length - 1 ? "on" : "stale");
      });
      const sc = top(); if (!sc) return;
      const it = current(sc);
      if (it){
        if (sc.onFocus) sc.onFocus(it);
        else ensureVisible(it.el);
        try{ it.el.focus({ preventScroll:true }); }catch(e){}
        const key = sc.id + "|" + describe(it.el);
        if (!silent && key !== lastKey){ lastKey = key; hostLog("focus " + key); }
      }
      Hints.render();
    }catch(err){ report("focus repaint", err); }
  }

  return { push, pop, popTo, top, current, collect, move, activate, back, focusEl,
           replaceItems, syncItems, repaint, ensureVisible, depth: () => stack.length,
           has: (id) => stack.some(s => s.id === id) };
})();

/* ═══ Hint bar ═══════════════════════════════════════════
   The tutorial surface: it shows what is valid *here*, and it is
   right by construction because it is rendered from the scope. */
const Hints = (function(){
  function chip(id){
    const h = HINTS[id];
    if (!h) return "";
    const marks = Input.device === "pad"
      ? h.pad.map(glyphSVG).join("")
      : h.key.map(k => '<span class="key">' + k + "</span>").join("");
    if (!marks) return "";
    return '<span class="hint"><span class="hint-glyphs">' + marks + "</span>" + h.label + "</span>";
  }
  /* Only the chips are re-rendered. #btnReplay is a real focusable and
     must survive, so it is static markup that never gets replaced. */
  function render(){
    try{
      const sc = Focus.top();
      const ids = (sc && sc.hints) || [];
      $("#hintChips").innerHTML = ids.map(chip).join("");
      const rk = $("#replayKey");
      if (rk) rk.style.display = Input.device === "pad" ? "none" : "";
    }catch(err){ report("hint render", err); }
  }
  return { render, chip };
})();

/* ═══ Shell state ════════════════════════════════════════ */
let tab = "play", idx = 0, artFlip = 0;

function remPx(){
  const v = parseFloat(getComputedStyle(document.documentElement).fontSize);
  return isFinite(v) && v > 0 ? v : 16;
}
/* Computed, not measured: every tile ahead of the focused one is at its
   collapsed width, so the offset is exact even while widths are still
   animating — measuring offsetLeft mid-transition reads the old layout.
   The tokens are unitless multipliers of 1rem so this survives scaling. */
function railStep(){
  const cs = getComputedStyle(document.documentElement);
  const t = parseFloat(cs.getPropertyValue("--tile-u"));
  const g = parseFloat(cs.getPropertyValue("--gap-u"));
  return ((isFinite(t) ? t : 7.375) + (isFinite(g) ? g : 1)) * remPx();
}
function centre(){
  $("#rail").style.transform = `translateX(${-(idx * railStep())}px)`;
}

function artCSS(key){
  const [a, b] = G[key];
  return `radial-gradient(120% 100% at 18% 8%, ${a}88 0%, ${a}22 38%, transparent 66%),`
       + `radial-gradient(90% 80% at 78% 0%, ${b}cc 0%, transparent 60%),`
       + `linear-gradient(180deg, ${a}2e 0%, transparent 55%)`;
}
function tileCSS(key){
  const [a, b] = G[key];
  return `radial-gradient(120% 120% at 22% 12%, ${a} 0%, ${b} 68%),linear-gradient(160deg,${a},${b})`;
}

function buildRail(){
  const rail = $("#rail");
  rail.innerHTML = "";
  APPS[tab].forEach((app, i) => {
    const t = document.createElement("button");
    t.className = "tile";
    t.setAttribute("aria-current", i === idx ? "true" : "false");
    t.setAttribute("aria-label", app.name);
    t.setAttribute("data-nav", "3," + i);
    t.dataset.act = "railPick";
    t.dataset.label = "tile:" + app.id;
    t.innerHTML =
      `<div class="tile-art" style="background:${tileCSS(app.art)}"></div>` +
      `<div class="tile-sheen"></div>` +
      `<div class="tile-glyph"><svg viewBox="0 0 24 24">${ICON[app.icon]}</svg></div>` +
      `<div class="tile-name">${app.name}</div>` +
      (app.badge ? `<span class="tile-badge">${app.badge}</span>` : "");
    t.addEventListener("click", safe("tile click", (ev) => {
      if (ev.detail === 0) return;
      Input.set("key");
      selectTile(i);
      Focus.focusEl(t);
    }));
    rail.appendChild(t);
  });
  centre();
}

/* The rail's own selection. Deliberately NOT called select(): the v2
   shim owns the global name window.select, and a function declaration
   of the same name would be replaced by that adapter — which then
   calls itself. */
function selectTile(i, instant){
  const list = APPS[tab];
  idx = (i + list.length) % list.length;
  [...$("#rail").children].forEach((t, n) =>
    t.setAttribute("aria-current", n === idx ? "true" : "false"));
  requestAnimationFrame(centre);
  paintHero(list[idx], instant);
  rememberRow(3, idx);
}

/* Keep the home scope's column memory honest: arriving at the tab row
   from below should land on the tab that is actually selected, and
   arriving at the rail should land on the tile that is actually
   current — not on wherever the cursor happened to be two rows up. */
function rememberRow(row, col){
  if (!homeScope) return;
  homeScope.memo = homeScope.memo || {};
  homeScope.memo[row] = col;
}

function paintHero(app, instant){
  // crossfade the background art between two stacked layers
  const next = artFlip ? $("#art0") : $("#art1");
  const prev = artFlip ? $("#art1") : $("#art0");
  next.style.background = artCSS(app.art);
  next.classList.add("on");
  prev.classList.remove("on");
  artFlip ^= 1;

  const swap = $("#heroSwap");
  const write = safe("paintHero", () => {
    $("#heroEyebrow").textContent = app.eyebrow;
    $("#heroTitle").textContent   = app.title;
    $("#heroDesc").textContent    = app.desc;
    $("#launchLabel").textContent = app.action;
    $("#heroMeta").innerHTML = app.meta
      .map((m, n) => `<span class="chip${app.live === n ? " live" : ""}">${m}</span>`)
      .join("");
    swap.classList.remove("out");
  });
  if (instant || RM) { write(); return; }
  swap.classList.add("out");
  setTimeout(write, 180);
}

function setTabTo(name){
  if (!APPS[name] || name === tab) return;
  /* Decide the landing spot before buildRail() destroys every tile. */
  const focused = Focus.top() === homeScope ? (Focus.current(homeScope) || {}).el : null;
  const keep = focused && focused.classList.contains("tile") ? null : focused;

  tab = name; idx = 0;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  buildRail();
  paintHero(APPS[tab][0]);
  rememberRow(1, tab === "play" ? 0 : 1);
  rememberRow(3, 0);
  refreshHomeItems(keep);
}

/* ── The home scope ───────────────────────────────────────
   Four logical rows: status-bar buttons, tabs, hero actions, rail.
   Up/down crosses them, left/right walks within one. The rail wraps
   because a console rail always has. */
function homeItems(){
  return Focus.collect($("#shell"));
}
/* anchorEl may be passed explicitly by a caller that is about to
   destroy the currently focused node (a tab switch rebuilds the whole
   rail): the anchor has to be decided before the DOM changes, not
   read back out of it afterwards. Anything unusable lands on the
   rail's current selection rather than falling off the end. */
function refreshHomeItems(anchorEl){
  const sc = homeScope;
  if (!sc) return;
  let anchor = arguments.length ? anchorEl
             : (Focus.top() === sc ? (Focus.current(sc) || {}).el : null);
  if (!anchor || !anchor.isConnected) anchor = $("#rail").children[idx] || null;
  Focus.replaceItems(sc, homeItems(), anchor);
}

const homeScope = {
  id: "home",
  items: [],
  index: 0,
  wrapX: [3],                                    // only the rail wraps
  memo: { 1:0, 3:0 },                            // active tab, current tile
  hints: ["navAll", "launch", "tabs", "cc", "appOpt"],
  onFocus(it){
    const el = it.el;
    if (el.classList.contains("tile")){
