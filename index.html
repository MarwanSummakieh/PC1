              () => { toast("Output switched to " + o.shortName + "."); Focus.pop(); openPanel("sound"); },
              e  => toast(Sys.say(e)));
          }
        }));
        ctx.row({ label:"All sound settings", sub:"Opens Settings → Sound", icon:"gear",
                  run: () => ACT.settingsCatId("sound") });
      }).catch(e => { ctx.err("The mixer could not be read", e); }));
    return { node };
  },

  mic(){
    const node = panelShell("Microphone", "The Windows capture endpoint — the real one, not a shell flag.");
    fillAsync(node, "mic", (ctx) =>
      Sys.call("audio.devices").then(a => {
        const ins = a.inputs || [];
        const cur = ins.filter(o => o.isDefault)[0] || ins[0];
        if (!cur){
          ctx.stat("Windows reports no active capture device.", "bad");
          ctx.note("Nothing to mute: this machine has <b>no active microphone endpoint</b>. " +
            "A headset or a webcam would make one appear.");
          return;
        }
        ctx.facts([
          ["Device", cur.name],
          ["Level",  Math.round((cur.volume || 0) * 100) + "%"],
          ["State",  cur.muted ? "Muted" : "Live"]
        ]);
        ctx.row({ label: cur.muted ? "Unmute the microphone" : "Mute the microphone",
                  sub:"Sets mute on the endpoint itself, so every app sees it",
                  tailHTML: cur.muted ? tagHTML("muted", "warn") : tagHTML("live", "on"),
                  icon:"info",
                  run: () => Sys.call("audio.setMute", { id:cur.id, flow:"input", muted:!cur.muted }, { timeout:8000 })
                    .then(() => { toast(cur.muted ? "Microphone unmuted." : "Microphone muted."); Focus.pop(); openPanel("mic"); },
                          e  => toast(Sys.say(e))) });
        ctx.slider({
          label:"Input level", value:cur.volume || 0, step:0.05,
          hint:"Left and right adjust · " + cur.shortName,
          commit(v){ return Sys.call("audio.setVolume", { id:cur.id, flow:"input", level:v }, { timeout:8000 }); }
        });
      }).catch(e => { ctx.err("The capture endpoint could not be read", e); }));
    return { node };
  }
};

/* Fill a control-centre panel from the OS after it is already on
   screen. The panel opens instantly with a spinner rather than waiting
   on the system — a control centre that stalls before it appears is
   worse than one that fills in. */
function fillAsync(node, panelId, fn){
  const body = node.querySelector(".panel-body");
  const loading = statEl("Reading…", null, true);
  body.appendChild(loading);
  let n = 0;
  const ctx = {
    alive(){ return body.isConnected; },
    add(el){ if (el) body.appendChild(el); return el; },
    facts(pairs){ return ctx.add(factsEl(pairs)); },
    sec(t){ const e = document.createElement("h4"); e.textContent = t; return ctx.add(e); },
    stat(t, k, s){ return ctx.add(statEl(t, k, s)); },
    note(h){ return ctx.add(noteEl(h)); },
    err(t, e){ return ctx.add(errEl(t, e)); },
    row(o){ return ctx.add(actionRow(o, n++, 0)); },
    slider(o){ return ctx.add(sliderRow(o, n++, 0)); },
    sync(){
      const sc = Focus.top();
      if (!sc || sc.id !== "panel:" + panelId) return;
      Focus.syncItems(sc, Focus.collect(node), (Focus.current(sc) || {}).el);
      Focus.repaint();
    }
  };
  Promise.resolve()
    .then(() => fn(ctx))
    .then(() => { loading.remove(); if (ctx.alive()) ctx.sync(); })
    .catch(err => {
      loading.remove();
      if (!ctx.alive()) return;
      report("panel " + panelId + " content", err);
      ctx.err("This panel could not be read", err);
      ctx.sync();
    });
  return ctx;
}

/* ═══ The nine settings categories ═══════════════════════
   Each one owns an async build(ctx) that reads the machine through
   Sys and writes what it finds. The rules every category obeys:

     * a value on screen was read from this machine, or it is labelled;
     * a control that cannot work here is absent or says why, never a
       button that fails when pressed;
     * a failure renders as a sentence, not as an empty section.       */

const SET_CATS = [

  /* ── 1. Network ─────────────────────────────────────────
     The bench is wired with no Wi-Fi radio at all, so the
     "no adapter" path is a first-class state here, not an error. */
  { id:"network", label:"Network", sub:"Wi-Fi, wired, address", icon:"info",
    blurb:"Connection state read from Windows. Wi-Fi controls appear only if this machine has a radio.",
    build(ctx){
      const loading = ctx.stat("Reading network state…", null, true);
      return Sys.call("net.status").then(net => {
        if (!ctx.alive()) return;
        loading.remove();

        const r = net.reachability || {};
        const adapters = (net.adapters || []).filter(a => a.up && !a.isVirtual);
        const primary = adapters.filter(a => a.routable)[0] || adapters[0] || null;

        ctx.sec("Connection");
        ctx.facts([
          ["Internet", r.internet ? "Reachable" : (r.connected ? "Local network only" : "Not connected")],
          ["Type",     net.connectionType === "wifi" ? "Wi-Fi" : (net.connectionType === "ethernet" ? "Wired Ethernet" : orDash(net.connectionType))],
          ["Adapter",  primary ? primary.name : "— none up"],
          ["Hardware", primary ? primary.description : "—"],
          ["IPv4",     primary && primary.ipv4 && primary.ipv4[0] ? (primary.ipv4[0].address + "/" + primary.ipv4[0].prefixLength) : "—"],
          ["Gateway",  primary && primary.gateways && primary.gateways[0] ? primary.gateways[0] : "—"],
          ["DNS",      primary && primary.dns && primary.dns.length ? primary.dns.slice(0, 2).join(", ") : "—"],
          ["Link speed", primary ? orDash(primary.linkSpeedText) : "—"],
          ["Host name", orDash(net.hostName)]
        ]);

        ctx.row({ label:"All adapters", sub:(net.adapters || []).length + " known to Windows, including virtual ones",
                  icon:"info", run: () => showAdapters(net) });

        return Sys.call("wifi.status").then(w => ({ w:w, net:net }), e => ({ err:e, net:net }));
      }).then(res => {
        if (!ctx.alive() || !res) return;
        ctx.sec("Wi-Fi");

        /* The two ways there is no Wi-Fi: the WLAN service refused us
           (wifi_unavailable) or it answered with no interfaces. Both
           are ordinary states on a wired console, and both say so. */
        const noRadio = res.err
          ? (res.err.code === "wifi_unavailable" || res.err.code === "no_wifi_adapter")
          : !(res.w && res.w.present && (res.w.interfaces || []).length);

        if (noRadio){
          ctx.stat("No Wi-Fi adapter found on this machine.", "bad");
          ctx.note("This console is on <b>wired Ethernet</b> and has no wireless radio, so there is nothing to scan, " +
            "connect to or forget. Wi-Fi controls are hidden rather than shown as buttons that would fail.");
          if (res.err && res.err.code !== "wifi_unavailable" && res.err.code !== "no_wifi_adapter")
            ctx.err("Windows reported", res.err);
          return;
        }
        if (res.err){ ctx.err("Wi-Fi state could not be read", res.err); return; }

        const iface = (res.w.interfaces || [])[0] || {};
        const conn = iface.connection || null;
        ctx.facts([
          ["Adapter",  orDash(iface.description)],
          ["State",    orDash(iface.state)],
          ["Network",  conn && conn.connected ? conn.ssid : "not associated"],
          ["Security", conn && conn.connected ? orDash(conn.security) : "—"],
          ["Signal",   conn && conn.connected ? (conn.signal + "%  (" + conn.rssiDbm + " dBm)") : "—"],
          ["Rate",     conn && conn.connected && conn.rxRateKbps ? Math.round(conn.rxRateKbps / 1000) + " Mbps" : "—"]
        ]);

        ctx.row({ label:"Available networks", sub:"Scan for networks in range and join one",
                  icon:"info", run: () => wifiBrowser() });
        ctx.row({ label:"Saved networks",
                  sub:(iface.savedProfiles || []).length + " profile" + ((iface.savedProfiles || []).length === 1 ? "" : "s") + " stored on this machine",
                  icon:"disk", run: () => wifiProfiles(iface.savedProfiles || []) });
        if (conn && conn.connected)
          ctx.row({ label:"Disconnect from " + conn.ssid, sub:"Drops the wireless association; wired links are untouched",
                    icon:"signout", tone:"danger",
                    run: () => confirmAction({
                      id:"wifi-disconnect", title:"Disconnect from " + conn.ssid + "?",
                      sub:"Anything using this connection loses it immediately.",
                      goLabel:"Disconnect",
                      onConfirm: () => Sys.call("wifi.disconnect").then(
                        () => { toast("Disconnected from " + conn.ssid + "."); if (settingsRepaint) settingsRepaint(); },
                        e  => toast(Sys.say(e)))
                    }) });
      });
    } },

  /* ── 2. Display ─────────────────────────────────────────
     Every mode change goes through confirm-or-revert. On a television
     a bad mode is a black screen with no way back, so the default
     answer is always "put it back". */
  { id:"display", label:"Display", sub:"Resolution, refresh, HDR", icon:"info",
    blurb:"Read from Windows through the display configuration API. Mode changes revert themselves unless you confirm.",
    build(ctx){
      const loading = ctx.stat("Reading displays…", null, true);
      return Sys.call("display.list").then(d => {
        if (!ctx.alive()) return;
        loading.remove();
        const list = d.displays || [];
        if (!list.length){ ctx.stat("Windows reported no displays.", "bad"); return; }

        list.forEach(m => {
          ctx.sec(m.name ? m.name : ("Display " + (m.index + 1)));
          const hdr = m.hdr || {};
          ctx.facts([
            ["Connection",  orDash(m.connection)],
            ["Resolution",  orDash(m.resolution)],
            ["Refresh",     fmtHz(m.refreshHz)],
            ["Scale",       m.scalePercent ? m.scalePercent + "%  (" + m.dpi + " DPI)" : "—"],
            ["Position",    m.positionX + ", " + m.positionY + (m.primary ? "  (primary)" : "")],
            ["HDR",         !hdr.queryable ? "not exposed by this driver"
                            : (!hdr.supported ? "not supported by this display"
                            : (hdr.enabled ? "On" : "Off"))],
            ["Colour",      (hdr.colorEncoding || "—") + (hdr.bitsPerColorChannel ? "  " + hdr.bitsPerColorChannel + "-bit" : "")]
          ]);

          ctx.row({ label:"Resolution and refresh rate",
                    sub:"Pick a mode — it reverts automatically unless you confirm it",
                    tail:m.resolution + " @ " + Math.round(m.refreshHz) + " Hz",
                    icon:"info", run: () => displayModePicker(m) });

          if (hdr.queryable && hdr.supported){
            ctx.row({ label:hdr.enabled ? "Turn HDR off" : "Turn HDR on",
                      sub:"Toggles Windows advanced colour for this display",
                      tail:hdr.enabled ? "On" : "Off", icon:"paint",
                      run: () => Sys.call("display.setHdr", { display:m.gdiName, enabled:!hdr.enabled }, { timeout:20000 })
                        .then(() => { toast("HDR " + (hdr.enabled ? "off" : "on") + "."); if (settingsRepaint) settingsRepaint(); },
                              e => toast(Sys.say(e))) });
          } else {
            ctx.stat(hdr.queryable
              ? "HDR: this display reports advanced colour as unsupported, so there is nothing to switch."
              : "HDR: this driver does not expose advanced colour to Windows.", "bad");
          }
        });

        ctx.sec("As the page sees it");
        ctx.facts(displayFacts());
        ctx.row({ label:"Re-measure the page", sub:"Re-read the viewport and time the real refresh rate",
                  icon:"update", run: () => { measureHz(); setTimeout(() => { if (settingsRepaint) settingsRepaint(); }, 700); } });
      });
    } },

  /* ── 3. Sound ───────────────────────────────────────────── */
  { id:"sound", label:"Sound", sub:"Output device, volume", icon:"info",
    blurb:"The Windows mixer, live. The volume slider is adjusted with left and right.",
    build(ctx){
      const loading = ctx.stat("Reading audio endpoints…", null, true);

      /* The shell's cues are synthesised in the page and owe nothing to the
         Windows mixer, so this is a function called on both the success and
         the failure path rather than a block buried in the success one: a
         machine whose audio endpoints cannot be read must still be able to
         turn the shell's own clicks down. */
      const shellSound = () => {
        if (!(window.ArcSfx && window.ArcFeel)) return;
        ctx.sec("Shell sound");
        ctx.stat("The shell's own cues. Synthesised in the page, so there are no sound files on this "
          + "machine to go missing and nothing to load before the first click.", null);
        const ui = ctx.slider({
          label:"UI sound", value: ArcSfx.volume, muted: ArcSfx.muted, step:0.05,
          hint:"Left and right adjust · Cross mutes · every change plays itself",
          commit(v){ ArcSfx.setVolume(v); ArcFeel.play("activate"); return Promise.resolve(); },
          activate(el){
            const next = !ArcSfx.muted;
            ArcSfx.setMuted(next);
            el.__arcSetMuted(next);
            if (!next) ArcFeel.play("activate");
            toast(next ? "Shell sound muted." : "Shell sound on.");
          }
        });
        ui.setAttribute("aria-label", "UI sound volume");
        ctx.row({ label:"Follow the Windows volume",
                  sub:"Cues track the system level and go silent when Windows is muted",
                  tailHTML: ArcSfx.followsSystem ? tagHTML("on", "on") : tagHTML("off"),
                  icon:"info",
                  run: () => { const n = !ArcSfx.followsSystem;
                               ArcSfx.setFollowsSystem(n); ArcFeel.toggle(n);
                               toast(n ? "Following the system volume." : "Independent of the system volume.");
                               if (settingsRepaint) settingsRepaint(); } });
        ctx.row({ label:"Play the boot signature",
                  sub:"The cue the shell resolves on as the home screen wipes in",
                  icon:"info", run: () => ArcFeel.play("bootDone") });
      };

      return Sys.call("audio.devices").then(a => {
        if (!ctx.alive()) return;
        loading.remove();
        const outs = a.outputs || [];
        const cur = outs.filter(o => o.isDefault)[0] || outs[0] || null;

        /* Devices first, volume second — deliberately. Crossing into this
           pane from the category list lands on the first row, and that
           first row must be one where "left" still means "go back",
           not one where it means "quieter". */
        ctx.sec("Output devices");
        if (!outs.length) ctx.stat("No active output endpoints.", "bad");
        outs.forEach(o => {
          ctx.row({
            label:o.name, sub:(o.formFactor || "Endpoint") + " · " + Math.round((o.volume || 0) * 100) + "%"
                 + (o.muted ? " · muted" : ""),
            tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
            icon:"info",
            run: () => {
              if (o.isDefault){ toast(o.shortName + " is already the default output."); return; }
              Sys.call("audio.setDefault", { id:o.id, flow:"output", role:"all" }, { timeout:12000 }).then(
                () => { toast("Output switched to " + o.shortName + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)));
            }
          });
        });

        ctx.sec("Volume");
        if (!cur){
          ctx.stat("Windows reports no active output device.", "bad");
        } else {
          const sl = ctx.slider({
            label:"Volume", value: typeof cur.volume === "number" ? cur.volume : 0,
            muted: !!cur.muted, step:0.05,
            hint:"Left and right adjust · Cross toggles mute · " + cur.shortName,
            commit(v){ return Sys.call("audio.setVolume", { id:cur.id, level:v }, { timeout:8000 }); },
            activate(el){
              const next = !cur.muted;
              Sys.call("audio.setMute", { id:cur.id, muted:next }, { timeout:8000 }).then(() => {
                cur.muted = next;
                el.__arcSetMuted(next);
                toast(next ? "Output muted." : "Output unmuted.");
              }, e => toast(Sys.say(e)));
            }
          });
          sl.setAttribute("aria-label", "Volume");
        }

        const ins = a.inputs || [];
        ctx.sec("Input");
        if (!ins.length) ctx.stat("No active capture endpoints.", "bad");
        ins.forEach(o => {
          ctx.row({
            label:o.name, sub:(o.formFactor || "Endpoint") + " · " + Math.round((o.volume || 0) * 100) + "%"
                 + (o.muted ? " · muted" : ""),
            tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
            icon:"info",
            run: () => {
              if (o.isDefault){
                const next = !o.muted;
                Sys.call("audio.setMute", { id:o.id, flow:"input", muted:next }, { timeout:8000 }).then(
                  () => { toast(next ? "Microphone muted." : "Microphone unmuted."); if (settingsRepaint) settingsRepaint(); },
                  e  => toast(Sys.say(e)));
                return;
              }
              Sys.call("audio.setDefault", { id:o.id, flow:"input", role:"all" }, { timeout:12000 }).then(
                () => { toast("Input switched to " + o.shortName + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)));
            }
          });
        });

        /* The shell's cues sit under whatever the television is doing, and this
           pane is the only place that already knows the Windows level. */
        if (window.ArcSfx && cur) ArcSfx.setSystemVolume(cur.volume, cur.muted);
        shellSound();
      }, e => { loading.remove(); ctx.err("Audio endpoints could not be read", e); shellSound(); });
    } },

  /* ── 4. Controllers ─────────────────────────────────────
     Two independent views: what the host's raw-HID reader has (which
     is where the battery comes from) and what Bluetooth knows. The
     bench has no Bluetooth hardware, so that half says so. */
  { id:"pad", label:"Controllers", sub:"Pads, battery, Bluetooth", icon:"pad",
    blurb:"The pad this shell is reading, and the Bluetooth radio it would pair new ones with.",
    build(ctx){
      const loading = ctx.stat("Reading controllers…", null, true);
      return padSnapshot(0).then(p => {
        if (!ctx.alive()) return;
        loading.remove();
        ctx.sec("Connected pad");
        if (p && p.connected){
          const facts = [
            ["Model",     orDash(p.model)],
            ["Connection", p.transport === "BT" ? "Bluetooth" : (p.transport === "USB" ? "USB cable" : orDash(p.transport))],
            ["Hardware ID", "VID 0x" + (p.vid || 0).toString(16).toUpperCase().padStart(4, "0")
                          + " · PID 0x" + (p.pid || 0).toString(16).toUpperCase().padStart(4, "0")],
            ["Input reports", (p.reports || 0).toLocaleString() + " read"]
          ];
          facts.splice(2, 0, ["Battery", p.batteryKnown
            ? ("~" + p.batteryPercent + "%  ·  " + p.batteryState)
            : "not reported by this pad's report layout"]);
          ctx.facts(facts);
          if (p.batteryKnown)
            ctx.stat("Battery is read from the pad's own input report and is approximate — it has eleven steps, not a hundred.", null);
        } else {
          ctx.stat(p ? ("No pad on the host's HID channel — " + orDash(p.status)) : "The host did not report a pad.", "bad");
        }

        ctx.sec("Seen by the page");
        ctx.facts(padFacts());
        ctx.row({ label:"Re-read the controller", sub:"Ask the host for a fresh HID snapshot",
                  icon:"update", run: () => { padInfoAt = -1e9; if (settingsRepaint) settingsRepaint(); } });

        /* ── Vibration ──────────────────────────────────────────
           Reported, not assumed: the host says whether it has a write handle
           to the pad and how many output reports it has actually placed, so
           a pad that silently refuses them says so instead of leaving a
           switch that appears to work. */
        if (window.ArcFeel){
          ctx.sec("Vibration");
          const h = (p && p.haptic) || null;
          if (!h) ctx.stat("This host build has no haptic channel.", "bad");
          else if (!h.ready) ctx.stat("No write channel to the pad — " + (h.status || "not started") + ".", "bad");
          else ctx.stat("The host is writing " + h.outputLength + "-byte output reports over "
            + (p.transport === "BT" ? "Bluetooth" : "USB") + ": " + h.writes + " sent, "
            + h.failures + " refused.", null);

          const vs = ctx.slider({
            label:"Vibration strength", value: ArcFeel.hapticLevel, muted: !ArcFeel.hapticEnabled, step:0.05,
            hint:"Left and right adjust · Cross turns it off · every change is played on the pad",
            commit(v){ ArcFeel.setHapticLevel(v); ArcFeel.haptic("test"); return Promise.resolve(); },
            activate(el){
              const next = !ArcFeel.hapticEnabled;
              ArcFeel.setHapticEnabled(next);
              el.__arcSetMuted(!next);
              if (next) ArcFeel.haptic("test");
              toast(next ? "Vibration on." : "Vibration off.");
            }
          });
          vs.setAttribute("aria-label", "Vibration strength");
          ctx.row({ label:"Test the vibration", sub:"One pulse on each motor in turn",
                    icon:"pad", run: () => { ArcFeel.haptic("test"); toast("Sent a test pulse to the pad."); } });
        }

        return Sys.call("bt.status").then(b => b, e => ({ __err:e }));
      }).then(b => {
        if (!ctx.alive() || !b) return;
        ctx.sec("Bluetooth");
        if (b.__err){ ctx.err("Bluetooth state could not be read", b.__err); return; }
        if (!b.present){
          ctx.stat("No Bluetooth radio found on this machine.", "bad");
          ctx.note("This console has <b>no Bluetooth hardware</b>, so pairing controls are hidden rather than " +
            "offered as buttons that would fail. A wired pad works regardless, and a USB Bluetooth adapter " +
            "would make this section appear.");

        ctx.facts([
          ["Radio",   b.enabled ? "On" : "Off"],
          ["Adapter", (b.radios && b.radios[0] && b.radios[0].name) ? b.radios[0].name : "—"],
          ["Address", (b.radios && b.radios[0] && b.radios[0].address) ? b.radios[0].address : "—"],
          ["Control", orDash(b.radioControl)]
        ]);
        ctx.row({ label:b.enabled ? "Turn Bluetooth off" : "Turn Bluetooth on",
                  sub:"Switches the radio through the Windows radio manager",
                  tailHTML: b.enabled ? tagHTML("on", "on") : tagHTML("off"),
                  icon:"pad",
                  run: () => Sys.call("bt.setRadio", { enabled: !b.enabled }, { timeout:20000 }).then(
                    () => { toast("Bluetooth " + (b.enabled ? "off" : "on") + "."); if (settingsRepaint) settingsRepaint(); },
                    e  => toast(Sys.say(e))) });
        ctx.row({ label:"Pair a new controller", sub:"Puts the radio into a discovery sweep and lists what answers",
                  icon:"pad", run: () => btBrowser() });

        return Sys.call("bt.devices").then(d => d, e => ({ __err:e }));
      }).then(d => {
        if (!ctx.alive() || !d) return;
        if (d.__err){ ctx.err("Paired devices could not be read", d.__err); return; }
        const devs = d.devices || [];
        ctx.sec("Paired devices");
        if (!devs.length){ ctx.stat("Nothing is paired with this machine.", null); return; }
        devs.forEach(dev => {
          ctx.row({
            label: dev.name || dev.address,
            sub: [dev.address, dev.deviceClass, dev.looksLikeGamepad ? "gamepad" : null]
                   .filter(Boolean).join(" · "),
            tailHTML: dev.connected ? tagHTML("connected", "on") : tagHTML("paired"),
            icon: dev.looksLikeGamepad ? "pad" : "info",
            run: () => confirmAction({
              id:"bt-unpair", title:"Forget " + (dev.name || dev.address) + "?",
              sub:"Windows removes the pairing. You would have to pair it again to use it.",
              goLabel:"Forget",
              onConfirm: () => Sys.call("bt.unpair", { address:dev.address }, { timeout:20000 }).then(
                () => { toast("Removed " + (dev.name || dev.address) + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)))
            })
          });
        });
      });
    } },

  /* ── 5. Power ───────────────────────────────────────────
     The actions are the ones the Power panel already owns — this
     integrates with them rather than growing a second copy that could
     drift. What is new here is the state Windows knows. */
  { id:"power", label:"Power", sub:"Battery, plan, rest", icon:"rest",
    blurb:"Power state from Windows. Rest, restart, shut down and sign out are the same confirmed actions as the Power panel.",
    build(ctx){
      const loading = ctx.stat("Reading power state…", null, true);
      return Sys.call("power.status").then(p => {
        if (!ctx.alive()) return;
        loading.remove();
        ctx.sec("State");
        const facts = [
          ["Source",     p.onAc ? "AC power" : "Battery"],
          ["Power plan", orDash(p.powerPlan)],
          ["Uptime",     p.uptimeMs ? fmtUptime(p.uptimeMs) : "—"]
        ];
        if (p.hasBattery){
          facts.splice(1, 0, ["Battery", p.batteryPercent + "%"
            + (p.charging ? " · charging" : "")
            + (p.batteryCritical ? " · CRITICAL" : (p.batteryLow ? " · low" : ""))]);
          facts.splice(2, 0, ["Battery saver", p.batterySaver ? "On" : "Off"]);
        } else {
          facts.splice(1, 0, ["Battery", "no battery — this machine is mains-only"]);
        }
        ctx.facts(facts);

        ctx.sec("Actions");
        ctx.row({ label:"Rest mode", sub:"Suspend to RAM — wake with the controller or the power button",
                  icon:"rest", run: () => { Overlay.closeAll(); Host.power("sleep"); toast("Power: rest requested."); } });
        ctx.row({ label:"Restart", sub:"Close everything and reboot the machine", icon:"restart", tone:"danger",
                  run: () => confirmPower("restart") });
        ctx.row({ label:"Shut down", sub:"Close everything and power off", icon:"shut", tone:"danger",
                  run: () => confirmPower("shutdown") });
        ctx.row({ label:"Sign out", sub:"End this Windows session and return to the sign-in screen",
                  icon:"signout", tone:"danger", run: () => confirmPower("signout") });
        ctx.note("Restart and shut down are routed through the host's Shell Launcher exit codes, so Windows " +
          "ends the session the same way it would from the sign-in screen. <b>They always ask twice.</b>");
      });
    } },

  /* ── 6. Storage ─────────────────────────────────────────── */
  { id:"storage", label:"Storage", sub:"Drives, free space", icon:"disk",
    blurb:"Every drive Windows has mounted, with removable media flagged.",
    build(ctx){
      const loading = ctx.stat("Reading drives…", null, true);
      return Sys.call("sys.storage").then(s => {
        if (!ctx.alive()) return;
        loading.remove();
        const drives = (s.drives || []).filter(d => d.ready);
        const skipped = (s.drives || []).length - drives.length;

        /* First, before the read-only inventory: the one thing on this
           page a human might actually want to *do* with a drive. */
        ctx.sec("Files");
        ctx.row({ label:"Browse files", icon:"disk",
                  sub:"Open the file explorer on this machine's drives",
                  run: () => ACT.openFiles() });

        ctx.sec("Drives");
        if (!drives.length){ ctx.stat("Windows reported no ready drives.", "bad"); return; }
        drives.forEach(d => ctx.add(driveEl(d)));
        const total = drives.reduce((n, d) => n + (d.totalBytes || 0), 0);
        const free  = drives.reduce((n, d) => n + (d.freeBytes  || 0), 0);
        ctx.facts([
          ["Drives",     drives.length + (skipped ? "  (" + skipped + " not ready, skipped)" : "")],
          ["Total",      fmtBytes(total)],
          ["Free",       fmtBytes(free)],
          ["Removable",  drives.filter(d => d.removable).length + " of " + drives.length]
        ]);
      });
    } },

  /* ── 7. System / Update ─────────────────────────────────
     Deliberately has NO install button. Installing needs administrator
     rights this shell does not have, so the honest design is to report
     what is pending and let Windows Update install on its schedule.
     A fake progress bar here would be a lie with a spinner on it. */
  { id:"update", label:"System", sub:"Build, updates", icon:"update",
    blurb:"What this machine is, and what Windows Update has pending for it.",
    build(ctx){
      const loading = ctx.stat("Reading system information…", null, true);
      return Sys.call("sys.info").then(i => {
        if (!ctx.alive()) return;
        loading.remove();
        const os = i.os || {}, cpu = i.cpu || {}, mem = i.memory || {};
        ctx.sec("This machine");
        ctx.facts([
          ["Windows",   orDash(os.productName)],
          ["Version",   (os.displayVersion || "?") + "  ·  build " + (os.buildFull || os.build || "?")],
          ["Edition",   orDash(os.edition)],
          ["Processor", orDash(cpu.name)],
          ["Cores",     cpu.logicalProcessors ? cpu.logicalProcessors + " logical" : "—"],
          ["Memory",    mem.totalGB ? (mem.totalGB + " GB  ·  " + mem.usedPercent + "% in use") : "—"],
          ["Uptime",    orDash(i.uptimeText)],
          ["Installed", os.installedUtc ? new Date(os.installedUtc).toLocaleDateString() : "—"]
        ]);

        ctx.sec("Windows Update");
        const st = ctx.stat("No search has run yet this session.", null, false);
        const listBox = document.createElement("div");
        ctx.add(listBox);

        function render(list){
          listBox.innerHTML = "";
          const ups = (list && list.updates) || [];
          if (!ups.length){
            setStat(st, "No pending updates were found.", "good", false);
          } else {
            setStat(st, ups.length + " update" + (ups.length === 1 ? "" : "s") + " pending.", null, false);
            ups.slice(0, 12).forEach(u => {
              const d = document.createElement("div");
              d.className = "drive";
              const t = document.createElement("div");
              t.className = "drive-top";
              const b = document.createElement("b"); b.textContent = u.title || "(untitled update)";
              t.appendChild(b);
              const sub = document.createElement("div");
              sub.className = "drive-sub";
              sub.textContent = [(u.kb || []).join(" "),
                                 u.severity || null,
                                 u.mandatory ? "mandatory" : null,
                                 u.sizeBytes ? fmtBytes(u.sizeBytes) : null,
                                 u.downloaded ? "downloaded" : null,
                                 u.rebootRequired ? "needs a restart" : null].filter(Boolean).join(" · ") || "pending";
              d.appendChild(t); d.appendChild(sub);
              listBox.appendChild(d);
            });
            if (ups.length > 12) listBox.appendChild(statEl("…and " + (ups.length - 12) + " more.", null));
          }
          if (ctx.alive()) ctx.sync();
        }

        ctx.row({ label:"Check for updates",
                  sub:"Asks Windows Update. This can take a minute or two — the shell stays live throughout.",
                  icon:"update",
                  run(el){
                    const label = el.querySelector(".row-text small");
                    setStat(st, "Searching Windows Update…", null, true);
                    let cancelled = false;
                    Sys.job("updates.check", {}, {
                      timeout: 180000,
                      isCancelled: () => cancelled || !ctx.alive(),
                      onProgress(p){
                        if (!ctx.alive()){ cancelled = true; return; }
                        setStat(st, "Searching Windows Update… " + Math.round(p.elapsedMs / 1000) + " s"
                          + (p.phase ? "  ·  " + p.phase : ""), null, true);
                      }
                    }).then(res => {
                      if (!ctx.alive()) return;
                      render(res);
                      if (label) label.textContent = "Last checked just now.";
                    }, e => {
                      if (!ctx.alive()) return;
                      setStat(st, "Update check failed: " + Sys.say(e), "bad", false);
                    });
                  } });

        ctx.note("<b>Updates install on Windows' own schedule.</b> There is no install button here on purpose: " +
          "installing needs administrator rights that this shell deliberately does not have, so a button would " +
          "only ever fail. This screen reports honestly what is pending.");

        /* If a check already ran in this host process, show its result
           immediately rather than making the human re-run a two-minute
           search to see what the shell already knows. */
        return Sys.call("updates.list").then(l => { if (ctx.alive()) render(l); },
                                             () => { /* no_search_yet is the normal first state */ });
      });
    } },

  /* ── 8. Date & time ─────────────────────────────────────
     The time zone is settable by this account; the clock itself is
     not. Rather than offer a control that fails, the panel says which
     privilege is missing and who owns the clock instead. */
  { id:"time", label:"Date & time", sub:"Clock, time zone", icon:"info",
    blurb:"The system clock and time zone. The zone is yours to change; the clock belongs to Windows.",
    build(ctx){
      const loading = ctx.stat("Reading the clock…", null, true);
      return Sys.call("sys.time").then(t => {
        if (!ctx.alive()) return;
        loading.remove();
        const tz = t.timeZone || {}, ntp = t.ntp || {};
        ctx.sec("Now");
        ctx.facts([
          ["Date",      orDash(t.dateFormatted)],
          ["Time",      orDash(t.timeFormatted)],
          ["UTC",       t.utcIso ? t.utcIso.replace("T", " ").replace(/\..*/, "") + "Z" : "—"],
          ["Time zone", orDash(tz.displayName)],
          ["Offset",    typeof tz.currentUtcOffsetMinutes === "number"
                          ? fmtOffset(tz.currentUtcOffsetMinutes) + (tz.inDaylightSaving ? "  (daylight saving)" : "") : "—"]
        ]);

        ctx.sec("Time zone");
        ctx.row({ label:"Change the time zone", sub:"Every zone Windows has installed", tail:tz.id || "—",
                  icon:"info", run: () => timezonePicker(tz.id) });

        ctx.sec("Synchronisation");
        ctx.facts([
          ["Automatic",  ntp.autoSync ? "On" : "Off"],
          ["Source",     orDash(ntp.syncType)],
          ["Server",     orDash(ntp.server)],
          ["Last good",  ntp.lastKnownGoodUtc ? new Date(ntp.lastKnownGoodUtc).toLocaleString() : "—"],
          ["W32Time",    orDash(ntp.serviceState)]
        ]);

        return Sys.call("sys.privileges").then(p => p, () => null);
      }).then(p => {
        if (!ctx.alive()) return;
        const rel = (p && p.relevantPrivileges) || {};
        if (rel.SeSystemtimePrivilege === false || !p){
          ctx.note("<b>Setting the clock is not offered here.</b> This shell runs as a standard user, which does " +
            "not hold <code>SeSystemtimePrivilege</code>, so a \"set the time\" control could only ever fail. " +
            "Windows keeps the clock synchronised against its time server instead. Changing the <b>time zone</b> " +
            "does work — that needs a different privilege, which this account does hold.");
        } else {
          ctx.note("This account holds <code>SeSystemtimePrivilege</code>, but the clock is still left to Windows' " +
            "time service: two authorities setting one clock is how a console ends up minutes out.");
        }
        return Sys.call("sys.locale").then(l => {
          if (!ctx.alive() || !l) return;
          ctx.sec("Region and format");
          ctx.facts([
            ["Locale",   (l.cultureDisplayName || l.culture || "—")],
            ["Region",   (l.region && l.region.displayName) || orDash(l.country)],
            ["Clock",    l.uses24HourClock ? "24-hour" : "12-hour"],
            ["Date format", orDash(l.shortDatePattern)],
            ["Keyboard", (l.inputLanguages || []).join(", ") || "—"]
          ]);
        }, () => {});
      });
    } },

  /* ── 9. About ───────────────────────────────────────────── */
  { id:"about", label:"About", sub:"Device, accounts, build", icon:"info",
    blurb:"What this console is, who can sign into it, and what the shell itself is running on.",
    build(ctx){
      ctx.sec("This console");
      ctx.row({ label:"Device name",
                sub: deviceName ? "A shell-local label — not the Windows computer name"
                                : "Not set — this is a shell-local label, not the Windows computer name",
                tail: deviceName || "Set…", icon:"info", run: () => ACT.deviceName() });

      const loading = ctx.stat("Reading system information…", null, true);
      return Sys.call("sys.info").then(i => {
        if (!ctx.alive()) return;
        loading.remove();
        const os = i.os || {};
        ctx.facts([
          ["Computer name", orDash(i.machineName)],
          ["Signed in as",  orDash(i.userName)],
          ["Elevated",      i.elevated ? "Yes" : "No — standard user, by design"],
          ["Session",       String(i.sessionId)],
          ["Windows",       (os.productName || "?") + "  ·  " + (os.buildFull || "?")],
          ["Architecture",  orDash(i.osArchitecture)]
        ]);
        return Sys.call("accounts.list").then(a => a, e => ({ __err:e }));
      }).then(a => {
        if (!ctx.alive() || !a) return;
        ctx.sec("Accounts");
        if (a.__err){ ctx.err("Accounts could not be read", a.__err); }
        else {
          const users = (a.users || []).filter(u => u.enabled);
          users.forEach(u => {
            ctx.add(factsEl([[
              u.name + (u.fullName ? "  (" + u.fullName + ")" : ""),
              [u.isAdministrator ? "administrator" : "standard",
               u.signedIn ? "signed in" : null,
               u.isCurrentUser ? "this session" : null].filter(Boolean).join(" · ")
            ]]));
          });
          if (!users.length) ctx.stat("No enabled local accounts were reported.", "bad");
          ctx.stat("Read-only by design: creating, deleting and re-passwording accounts is not something a " +
            "living-room shell should be able to do.", null);
        }

        ctx.sec("Shell");
        ctx.facts([
          ["PC1 OS",     "1.0"],
          ["Host",       Host.caps.sys ? "ShellHostWeb v4 (system channel live)"
                        : (Host.caps.nav ? "ShellHostWeb v3 — no system channel" : "ShellHostWeb v2 (legacy pad channel)")],
          ["Keyboard",   window.ArcOSK ? ("ArcOSK " + (window.ArcOSK.version || "loaded")) : "not loaded"],
          ["Explorer",   window.ArcFiles
                          ? ("ArcFiles " + (window.ArcFiles.version || "loaded")
                             + (Host.caps.fs ? " — host fs channel live" : " — host has no fs channel"))
                          : "not loaded"],
          ["Browser",    window.ArcBrowser
                          ? ("ArcBrowser " + (window.ArcBrowser.version || "loaded")
                             + (Host.caps.browser ? " — content WebView available" : " — host has no browser channel"))
                          : "not loaded"],
          ["Renderer",   (navigator.userAgent.match(/Edg\/[\d.]+/) || ["Edge (unknown build)"])[0]],
          ["Page",       location.href],
          ["Root scale", remPx().toFixed(2) + " px / rem"]
        ]);
        ctx.row({ label:"System API catalogue", sub:"Every command this host exposes, and which need rights it lacks",
                  icon:"info", run: () => apiCatalogue() });
      });
    } }
];

/* ═══ Settings sub-flows ═════════════════════════════════
   Each of these pushes its own scope, so Circle always means "never
   mind" and lands back exactly where it came from. */

function showAdapters(net){

    label: a.name,
    sub: [a.description, a.kind, a.status, a.isVirtual ? "virtual" : null,
          a.ipv4 && a.ipv4[0] ? a.ipv4[0].address : null].filter(Boolean).join(" · "),

  }));

  });
}

/* ── Wi-Fi ───────────────────────────────────────────────
   The scan is a job: the list appears immediately from the cache and
   is replaced when the real sweep lands, with a spinner in between. */
function wifiBrowser(){
  const p = pickerPanel({
    id:"wifi", title:"Available networks", eyebrow:"Wi-Fi",
    sub:"Signal strength and security as Windows reports them.",
    status:"Reading the cached list…", statusSpin:true,
    items: [], emptyText:"No networks in range.",
    onPick: (it) => { if (it.net) wifiConnect(it.net); }
  });
  let gone = false;
  const scope = p.scope;
  const alive = () => !gone && Focus.has(scope.id);

  function toItems(list){
    return (list || []).map(n => ({
      net: n,
      label: n.ssid || "(hidden network)",
      sub: [n.secure ? n.security : "Open — no encryption",
            n.band, n.bssCount > 1 ? n.bssCount + " access points" : null,
            n.savedProfile ? "saved" : null].filter(Boolean).join(" · "),
      tailHTML: (n.connected ? tagHTML("connected", "on") : "") + sigHTML(n.bars),
      icon: "info"
    }));
  }
  function pull(statusText, spinning){
    return Sys.call("wifi.list").then(l => {
      if (!alive()) return;
      p.paint(toItems(l.networks), statusText, null, spinning);
    }, e => {
      if (!alive()) return;
      p.paint([], Sys.say(e), "bad", false);
    });
  }

  pull("Scanning for networks…", true).then(() => {
    if (!alive()) return;
    return Sys.job("wifi.scan", { timeoutMs: 10000 }, {
      timeout: 40000,
      isCancelled: () => !alive(),
      onProgress: () => { pull("Scanning for networks…", true); }
    }).then(res => {
      if (!alive()) return;
      const items = toItems(res.networks);
      p.paint(items, items.length + " network" + (items.length === 1 ? "" : "s") + " in range.", null, false);
    }, e => {
      if (!alive()) return;
      if (e.code === "cancelled") return;
      /* A failed sweep still leaves the cached list on screen — say the
         sweep failed rather than blanking what we already showed. */
      pull("Scan failed: " + Sys.say(e), false);
    });
  });

  const origPop = scope.onPop;
  scope.onPop = function(){ gone = true; if (origPop) origPop(); };
}

function wifiConnect(net){
  const ssid = net.ssid || "";
  if (net.connected){ toast("Already connected to " + ssid + "."); return; }

  function go(password){
    const busy = busyPanel("Connecting to " + ssid, "Windows is creating a profile and associating with the network.");
    Sys.job("wifi.connect", {
      ssid: ssid,
      password: password || undefined,
      security: net.secure ? "auto" : "OPEN",
      hidden: !!net.hidden,
      timeoutMs: 25000
    }, {
      timeout: 60000,
      onProgress(pr){ busy.say(pr.phase || ("Connecting… " + Math.round(pr.elapsedMs / 1000) + " s"), null, true); }
    }).then(r => {
      busy.close();
      toast(r && r.connected === false
        ? ("Could not join " + ssid + ".")
        : ("Connected to " + ssid + "."));
      if (settingsRepaint) settingsRepaint();
    }, e => {
      busy.close();
      /* A wrong password comes back as a plain connect failure — say
         what to try rather than echoing the API's wording alone. */
      const extra = net.secure && !net.savedProfile ? "  Check the password and try again." : "";
      toast("Could not join " + ssid + ": " + Sys.say(e) + extra);
      hostLog("wifi.connect '" + ssid + "' failed: " + Sys.say(e));
    });
  }

  if (!net.secure || net.savedProfile){ go(null); return; }
  OSK.open({
    title: "Password for " + ssid,
    value: "", mode: "password", maxLength: 63,
    placeholder: "Network password",
    commitLabel: "Join",
    onCommit: safe("wifi password", (v) => {
      if (!v){ toast("No password entered — not joining " + ssid + "."); return; }
      go(v);
    }),
    onCancel: safe("wifi password cancel", () => hostLog("Wi-Fi password cancelled for " + ssid))
  });
}

function wifiProfiles(names){
  const p = pickerPanel({
    id:"wifiprofiles", title:"Saved networks", eyebrow:"Wi-Fi",
    sub:"Profiles stored on this machine. Forgetting one deletes its saved password.",
    items: (names || []).map(n => ({ ssid:n, label:n, sub:"Saved profile", tailHTML:tagHTML("forget"), icon:"disk" })),
    emptyText:"No saved wireless profiles.",
    onPick: (it) => confirmAction({
      id:"wifi-forget", title:"Forget " + it.ssid + "?",
      sub:"The saved password is deleted. You would have to type it again to rejoin.",
      goLabel:"Forget",
      onConfirm: () => Sys.call("wifi.forget", { ssid: it.ssid }, { timeout:15000 }).then(
        () => { toast("Forgot " + it.ssid + "."); p.close(); if (settingsRepaint) settingsRepaint(); },
        e  => toast(Sys.say(e)))
    })
  });
}

/* ── Bluetooth ─────────────────────────────────────────── */
function btBrowser(){
  const p = pickerPanel({
    id:"btscan", title:"Pair a controller", eyebrow:"Bluetooth",
    sub:"Hold Create and PS on a DualSense until the light bar flashes, then pick it below.",
    status:"Starting a discovery sweep…", statusSpin:true,
    items:[], emptyText:"Nothing answered the sweep yet.",
    onPick: (it) => btPair(it.dev, p)
  });
  let gone = false;
  const scope = p.scope;
  const alive = () => !gone && Focus.has(scope.id);
  const origPop = scope.onPop;
  scope.onPop = function(){ gone = true; if (origPop) origPop(); };

  Sys.job("bt.scan", { seconds: 10 }, {
    timeout: 45000,
    isCancelled: () => !alive(),
    onProgress(pr){ if (alive()) p.paint(undefined, "Sweeping… " + Math.round(pr.elapsedMs / 1000) + " s", null, true); }
  }).then(res => {
    if (!alive()) return;
    const found = (res.devices || []).filter(d => !d.paired);
    p.paint(found.map(d => ({
      dev: d,
      label: d.name || d.address,
      sub: [d.address, d.deviceClass, d.looksLikeGamepad ? "looks like a gamepad" : null].filter(Boolean).join(" · "),
      tailHTML: tagHTML("pair"),
      icon: d.looksLikeGamepad ? "pad" : "info"
    })), found.length ? (found.length + " unpaired device" + (found.length === 1 ? "" : "s") + " found.")
                      : "Nothing unpaired answered. Put the controller into pairing mode and try again.",
       found.length ? null : "bad", false);
  }, e => {
    if (!alive() || e.code === "cancelled") return;
    p.paint([], "Scan failed: " + Sys.say(e), "bad", false);
  });
}

function btPair(dev, picker){
  const name = dev.name || dev.address;
  const busy = busyPanel("Pairing with " + name, "Windows is running the pairing ceremony. A DualSense confirms automatically.");
  Sys.job("bt.pair", { address: dev.address, name: dev.name, timeoutMs: 30000 }, {
    timeout: 60000,
    onProgress(pr){ busy.say(pr.phase || ("Pairing… " + Math.round(pr.elapsedMs / 1000) + " s"), null, true); }
  }).then(() => {
    busy.close();
    if (picker) picker.close();
    toast("Paired with " + name + ".");
    if (settingsRepaint) settingsRepaint();
  }, e => {
    busy.close();
    toast("Could not pair with " + name + ": " + Sys.say(e));
    hostLog("bt.pair '" + name + "' failed: " + Sys.say(e));
  });
}

/* ── Display modes, and the reason this screen is careful ─
   On a television a mode the panel cannot show is a black screen with
   no way back — the pad is invisible too, because you cannot see what
   you are pressing. So the apply path is:

     1. dry-run the mode (CDS_TEST) and refuse it here if it fails;
     2. draw the confirmation FIRST, focused on Revert;
     3. only then apply;
     4. count down out loud, and revert on zero, on Circle, or on any
        error — confirming is the only path that keeps the change.

   Nothing about that depends on the human being able to see: doing
   nothing gets the old mode back. */
function displayModePicker(disp){
  const cur = { w: disp.width, h: disp.height, hz: Math.round(disp.refreshHz) };
  const p = pickerPanel({
    id:"dispmodes", title:"Resolution and refresh rate", eyebrow:"Display",
    sub:disp.name ? ("Modes " + disp.name + " reports to Windows.") : "Modes this display reports to Windows.",
    status:"Reading supported modes…", statusSpin:true,
    items:[], emptyText:"This display reported no modes.",
    onPick: (it) => {
      if (it.isCurrent){ toast("That is already the current mode."); return; }
      displayModeApply(disp, it.mode);
    }
  });
  let gone = false;
  const origPop = p.scope.onPop;
  p.scope.onPop = function(){ gone = true; if (origPop) origPop(); };

  Sys.call("display.modes", { display: disp.gdiName }, { timeout: 15000 }).then(d => {
    if (gone) return;
    const seen = {};
    const modes = (d.modes || []).filter(m => {
      const k = m.width + "x" + m.height + "@" + m.refreshHz;
      if (seen[k]) return false;
      seen[k] = 1;
      return m.width >= 800;                 // 640×480 on a TV is not a choice, it is an accident
    }).sort((a, b) => (b.width - a.width) || (b.height - a.height) || (b.refreshHz - a.refreshHz));

    p.paint(modes.map(m => {
      const isCurrent = m.width === cur.w && m.height === cur.h && Math.abs(m.refreshHz - cur.hz) <= 1;
      return {
        mode: m, isCurrent: isCurrent,
        label: m.width + " × " + m.height,
        sub: Math.round(m.refreshHz) + " Hz · " + m.bpp + "-bit"
             + (m.width === cur.w && m.height === cur.h ? " · native to the current resolution" : ""),
        tailHTML: isCurrent ? tagHTML("current", "on") : tagHTML("apply"),
        icon: "info"
      };
    }), modes.length + " mode" + (modes.length === 1 ? "" : "s") + ". Any change reverts itself unless you confirm it.",
      null, false);
  }, e => { if (!gone) p.paint([], Sys.say(e), "bad", false); });
}

const DISPLAY_REVERT_SECONDS = 15;

function displayModeApply(disp, mode){
  const label = mode.width + " × " + mode.height + " @ " + Math.round(mode.refreshHz) + " Hz";

  /* Step 1: ask the driver, without changing anything. SystemApi always
     dry-runs first, so test:true means "tell me and stop". */
  Sys.call("display.setMode", {
    display: disp.gdiName, width: mode.width, height: mode.height,
    refreshHz: Math.round(mode.refreshHz), test: true
  }, { timeout: 15000 }).then(probe => {
    const prev = parsePrevMode(probe.previous) || { width: disp.width, height: disp.height, refreshHz: Math.round(disp.refreshHz) };
    countdownConfirm(disp, mode, prev, label);
  }, e => {
    toast("That mode was refused before anything changed: " + Sys.say(e));
    hostLog("display dry-run refused " + label + ": " + Sys.say(e));
  });
}

function parsePrevMode(s){
  const m = /^(\d+)x(\d+)@(\d+)$/.exec(String(s || "").trim());
  if (!m) return null;
  return { width:+m[1], height:+m[2], refreshHz:+m[3] };
}

function countdownConfirm(disp, mode, prev, label){
  const node = panelShell("Keep this display mode?",
    "If you can read this, press Keep. Doing nothing puts the old mode back.", "Display");
  node.classList.add("confirm");
  const body = node.querySelector(".panel-body");
  const num = document.createElement("div");
  num.className = "countdown";
  const sub = document.createElement("div");
  sub.className = "countdown-sub";
  sub.textContent = "Reverting to " + prev.width + " × " + prev.height + " @ " + prev.refreshHz + " Hz";
  body.appendChild(num); body.appendChild(sub);
  const stat = statEl("Applying " + label + "…", null, true);
  body.appendChild(stat);

  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  /* Revert is column 0 and takes focus: the safe answer is the one
     already selected. On a screen you may not be able to see, the
     default press has to be the one that gets you back. */
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = "Revert now";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "run"; no.dataset.label = "revert";
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = "Keep";
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "run"; go.dataset.label = "keep";
  [no, go].forEach(b => b.addEventListener("click", safe("countdown click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.appendChild(acts);

  let left = DISPLAY_REVERT_SECONDS;
  let settled = false;
  let ticker = 0;
  num.textContent = left + "s";

  function finish(){
    clearInterval(ticker);
    if (Focus.top() === sc) Focus.pop();
  }
  function revert(why){
    if (settled) return;
    settled = true;
    clearInterval(ticker);
    setStat(stat, "Reverting…", null, true);
    hostLog("display: reverting to " + prev.width + "x" + prev.height + "@" + prev.refreshHz + " (" + why + ")");
    Sys.call("display.setMode", {
      display: disp.gdiName, width: prev.width, height: prev.height, refreshHz: prev.refreshHz, test: false
    }, { timeout: 20000 }).then(() => {
      finish();
      toast("Display mode reverted (" + why + ").");
      if (settingsRepaint) settingsRepaint();
    }, e => {
      finish();
      /* The one genuinely bad outcome. Say exactly what to do about it
         rather than leaving a television in an unknown state silently. */
      toast("REVERT FAILED: " + Sys.say(e) + "  Use Windows' own display settings, or restart the console.");
      hostLog("display REVERT FAILED: " + Sys.say(e));
    });
  }
  function keep(){
    if (settled) return;
    settled = true;
    clearInterval(ticker);
    finish();
    toast("Display mode kept: " + label + ".");
    hostLog("display: kept " + label);
    if (settingsRepaint) settingsRepaint();
  }
  no.__arcRun = () => revert("you asked");
  go.__arcRun = keep;

  const sc = pushPanel("display-countdown", node, {
    hints: ["navLR", "confirm", "cancel"],
    /* Circle is the safe answer here too, not "dismiss and keep". */
    onBack(){ revert("you backed out"); return "reverting the display mode"; }
  });

  /* The confirmation must already be on screen before the mode changes,
     or a display that cannot show the new mode never renders it. */
  requestAnimationFrame(() => setTimeout(safe("display apply", () => {
    Sys.call("display.setMode", {
      display: disp.gdiName, width: mode.width, height: mode.height,
      refreshHz: Math.round(mode.refreshHz), test: false
    }, { timeout: 25000 }).then(() => {
      if (settled) return;
      setStat(stat, "Applied. Press Keep to make it permanent.", null, false);
      ticker = setInterval(safe("countdown tick", () => {
        left--;
        num.textContent = Math.max(0, left) + "s";
        if (left <= 0) revert("no answer in " + DISPLAY_REVERT_SECONDS + "s");
      }), 1000);
    }, e => {
      if (settled) return;
      settled = true;
      finish();
      toast("The mode change failed and nothing was altered: " + Sys.say(e));
      hostLog("display apply failed for " + label + ": " + Sys.say(e));
    });
  }), 60));
}

/* ── Time zone ───────────────────────────────────────────── */
function timezonePicker(currentId){
  const p = pickerPanel({
    id:"tz", title:"Time zone", eyebrow:"Date & time",
    sub:"Every zone Windows has installed. Changing it takes effect immediately.",
    status:"Reading installed time zones…", statusSpin:true,
    items:[], emptyText:"Windows reported no time zones.",
    onPick: (it) => {
      if (it.zone.id === currentId){ toast("That is already the current time zone."); return; }
      Sys.call("sys.setTimezone", { id: it.zone.id }, { timeout: 15000 }).then(() => {
        toast("Time zone set to " + it.zone.id + ".");
        p.close();
        if (settingsRepaint) settingsRepaint();
      }, e => toast("Time zone unchanged: " + Sys.say(e)));
    }
  });
  let gone = false;
  const origPop = p.scope.onPop;
  p.scope.onPop = function(){ gone = true; if (origPop) origPop(); };

  Sys.call("sys.timezones", {}, { timeout: 15000 }).then(d => {
    if (gone) return;
    const zones = (d.zones || []).slice().sort((a, b) =>
      (a.baseUtcOffsetMinutes - b.baseUtcOffsetMinutes) || a.id.localeCompare(b.id));
    p.paint(zones.map(z => ({
      zone: z,
      label: z.displayName || z.id,
      sub: z.id + (z.supportsDaylightSaving ? " · observes daylight saving" : ""),
      tailHTML: z.id === currentId ? tagHTML("current", "on") : "",
      icon: "info"
    })), zones.length + " zones. The current one is marked.", null, false);
    /* Land on the current zone rather than at the top of a 140-row list. */
    const i = zones.findIndex(z => z.id === currentId);
    if (i >= 0){
      const rows = p.node.querySelectorAll(".panel-body .row");
      if (rows[i]) Focus.focusEl(rows[i]);
    }
  }, e => { if (!gone) p.paint([], Sys.say(e), "bad", false); });
}

function fmtUptime(ms){
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + "d " + h + "h " + m + "m";
  if (h) return h + "h " + m + "m";
  return m + "m";
}
function fmtOffset(min){
  const sign = min < 0 ? "-" : "+", a = Math.abs(min);
  return "UTC" + sign + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}

/* ── Measured facts ─────────────────────────────────────── */
let measuredHz = 0;
function measureHz(){
  let n = 0;
  const t0 = performance.now();
  function step(){
    n++;
    if (performance.now() - t0 < 480) requestAnimationFrame(step);
    else measuredHz = Math.round(n / ((performance.now() - t0) / 1000));
  }
  requestAnimationFrame(step);
}
function displayFacts(){
  const dpr = devicePixelRatio || 1;
  return [
    ["Viewport",        innerWidth + " × " + innerHeight + " CSS px"],
    ["Device pixels",   Math.round(innerWidth * dpr) + " × " + Math.round(innerHeight * dpr)],
    ["Scale factor",    dpr.toFixed(2) + "×"],
    ["Screen",          screen.width + " × " + screen.height],
    ["Colour depth",    screen.colorDepth + "-bit"],
    ["Refresh rate",    measuredHz ? measuredHz + " Hz (measured)" : "measuring…"],
    ["Dynamic range",   matchMedia("(dynamic-range: high)").matches ? "High (HDR)" : "Standard"],
    ["Colour gamut",    matchMedia("(color-gamut: p3)").matches ? "Display-P3 or wider" : "sRGB"],
    ["Root scale",      remPx().toFixed(2) + " px / rem"]
  ];
}
function padFacts(){
  const out = [];
  try{
    const gp = navigator.getGamepads ? navigator.getGamepads() : [];
    let n = 0;
    for (const p of gp){
      if (!p) continue;
      n++;
      out.push(["Slot " + p.index, (p.id || "unknown").replace(/\s*\(.*$/, "")]);
      out.push(["Mapping", p.mapping || "(none)"]);
      out.push(["Controls", p.buttons.length + " buttons, " + p.axes.length + " axes"]);
    }
    if (!n) out.push(["Controllers", "none visible to the page"]);
  }catch(e){ out.push(["Controllers", "unavailable: " + e.message]); }
  out.push(["Host pad channel", Host.caps.nav
    ? "full (directions, face buttons, shoulders, phases)"
    : "legacy (left/right/cross/circle/L1/R1/options only)"]);
  out.push(["System channel", Host.caps.sys ? "live" : "not offered by this host build"]);
  return out;
}

/* ═══ Activation table ═══════════════════════════════════ */
const ACT = {
  noop(){},
  back(){ Focus.back(); },

  /* Rows built at runtime carry their behaviour as a closure on the
     element rather than a name in this table — a settings pane's rows
     depend on what the OS just said, and cannot be enumerated here. */
  run(el){
    if (typeof el.__arcRun !== "function"){ hostLog("run: no closure on " + (el.dataset.label || el.className)); return; }
    try{ el.__arcRun(el); }
    catch(err){ report("row " + (el.dataset.label || "action"), err); }
  },
  replay(){ runBoot(); },

  railPick(el){
    const i = [...$("#rail").children].indexOf(el);
    if (i >= 0) selectTile(i);
    doLaunch();
  },
  launch(){ doLaunch(); },
  appOptions(){ openAppOptions(); },

  openSettings(){ openCC("settings"); openPanel("settings"); },
  openPower(){ openCC("power"); openPanel("power"); },

  ccPick(el){
    const p = el.dataset.panel;
    if (p) openPanel(p);
  },
  settingsCat(el){ ACT.settingsCatId(el.dataset.arg); },
  settingsCatId(id){
    if (Focus.top() && Focus.top().id === "panel:settings") return;   // the pane already follows focus
    if (Focus.has("panel:settings") && settingsGoto){
      Focus.popTo("panel:settings");
      settingsGoto(id);
      return;
    }

    Focus.popTo("cc");
    const sc = openPanel("settings");
    if (sc && settingsGoto) settingsGoto(id);
  },
  powerConfirm(el){ confirmPower(el.dataset.arg); },
  power(el){
    const a = el.dataset.arg;
    Overlay.closeAll();
    Host.power(a);
    toast("Power: " + a + " requested.");
  },
  deviceName(){
    OSK.open({
      title: "Device name",
      value: deviceName,
      mode: "text",
      maxLength: 32,
      placeholder: "e.g. Living room",
      commitLabel: "Save",
      onCommit: safe("osk commit", (v) => setDeviceName(v)),
      onCancel: safe("osk cancel", () => hostLog("OSK cancelled — device name unchanged"))
    });
  },
  /* The file explorer. It is its own modal world with its own scope
     stack and its own hint bar, so the shell does not push a Focus
     scope for it — the router in Nav.action() is what makes it modal.

     What the shell does owe it is the way back. ArcFiles calls onExit
     after it has torn its own DOM down, and Focus.repaint() puts the
     ring and the real DOM focus back on whatever was underneath: the
     Storage row in Settings, or the home tile, depending on where the
     human came in from. Without it the explorer closes onto a screen
     with no cursor and the next D-pad press goes nowhere visible. */
  openFiles(){
    const cameFrom = Focus.top() ? Focus.top().id : "(nothing)";
    Files.open({
      title: "Files",
      onExit: safe("files exit", () => {
        hostLog("files: closed, returning focus to " + cameFrom);
        Focus.repaint();
      })
    });
  },

  /* The browser. Same shape as openFiles(): its own modal world, its

  openBrowser(url){
    Browser.open(typeof url === "string" ? url : "");
  },

  stub(el){
    const what = el.dataset.arg || el.dataset.label || "This control";
    toast(what + " is a stub — navigation works, the action is not implemented yet.");
    hostLog("stub activated: " + what);
  }
};

/* The launch path, unchanged in substance: #btnLaunch is still the
   thing that posts {type:launch} and the host still job-tracks the
   child and forces the foreground back afterwards. */
let launching = false;
/* The v2 shim owns a capture-phase Enter handler that posts {type:launch}
   before the page sees the key at all, and it cannot be unhooked from
   here. Rather than send a second message and spawn two children, note
   that it already fired and let it stand. v3 routes Enter through
   arcPad() like every other action and this window is never open. */
let shimEnterAt = -1e9;
function doLaunch(){
  if (performance.now() - shimEnterAt < 250){
    hostLog("launch already posted by the v2 shim's Enter handler — not duplicating");
    return;
  }
  if (launching) return;
  launching = true;
  setTimeout(() => { launching = false; }, 600);
  const b = $("#btnLaunch");
  b.classList.add("pressed");
  setTimeout(() => b.classList.remove("pressed"), 160);

  /* A tile carrying `run` is built into the shell rather than being a
     child process — the explorer is the first of them. It must not
     reach {type:launch}, or the host would spawn the placeholder child
     underneath it. */
  const app = APPS[tab][idx];
  if (typeof app.run === "function"){
    hostLog("open (in-shell): " + app.id);
    try{ app.run(); }
    catch(err){ report("tile run " + app.id, err); }
    return;
  }
  hostLog("launch: " + app.id);
  try{ if (window.ArcFeel) ArcFeel.play("launch"); }catch(e){}
  Host.post({ type:"launch", target:"" });
}

function openAppOptions(){

    { label:"Pin to the front",  sub:"Stub",                      icon:"info",   act:"stub", arg:"Pin to the front" },
    { label:"App settings",      sub:"Stub",                      icon:"gear",   act:"stub", arg:"App settings" }
  ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));

/* ═══ What is running ════════════════════════════════════
   The host publishes; this subscribes. It is never polled — the
   page cannot see the process table and any interval it invented
   here would either lag or burn a scan the host has already done.

   Message shape (host -> page), pushed on every change:

     {type:"apps",
      running:[{id,title,kind,pid,tracked,foreground,pids}],
      background:[{name,category,pid,procs,actionable}]}

   `running` is zero or one entry: the app the shell has yielded to
   and can Resume, Minimise or Close. `background` is everything
   worth naming that is up, whether the shell started it or not —
   Steam, Discord, Vanguard. The status bar is not built here; that
   is another owner's surface. Apps.background() is the data. */
const Apps = (function(){
  let running = null;
  let background = [];
  const listeners = [];

  function emit(){
    listeners.forEach(fn => { try{ fn(running, background); }catch(err){ report("apps listener", err); } });
  }

  return {
    handle(m){
      const was = running && running.id;
      running = (m.running && m.running.length) ? m.running[0] : null;
      background = m.background || [];
      if ((running && running.id) !== was)
        hostLog("apps: running = " + (running ? running.title + " (pid " + running.pid +
                (running.tracked ? ", tracked" : ", untracked") + ")" : "nothing"));
      applyRunningMarks();
      emit();
    },
    /* True for the library id of the app that is open right now. The rail
       and the hero both ask this; nothing else should need to. */
    isRunning(id){ return !!(running && id && running.id === id); },
    current(){ return running; },
    background(){ return background.slice(); },
    onChange(fn){ listeners.push(fn); try{ fn(running, background); }catch(e){} },
    ask(){ Host.post({ type:"app", cmd:"state" }); }
  };
})();

/* Paint the running state onto the rail and the hero. Cheap and
   idempotent: called on every apps message and after every rail
   rebuild, because a rebuild throws the marks away with the tiles. */
function applyRunningMarks(){
  const list = APPS[tab] || [];
  [...$("#rail").children].forEach((t, n) => {
    const app = list[n];
    const on = !!(app && Apps.isRunning(app.id));
    t.classList.toggle("running", on);
    let pill = t.querySelector(".tile-live");
    if (on && !pill){
      pill = document.createElement("span");
      pill.className = "tile-live";
      pill.textContent = "Running";
      t.appendChild(pill);
    } else if (!on && pill){
      pill.remove();
    }
  });
  const app = list[idx];
  if (app){
    const on = Apps.isRunning(app.id);
    $("#launchLabel").textContent = on ? "Resume" : (app.action || "Launch");
    $("#btnLaunch").dataset.label = on ? "resume" : "launch";
  }
}

/* ═══ The guide menu ═════════════════════════════════════
   What a short press of PS opens when something is running. Three
   rows and no cleverness: the thing you almost always want (Resume)
   is focused, the thing that loses work (Close) is last and behind a
   confirmation. It is an ordinary panel on the existing focus stack,
   so Circle backs out of it exactly like every other panel and the
   pad hints are the ones the human already knows. */
function openGuideMenu(app){
  const a = app || Apps.current();
  if (!a){
    /* The host only sends this with something running, so arriving
       here means the app exited between the press and the message.
       Say so rather than opening an empty menu. */

    return;
  }
  Overlay.closeAll();
  const node = panelShell(a.title, a.tracked
    ? "This app is open. The shell is in front of it."
    : "This app is open, but the shell could not attach to it — it will not know when the app closes.",
    "Guide");
  const body = node.querySelector(".panel-body");
  [
    { label:"Resume",   sub:"Go back to " + a.title, icon:"play",  act:"appResume" },
    { label:"Minimise", sub:"Stay here. " + a.title + " keeps running.", icon:"shell", act:"appMinimise" },
    { label:"Close",    sub:"Quit " + a.title + " and everything it started", icon:"stop",
      act:"appClose", tone:"danger" }
  ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
  pushPanel("guide", node, { hints:["navUD", "select", "back"] });
  hostLog("guide menu opened for " + a.title);
}

ACT.appClose = function(){
  const a = Apps.current();
