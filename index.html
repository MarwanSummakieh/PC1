      const i = [...$("#rail").children].indexOf(el);
      if (i >= 0 && i !== idx) selectTile(i);
      centre();
      return;                                    // the rail scrolls itself
    }
    if (el.classList.contains("tab") && el.dataset.tab !== tab){
      setTabTo(el.dataset.tab);                    // focusing a tab switches view
      return;
    }
    Focus.ensureVisible(el);
  },
  onBack(){
    hostLog("back at home root — nothing to leave");
    return "already at the shell root";
  }
};

/* ═══ Overlay: control centre and panels ═════════════════ */
const Overlay = (function(){
  const el = () => $("#cc");

  function sync(){
    const open = Focus.depth() > 1;
    el().classList.toggle("open", open);           // the v2 shim reads this class
    el().setAttribute("aria-hidden", open ? "false" : "true");
    el().dataset.view = Focus.has("cc") && Focus.depth() === 2 ? "cc" : (open ? "panel" : "cc");
  }
  function closeAll(){
    let guard = 0;
    while (Focus.depth() > 1 && guard++ < 16) Focus.pop();
    $("#panelStack").innerHTML = "";
    sync();
  }
  return { sync, closeAll };
})();

/* ── Control centre scope ─────────────────────────────── */
function buildCC(){
  const row = $("#ccRow");
  row.innerHTML = "";
  CC_ITEMS.forEach((it, i) => {
    const b = document.createElement("button");
    b.className = "cc-item" + (it.on ? " on" : "");
    b.setAttribute("aria-label", it.label);
    b.setAttribute("data-nav", "0," + i);
    b.dataset.act = "ccPick";
    b.dataset.panel = it.panel;
    b.dataset.label = "cc:" + it.id;
    b.innerHTML = `<svg viewBox="0 0 24 24">${it.icon}</svg>`;
    b.addEventListener("mouseenter", safe("cc hover", () => {
      if (Focus.top() && Focus.top().id === "cc"){ Input.set("key"); Focus.focusEl(b); }
    }));
    row.appendChild(b);
  });
}
function paintCCLabel(){
  const sc = Focus.top();
  if (!sc || sc.id !== "cc") return;
  const cur = Focus.current(sc);
  const i = cur ? [...$("#ccRow").children].indexOf(cur.el) : 0;
  const it = CC_ITEMS[Math.max(0, i)];
  $("#ccRow").querySelectorAll(".cc-item").forEach((b, n) =>
    b.setAttribute("aria-current", n === i ? "true" : "false"));
  if (it) $("#ccLabel").innerHTML = it.label + "<small>" + it.sub + "</small>";
}

function openCC(startId){
  if (Focus.has("cc")) { Focus.popTo("cc"); Overlay.sync(); return; }
  const items = Focus.collect($("#ccRow"));
  const sc = Focus.push({
    id: "cc",
    items,
    index: 0,
    wrapX: true,
    hints: ["navLR", "select", "back"],
    onFocus(){ paintCCLabel(); },
    onPop(){ Overlay.sync(); }
  });
  if (startId){
    const b = [...$("#ccRow").children].find(x => x.dataset.label === "cc:" + startId);
    if (b) Focus.focusEl(b);
  }
  Overlay.sync();
  paintCCLabel();
}
function toggleOverlay(){
  if (Focus.depth() > 1){ Overlay.closeAll(); return "overlay closed"; }
  openCC();
  return "control centre opened";
}

/* ═══ Panels ═════════════════════════════════════════════
   Every panel is built into a detached node first: if a builder
   throws, the shell shows an error card whose back button still
   works rather than pushing a half-built scope. */
function panelShell(title, sub, eyebrow){
  const sec = document.createElement("section");
  sec.className = "panel";
  sec.innerHTML =
    '<header class="panel-head">' +
      '<div class="panel-eyebrow">' + (eyebrow || "Control centre") + "</div>" +
      '<h2 class="panel-title"></h2>' +
      (sub ? '<p class="panel-sub"></p>' : "") +
    "</header>" +
    '<div class="panel-body"></div>';
  sec.querySelector(".panel-title").textContent = title;
  if (sub) sec.querySelector(".panel-sub").textContent = sub;
  return sec;
}

function rowEl(o, r, c){
  const b = document.createElement("button");
  b.className = "row" + (o.tone ? " " + o.tone : "");
  b.setAttribute("data-nav", r + "," + c);
  b.dataset.act = o.act || "noop";
  if (o.arg) b.dataset.arg = o.arg;
  b.dataset.label = o.label;
  if (o.disabled) b.setAttribute("aria-disabled", "true");
  b.innerHTML =
    (o.icon ? '<span class="row-ico"><svg viewBox="0 0 24 24">' + (ICON[o.icon] || "") + "</svg></span>" : "") +
    '<span class="row-text"><b></b>' + (o.sub ? "<small></small>" : "") + "</span>" +
    (o.tail ? '<span class="row-tail"></span>' : "");
  b.querySelector(".row-text b").textContent = o.label;
  if (o.sub)  b.querySelector(".row-text small").textContent = o.sub;
  if (o.tail) b.querySelector(".row-tail").textContent = o.tail;
  b.addEventListener("click", safe("row click", (ev) => {
    if (ev.detail === 0) return;                 // synthetic click: the pad path handles it
    Input.set("key");
    Focus.focusEl(b);
    Focus.activate();
  }));
  return b;
}

function factsEl(pairs){
  const d = document.createElement("div");
  d.className = "facts";
  pairs.forEach(([k, v]) => {
    const f = document.createElement("div");
    f.className = "fact";
    const s = document.createElement("span"); s.textContent = k;
    const b = document.createElement("b");    b.textContent = v;
    f.appendChild(s); f.appendChild(b);
    d.appendChild(f);
  });
  return d;
}
function noteEl(html){
  const n = document.createElement("div");
  n.className = "note";
  n.innerHTML = html;
  return n;
}

function pushPanel(id, node, opts){
  const stackEl = $("#panelStack");
  [...stackEl.children].forEach(c => c.classList.add("behind"));
  stackEl.appendChild(node);
  requestAnimationFrame(() => node.classList.add("in"));

  const items = Focus.collect(node);
  /* opts may carry its own teardown as onClose. It must not be able to
     replace onPop, or a panel that wanted a callback would leak its
     node into the DOM forever. */
  const extra = Object.assign({}, opts || {});
  const onClose = extra.onClose;
  delete extra.onClose;
  delete extra.onPop;
  const sc = Focus.push(Object.assign({
    id: "panel:" + id,
    items,
    index: 0,
    hints: ["navUD", "select", "back"],
    onPop(){
      try{ if (onClose) onClose(); }catch(err){ report("panel " + id + " onClose", err); }
      node.remove();
      const rest = $("#panelStack").children;
      if (rest.length) rest[rest.length - 1].classList.remove("behind");
      Overlay.sync();
    }
  }, extra));
  Overlay.sync();
  return sc;
}

function openPanel(id){
  let node;
  try{
    const build = PANEL_BUILD[id];
    if (!build) throw new Error("no panel named '" + id + "'");
    const r = build();
    node = r.node;
    return pushPanel(id, node, r.scope);
  }catch(err){
    report("panel " + id, err);
    const fail = panelShell("Panel unavailable", "This panel failed to open. The rest of the shell is unaffected.", "Error");
    fail.querySelector(".panel-body").appendChild(
      rowEl({ label:"Back", sub:String(err && err.message ? err.message : err), icon:"info", act:"back" }, 0, 0));
    return pushPanel(id + ":error", fail, { hints:["select","back"] });
  }
}

/* ── Device name ──────────────────────────────────────────
   The one setting in this tree that is genuinely editable, and the
   proof that the on-screen keyboard round-trips: open() -> the human
   types -> onCommit -> stored -> shown. It is deliberately a
   shell-local label, not the Windows computer name; renaming a
   machine is a privileged operation and belongs to the host, not to
   a text field in a placeholder panel. */
let deviceName = "";
try{ deviceName = localStorage.getItem("arc.deviceName") || ""; }catch(e){}

let settingsRepaint = null;             // set while the settings panel is up
let settingsGoto = null;                // jump the open settings panel to a category

function setDeviceName(v){
  deviceName = (v || "").trim().slice(0, 32);
  try{
    if (deviceName) localStorage.setItem("arc.deviceName", deviceName);
    else localStorage.removeItem("arc.deviceName");
  }catch(e){ hostLog("device name not persisted: " + e); }
  hostLog("device name committed: '" + deviceName + "'");
  toast(deviceName ? ("Device name set to “" + deviceName + "”") : "Device name cleared");
  try{ if (settingsRepaint) settingsRepaint(); }catch(err){ report("settings repaint", err); }
  Focus.repaint();
}

/* ── Placeholder discipline ───────────────────────────────
   Nothing in a panel may look like a reading unless it is one.
   A value the shell cannot obtain says so, and says who could. */
const PLACEHOLDER = "— not read from this system";
function hostValue(key, fallbackLabel){
  const s = Host.sys;
  if (s && s[key] != null && s[key] !== "") return String(s[key]);
  return fallbackLabel || PLACEHOLDER;
}

/* ═══ Settings atoms ═════════════════════════════════════
   Small builders shared by every category, so "reading…",
   "unavailable" and "this is what the OS said" look the same
   everywhere and can never be confused with a real reading. */

function statEl(text, kind, spinning){
  const d = document.createElement("div");
  d.className = "stat" + (kind ? " " + kind : "");
  if (spinning){ const s = document.createElement("span"); s.className = "spin"; d.appendChild(s); }
  const t = document.createElement("span"); t.textContent = text;
  d.appendChild(t);
  d.__text = t;
  return d;
}
function setStat(el, text, kind, spinning){
  if (!el) return;
  el.className = "stat" + (kind ? " " + kind : "");
  const spin = el.querySelector(".spin");
  if (spinning && !spin) el.insertBefore(Object.assign(document.createElement("span"), { className:"spin" }), el.firstChild);
  if (!spinning && spin) spin.remove();
  if (el.__text) el.__text.textContent = text;
}

/* An error card. Always three things: what failed, what the system
   said, and the machine-readable code — never a bare HRESULT alone. */
function errEl(title, e){
  const d = document.createElement("div");
  d.className = "err";
  const b = document.createElement("b"); b.textContent = title;
  const p = document.createElement("div"); p.textContent = Sys.say(e);
  d.appendChild(b); d.appendChild(p);
  if (e && e.code){
    const c = document.createElement("code");
    c.textContent = e.code;
    d.appendChild(c);
  }
  return d;
}

/* A row whose action is a closure rather than a name in ACT. */
function actionRow(o, r, c){
  const spec = Object.assign({}, o, { act: o.run ? "run" : (o.act || "noop") });
  if (o.tailHTML && !spec.tail) spec.tail = " ";      // rowEl only makes the tail span if asked
  const b = rowEl(spec, r, c);
  if (o.run) b.__arcRun = o.run;
  if (o.tailHTML) b.querySelector(".row-tail").innerHTML = o.tailHTML;
  return b;
}

/* Five bars, filled to the measured level. bars is 0-4 as Windows
   reports it (wlan signal quality bucketed), so 0 lights one bar. */
function sigHTML(bars){
  let out = '<span class="sig">';
  for (let i = 0; i < 5; i++) out += '<i class="' + (i <= bars ? "lit" : "") + '"></i>';
  return out + "</span>";
}
function tagHTML(text, cls){
  return '<span class="tag' + (cls ? " " + cls : "") + '">' + escHTML(text) + "</span>";
}
function escHTML(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtBytes(n){
  if (typeof n !== "number" || !isFinite(n) || n < 0) return "—";
  if (n >= 1099511627776) return (n / 1099511627776).toFixed(2) + " TB";
  if (n >= 1073741824)    return (n / 1073741824).toFixed(1)  + " GB";
  if (n >= 1048576)       return (n / 1048576).toFixed(0)     + " MB";
  return n + " B";
}
function fmtHz(v){
  if (typeof v !== "number" || !isFinite(v) || v <= 0) return "—";
  return (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(3).replace(/0+$/, "")) + " Hz";
}
function orDash(v){ return (v === null || v === undefined || v === "") ? "—" : String(v); }

/* A drive card: name, label, a bar, and the numbers under it. */
function driveEl(d){
  const box = document.createElement("div");
  box.className = "drive";
  const pct = typeof d.usedPercent === "number" ? d.usedPercent : 0;
  const top = document.createElement("div");
  top.className = "drive-top";
  const b = document.createElement("b");
  b.textContent = (d.name || "?") + (d.label ? "  " + d.label : "");
  const s = document.createElement("span");
  s.textContent = fmtBytes(d.freeBytes) + " free of " + fmtBytes(d.totalBytes);
  top.appendChild(b); top.appendChild(s);
  const bar = document.createElement("div");
  bar.className = "bar" + (pct >= 90 ? " hot" : "");
  const fill = document.createElement("i");
  fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  bar.appendChild(fill);
  const sub = document.createElement("div");
  sub.className = "drive-sub";
  sub.textContent = [
    (d.driveType || "?"),
    d.removable ? "removable" : "internal",
    (d.fileSystem || ""),
    pct + "% used"
  ].filter(Boolean).join(" · ");
  box.appendChild(top); box.appendChild(bar); box.appendChild(sub);
  return box;
}

/* ── A slider that is a focusable row ─────────────────────
   Left/right adjust it, and it claims those directions through
   __arcAdjust so the focus manager stays generic. Cross toggles mute
   where the caller supplies one. The write is debounced: the pad can
   emit repeats faster than an audio endpoint wants to be written. */
function sliderRow(o, r, c){
  const b = document.createElement("button");
  b.className = "row slider" + (o.muted ? " muted" : "");
  b.setAttribute("data-nav", r + "," + c);
  b.dataset.act = "run";
  b.dataset.label = o.label;
  b.innerHTML =
    '<span class="slider-head"><b></b><span></span></span>' +
    '<span class="slider-track"><i class="slider-fill"></i></span>' +
    '<span class="slider-hint"></span>';
  const nameEl = b.querySelector(".slider-head b");
  const valEl  = b.querySelector(".slider-head span");
  const fillEl = b.querySelector(".slider-fill");
  const hintEl = b.querySelector(".slider-hint");
  nameEl.textContent = o.label;
  hintEl.textContent = o.hint || "";

  let value = Math.max(0, Math.min(1, typeof o.value === "number" ? o.value : 0));
  let pendingTimer = 0, inflight = false, dirty = false;

  function paint(){
    const pct = Math.round(value * 100);
    valEl.textContent = o.muted ? pct + "%  ·  muted" : pct + "%";
    fillEl.style.width = pct + "%";
    b.classList.toggle("muted", !!o.muted);
  }
  paint();

  function flush(){
    if (!o.commit) return;
    if (inflight){ dirty = true; return; }
    inflight = true;
    const v = value;
    Promise.resolve()
      .then(() => o.commit(v))
      .catch(e => { toast(Sys.say(e)); hostLog("slider '" + o.label + "' commit failed: " + Sys.say(e)); })
      .then(() => {
        inflight = false;
        if (dirty){ dirty = false; flush(); }
      });
  }

  b.__arcAdjust = function(dx){
    if (!dx) return false;                       // up/down still leave the row
    const step = o.step || 0.05;
    const next = Math.max(0, Math.min(1, Math.round((value + dx * step) * 1000) / 1000));
    /* At the end of the track the press is NOT consumed. In a two-pane
       layout that is the escape hatch: pushing left at 0% crosses back
       to the category list instead of doing nothing at all. */
    if (Math.abs(next - value) < 1e-6) return false;
    value = next;
    paint();
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(flush, 120);
    return true;
  };
  b.__arcRun = function(){ if (o.activate) o.activate(b); };
  b.__arcSetMuted = function(m){ o.muted = m; paint(); };
  b.addEventListener("click", safe("slider click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  }));
  return b;
}

/* ── A pushed list to choose from ─────────────────────────
   Wi-Fi networks, display modes, time zones, output devices: all the
   same shape, so all the same navigation. Its own scope, so Circle
   means "never mind" and lands you back exactly where you were. */
function pickerPanel(o){
  const node = panelShell(o.title, o.sub, o.eyebrow || "Settings");
  const bodyEl = node.querySelector(".panel-body");
  const head = o.status ? bodyEl.appendChild(statEl(o.status, o.statusKind, o.statusSpin)) : null;
  const list = document.createElement("div");
  bodyEl.appendChild(list);

  /* items === undefined means "leave the rows alone, only the status
     line changed" — a scan ticking its elapsed time must not blank the
     list it has already found. */
  function paint(items, statusText, statusKind, spinning){
    if (items !== undefined){
      list.innerHTML = "";
      items.forEach((it, i) => {
        list.appendChild(actionRow({
          label: it.label, sub: it.sub, tail: it.tail, tailHTML: it.tailHTML,
          icon: it.icon, tone: it.tone, disabled: it.disabled,
          run: () => { if (o.onPick) o.onPick(it, i); }
        }, i, 0));
      });
      if (!items.length) list.appendChild(statEl(o.emptyText || "Nothing to show.", "bad"));
    }
    if (head && statusText !== undefined) setStat(head, statusText, statusKind, spinning);
    const sc = Focus.top();
    if (sc && sc.id === "panel:" + (o.id || "picker")){
      Focus.syncItems(sc, Focus.collect(node), (Focus.current(sc) || {}).el);
      Focus.repaint();
    }
  }
  paint(o.items || []);
  if (o.note) bodyEl.appendChild(noteEl(o.note));

  const sc = pushPanel(o.id || "picker", node, { hints:["navUD", "select", "back"] });
  return { scope: sc, node, paint, close(){ if (Focus.top() === sc) Focus.pop(); } };
}

/* ── A yes/no that is not about power ─────────────────────
   Same shape as the power confirmation and the same safe default:
   Cancel is focused, confirming is a deliberate move sideways. */
function confirmAction(o){
  const node = panelShell(o.title, o.sub, o.eyebrow || "Confirm");
  node.classList.add("confirm");
  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = o.cancelLabel || "Cancel";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "run"; no.dataset.label = "cancel";
  no.__arcRun = () => { Focus.back(); if (o.onCancel) o.onCancel(); };
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = o.goLabel || "Confirm";
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "run"; go.dataset.label = "confirm";
  go.__arcRun = () => { Focus.back(); if (o.onConfirm) o.onConfirm(); };
  [no, go].forEach(b => b.addEventListener("click", safe("confirm click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.querySelector(".panel-body").remove();
  node.appendChild(acts);
  return pushPanel("confirm:" + (o.id || "action"), node, { hints:["navLR", "confirm", "cancel"] });
}

/* A modal "working…" card for an operation that has to finish before
   the human can do anything else (connecting to Wi-Fi, pairing). */
function busyPanel(title, sub){
  const node = panelShell(title, sub, "Working");
  const body = node.querySelector(".panel-body");
  const st = statEl("Starting…", null, true);
  body.appendChild(st);
  /* Deliberately no focusables: Circle still pops the scope, so the
     human is never trapped, but there is nothing to press by mistake. */
  const sc = pushPanel("busy", node, { hints:["cancel"], items:[] });
  return {
    scope: sc,
    say(text, kind, spinning){ setStat(st, text, kind, spinning === undefined ? true : spinning); },
    close(){ if (Focus.top() === sc) Focus.pop(); }
  };
}

const PANEL_BUILD = {

  /* Power. Restart and shut down are two presses, never one: a stray
     Cross on a console must not take the machine down mid-game. */
  power(){
    const node = panelShell("Power", "Rest keeps the session in memory. Restart and shut down ask again before they act.");
    const body = node.querySelector(".panel-body");
    [
      { label:"Rest mode",  sub:"Suspend to RAM — wake with the controller or the power button", icon:"rest",    act:"power",  arg:"sleep" },
      { label:"Restart",    sub:"Close everything and reboot the machine",                        icon:"restart", act:"powerConfirm", arg:"restart",  tone:"danger" },
      { label:"Shut down",  sub:"Close everything and power off",                                 icon:"shut",    act:"powerConfirm", arg:"shutdown", tone:"danger" },
      { label:"Sign out",   sub:"End this Windows session and return to the sign-in screen",      icon:"signout", act:"powerConfirm", arg:"signout",  tone:"danger" }
    ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
    if (!Host.caps.power)
      body.appendChild(noteEl("Restart and shut down route through the host's Shell Launcher exit codes on this build. " +
        "<b>Rest mode and sign out need host build v3</b> and will say so if the running host cannot do them."));
    return { node };
  },

  /* Profile. Real values when the host reports them, a labelled
     placeholder when it does not — never an invented user name. */
  profile(){
    const node = panelShell("Profile", "The Windows account this shell is running as.");
    const body = node.querySelector(".panel-body");

    const head = document.createElement("div");
    head.className = "profile";
    const user = hostValue("user", "(host has not reported the user)");
    head.innerHTML = '<div class="avatar"></div><div class="profile-id"><b></b><small></small></div>';
    head.querySelector(".avatar").textContent = (user[0] || "?").toUpperCase();
    head.querySelector("b").textContent = user;
    head.querySelector("small").textContent =
      hostValue("machine", "(host has not reported the machine name)") + " · " + hostValue("os", "Windows");
    body.appendChild(head);

    body.appendChild(factsEl([
      ["Account",  user],
      ["Machine",  hostValue("machine")],
      ["Domain",   hostValue("domain")],
      ["OS build", hostValue("os")],
      ["Uptime",   hostValue("uptime")]
    ]));
    [
      { label:"Switch user",      sub:"Stub — the account picker is not built yet", icon:"swap",    act:"stub", arg:"Switch user" },
      { label:"Account settings", sub:"Opens Settings → About",                     icon:"gear",    act:"settingsCat", arg:"about" },
      { label:"Sign out",         sub:"End this Windows session",                   icon:"signout", act:"powerConfirm", arg:"signout", tone:"danger" }
    ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
    if (!Host.sys) body.appendChild(noteEl("<b>Placeholder values above.</b> The running host build does not report system information; host v3 fills these in."));
    return { node };
  },

  /* Settings. A category rail on the left, a content pane on the right,
     both pad-navigable, left/right crossing between them — and every
     pane reading and writing the real machine through Sys. */
  settings(){
    const node = panelShell("Settings",
      "Everything here reads the running machine. Anything the hardware cannot do says so instead of pretending.");
    const body = node.querySelector(".panel-body");
    const wrap = document.createElement("div");
    wrap.className = "settings";
    const cats = document.createElement("nav"); cats.className = "set-cats";
    const pane = document.createElement("div"); pane.className = "set-pane";
    wrap.appendChild(cats); wrap.appendChild(pane);
    body.appendChild(wrap);

    SET_CATS.forEach((c, i) => {
      cats.appendChild(rowEl({ label:c.label, sub:c.sub, icon:c.icon, act:"settingsCat", arg:c.id }, i, 0));
    });

    let shownCat = null;
    let paintSeq = 0;                     // guards a late async render of a pane you left
    let stale = false;                    // the pane changed while a picker sat on top of us

    /* Re-collect the scope's focusables after the pane's DOM changed.
       withRepaint is false while we are INSIDE repaint() (the scope's
       own onFocus hook calls paintPane) and true from an async
       continuation, which is not.

       A pane very often changes while something is stacked above it —
       a picker commits a setting and asks for a repaint before it pops.
       Syncing then would be syncing the wrong scope, so it is deferred:
       the flag is cleared the moment this scope is the top one again. */
    function sync(withRepaint){
      const sc0 = Focus.top();
      if (!sc0 || sc0.id !== "panel:settings"){ stale = true; return; }
      const keep = (Focus.current(sc0) || {}).el;
      Focus.syncItems(sc0, Focus.collect(node), keep && keep.isConnected ? keep : null);
      stale = false;
      if (withRepaint) Focus.repaint();
    }

    /* Called from the scope's onFocus hook, so it must be idempotent and
       must not re-enter repaint() during its synchronous part. */
    function paintPane(catId, force){
      const cat = SET_CATS.find(c => c.id === catId) || SET_CATS[0];
      if (cat.id === shownCat && !force) return;
      shownCat = cat.id;
      const mySeq = ++paintSeq;

      const sc0 = Focus.top();
      const keep = sc0 && sc0.id === "panel:settings" ? (Focus.current(sc0) || {}).el : null;
      pane.innerHTML = "";                       // read `keep` first: this removes nodes
      const h = document.createElement("h3"); h.textContent = cat.label;
      const p = document.createElement("p");  p.textContent = cat.blurb;
      pane.appendChild(h); pane.appendChild(p);
      cats.querySelectorAll(".row").forEach((r, i) =>
        r.setAttribute("aria-current", String(SET_CATS[i].id === cat.id)));

      let rowN = 0;
      const ctx = {
        pane,
        /* alive() is the whole reason a slow pane cannot corrupt a fast
           one: every async continuation checks it before touching the
           DOM, so walking down the category list while Wi-Fi is still
           scanning simply abandons the scan's render. */
        alive(){ return mySeq === paintSeq && pane.isConnected; },
        sec(title){ const e = document.createElement("h4"); e.textContent = title; pane.appendChild(e); return e; },
        add(el){ if (el) pane.appendChild(el); return el; },
        facts(pairs){ const e = factsEl(pairs); pane.appendChild(e); return e; },
        stat(text, kind, spinning){ const e = statEl(text, kind, spinning); pane.appendChild(e); return e; },
        note(html){ const e = noteEl(html); pane.appendChild(e); return e; },
        err(title, e){ const n = errEl(title, e); pane.appendChild(n); return n; },
        /* Rows are numbered as they are appended, all in column 1: the
           pane is one vertical list beside the category list. */
        row(o){ const b = actionRow(o, rowN++, 1); pane.appendChild(b); return b; },
        slider(o){ const b = sliderRow(o, rowN++, 1); pane.appendChild(b); return b; },
        sync(){ if (ctx.alive()) sync(true); },
        refresh(){ if (ctx.alive()) paintPane(cat.id, true); }
      };

      /* The synchronous part is done; hand the pane to the category and
         let it fill in from the OS. Nothing below can throw into the
         focus manager: a builder that fails renders an error card and
         the rest of the shell is untouched. */
      sync(false);
      Promise.resolve()
        .then(() => cat.build(ctx))
        .then(() => { if (ctx.alive()) sync(true); })
        .catch(e => {
          if (!ctx.alive()) return;
          hostLog("settings pane '" + cat.id + "' failed: " + (e && e.code ? e.code : "") + " " + (e && e.message));
          ctx.err("This section could not be read", e);
          sync(true);
        });
    }

    paintPane(SET_CATS[0].id);
    /* Let an action that changes what a pane shows (committing a name
       through the keyboard, applying a setting) force a redraw without
       knowing anything about this closure. */
    settingsRepaint = function(){ if (shownCat) paintPane(shownCat, true); };
    settingsGoto = function(id){
      const i = SET_CATS.findIndex(c => c.id === id);
      if (i < 0) return false;
      const el = cats.children[i];
      if (!el) return false;
      Focus.focusEl(el);
      return true;
    };

    return {
      node,
      scope: {
        hints: ["navAll", "select", "back"],
        crossColumns: true,             // category list | content pane
        onClose(){ settingsRepaint = null; settingsGoto = null; },
        onFocus(it){
          const el = it.el;
          /* First focus after a picker popped: the pane may have been
             rebuilt underneath us while it was on top. Re-collect before
             anything else, or half the rows are nodes that no longer
             exist and the cursor falls into a gap. */
          if (stale){
            stale = false;
            const sc0 = Focus.top();
            if (sc0 && sc0.id === "panel:settings")
              Focus.syncItems(sc0, Focus.collect(node), el.isConnected ? el : null);
          }
          if (el.parentElement === cats){
            const i = [...cats.children].indexOf(el);
            if (SET_CATS[i]) paintPane(SET_CATS[i].id);
          }
          Focus.ensureVisible(el);
        }
      }
    };
  },

  /* The control-centre quick panels are the same real state as the
     Settings categories, cut down to what you would want without
     leaving what you were doing. They share the builders, so the two
     can never drift apart. */
  display(){
    const node = panelShell("Display", "What Windows is driving this panel with, right now.");
    fillAsync(node, "display", (ctx) =>
      Sys.call("display.list").then(d => {
        const m = (d.displays || [])[0];
        if (!m){ ctx.stat("Windows reported no displays.", "bad"); return; }
        const hdr = m.hdr || {};
        ctx.facts([
          ["Display",    orDash(m.name)],
          ["Resolution", orDash(m.resolution)],
          ["Refresh",    fmtHz(m.refreshHz)],
          ["Scale",      m.scalePercent ? m.scalePercent + "%" : "—"],
          ["HDR",        !hdr.queryable ? "not exposed" : (!hdr.supported ? "unsupported" : (hdr.enabled ? "On" : "Off"))]
        ]);
        ctx.row({ label:"Resolution and refresh rate", sub:"Reverts itself unless you confirm the change",
                  tail:m.resolution, icon:"info", run: () => displayModePicker(m) });
        ctx.row({ label:"All display settings", sub:"Opens Settings → Display", icon:"gear",
                  run: () => ACT.settingsCatId("display") });
      }).catch(e => { ctx.err("Displays could not be read", e); }));
    return { node };
  },

  net(){
    const node = panelShell("Network", "The connection this console is actually using.");
    fillAsync(node, "net", (ctx) =>
      Sys.call("net.status").then(n => {
        const r = n.reachability || {};
        const up = (n.adapters || []).filter(a => a.up && !a.isVirtual);
        const primary = up.filter(a => a.routable)[0] || up[0] || null;
        ctx.facts([
          ["Internet",  r.internet ? "Reachable" : (r.connected ? "Local only" : "Not connected")],
          ["Type",      n.connectionType === "wifi" ? "Wi-Fi" : (n.connectionType === "ethernet" ? "Wired" : orDash(n.connectionType))],
          ["Adapter",   primary ? primary.name : "— none up"],
          ["Address",   primary && primary.ipv4 && primary.ipv4[0] ? primary.ipv4[0].address : "—"],
          ["Speed",     primary ? orDash(primary.linkSpeedText) : "—"]
        ]);
        ctx.row({ label:"All network settings", sub:"Opens Settings → Network", icon:"gear",
                  run: () => ACT.settingsCatId("network") });
      }).catch(e => { ctx.err("The network state could not be read", e); }));
    return { node };
  },

  sound(){
    const node = panelShell("Sound", "The Windows mixer. Left and right adjust the volume.");
    fillAsync(node, "sound", (ctx) =>
      Sys.call("audio.devices").then(a => {
        const outs = a.outputs || [];
        const cur = outs.filter(o => o.isDefault)[0] || outs[0];
        if (!cur){ ctx.stat("Windows reports no active output device.", "bad"); return; }
        ctx.slider({
          label:"Volume", value:cur.volume || 0, muted:!!cur.muted, step:0.05,
          hint:"Left and right adjust · Cross toggles mute · " + cur.shortName,
          commit(v){ return Sys.call("audio.setVolume", { id:cur.id, level:v }, { timeout:8000 }); },
          activate(el){
            const next = !cur.muted;
            Sys.call("audio.setMute", { id:cur.id, muted:next }, { timeout:8000 }).then(
              () => { cur.muted = next; el.__arcSetMuted(next); toast(next ? "Output muted." : "Output unmuted."); },
              e  => toast(Sys.say(e)));
          }
        });
        outs.forEach(o => ctx.row({
          label:o.name, sub:o.formFactor || "Endpoint",
          tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
          icon:"info",
          run: () => {
            if (o.isDefault){ toast(o.shortName + " is already the default output."); return; }
            Sys.call("audio.setDefault", { id:o.id, flow:"output", role:"all" }, { timeout:12000 }).then(
              () => { toast("Output switched to " + o.shortName + "."); Focus.pop(); openPanel("sound"); },
              e  => toast(Sys.say(e)));
          }
        }));
        ctx.row({ label:"All sound settings", sub:"Opens Settings → Sound", icon:"gear",
                  run: () => ACT.settingsCatId("sound") });
      }).catch(e => { ctx.err("The mixer could not be read", e); }));
    return { node };
  },

  mic(){
    const node = panelShell("Microphone", "The Windows capture endpoint — the real one, not a shell flag.");
    fillAsync(node, "mic", (ctx) =>
      Sys.call("audio.devices").then(a => {
        const ins = a.inputs || [];
        const cur = ins.filter(o => o.isDefault)[0] || ins[0];
        if (!cur){
          ctx.stat("Windows reports no active capture device.", "bad");
          ctx.note("Nothing to mute: this machine has <b>no active microphone endpoint</b>. " +
            "A headset or a webcam would make one appear.");
          return;
        }
        ctx.facts([
          ["Device", cur.name],
          ["Level",  Math.round((cur.volume || 0) * 100) + "%"],
          ["State",  cur.muted ? "Muted" : "Live"]
        ]);
        ctx.row({ label: cur.muted ? "Unmute the microphone" : "Mute the microphone",
                  sub:"Sets mute on the endpoint itself, so every app sees it",
                  tailHTML: cur.muted ? tagHTML("muted", "warn") : tagHTML("live", "on"),
                  icon:"info",
                  run: () => Sys.call("audio.setMute", { id:cur.id, flow:"input", muted:!cur.muted }, { timeout:8000 })
                    .then(() => { toast(cur.muted ? "Microphone unmuted." : "Microphone muted."); Focus.pop(); openPanel("mic"); },
                          e  => toast(Sys.say(e))) });
        ctx.slider({
          label:"Input level", value:cur.volume || 0, step:0.05,
          hint:"Left and right adjust · " + cur.shortName,
          commit(v){ return Sys.call("audio.setVolume", { id:cur.id, flow:"input", level:v }, { timeout:8000 }); }
        });
      }).catch(e => { ctx.err("The capture endpoint could not be read", e); }));
    return { node };
  }
};

/* Fill a control-centre panel from the OS after it is already on
   screen. The panel opens instantly with a spinner rather than waiting
   on the system — a control centre that stalls before it appears is
   worse than one that fills in. */
function fillAsync(node, panelId, fn){
  const body = node.querySelector(".panel-body");
  const loading = statEl("Reading…", null, true);
  body.appendChild(loading);
  let n = 0;
  const ctx = {
    alive(){ return body.isConnected; },
    add(el){ if (el) body.appendChild(el); return el; },
    facts(pairs){ return ctx.add(factsEl(pairs)); },
    sec(t){ const e = document.createElement("h4"); e.textContent = t; return ctx.add(e); },
    stat(t, k, s){ return ctx.add(statEl(t, k, s)); },
    note(h){ return ctx.add(noteEl(h)); },
    err(t, e){ return ctx.add(errEl(t, e)); },
    row(o){ return ctx.add(actionRow(o, n++, 0)); },
    slider(o){ return ctx.add(sliderRow(o, n++, 0)); },
    sync(){
      const sc = Focus.top();
      if (!sc || sc.id !== "panel:" + panelId) return;
      Focus.syncItems(sc, Focus.collect(node), (Focus.current(sc) || {}).el);
      Focus.repaint();
    }
  };
  Promise.resolve()
    .then(() => fn(ctx))
    .then(() => { loading.remove(); if (ctx.alive()) ctx.sync(); })
    .catch(err => {
      loading.remove();
      if (!ctx.alive()) return;
      report("panel " + panelId + " content", err);
      ctx.err("This panel could not be read", err);
      ctx.sync();
    });
  return ctx;
}

/* ═══ The nine settings categories ═══════════════════════
   Each one owns an async build(ctx) that reads the machine through
   Sys and writes what it finds. The rules every category obeys:

     * a value on screen was read from this machine, or it is labelled;
     * a control that cannot work here is absent or says why, never a
       button that fails when pressed;
     * a failure renders as a sentence, not as an empty section.       */

const SET_CATS = [

  /* ── 1. Network ─────────────────────────────────────────
     The bench is wired with no Wi-Fi radio at all, so the
     "no adapter" path is a first-class state here, not an error. */
  { id:"network", label:"Network", sub:"Wi-Fi, wired, address", icon:"info",
    blurb:"Connection state read from Windows. Wi-Fi controls appear only if this machine has a radio.",
    build(ctx){
      const loading = ctx.stat("Reading network state…", null, true);
      return Sys.call("net.status").then(net => {
        if (!ctx.alive()) return;
        loading.remove();

        const r = net.reachability || {};
        const adapters = (net.adapters || []).filter(a => a.up && !a.isVirtual);
        const primary = adapters.filter(a => a.routable)[0] || adapters[0] || null;

        ctx.sec("Connection");
        ctx.facts([
          ["Internet", r.internet ? "Reachable" : (r.connected ? "Local network only" : "Not connected")],
          ["Type",     net.connectionType === "wifi" ? "Wi-Fi" : (net.connectionType === "ethernet" ? "Wired Ethernet" : orDash(net.connectionType))],
          ["Adapter",  primary ? primary.name : "— none up"],
          ["Hardware", primary ? primary.description : "—"],
          ["IPv4",     primary && primary.ipv4 && primary.ipv4[0] ? (primary.ipv4[0].address + "/" + primary.ipv4[0].prefixLength) : "—"],
          ["Gateway",  primary && primary.gateways && primary.gateways[0] ? primary.gateways[0] : "—"],
          ["DNS",      primary && primary.dns && primary.dns.length ? primary.dns.slice(0, 2).join(", ") : "—"],
          ["Link speed", primary ? orDash(primary.linkSpeedText) : "—"],
          ["Host name", orDash(net.hostName)]
        ]);

        ctx.row({ label:"All adapters", sub:(net.adapters || []).length + " known to Windows, including virtual ones",
                  icon:"info", run: () => showAdapters(net) });

        return Sys.call("wifi.status").then(w => ({ w:w, net:net }), e => ({ err:e, net:net }));
      }).then(res => {
        if (!ctx.alive() || !res) return;
        ctx.sec("Wi-Fi");

        /* The two ways there is no Wi-Fi: the WLAN service refused us
           (wifi_unavailable) or it answered with no interfaces. Both
           are ordinary states on a wired console, and both say so. */
        const noRadio = res.err
          ? (res.err.code === "wifi_unavailable" || res.err.code === "no_wifi_adapter")
          : !(res.w && res.w.present && (res.w.interfaces || []).length);

        if (noRadio){
          ctx.stat("No Wi-Fi adapter found on this machine.", "bad");
          ctx.note("This console is on <b>wired Ethernet</b> and has no wireless radio, so there is nothing to scan, " +
            "connect to or forget. Wi-Fi controls are hidden rather than shown as buttons that would fail.");
          if (res.err && res.err.code !== "wifi_unavailable" && res.err.code !== "no_wifi_adapter")
            ctx.err("Windows reported", res.err);
          return;
        }
        if (res.err){ ctx.err("Wi-Fi state could not be read", res.err); return; }

        const iface = (res.w.interfaces || [])[0] || {};
        const conn = iface.connection || null;
        ctx.facts([
          ["Adapter",  orDash(iface.description)],
          ["State",    orDash(iface.state)],
          ["Network",  conn && conn.connected ? conn.ssid : "not associated"],
          ["Security", conn && conn.connected ? orDash(conn.security) : "—"],
          ["Signal",   conn && conn.connected ? (conn.signal + "%  (" + conn.rssiDbm + " dBm)") : "—"],
          ["Rate",     conn && conn.connected && conn.rxRateKbps ? Math.round(conn.rxRateKbps / 1000) + " Mbps" : "—"]
        ]);

        ctx.row({ label:"Available networks", sub:"Scan for networks in range and join one",
                  icon:"info", run: () => wifiBrowser() });
        ctx.row({ label:"Saved networks",
                  sub:(iface.savedProfiles || []).length + " profile" + ((iface.savedProfiles || []).length === 1 ? "" : "s") + " stored on this machine",
                  icon:"disk", run: () => wifiProfiles(iface.savedProfiles || []) });
        if (conn && conn.connected)
          ctx.row({ label:"Disconnect from " + conn.ssid, sub:"Drops the wireless association; wired links are untouched",
                    icon:"signout", tone:"danger",
                    run: () => confirmAction({
                      id:"wifi-disconnect", title:"Disconnect from " + conn.ssid + "?",
                      sub:"Anything using this connection loses it immediately.",
                      goLabel:"Disconnect",
                      onConfirm: () => Sys.call("wifi.disconnect").then(
                        () => { toast("Disconnected from " + conn.ssid + "."); if (settingsRepaint) settingsRepaint(); },
                        e  => toast(Sys.say(e)))
                    }) });
      });
    } },

  /* ── 3. Sound ───────────────────────────────────────────── */
  { id:"sound", label:"Sound", sub:"Output device, volume", icon:"info",
    blurb:"The Windows mixer, live. The volume slider is adjusted with left and right.",
    build(ctx){
      const loading = ctx.stat("Reading audio endpoints…", null, true);
      return Sys.call("audio.devices").then(a => {
        if (!ctx.alive()) return;
        loading.remove();
        const outs = a.outputs || [];
        const cur = outs.filter(o => o.isDefault)[0] || outs[0] || null;

        /* Devices first, volume second — deliberately. Crossing into this
           pane from the category list lands on the first row, and that

            icon:"info",
            run: () => {

                () => { toast("Output switched to " + o.shortName + "."); if (settingsRepaint) settingsRepaint(); },

        });

        ctx.sec("Volume");
        if (!cur){
          ctx.stat("Windows reports no active output device.", "bad");
        } else {
          const sl = ctx.slider({
            label:"Volume", value: typeof cur.volume === "number" ? cur.volume : 0,
            muted: !!cur.muted, step:0.05,
            hint:"Left and right adjust · Cross toggles mute · " + cur.shortName,
            commit(v){ return Sys.call("audio.setVolume", { id:cur.id, level:v }, { timeout:8000 }); },
            activate(el){
              const next = !cur.muted;
              Sys.call("audio.setMute", { id:cur.id, muted:next }, { timeout:8000 }).then(() => {
                cur.muted = next;
                el.__arcSetMuted(next);
                toast(next ? "Output muted." : "Output unmuted.");
              }, e => toast(Sys.say(e)));
            }
          });
          sl.setAttribute("aria-label", "Volume");
        }

        const ins = a.inputs || [];
        ctx.sec("Input");
        if (!ins.length) ctx.stat("No active capture endpoints.", "bad");
        ins.forEach(o => {
          ctx.row({
            label:o.name, sub:(o.formFactor || "Endpoint") + " · " + Math.round((o.volume || 0) * 100) + "%"
                 + (o.muted ? " · muted" : ""),
            tailHTML: o.isDefault ? tagHTML("default", "on") : tagHTML("set default"),
            icon:"info",
            run: () => {

                const next = !o.muted;
                Sys.call("audio.setMute", { id:o.id, flow:"input", muted:next }, { timeout:8000 }).then(
                  () => { toast(next ? "Microphone muted." : "Microphone unmuted."); if (settingsRepaint) settingsRepaint(); },
                  e  => toast(Sys.say(e)));

                () => { toast("Input switched to " + o.shortName + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)));
            }
          });
        });
      });
    } },

  /* ── 4. Controllers ─────────────────────────────────────

            ["Connection", p.transport === "BT" ? "Bluetooth" : (p.transport === "USB" ? "USB cable" : orDash(p.transport))],
            ["Hardware ID", "VID 0x" + (p.vid || 0).toString(16).toUpperCase().padStart(4, "0")
                          + " · PID 0x" + (p.pid || 0).toString(16).toUpperCase().padStart(4, "0")],
            ["Input reports", (p.reports || 0).toLocaleString() + " read"]
          ];
          facts.splice(2, 0, ["Battery", p.batteryKnown

          if (p.batteryKnown)

        } else {
          ctx.stat(p ? ("No pad on the host's HID channel — " + orDash(p.status)) : "The host did not report a pad.", "bad");
        }

        ctx.sec("Seen by the page");
        ctx.facts(padFacts());
        ctx.row({ label:"Re-read the controller", sub:"Ask the host for a fresh HID snapshot",
                  icon:"update", run: () => { padInfoAt = -1e9; if (settingsRepaint) settingsRepaint(); } });

        return Sys.call("bt.status").then(b => b, e => ({ __err:e }));
      }).then(b => {
        if (!ctx.alive() || !b) return;
        ctx.sec("Bluetooth");
        if (b.__err){ ctx.err("Bluetooth state could not be read", b.__err); return; }
        if (!b.present){
          ctx.stat("No Bluetooth radio found on this machine.", "bad");

        ctx.facts([

          ["Address", (b.radios && b.radios[0] && b.radios[0].address) ? b.radios[0].address : "—"],
          ["Control", orDash(b.radioControl)]

                  tailHTML: b.enabled ? tagHTML("on", "on") : tagHTML("off"),
                  icon:"pad",
                  run: () => Sys.call("bt.setRadio", { enabled: !b.enabled }, { timeout:20000 }).then(
                    () => { toast("Bluetooth " + (b.enabled ? "off" : "on") + "."); if (settingsRepaint) settingsRepaint(); },
                    e  => toast(Sys.say(e))) });
        ctx.row({ label:"Pair a new controller", sub:"Puts the radio into a discovery sweep and lists what answers",
                  icon:"pad", run: () => btBrowser() });

        return Sys.call("bt.devices").then(d => d, e => ({ __err:e }));
      }).then(d => {
        if (!ctx.alive() || !d) return;
        if (d.__err){ ctx.err("Paired devices could not be read", d.__err); return; }
        const devs = d.devices || [];
        ctx.sec("Paired devices");
        if (!devs.length){ ctx.stat("Nothing is paired with this machine.", null); return; }
        devs.forEach(dev => {
          ctx.row({
            label: dev.name || dev.address,
            sub: [dev.address, dev.deviceClass, dev.looksLikeGamepad ? "gamepad" : null]
                   .filter(Boolean).join(" · "),
            tailHTML: dev.connected ? tagHTML("connected", "on") : tagHTML("paired"),
            icon: dev.looksLikeGamepad ? "pad" : "info",
            run: () => confirmAction({
              id:"bt-unpair", title:"Forget " + (dev.name || dev.address) + "?",
              sub:"Windows removes the pairing. You would have to pair it again to use it.",
              goLabel:"Forget",
              onConfirm: () => Sys.call("bt.unpair", { address:dev.address }, { timeout:20000 }).then(
                () => { toast("Removed " + (dev.name || dev.address) + "."); if (settingsRepaint) settingsRepaint(); },
                e  => toast(Sys.say(e)))
            })
          });
        });
      });
    } },

  /* ── 5. Power ───────────────────────────────────────────

  /* ── 6. Storage ─────────────────────────────────────────── */

        const free  = drives.reduce((n, d) => n + (d.freeBytes  || 0), 0);

          ["Drives",     drives.length + (skipped ? "  (" + skipped + " not ready, skipped)" : "")],
          ["Total",      fmtBytes(total)],

  /* ── 7. System / Update ─────────────────────────────────
     Deliberately has NO install button. Installing needs administrator
     rights this shell does not have, so the honest design is to report
     what is pending and let Windows Update install on its schedule.
     A fake progress bar here would be a lie with a spinner on it. */
  { id:"update", label:"System", sub:"Build, updates", icon:"update",
    blurb:"What this machine is, and what Windows Update has pending for it.",
    build(ctx){
      const loading = ctx.stat("Reading system information…", null, true);
      return Sys.call("sys.info").then(i => {
        if (!ctx.alive()) return;
        loading.remove();
        const os = i.os || {}, cpu = i.cpu || {}, mem = i.memory || {};
        ctx.sec("This machine");
        ctx.facts([
          ["Windows",   orDash(os.productName)],
          ["Version",   (os.displayVersion || "?") + "  ·  build " + (os.buildFull || os.build || "?")],
          ["Edition",   orDash(os.edition)],
          ["Processor", orDash(cpu.name)],
          ["Cores",     cpu.logicalProcessors ? cpu.logicalProcessors + " logical" : "—"],
          ["Memory",    mem.totalGB ? (mem.totalGB + " GB  ·  " + mem.usedPercent + "% in use") : "—"],
          ["Uptime",    orDash(i.uptimeText)],
          ["Installed", os.installedUtc ? new Date(os.installedUtc).toLocaleDateString() : "—"]
        ]);

        ctx.sec("Windows Update");
        const st = ctx.stat("No search has run yet this session.", null, false);
        const listBox = document.createElement("div");
        ctx.add(listBox);

        function render(list){
          listBox.innerHTML = "";
          const ups = (list && list.updates) || [];
          if (!ups.length){
            setStat(st, "No pending updates were found.", "good", false);
          } else {
            setStat(st, ups.length + " update" + (ups.length === 1 ? "" : "s") + " pending.", null, false);
            ups.slice(0, 12).forEach(u => {
              const d = document.createElement("div");
              d.className = "drive";
              const t = document.createElement("div");
              t.className = "drive-top";
              const b = document.createElement("b"); b.textContent = u.title || "(untitled update)";
              t.appendChild(b);
              const sub = document.createElement("div");
              sub.className = "drive-sub";
              sub.textContent = [(u.kb || []).join(" "),
                                 u.severity || null,
                                 u.mandatory ? "mandatory" : null,
                                 u.sizeBytes ? fmtBytes(u.sizeBytes) : null,
                                 u.downloaded ? "downloaded" : null,
                                 u.rebootRequired ? "needs a restart" : null].filter(Boolean).join(" · ") || "pending";
              d.appendChild(t); d.appendChild(sub);
              listBox.appendChild(d);
            });
            if (ups.length > 12) listBox.appendChild(statEl("…and " + (ups.length - 12) + " more.", null));
          }
          if (ctx.alive()) ctx.sync();
        }

        ctx.row({ label:"Check for updates",
                  sub:"Asks Windows Update. This can take a minute or two — the shell stays live throughout.",
                  icon:"update",
                  run(el){
                    const label = el.querySelector(".row-text small");
                    setStat(st, "Searching Windows Update…", null, true);
                    let cancelled = false;
                    Sys.job("updates.check", {}, {
                      timeout: 180000,
                      isCancelled: () => cancelled || !ctx.alive(),
                      onProgress(p){
                        if (!ctx.alive()){ cancelled = true; return; }
                        setStat(st, "Searching Windows Update… " + Math.round(p.elapsedMs / 1000) + " s"
                          + (p.phase ? "  ·  " + p.phase : ""), null, true);
                      }
                    }).then(res => {
                      if (!ctx.alive()) return;
                      render(res);
                      if (label) label.textContent = "Last checked just now.";
                    }, e => {
                      if (!ctx.alive()) return;
                      setStat(st, "Update check failed: " + Sys.say(e), "bad", false);
                    });
                  } });

        ctx.note("<b>Updates install on Windows' own schedule.</b> There is no install button here on purpose: " +
          "installing needs administrator rights that this shell deliberately does not have, so a button would " +
          "only ever fail. This screen reports honestly what is pending.");

        /* If a check already ran in this host process, show its result
           immediately rather than making the human re-run a two-minute
           search to see what the shell already knows. */
        return Sys.call("updates.list").then(l => { if (ctx.alive()) render(l); },
                                             () => { /* no_search_yet is the normal first state */ });
      });
    } },

  /* ── 8. Date & time ─────────────────────────────────────
     The time zone is settable by this account; the clock itself is
     not. Rather than offer a control that fails, the panel says which
     privilege is missing and who owns the clock instead. */
  { id:"time", label:"Date & time", sub:"Clock, time zone", icon:"info",
    blurb:"The system clock and time zone. The zone is yours to change; the clock belongs to Windows.",
    build(ctx){
      const loading = ctx.stat("Reading the clock…", null, true);
      return Sys.call("sys.time").then(t => {
        if (!ctx.alive()) return;
        loading.remove();
        const tz = t.timeZone || {}, ntp = t.ntp || {};
        ctx.sec("Now");
        ctx.facts([
          ["Date",      orDash(t.dateFormatted)],
          ["Time",      orDash(t.timeFormatted)],
          ["UTC",       t.utcIso ? t.utcIso.replace("T", " ").replace(/\..*/, "") + "Z" : "—"],
          ["Time zone", orDash(tz.displayName)],
          ["Offset",    typeof tz.currentUtcOffsetMinutes === "number"
                          ? fmtOffset(tz.currentUtcOffsetMinutes) + (tz.inDaylightSaving ? "  (daylight saving)" : "") : "—"]
        ]);

        ctx.sec("Time zone");
        ctx.row({ label:"Change the time zone", sub:"Every zone Windows has installed", tail:tz.id || "—",
                  icon:"info", run: () => timezonePicker(tz.id) });

        ctx.sec("Synchronisation");
        ctx.facts([
          ["Automatic",  ntp.autoSync ? "On" : "Off"],
          ["Source",     orDash(ntp.syncType)],
          ["Server",     orDash(ntp.server)],
          ["Last good",  ntp.lastKnownGoodUtc ? new Date(ntp.lastKnownGoodUtc).toLocaleString() : "—"],
          ["W32Time",    orDash(ntp.serviceState)]
        ]);

        return Sys.call("sys.privileges").then(p => p, () => null);
      }).then(p => {
        if (!ctx.alive()) return;
        const rel = (p && p.relevantPrivileges) || {};
        if (rel.SeSystemtimePrivilege === false || !p){
          ctx.note("<b>Setting the clock is not offered here.</b> This shell runs as a standard user, which does " +
            "not hold <code>SeSystemtimePrivilege</code>, so a \"set the time\" control could only ever fail. " +
            "Windows keeps the clock synchronised against its time server instead. Changing the <b>time zone</b> " +
            "does work — that needs a different privilege, which this account does hold.");
        } else {
          ctx.note("This account holds <code>SeSystemtimePrivilege</code>, but the clock is still left to Windows' " +
            "time service: two authorities setting one clock is how a console ends up minutes out.");
        }
        return Sys.call("sys.locale").then(l => {
          if (!ctx.alive() || !l) return;
          ctx.sec("Region and format");
          ctx.facts([
            ["Locale",   (l.cultureDisplayName || l.culture || "—")],
            ["Region",   (l.region && l.region.displayName) || orDash(l.country)],
            ["Clock",    l.uses24HourClock ? "24-hour" : "12-hour"],
            ["Date format", orDash(l.shortDatePattern)],
            ["Keyboard", (l.inputLanguages || []).join(", ") || "—"]
          ]);
        }, () => {});
      });
    } },

  /* ── 9. About ───────────────────────────────────────────── */
  { id:"about", label:"About", sub:"Device, accounts, build", icon:"info",
    blurb:"What this console is, who can sign into it, and what the shell itself is running on.",
    build(ctx){

                tail: deviceName || "Set…", icon:"info", run: () => ACT.deviceName() });

      const loading = ctx.stat("Reading system information…", null, true);

      }).then(a => {
        if (!ctx.alive() || !a) return;
        ctx.sec("Accounts");
        if (a.__err){ ctx.err("Accounts could not be read", a.__err); }
        else {
          const users = (a.users || []).filter(u => u.enabled);

               u.signedIn ? "signed in" : null,
               u.isCurrentUser ? "this session" : null].filter(Boolean).join(" · ")
            ]]));
          });
          if (!users.length) ctx.stat("No enabled local accounts were reported.", "bad");
          ctx.stat("Read-only by design: creating, deleting and re-passwording accounts is not something a " +
            "living-room shell should be able to do.", null);
        }

        ctx.sec("Shell");
        ctx.facts([
          ["ARC OS",     "1.0"],
          ["Host",       Host.caps.sys ? "ShellHostWeb v4 (system channel live)"
                        : (Host.caps.nav ? "ShellHostWeb v3 — no system channel" : "ShellHostWeb v2 (legacy pad channel)")],
          ["Keyboard",   window.ArcOSK ? ("ArcOSK " + (window.ArcOSK.version || "loaded")) : "not loaded"],
          ["Explorer",   window.ArcFiles
                          ? ("ArcFiles " + (window.ArcFiles.version || "loaded")
                             + (Host.caps.fs ? " — host fs channel live" : " — host has no fs channel"))
                          : "not loaded"],
          ["Browser",    window.ArcBrowser
                          ? ("ArcBrowser " + (window.ArcBrowser.version || "loaded")
                             + (Host.caps.browser ? " — content WebView available" : " — host has no browser channel"))
                          : "not loaded"],
          ["Renderer",   (navigator.userAgent.match(/Edg\/[\d.]+/) || ["Edge (unknown build)"])[0]],
          ["Page",       location.href],
          ["Root scale", remPx().toFixed(2) + " px / rem"]
        ]);
        ctx.row({ label:"System API catalogue", sub:"Every command this host exposes, and which need rights it lacks",
                  icon:"info", run: () => apiCatalogue() });
      });
    } }
];

/* ── Wi-Fi ───────────────────────────────────────────────
   The scan is a job: the list appears immediately from the cache and
   is replaced when the real sweep lands, with a spinner in between. */
function wifiBrowser(){
  const p = pickerPanel({
    id:"wifi", title:"Available networks", eyebrow:"Wi-Fi",
    sub:"Signal strength and security as Windows reports them.",
    status:"Reading the cached list…", statusSpin:true,
    items: [], emptyText:"No networks in range.",
    onPick: (it) => { if (it.net) wifiConnect(it.net); }
  });
  let gone = false;
  const scope = p.scope;
  const alive = () => !gone && Focus.has(scope.id);

  function toItems(list){
    return (list || []).map(n => ({
      net: n,
      label: n.ssid || "(hidden network)",
      sub: [n.secure ? n.security : "Open — no encryption",
            n.band, n.bssCount > 1 ? n.bssCount + " access points" : null,
            n.savedProfile ? "saved" : null].filter(Boolean).join(" · "),
      tailHTML: (n.connected ? tagHTML("connected", "on") : "") + sigHTML(n.bars),
      icon: "info"
    }));
  }
  function pull(statusText, spinning){
    return Sys.call("wifi.list").then(l => {
      if (!alive()) return;
      p.paint(toItems(l.networks), statusText, null, spinning);
    }, e => {
      if (!alive()) return;
      p.paint([], Sys.say(e), "bad", false);
    });
  }

  pull("Scanning for networks…", true).then(() => {
    if (!alive()) return;
    return Sys.job("wifi.scan", { timeoutMs: 10000 }, {
      timeout: 40000,
      isCancelled: () => !alive(),
      onProgress: () => { pull("Scanning for networks…", true); }
    }).then(res => {
      if (!alive()) return;
      const items = toItems(res.networks);
      p.paint(items, items.length + " network" + (items.length === 1 ? "" : "s") + " in range.", null, false);
    }, e => {
      if (!alive()) return;
      if (e.code === "cancelled") return;
      /* A failed sweep still leaves the cached list on screen — say the
         sweep failed rather than blanking what we already showed. */
      pull("Scan failed: " + Sys.say(e), false);
    });
  });

  const origPop = scope.onPop;
  scope.onPop = function(){ gone = true; if (origPop) origPop(); };
}

function wifiConnect(net){
  const ssid = net.ssid || "";
  if (net.connected){ toast("Already connected to " + ssid + "."); return; }

  function go(password){
    const busy = busyPanel("Connecting to " + ssid, "Windows is creating a profile and associating with the network.");
    Sys.job("wifi.connect", {
      ssid: ssid,
      password: password || undefined,
      security: net.secure ? "auto" : "OPEN",
      hidden: !!net.hidden,
      timeoutMs: 25000
    }, {
      timeout: 60000,
      onProgress(pr){ busy.say(pr.phase || ("Connecting… " + Math.round(pr.elapsedMs / 1000) + " s"), null, true); }
    }).then(r => {
      busy.close();
      toast(r && r.connected === false
        ? ("Could not join " + ssid + ".")
        : ("Connected to " + ssid + "."));
      if (settingsRepaint) settingsRepaint();
    }, e => {
      busy.close();
      /* A wrong password comes back as a plain connect failure — say
         what to try rather than echoing the API's wording alone. */
      const extra = net.secure && !net.savedProfile ? "  Check the password and try again." : "";
      toast("Could not join " + ssid + ": " + Sys.say(e) + extra);
      hostLog("wifi.connect '" + ssid + "' failed: " + Sys.say(e));
    });
  }

  if (!net.secure || net.savedProfile){ go(null); return; }
  OSK.open({
    title: "Password for " + ssid,
    value: "", mode: "password", maxLength: 63,
    placeholder: "Network password",
    commitLabel: "Join",
    onCommit: safe("wifi password", (v) => {
      if (!v){ toast("No password entered — not joining " + ssid + "."); return; }
      go(v);
    }),
    onCancel: safe("wifi password cancel", () => hostLog("Wi-Fi password cancelled for " + ssid))
  });
}

/* ── Display modes, and the reason this screen is careful ─
   On a television a mode the panel cannot show is a black screen with
   no way back — the pad is invisible too, because you cannot see what
   you are pressing. So the apply path is:

     1. dry-run the mode (CDS_TEST) and refuse it here if it fails;
     2. draw the confirmation FIRST, focused on Revert;
     3. only then apply;
     4. count down out loud, and revert on zero, on Circle, or on any
        error — confirming is the only path that keeps the change.

   Nothing about that depends on the human being able to see: doing
   nothing gets the old mode back. */
function displayModePicker(disp){
  const cur = { w: disp.width, h: disp.height, hz: Math.round(disp.refreshHz) };
  const p = pickerPanel({
    id:"dispmodes", title:"Resolution and refresh rate", eyebrow:"Display",
    sub:disp.name ? ("Modes " + disp.name + " reports to Windows.") : "Modes this display reports to Windows.",
    status:"Reading supported modes…", statusSpin:true,
    items:[], emptyText:"This display reported no modes.",
    onPick: (it) => {
      if (it.isCurrent){ toast("That is already the current mode."); return; }
      displayModeApply(disp, it.mode);
    }
  });
  let gone = false;
  const origPop = p.scope.onPop;
  p.scope.onPop = function(){ gone = true; if (origPop) origPop(); };

  Sys.call("display.modes", { display: disp.gdiName }, { timeout: 15000 }).then(d => {
    if (gone) return;
    const seen = {};
    const modes = (d.modes || []).filter(m => {
      const k = m.width + "x" + m.height + "@" + m.refreshHz;
      if (seen[k]) return false;
      seen[k] = 1;
      return m.width >= 800;                 // 640×480 on a TV is not a choice, it is an accident
    }).sort((a, b) => (b.width - a.width) || (b.height - a.height) || (b.refreshHz - a.refreshHz));

    p.paint(modes.map(m => {
      const isCurrent = m.width === cur.w && m.height === cur.h && Math.abs(m.refreshHz - cur.hz) <= 1;
      return {
        mode: m, isCurrent: isCurrent,
        label: m.width + " × " + m.height,
        sub: Math.round(m.refreshHz) + " Hz · " + m.bpp + "-bit"
             + (m.width === cur.w && m.height === cur.h ? " · native to the current resolution" : ""),
        tailHTML: isCurrent ? tagHTML("current", "on") : tagHTML("apply"),
        icon: "info"
      };
    }), modes.length + " mode" + (modes.length === 1 ? "" : "s") + ". Any change reverts itself unless you confirm it.",
      null, false);
  }, e => { if (!gone) p.paint([], Sys.say(e), "bad", false); });
}

const DISPLAY_REVERT_SECONDS = 15;

function displayModeApply(disp, mode){
  const label = mode.width + " × " + mode.height + " @ " + Math.round(mode.refreshHz) + " Hz";

  /* Step 1: ask the driver, without changing anything. SystemApi always
     dry-runs first, so test:true means "tell me and stop". */
  Sys.call("display.setMode", {
    display: disp.gdiName, width: mode.width, height: mode.height,
    refreshHz: Math.round(mode.refreshHz), test: true
  }, { timeout: 15000 }).then(probe => {
    const prev = parsePrevMode(probe.previous) || { width: disp.width, height: disp.height, refreshHz: Math.round(disp.refreshHz) };
    countdownConfirm(disp, mode, prev, label);
  }, e => {
    toast("That mode was refused before anything changed: " + Sys.say(e));
    hostLog("display dry-run refused " + label + ": " + Sys.say(e));
  });
}

function parsePrevMode(s){
  const m = /^(\d+)x(\d+)@(\d+)$/.exec(String(s || "").trim());
  if (!m) return null;
  return { width:+m[1], height:+m[2], refreshHz:+m[3] };
}

function countdownConfirm(disp, mode, prev, label){
  const node = panelShell("Keep this display mode?",
    "If you can read this, press Keep. Doing nothing puts the old mode back.", "Display");
  node.classList.add("confirm");
  const body = node.querySelector(".panel-body");
  const num = document.createElement("div");
  num.className = "countdown";
  const sub = document.createElement("div");
  sub.className = "countdown-sub";
  sub.textContent = "Reverting to " + prev.width + " × " + prev.height + " @ " + prev.refreshHz + " Hz";
  body.appendChild(num); body.appendChild(sub);
  const stat = statEl("Applying " + label + "…", null, true);
  body.appendChild(stat);

  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  /* Revert is column 0 and takes focus: the safe answer is the one
     already selected. On a screen you may not be able to see, the
     default press has to be the one that gets you back. */
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = "Revert now";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "run"; no.dataset.label = "revert";
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = "Keep";
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "run"; go.dataset.label = "keep";
  [no, go].forEach(b => b.addEventListener("click", safe("countdown click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.appendChild(acts);

  let left = DISPLAY_REVERT_SECONDS;
  let settled = false;
  let ticker = 0;
  num.textContent = left + "s";

  function finish(){
    clearInterval(ticker);
    if (Focus.top() === sc) Focus.pop();
  }
  function revert(why){
    if (settled) return;
    settled = true;
    clearInterval(ticker);
    setStat(stat, "Reverting…", null, true);
    hostLog("display: reverting to " + prev.width + "x" + prev.height + "@" + prev.refreshHz + " (" + why + ")");
    Sys.call("display.setMode", {
      display: disp.gdiName, width: prev.width, height: prev.height, refreshHz: prev.refreshHz, test: false
    }, { timeout: 20000 }).then(() => {
      finish();
      toast("Display mode reverted (" + why + ").");
      if (settingsRepaint) settingsRepaint();
    }, e => {
      finish();
      /* The one genuinely bad outcome. Say exactly what to do about it
         rather than leaving a television in an unknown state silently. */
      toast("REVERT FAILED: " + Sys.say(e) + "  Use Windows' own display settings, or restart the console.");
      hostLog("display REVERT FAILED: " + Sys.say(e));
    });
  }
  function keep(){
    if (settled) return;
    settled = true;
    clearInterval(ticker);
    finish();
    toast("Display mode kept: " + label + ".");
    hostLog("display: kept " + label);
    if (settingsRepaint) settingsRepaint();
  }
  no.__arcRun = () => revert("you asked");
  go.__arcRun = keep;

  const sc = pushPanel("display-countdown", node, {
    hints: ["navLR", "confirm", "cancel"],
    /* Circle is the safe answer here too, not "dismiss and keep". */
    onBack(){ revert("you backed out"); return "reverting the display mode"; }
  });

  /* The confirmation must already be on screen before the mode changes,
     or a display that cannot show the new mode never renders it. */
  requestAnimationFrame(() => setTimeout(safe("display apply", () => {
    Sys.call("display.setMode", {
      display: disp.gdiName, width: mode.width, height: mode.height,
      refreshHz: Math.round(mode.refreshHz), test: false
    }, { timeout: 25000 }).then(() => {
      if (settled) return;
      setStat(stat, "Applied. Press Keep to make it permanent.", null, false);
      ticker = setInterval(safe("countdown tick", () => {
        left--;
        num.textContent = Math.max(0, left) + "s";
        if (left <= 0) revert("no answer in " + DISPLAY_REVERT_SECONDS + "s");
      }), 1000);
    }, e => {
      if (settled) return;
      settled = true;
      finish();
      toast("The mode change failed and nothing was altered: " + Sys.say(e));
      hostLog("display apply failed for " + label + ": " + Sys.say(e));
    });
  }), 60));
}

    id:"tz", title:"Time zone", eyebrow:"Date & time",

    }
  });
  let gone = false;
  const origPop = p.scope.onPop;
  p.scope.onPop = function(){ gone = true; if (origPop) origPop(); };

  Sys.call("sys.timezones", {}, { timeout: 15000 }).then(d => {
    if (gone) return;
    const zones = (d.zones || []).slice().sort((a, b) =>
