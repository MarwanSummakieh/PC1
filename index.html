<script src="osk.js"></script>

<script src="files.js"></script>

<script src="homeart.js"></script>

<style>
/* ─────────────────────────────────────────────────────────────
   PC1 — the console shell for this machine

   SIZING RULE: nothing outside :root is expressed in px. The root
   font-size is derived from the viewport, everything else is rem,
   so 1080p / 1440p / ultrawide / 4K are the same layout at
   different scales rather than four separate designs.

   MATERIAL: neutral black, one flat blue that never glows, and a
   white selection ring. Nothing here is lit from within — depth
   comes from surface steps and hairlines, not from bloom. Colour
   appears in exactly three places: the primary action, semantic
   state, and the cover art itself.
   ───────────────────────────────────────────────────────────── */

/* Inter ships beside the shell — same origin, no network, no CDN.
   Variable across 100–900, so one file per subset covers every
   weight the shell uses. Licence in OFL-Inter.txt.
   font-display:block, not swap: a console shell that flashes a
   fallback face on the way up looks broken, and the face is on
   local disk so the block is measured in milliseconds. */
@font-face{
  font-family:"Inter";font-style:normal;font-weight:100 900;font-display:block;
  src:url("Inter-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
                U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
                U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Inter";font-style:normal;font-weight:100 900;font-display:block;
  src:url("Inter-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
                U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,
                U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face{
  font-family:"Inter Tight";font-style:normal;font-weight:100 900;font-display:block;
  src:url("InterTight-latin.woff2") format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,
                U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,
                U+2212,U+2215,U+FEFF,U+FFFD;
}
@font-face{
  font-family:"Inter Tight";font-style:normal;font-weight:100 900;font-display:block;
  src:url("InterTight-latin-ext.woff2") format("woff2");
  unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,
                U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,
                U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}

:root{
  /* Neutral, not navy. A blue-biased dark reads as "space console";
     this shell wants the art on the covers to be the only chroma on
     screen, which needs a ground that competes with nothing. The
     faint lift off pure #000 is deliberate — true black crushes the
     hairlines that carry the whole structure. */
  --void:      #0b0b0d;
  --deep:      #141417;
  --haze:      #1c1c21;
  --line:      #2b2b32;
  --line-soft: #202027;

  --ice:       #f4f5f7;
  --steel:     #9c9da5;
  --dim:       #6a6b73;

  /* One flat blue. It fills the primary action and nothing else —
     it is never a glow, never a border, never a focus ring. */
  --beam:      #1a86ff;
  --beam-hot:  #57a6ff;
  --beam-deep: #0b4fa8;

  /* Selection is white. On a television a white ring survives any
     cover art behind it; a blue one disappears into a blue box. */
  --sel:       #ffffff;

  --good:      #3fd18b;
  --warn:      #ffb457;
  --bad:       #ff5c68;   /* destructive only — delete, disconnect, fail */

  --sans: "Inter","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --display: "Inter Tight","Inter","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;

  /* Tight radii. The old shell was built from pills; this one is
     built from cards and hairlines, which want corners you can
     still read as corners. */
  --r-s: .25rem;
  --r-m: .375rem;
  --r-l: .5rem;

  --e-out: cubic-bezier(.16,.84,.24,1);
  --e-in:  cubic-bezier(.6,0,.9,.4);

  /* ── Root scale ───────────────────────────────────────────
     17.5px at 1920×1080, 23.3px at 1440p (incl. 3440×1440),
     35px at 2160p. Height-led because a console UI is read at a
     fixed distance and height is what changes with the panel;
     the vw term only bites on wide-and-short or portrait
     viewports, so an odd aspect ratio shrinks instead of
     overflowing.

     The height term was 1.4815vh until a human looked at a
     3440×1440 panel and reported the whole design reading as a
     small cluster in the left third. Reading distance did not
     change, so the type scale is only lifted ~9%; the rest of
     the answer is the ultrawide block at the bottom of this
     sheet, which spends the extra WIDTH rather than inflating
     everything uniformly. */
  font-size: clamp(12px, min(1.62vh, 2.05vw), 40px);

  /* Overscan / bezel safe area. Percent-of-viewport floors keep
     content off the extreme edge. Both sides, always: the right
     inset is the one that gets forgotten, and a control cut in
     half by the panel edge is indistinguishable from a bug. */
  --edge:   max(2.5rem, 2.6vw);
  --safe-y: max(1.6rem, 2.2vh);

  /* Rail geometry as unitless multipliers of 1rem. Two reasons they are
     bare numbers: JS can compute the scroll offset exactly at any scale
     (railStep()), and a custom property whose value is calc(… * 1rem)
     is resolved once against the root font-size and is NOT re-resolved
     when a viewport-driven root font-size changes — the multiplication
     has to happen at the point of use, below, or the rail keeps the
     scale it had at first layout.

     Covers are 3:4 portrait — box art, not icons. Only the WIDTHS are
     tokens; every height is width × 4/3 at the point of use, so the
     aspect ratio cannot drift out of sync with itself. The rail's
     scroll step reads --cover-u alone, because every cover ahead of
     the focused one sits at its collapsed width. */
  --cover-u: 9.25;
  --cover-active-u: 13.5;
  --gap-u: 1;

  /* The reading column. Everything to the right of it is artwork, so
     this number is the one that decides how much of the screen the UI
     is allowed to take. Capped in rem rather than left at a percentage
     because a 3440-wide panel does not want a 1200px paragraph — it
     wants the same column and more picture. */
  --col: clamp(22rem, 34vw, 38rem);

  /* Set by paintHero from the focused cover's dominant chroma. The
     default is the shell's own blue, which is what an empty machine
     and the boot screen get. Everything that reads this is a hairline
     or a rule — never text, never a fill behind text — so a title
     with an unhelpful palette can change the mood of the screen
     without ever being able to break its contrast. */
  --accent: #4d7fb8;

  /* How far the rail is allowed to sit in from the left edge. The rail
     scrolls by translating, so covers BEFORE the focused one pass under
     the screen edge; --rail-lead is the strip they are allowed to occupy
     and .rail-wrap masks it, so a partial cover reads as "there is more
     that way" instead of as a cover drawn wrong. */
  --rail-lead: calc(var(--edge) * .62);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--void);
  color:var(--ice);
  font-family:var(--sans);
  font-size:1rem;
  line-height:1.5;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
:focus-visible{outline:none}

/* ── Focus treatment ──────────────────────────────────────────
   One rule, one ring, one curve. data-focus="on" is the live
   cursor; "stale" is a scope further down the stack — still shown,
   because on a TV a user must always be able to see where they
   will land when they back out.

   The ring is white and hard-edged. It used to be a blue halo,
   which had two problems on a television: it washed out against
   any bright artwork behind it, and its blur made the exact
   boundary of the focused thing ambiguous from across a room.
   White at full opacity survives every cover in the catalogue. */
[data-focus]{outline:none}
[data-focus="on"]{
  box-shadow:0 0 0 .125rem var(--sel);
  transition:box-shadow .28s var(--e-out),background .28s var(--e-out),
             color .28s var(--e-out),transform .28s var(--e-out);
}
[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.3)}

/* ── Ground ────────────────────────────────────────────────────
   What is left of the shell's own background once the artwork is
   doing the work: a single soft lift under the status bar so the
   screen is never a flat rectangle of #0b0b0d when there is no art
   to put on it. Everything else on this layer is the title. */
.vignette{
  position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(140% 88% at 50% -8%, #16161c 0%, var(--void) 62%);
}

/* ── Stage ─────────────────────────────────────────────────── */
.stage{position:fixed;inset:0;z-index:2}

/* ═══ BOOT ═════════════════════════════════════════════════
   The identity is one typographic lockup, and the loading bar is
   part of it: PC1 sits on a rule that fills with the boot's
   progress and then simply stays there as the underline of the
   wordmark. There is no spinner, no orbiting node and no bloom —
   the whole screen is flat, which is the point. The only colour
   on it is the blue in the rule, and the rule is the only thing
   that moves.

   The block is centred on the screen but left-aligned inside
   itself: a splash that centres every line reads as a logo screen,
   and this one is meant to read as a machine reporting in. */
#boot{
  position:fixed;inset:0;z-index:20;overflow:hidden;
  display:grid;place-items:center;
  background:
    radial-gradient(64% 50% at 50% 44%, #131318 0%, rgba(11,11,13,0) 72%),
    var(--void);
  transition:opacity .45s var(--e-in),scale .45s var(--e-in);
}
#boot.gone{opacity:0;scale:1.015;pointer-events:none}

.boot-core{
  display:grid;justify-items:start;gap:0;
  width:24rem;max-width:74vw;translate:0 -1rem;
}

.wordmark{
  display:flex;
  font-family:var(--display);font-size:4.25rem;font-weight:700;
  letter-spacing:-.045em;line-height:1;color:var(--ice);
}
.wordmark span{
  opacity:0;translate:0 .5rem;
  animation:letter .55s var(--e-out) forwards;
}
@keyframes letter{to{opacity:1;translate:0 0}}
@keyframes fade{to{opacity:1}}

/* The rule under the wordmark IS the progress bar. */
.boot-progress{
  width:100%;display:grid;gap:.75rem;
  margin-top:1.25rem;
  opacity:0;animation:fade .5s var(--e-out) .75s forwards;
}
.track{width:100%;height:.125rem;background:var(--line);position:relative;overflow:hidden}
.fill{
  position:absolute;inset:0 auto 0 0;width:0%;
  background:var(--beam);
  transition:width .5s var(--e-out);
}
.boot-status{
  display:flex;justify-content:space-between;gap:1rem;width:100%;
  font-size:.8125rem;letter-spacing:0;color:var(--steel);
}
.boot-status b{font-weight:500;color:var(--dim);font-variant-numeric:tabular-nums}

.boot-meta{
  position:fixed;bottom:var(--safe-y);left:0;right:0;z-index:21;
  display:flex;justify-content:space-between;padding:0 var(--edge);
  font-size:.75rem;letter-spacing:0;
  color:var(--dim);opacity:0;animation:fade .6s var(--e-out) 1.1s forwards;
}
#boot.gone .boot-meta{opacity:0}

/* ═══ SHELL ════════════════════════════════════════════════ */
#shell{
  position:fixed;inset:0;z-index:10;
  display:grid;grid-template-rows:auto auto 1fr auto;
  /* No blur on the way in. A full-screen filter:blur() is a real
     compositing cost on every frame of the transition, and it read as
     the old lit design's signature — the shell now simply arrives. */
  opacity:0;scale:1.012;pointer-events:none;
}
#shell.live{
  opacity:1;scale:1;pointer-events:auto;
  transition:opacity .5s var(--e-out),scale .6s var(--e-out);
}

/* ── Status bar ───────────────────────────────────────────── */
/* Every band that runs the full width of the screen is a flex row of
   things that would rather not shrink, and a flex row that cannot
   shrink runs off the right edge instead — which is what "the zoom
   control and the Menu button are cut in half" is, in every screen it
   happens on. So the rule for all of them, here and in browser.css and
   files.css, is the same: the row may shrink, its groups may shrink,
   the text inside ellipses, and the least important chip leaves first.
   min-width:0 is not optional on a flex child that contains text — the
   default min-width:auto is exactly what pushes the row wider than its
   container. */
.statusbar{
  display:flex;align-items:center;gap:1.625rem;min-width:0;
  padding:var(--safe-y) var(--edge) 0;
}
.user{display:flex;align-items:center;gap:.625rem;min-width:0;flex:0 1 auto}
.user-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-right{min-width:0;flex:0 1 auto}
.status-chip{min-width:0}
.status-chip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-chip svg,.avatar,.icon-btn{flex:0 0 auto}
/* Narrow viewports drop the least load-bearing chip rather than push
   the clock and the two buttons off the panel. */
@media (max-width:900px){ .statusbar .status-chip[title="Storage"]{display:none} }
@media (max-width:640px){ .statusbar .status-chip{display:none} }
/* The avatar is the one round thing left in the shell, and the only
   place the accent appears as a fill outside the primary action —
   a person is not a card. */
.avatar{
  width:1.875rem;height:1.875rem;border-radius:50%;
  background:var(--beam);
  display:grid;place-items:center;
  font-size:.8125rem;font-weight:600;color:#fff;
}
.user-name{font-size:.875rem;font-weight:500;letter-spacing:0}
.status-spacer{flex:1}
.status-right{display:flex;align-items:center;gap:1.125rem;color:var(--steel)}
.status-chip{display:flex;align-items:center;gap:.44rem;font-size:.8125rem;letter-spacing:0}
.status-chip svg{width:.94rem;height:.94rem;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.clock{
  font-size:.875rem;font-weight:500;
  letter-spacing:0;color:var(--ice);font-variant-numeric:tabular-nums;
}
.icon-btn{
  width:1.875rem;height:1.875rem;border-radius:var(--r-s);display:grid;place-items:center;
  color:var(--steel);transition:background .2s,color .2s,box-shadow .28s var(--e-out);
}
.icon-btn:hover{background:var(--haze);color:var(--ice)}
.icon-btn[data-focus="on"]{background:var(--haze);color:var(--ice)}
.icon-btn svg{width:1.06rem;height:1.06rem;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ── Tabs ─────────────────────────────────────────────────────
   Wide-tracked thin caps became compact semibold sentence case:
   Mythos sets navigation at UI size and lets weight, not spacing,
   carry the emphasis. The underline is a solid 2px white rule
   with no glow — it either marks the tab or it doesn't. */
.tabs{display:flex;gap:1.75rem;padding:1.25rem var(--edge) 0}
.tab{
  position:relative;padding:.125rem .4375rem .5rem;
  font-family:var(--display);font-size:1.125rem;font-weight:600;
  letter-spacing:-.01em;color:var(--dim);
  transition:color .25s,background .25s;
  border-radius:var(--r-s) var(--r-s) 0 0;
}
.tab::after{
  content:"";position:absolute;left:0;right:100%;bottom:0;height:.125rem;
  background:var(--sel);
  transition:right .35s var(--e-out);
}
.tab[aria-selected="true"]{color:var(--ice)}
.tab[aria-selected="true"]::after{right:0}
.tab:hover{color:var(--steel)}
.tab[aria-selected="true"]:hover{color:var(--ice)}
/* Tabs opt OUT of the global white ring. Focusing a tab already switches to
   it, so the underline is the selection; a second hard rectangle drawn round
   the word said the same thing twice and boxed in a piece of running text.
   What the cursor still has to show is which ROW it is on, and a filled
   ground does that without outlining letterforms. */
.tab[data-focus="on"]{
  color:var(--ice);
  background:var(--haze);
  box-shadow:none;
}
.tab[data-focus="stale"]{box-shadow:none;background:rgba(28,28,33,.5)}

/* ── Hero ─────────────────────────────────────────────────────
   The hero block is centred in the band between the tabs and the
   rail rather than pinned under the tabs. The band is tall by
   design — it is where the focused cover's colour lives — and a
   short block pinned to its top reads as a layout that ran out of
   content rather than one that left room on purpose. */
/* The hero band is centred in what is left between the tabs and the
   rail, with a floor under the padding so the eyebrow never ends up
   sitting on the tab underline on a short panel. */
.main{
  position:relative;overflow:hidden;display:grid;align-content:center;
  padding-block:clamp(1rem,3.5vh,3rem);
}

/* ── The backdrop ─────────────────────────────────────────────
   The screen's ground IS the focused title. Four layers, every one
   of them driven by ui/homeart.js out of a single image:

     .art-wash   the cover downsampled to 32×48 and stretched over
                 the whole panel. Blowing a 32×48 texture across
                 3440 pixels IS a blur, performed by the bilinear
                 filter the compositor was going to run on that
                 layer anyway. No filter pass, no canvas per frame,
                 and nothing running at all while nobody is
                 touching the pad — which matters on a machine
                 whose entire job is to hand its frames to a game.

     .art-key    the same cover at full resolution, tall, anchored
                 past the top and right edges so it is CROPPED by
                 the screen rather than framed by it. Its mask is
                 one radial gradient, so it dissolves into the wash
                 on the left and the floor instead of ending at a
                 border. This is the layer that makes the right two
                 thirds of an ultrawide panel worth having.

     .art-veil   the contrast guarantee, and the reason none of the
                 above can make the type unreadable: near-solid
                 down the left where the words are, open across the
                 right where the art is, solid again at the floor
                 so the rail always sits on clean ground.

     .arc-mark   the identity. Two hairline arcs on a radius far
                 larger than the screen, so what you see is a
                 shallow sweep rather than a circle — the same mark
                 the boot screen resolves into, at architectural
                 scale, taking its colour from the focused title.

   art sits on its own fixed layer above the ground and below the
   shell, so it bleeds behind the status bar instead of seaming at
   the tabs. */
.hero-art{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}

.art-wash{
  position:absolute;inset:-12%;
  background-position:50% 32%;background-size:cover;background-repeat:no-repeat;
  opacity:0;scale:1.08;
  transition:opacity .9s var(--e-out),scale 1.5s var(--e-out);
}
.art-wash.on{opacity:.9;scale:1}

.art-veil{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,
      var(--void) 0%, rgba(11,11,13,.9) 17%, rgba(11,11,13,.52) 36%,
      rgba(11,11,13,.2) 58%, rgba(11,11,13,.12) 80%, rgba(11,11,13,.36) 100%),
    linear-gradient(0deg, var(--void) 1%, rgba(11,11,13,.62) 20%, rgba(11,11,13,0) 50%);
}

/* The panel is cut to the COVER'S OWN 2:3, not to a share of the
   screen. A panel shaped by the viewport and filled with `cover` crops
   a portrait to whatever aspect the machine happens to be, which on an
   ultrawide meant a random 40% of the middle of the picture blown up
   past 1:1 — the artwork was on screen and its composition was not.
   Sized off vh it is the same crop at every resolution: the top and
   bottom run off the screen, the sides are whole. */
/* Anchored high and run well past the bottom of the screen on purpose.
   Portrait key art puts its cast along the bottom edge, and with the
   panel ending near the floor those figures landed at full brightness
   directly behind the rail and the hint bar — two busy things fighting
   over the same corner. Hiding the lower quarter below the screen keeps
   the part of the composition that reads at three metres, and gives the
   rail a clean corner to sit in. */
.art-key{
  position:absolute;top:-10vh;right:-1.5vw;
  height:148vh;width:calc(148vh * 2 / 3);
  background-position:50% 50%;background-size:cover;background-repeat:no-repeat;
  /* A horizontal fade, not a radial. The radial version left a hard
     vertical seam down the artwork's left edge: an ellipse sized as a
     percentage of the element is still 55% opaque where the element
     stops, so the mask faded the picture without ever reaching zero,
     and what you saw was a dimmed panel with a straight edge. The top,
     bottom and right edges do not need masking at all — they are
     cropped by the screen, which is the point of the layer — so the
     only edge that has to dissolve is the one facing the type. */
  --key-mask:linear-gradient(90deg,
      rgba(0,0,0,0) 0%, rgba(0,0,0,.22) 15%, rgba(0,0,0,.72) 36%, #000 62%);
  mask-image:var(--key-mask);
  -webkit-mask-image:var(--key-mask);
  opacity:0;translate:1.6rem 0;scale:1.03;
  transition:opacity .55s var(--e-out),translate .85s var(--e-out),scale .85s var(--e-out);
}
.art-key.on{opacity:.88;translate:0 0;scale:1}

/* Crown and floor are drawn ABOVE the artwork rather than under it, so
   the picture dissolves into the shell's chrome instead of running
   underneath it. The crown is not decoration: the status bar is white
   text with no plate behind it, and a bright sky arriving under the
   clock is the difference between a legible strip and an unreadable
   one. Both are soft over a long distance, so neither reads as a bar. */
.art-crown{
  position:absolute;inset:0 0 auto 0;height:19%;
  background:linear-gradient(180deg,rgba(11,11,13,.94) 0%,rgba(11,11,13,.62) 30%,
             rgba(11,11,13,.22) 66%,rgba(11,11,13,0) 100%);
}
.art-floor{
  position:absolute;inset:auto 0 0 0;height:58%;
  background:linear-gradient(0deg,var(--void) 6%,rgba(11,11,13,.95) 26%,
             rgba(11,11,13,.62) 48%,rgba(11,11,13,0) 100%);
}

.arc-mark{
  position:absolute;left:50%;bottom:-118vh;
  width:212vh;height:212vh;translate:-50% 0;
  border-radius:50%;
  border:.0625rem solid var(--accent);
  opacity:.26;
  transition:border-color .9s var(--e-out);
}
.arc-mark.two{width:252vh;height:252vh;bottom:-140vh;opacity:.13}
/* When there is no cover to fill the screen — a title whose only
   artwork is an executable icon, and every title on a machine with
   nothing installed — the mark comes forward and carries the ground on
   its own. That is the whole reason to have one: an empty library
   should look like a screen somebody designed, not like a screen that
   failed to load. */
.art-none .arc-mark{opacity:.5}
.art-none .arc-mark.two{opacity:.26}

/* ── Hero ─────────────────────────────────────────────────────
   One reading column, hard left, vertically centred in the band
   between the tabs and the rail. The facts that used to sit in a
   bordered card on the right are now a spec strip under the
   actions: the same information, but the right-hand two thirds of
   the screen is given to the artwork instead of to a widget. That
   is the whole answer to "the layout does not use the screen" —
   the extra width is not for more UI, it is for the cover. */
.hero{
  position:relative;z-index:1;
  padding:0 var(--edge);
  display:grid;grid-template-columns:minmax(0,var(--col)) minmax(0,1fr);
}
.hero-main{grid-column:1;min-width:0}
.hero-side{grid-column:1;min-width:0}

/* The eyebrow carries the accent rule — the one place the focused
   title's own colour touches the type column. */
.eyebrow{
  display:flex;align-items:center;gap:.7rem;
  font-size:.75rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--steel);margin-bottom:.85rem;
}
.eyebrow::before{
  content:"";flex:0 0 auto;width:1.75rem;height:.125rem;
  background:var(--accent);
  transition:background .6s var(--e-out);
}
.hero-title{
  font-family:var(--display);font-weight:700;
  font-size:min(4.4rem,9vw);line-height:1.0;
  letter-spacing:-.035em;margin:0;text-wrap:balance;color:var(--ice);
  text-shadow:0 .125rem 1.5rem rgba(0,0,0,.55);
}
/* Three lines, then it stops. The full sentence is still there for
   the details panel; a television is not where you read a paragraph. */
.hero-desc{
  margin:clamp(.55rem,1.7vh,1.1rem) 0 0;max-width:44ch;
  font-size:.9375rem;line-height:1.62;color:var(--steel);
  display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:4;overflow:hidden;
}
.hero-meta{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:clamp(.7rem,2vh,1.25rem)}
.chip{
  padding:.3125rem .625rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);background:rgba(20,20,23,.6);
  font-size:.75rem;font-weight:500;letter-spacing:0;color:var(--steel);
}
.chip.live{border-color:rgba(63,209,139,.42);color:var(--good)}

/* ── The spec strip ──────────────────────────────────────────
   Was a bordered card of label/value rows pinned to the right of
   the screen. It is now a row of small stacked pairs under the
   buttons, separated by hairlines: the same four facts, reading as
   a caption rather than as a dashboard, and taking no width away
   from the artwork.

   Named hero-fact*, NOT fact*: the panels already own a .facts /
   .fact read-only list further down this sheet. */
/* One line, never two. A fact here costs horizontal space, and a strip
   that wraps puts its hairline separators in the wrong places and drops
   a stray value under the rest — so the row does not wrap, the items
   may shrink, and a value that runs out of room ellipses. */
.hero-facts{
  display:flex;flex-wrap:nowrap;align-items:flex-start;
  margin-top:clamp(1rem,2.6vh,1.9rem);padding-top:.9rem;
  border-top:.0625rem solid var(--line-soft);
  max-width:100%;
}
.hero-fact{
  display:grid;gap:.2rem;min-width:0;flex:0 1 auto;
  padding-right:1.4rem;margin-right:1.4rem;
  border-right:.0625rem solid var(--line-soft);
}
.hero-fact:last-child{border-right:0;margin-right:0;padding-right:0}
.hero-fact-k{
  font-size:.6875rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
}
.hero-fact-v{
  font-size:.875rem;font-weight:600;color:var(--ice);
  font-variant-numeric:tabular-nums;
  max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.hero-fact.live .hero-fact-v{color:var(--good)}

.hero-actions{display:flex;gap:.625rem;margin-top:clamp(1rem,2.8vh,2rem);max-width:26rem}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.8125rem 1.375rem;border-radius:var(--r-m);
  font-size:.9375rem;font-weight:600;letter-spacing:0;
  transition:box-shadow .28s var(--e-out),background .2s,color .2s;
}
.btn svg{width:.9375rem;height:.9375rem;fill:currentColor}
/* The one saturated fill in the shell. */
.btn-primary{flex:1.5 1 0;background:var(--beam);color:#fff}
.btn-primary:hover{background:#3695ff}
.btn-ghost{flex:1 1 0;border:.0625rem solid var(--line);color:var(--ice);background:rgba(20,20,23,.72)}
.btn-ghost:hover{background:var(--haze)}

/* fade group when focus changes */
.swap{transition:opacity .28s var(--e-out),translate .38s var(--e-out)}
.swap.out{opacity:0;translate:0 .625rem}

/* ── Rail ─────────────────────────────────────────────────── */
/* The rail scrolls by translating, so covers before the focused one
   pass under the left screen edge. Cut off dead straight by the viewport
   they read as covers drawn wrong; faded out over the safe-area strip
   they read as a row that continues off-screen — which is what they are.
   The same fade is applied on the right, because the rail continues that
   way too and a hard edge there tells the same lie. The focused cover
   sits at --edge, outside the fade, so its selection ring is never
   touched. */
.rail-wrap{
  position:relative;z-index:1;
  padding:clamp(.7rem,3.2vh,2.4rem) 0 clamp(.7rem,2.6vh,1.9rem);
  overflow:hidden;
  --rail-fade:linear-gradient(to right,
      rgba(0,0,0,0) 0,
      #000 var(--rail-lead),
      #000 calc(100% - var(--rail-lead)),
      rgba(0,0,0,0) 100%);
  mask-image:var(--rail-fade);
  -webkit-mask-image:var(--rail-fade);
}
.rail{
  display:flex;align-items:flex-end;gap:calc(var(--gap-u) * 1rem);
  padding-left:var(--edge);
  transition:transform .45s var(--e-out);
  will-change:transform;
}
/* Covers are 3:4 portrait. Height is always width × 4/3 computed at
   the point of use — never a second token — so the two can never
   disagree about what the aspect ratio is. */
.tile{
  position:relative;flex:0 0 auto;
  width:calc(var(--cover-u) * 1rem);
  height:calc(var(--cover-u) * 1rem * 4 / 3);
  border-radius:var(--r-m);
  overflow:hidden;cursor:pointer;padding:0;
  border:.0625rem solid rgba(255,255,255,.06);
  transition:width .42s var(--e-out),height .42s var(--e-out),
             box-shadow .42s var(--e-out),border-color .3s;
  box-shadow:0 .5rem 1.25rem rgba(0,0,0,.55);
}
/* Unfocused covers are dimmed by a layer of their own rather than by
   the tile's opacity. Opacity on the tile fades its drop shadow and
   its selection ring with it, which is how a rail ends up looking
   washed out; a flat scrim over the art dims the picture and leaves
   the structure at full strength. */
.tile-dim{
  position:absolute;inset:0;background:rgba(5,5,8,.52);
  opacity:1;transition:opacity .42s var(--e-out);
}
.tile[aria-current="true"] .tile-dim{opacity:0}
.tile:hover .tile-dim{opacity:.55}
/* A cover is art plus a legible name. The scrim exists so the name
   is readable over whatever the art does at the bottom edge. */
.tile-sheen{
  position:absolute;inset:0;
  background:linear-gradient(0deg,rgba(0,0,0,.88) 0%,rgba(0,0,0,.34) 24%,rgba(0,0,0,0) 50%);
}
.tile-glyph{
  position:absolute;left:0;right:0;top:0;bottom:2.6rem;
  display:grid;place-items:center;color:rgba(255,255,255,.92);
}
.tile-glyph svg{
  width:2.25rem;height:2.25rem;fill:none;stroke:currentColor;
  stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 .125rem .5rem rgba(0,0,0,.5));
  transition:width .42s var(--e-out),height .42s var(--e-out);
}
/* The name is part of the cover, always visible — box art has its
   title printed on it. It no longer fades in on selection. */
.tile-name{
  position:absolute;left:.75rem;right:.75rem;bottom:.7rem;
  font-family:var(--display);font-weight:600;
  font-size:.8125rem;line-height:1.2;letter-spacing:-.01em;
  color:#fff;opacity:1;
  transition:font-size .42s var(--e-out);
}
.tile:hover{border-color:rgba(255,255,255,.18)}
.tile[aria-current="true"]{
  width:calc(var(--cover-active-u) * 1rem);
  height:calc(var(--cover-active-u) * 1rem * 4 / 3);
  border-color:rgba(255,255,255,.22);
  box-shadow:0 1.25rem 3rem rgba(0,0,0,.78);
}
.tile[aria-current="true"] .tile-glyph svg{width:3.25rem;height:3.25rem}
.tile[aria-current="true"] .tile-name{font-size:1.0625rem}
/* Selection is a white rule drawn INSIDE the cover, so it never
   inflates the box and never has to be reconciled with the layout —
   the rail's arithmetic stays exact. */
.tile[data-focus="on"]{
  border-color:transparent;
  box-shadow:0 1rem 2.5rem rgba(0,0,0,.7),inset 0 0 0 .1875rem var(--sel);
}
.tile[data-focus="stale"]{
  box-shadow:0 1rem 2.5rem rgba(0,0,0,.7),inset 0 0 0 .125rem rgba(255,255,255,.32);
}
.tile-badge{
  position:absolute;top:.5rem;right:.5rem;
  min-width:1.125rem;height:1.125rem;padding:0 .3rem;border-radius:var(--r-s);
  background:var(--beam);color:#fff;
  font-size:.66rem;font-weight:700;line-height:1.125rem;text-align:center;
}
/* "This is open right now." Bottom-left so it never collides with the
   count badge top-right, and a live dot rather than a colour alone so
   it survives a colour-blind reading and a photograph of the screen. */
.tile-live{
  position:absolute;left:.5rem;bottom:.5rem;
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.1rem .4rem .1rem .3rem;border-radius:var(--r-s);
  background:rgba(0,0,0,.62);color:#fff;
  font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:inset 0 0 0 .0625rem rgba(255,255,255,.22);
}
.tile-live::before{
  content:"";width:.4rem;height:.4rem;border-radius:50%;
  background:var(--good,#54d18c);
  box-shadow:0 0 .35rem var(--good,#54d18c);
}
@media (prefers-reduced-motion:no-preference){
  .tile-live::before{animation:tileLivePulse 2.4s ease-in-out infinite}
}
@keyframes tileLivePulse{0%,100%{opacity:1}50%{opacity:.45}}
.tile.running .tile-dim{opacity:.15}

/* ── Hint bar ─────────────────────────────────────────────── */
.hints{
  display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap;
  padding:0 var(--edge) var(--safe-y);
  font-size:.78rem;letter-spacing:.05em;color:var(--steel);
  min-height:2.4rem;
}
.hint-set{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.hint{display:flex;align-items:center;gap:.5rem;white-space:nowrap}
.hint-glyphs{display:inline-flex;align-items:center;gap:.25rem}
/* pad glyphs: same 24×24 stroke language as every other icon here.
   The face symbols opt out of the shell's default weight and caps:
   Sony's shapes are outlined at a heavier absolute stroke than a UI
   icon, with square-cut ends and sharp corners, and rounding them
   off to match the rest of the sheet is what turned the cross into
   a soft letter X. Everything else keeps the shell's language. */
.glyph{
  width:1.4rem;height:1.4rem;display:block;
  fill:none;stroke:currentColor;stroke-width:1.4;
  stroke-linecap:round;stroke-linejoin:round;
  color:var(--ice);
}
.glyph .face{stroke-width:1.9;stroke-linecap:butt;stroke-linejoin:miter}
.glyph .tri{stroke-linejoin:miter}
.glyph .ray{stroke-width:1.44;stroke-linecap:butt}
.glyph .solid{fill:currentColor;stroke:none}
.glyph .lbl{fill:currentColor;stroke:none;font-size:8.2px;font-family:var(--sans);font-weight:600;letter-spacing:.02em}
.glyph .lbl.sm{font-size:7.2px}
.key{
  display:inline-grid;place-items:center;min-width:1.375rem;height:1.375rem;padding:0 .375rem;
  border:.0625rem solid var(--line);border-radius:var(--r-s);
  background:var(--deep);
  font-size:.69rem;font-weight:500;color:var(--ice);
}
.hints-spacer{flex:1}
.replay{color:var(--dim);font-size:.75rem;letter-spacing:0;transition:color .2s;border-radius:var(--r-s);padding:.2rem .4rem}
.replay:hover{color:var(--ice)}
.replay[data-focus="on"]{color:var(--ice)}

/* ── Overlay: control centre + panels ─────────────────────── */
#cc{
  position:fixed;inset:0;z-index:40;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,6,8,.72);backdrop-filter:blur(16px);
  opacity:0;pointer-events:none;transition:opacity .3s var(--e-out);
}
#cc.open{opacity:1;pointer-events:auto}
#cc[data-view="panel"]{align-items:center}
#cc[data-view="panel"] .cc-panel{display:none}
#cc[data-view="cc"] .panel-stack{display:none}

.cc-panel{
  width:100%;padding:0 var(--edge) calc(var(--safe-y) + 1rem);
  translate:0 1.875rem;transition:translate .42s var(--e-out);
}
#cc.open .cc-panel{translate:0 0}
.cc-label{
  text-align:center;font-family:var(--display);font-weight:600;
  font-size:1.25rem;letter-spacing:-.015em;color:var(--ice);
  min-height:2rem;margin-bottom:1.5rem;
}
.cc-label small{display:block;font-family:var(--sans);font-weight:400;font-size:.8125rem;letter-spacing:0;color:var(--steel);margin-top:.25rem}
.cc-row{display:flex;justify-content:center;gap:.75rem;flex-wrap:wrap}
/* Squares, not circles. The rest of the shell is built from cards and
   hairlines now, and a row of discs was the last thing on screen still
   speaking the old language. */
.cc-item{
  width:4.5rem;height:4.5rem;border-radius:var(--r-m);
  display:grid;place-items:center;
  border:.0625rem solid var(--line);background:var(--deep);
  color:var(--steel);
  transition:transform .25s var(--e-out),border-color .25s,color .25s,background .25s,box-shadow .28s var(--e-out);
}
.cc-item svg{width:1.625rem;height:1.625rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.cc-item:hover,.cc-item[aria-current="true"]{
  transform:translateY(-.25rem);color:var(--ice);
  border-color:#3a3a42;background:var(--haze);
}
.cc-item[data-focus="on"]{
  transform:translateY(-.25rem);color:var(--ice);background:var(--haze);
  border-color:transparent;
  box-shadow:0 0 0 .125rem var(--sel);
}
.cc-item.on{color:var(--good)}

/* ── Panels ───────────────────────────────────────────────── */
.panel-stack{width:100%;display:flex;justify-content:center;padding:0 var(--edge)}
.panel{
  width:min(64rem,100%);
  background:var(--deep);
  border:.0625rem solid var(--line);border-radius:var(--r-l);
  box-shadow:0 1.5rem 4rem rgba(0,0,0,.75);
  overflow:hidden;
  translate:0 1.25rem;opacity:0;
  transition:translate .38s var(--e-out),opacity .3s var(--e-out);
}
.panel.in{translate:0 0;opacity:1}
.panel.behind{display:none}
.panel-head{padding:1.5rem 1.75rem 1rem;border-bottom:.0625rem solid var(--line)}
.panel-eyebrow{font-size:.75rem;font-weight:500;letter-spacing:.02em;color:var(--dim);margin-bottom:.35rem}
.panel-title{font-family:var(--display);font-weight:700;font-size:1.75rem;line-height:1.1;margin:0;letter-spacing:-.03em}
.panel-sub{margin:.4rem 0 0;font-size:.875rem;color:var(--steel);max-width:56ch}
.panel-body{padding:1.1rem 1.25rem 1.5rem;max-height:52vh;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.panel-body::-webkit-scrollbar{width:.4rem}
.panel-body::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}

.row{
  display:flex;align-items:center;gap:.875rem;width:100%;
  padding:.75rem .875rem;border-radius:var(--r-m);
  border:.0625rem solid transparent;background:var(--haze);
  margin-bottom:.375rem;color:var(--ice);
  transition:background .25s,border-color .25s,box-shadow .28s var(--e-out);
}
.row:hover{background:#22222a}
/* No translateX on focus. A row that slides when it is selected makes the
   left edge of the list ragged as the cursor moves down it. */
.row[data-focus="on"]{background:#22222a;border-color:transparent;box-shadow:0 0 0 .125rem var(--sel)}
.row[data-focus="stale"]{box-shadow:0 0 0 .0938rem rgba(255,255,255,.3)}
.row[aria-disabled="true"]{opacity:.5}
.row-ico{
  flex:0 0 auto;width:2.25rem;height:2.25rem;border-radius:var(--r-s);display:grid;place-items:center;
  background:#26262e;color:var(--steel);
}
.row[data-focus="on"] .row-ico{color:var(--ice)}
.row-ico svg{width:1.25rem;height:1.25rem;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.row-text{flex:1;min-width:0}
.row-text b{display:block;font-weight:500;font-size:.9375rem;letter-spacing:0}
.row-text small{display:block;font-size:.8125rem;color:var(--steel);margin-top:.0625rem}
.row-tail{flex:0 0 auto;font-size:.8125rem;color:var(--steel);font-variant-numeric:tabular-nums}
/* Danger keeps a colour of its own — this is the one place where the ring
   carrying meaning beats the ring being uniformly white. */
.row.danger[data-focus="on"]{box-shadow:0 0 0 .125rem var(--warn)}
.row.danger .row-ico{color:var(--warn)}

/* fact list — read-only values, never focusable. Same table as the
   home screen's hero-facts, minus the card: a panel is already one.
   Hairlines rather than zebra striping — the stripes were doing the
   work of separating rows that a single rule does more quietly. */
.facts{display:grid;padding:.2rem .3rem .8rem}
.fact{display:flex;justify-content:space-between;gap:1rem;padding:.5rem .45rem}
.fact + .fact{border-top:.0625rem solid var(--line-soft)}
.fact span{font-size:.8125rem;color:var(--dim)}
.fact b{font-size:.8125rem;font-weight:500;color:var(--ice);font-variant-numeric:tabular-nums;text-align:right}
.note{
  margin:.5rem .3rem 0;padding:.6rem .8rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);border-left:.1875rem solid var(--warn);
  background:var(--haze);
  font-size:.8125rem;color:var(--steel);letter-spacing:0;
}
.note b{color:var(--warn);font-weight:500}

/* profile header inside its panel */
.profile{display:flex;align-items:center;gap:1.25rem;padding:.4rem .6rem 1.1rem}
.profile .avatar{width:4.4rem;height:4.4rem;font-size:1.6rem}
.profile-id b{display:block;font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:-.02em}
.profile-id small{display:block;font-size:.8125rem;color:var(--steel);margin-top:.2rem}

/* settings: category rail + content pane, both pad-navigable */
.settings{display:grid;grid-template-columns:minmax(12rem,17rem) 1fr;gap:1rem;min-height:20rem}
.set-cats{border-right:.0625rem solid var(--line);padding-right:.75rem;overflow-y:auto;max-height:46vh;scrollbar-width:thin}
.set-cats .row{margin-bottom:.25rem;padding:.625rem .75rem}
.set-cats .row[aria-current="true"]{background:#26262e}
.set-pane{padding:.2rem .4rem;overflow-y:auto;max-height:46vh;scrollbar-width:thin}
.set-pane h3{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;margin:.2rem 0 .2rem}
.set-pane p{font-size:.875rem;color:var(--steel);margin:.2rem 0 .9rem;max-width:56ch}

/* ── Settings content: real state, and the vocabulary for showing it ──
   Every atom here exists to make the difference between "read from the
   OS", "still reading" and "could not read" visible at TV distance. */
.panel-body h4{
  font-size:.75rem;letter-spacing:.02em;color:var(--dim);
  margin:1.1rem .3rem .45rem;font-weight:500;
}
.panel-body h4:first-child,.set-pane h4:first-of-type{margin-top:.2rem}
.set-pane .facts{padding-bottom:.4rem}

/* a line of status under a heading — "Scanning…", "3 networks", an error */
.stat{
  display:flex;align-items:center;gap:.5rem;
  margin:.1rem .3rem .5rem;font-size:.78rem;color:var(--steel);letter-spacing:.02em;
}
.stat.bad{color:#ffcf9a}
.stat.good{color:var(--good)}

/* the spinner. One ring, the accent, the same curve as everything else. */
.spin{
  width:.85rem;height:.85rem;flex:0 0 auto;border-radius:50%;
  border:.11rem solid var(--line);border-top-color:var(--beam);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* an error the human can act on: what failed, what the OS said, what to do.
   Same shape as .note — a hairline card with a coloured left edge — so
   "here is a caveat" and "here is a failure" are the same object in two
   severities rather than two unrelated inventions. */
.err{
  margin:.5rem .3rem;padding:.7rem .9rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);border-left:.1875rem solid var(--warn);
  background:var(--haze);
  font-size:.8125rem;color:#f0d7b4;letter-spacing:0;
}
.err b{display:block;font-weight:600;color:var(--warn);margin-bottom:.15rem}
.err code{font-family:var(--sans);font-size:.75rem;color:var(--steel)}

   Same object as the hero's .chip — small rect, hairline, sentence case. */
.tag{
  display:inline-block;padding:.125rem .4rem;border-radius:var(--r-s);
  border:.0625rem solid var(--line);background:var(--deep);
  font-size:.75rem;font-weight:500;letter-spacing:0;color:var(--steel);
  margin-left:.35rem;vertical-align:middle;
}
.tag.on{color:var(--good);border-color:rgba(63,209,139,.42)}
.tag.warn{color:var(--warn);border-color:rgba(255,180,87,.42)}

/* signal strength — five bars, filled to the measured level */
.sig{display:inline-flex;align-items:flex-end;gap:.09rem;height:.8rem;vertical-align:middle}
.sig i{width:.16rem;background:#3a3a42}
.sig i:nth-child(1){height:26%}
.sig i:nth-child(2){height:45%}
.sig i:nth-child(3){height:64%}
.sig i:nth-child(4){height:82%}
.sig i:nth-child(5){height:100%}
.sig i.lit{background:var(--ice)}

/* used/free bar for a drive */
.bar{height:.375rem;border-radius:var(--r-s);background:#26262e;overflow:hidden;margin:.35rem 0 .2rem}
.bar i{display:block;height:100%;background:var(--beam)}
.bar.hot i{background:var(--warn)}
.drive{padding:.7rem .875rem;border-radius:var(--r-m);background:var(--haze);margin-bottom:.375rem}
.drive-top{display:flex;justify-content:space-between;gap:1rem;align-items:baseline}
.drive-top b{font-weight:500;font-size:.9375rem}
.drive-top span{font-size:.8125rem;color:var(--steel);font-variant-numeric:tabular-nums}
.drive-sub{font-size:.75rem;color:var(--dim);letter-spacing:0}

/* A slider that is a focusable row: left/right adjust, and the track is
   drawn under the label rather than beside it so it survives narrow panes.

   sliderRow() builds the track and the hint as <span>s, so every one of
   them needs an explicit display. Without it the track is an INLINE box:
   `height` and `overflow` do not apply to inline non-replaced elements,
   so the .5rem track was ignored and .slider-fill — a block inside an
   inline, with height:100% resolved against the row — grew into a
   ~1300×600 slab. That is what "the microphone and speaker sliders are
   too big" was: not a taste call, a layout bug that only shows up once
   somebody looks at the screen. The height is now stated on the fill as
   well as the track so a percentage can never be the thing that decides
   it. */
.row.slider{display:block;padding:.75rem 1rem}
.slider-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.slider-head b{font-weight:500;font-size:.9375rem}
.slider-head span{font-size:.875rem;color:var(--steel);font-variant-numeric:tabular-nums}
.row.slider[data-focus="on"] .slider-head span{color:var(--ice)}
.slider-track{
  display:block;height:.375rem;width:100%;max-width:34rem;
  border-radius:var(--r-s);background:#26262e;
  overflow:hidden;margin:.5rem 0 .3125rem;
}
.slider-fill{
  display:block;height:.375rem;border-radius:var(--r-s);background:var(--beam);
  transition:width .12s linear;
}
.row.slider.muted .slider-fill{background:var(--dim)}
.slider-hint{display:block;font-size:.75rem;color:var(--dim);letter-spacing:0}

/* the display-mode countdown. Amber, because the default answer is revert. */
.countdown{
  font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1;
  letter-spacing:-.04em;
  color:var(--warn);font-variant-numeric:tabular-nums;margin:.6rem 0 .2rem;
}
.countdown-sub{font-size:.8125rem;color:var(--steel);margin-bottom:.2rem}

/* confirmation — never one press away from powering off a console.
   The two buttons are the only place a focus ring is allowed to carry
   meaning: amber round the destructive one, white round the safe one,
   because here the difference between them is the whole point. */
.confirm{width:min(34rem,100%);text-align:center}
.confirm .panel-head{border-bottom:0;padding-bottom:.4rem}
.confirm-actions{display:flex;gap:.5rem;justify-content:center;padding:.6rem 1.5rem 1.75rem}
.cbtn{
  padding:.6875rem 1.5rem;border-radius:var(--r-m);font-size:.9375rem;font-weight:600;letter-spacing:0;
  border:.0625rem solid var(--line);background:var(--haze);color:var(--ice);
  transition:background .25s,border-color .25s,box-shadow .28s var(--e-out);
}
.cbtn.go[data-focus="on"]{background:rgba(255,180,87,.12);border-color:transparent;box-shadow:0 0 0 .125rem var(--warn)}
.cbtn.no[data-focus="on"]{background:#26262e;border-color:transparent;box-shadow:0 0 0 .125rem var(--sel)}

/* toast — a panel failing must never be silent, and must never be fatal */
#toast{
  position:fixed;left:50%;bottom:calc(var(--safe-y) + 3.6rem);translate:-50% 1rem;z-index:60;
  max-width:44rem;padding:.7rem 1.1rem;border-radius:var(--r-m);
  background:var(--deep);border:.0625rem solid var(--line);border-left:.1875rem solid var(--warn);
  color:#f0d7b4;
  font-size:.8125rem;letter-spacing:0;opacity:0;pointer-events:none;
  transition:opacity .25s var(--e-out),translate .25s var(--e-out);
}
#toast.show{opacity:1;translate:-50% 0}

/* On a short display the description is the first thing to go — the
   primary action must never be the thing that gets squeezed out. */

/* ── 21:9 ──────────────────────────────────────────────────────
   What the extra width is FOR, stated once. Not "the same layout
   with more black either side": the reading column stays the width
   a column should be, the artwork gets wider, and the rail gets
   bigger covers — so an ultrawide panel shows more art at a larger
   size rather than the same UI further apart. 3440×1440 is 2.39:1
   and lands here; 2560×1440 is 1.78:1 and does not. */

/* ═══ Failure containment ════════════════════════════════════
   This process IS the Windows shell: an escaped exception blanks a
   television. Every entry point from the outside world — host
   messages, key events, pad actions, panel builders — goes through
   safe(), which logs to the host and shows a toast instead of
   unwinding into nothing. */
let toastTimer = 0;
function toast(msg){
  try{
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 5200);
  }catch(e){}
}
function hostLog(s){
  try{ if (typeof window.arcPost === "function") window.arcPost({type:"log", target:s}); }catch(e){}
  try{ console.log("[arc] " + s); }catch(e){}
}
function report(where, err){
  const msg = where + ": " + (err && err.message ? err.message : String(err));
  hostLog("ERROR " + msg + (err && err.stack ? " | " + String(err.stack).split("\n")[1] : ""));
  toast(msg);
}
function safe(where, fn){
  return function(){
    try { return fn.apply(this, arguments); }
    catch(err){ report(where, err); }
  };
}
addEventListener("error", (e) => hostLog("window error: " + (e.message || "?")));

/* ── DualSense glyphs ─────────────────────────────────────────

   they replace was drawn from a written brief and read, correctly,
   as "a generic gamepad": four face symbols all at the same size
   inside a ring that Sony does not draw, a d-pad that was one
   connected plus, an Options button that was a rounded rectangle
   with three tapering lines on it, and a Create button that was
   the DualShock 4's Share icon — which the DualShock 4 never had,
   because Share was the WORD "SHARE" printed on the button.

   What the references say, and what is drawn here:

   FACE SYMBOLS are bare. The registered PlayStation Shapes Logo is
   the four naked shapes; the button cap is the ring, and Sony does
   not draw a ring around the symbol. The enclosing circle in most
   icon packs is a third-party container. They are also NOT the
   same size as each other — measured across two independent vector
   reproductions the ordering is consistently triangle > circle >
   cross > square, spanning about 23%, which is ordinary optical
   compensation: a square reads heaviest at a given bounding box
   and a triangle lightest. Drawing all four at one size is the
   single commonest mistake and it is what made the old set look
   mechanical. All four are outlined at one absolute stroke weight,
   with sharp corners and butt-cut ends.

   the centre at exactly 45° — a rotated plus, not a letter X, and
   its ends are cut square rather than rounded.

   THE D-PAD is four separate segments with gaps, not a connected
   plus: the DualSense uses the segmented four-button geometry over
   a centre pivot, which is precisely what stops opposing pairs
   firing together.

   L1/R1 AND L2/R2 ARE DIFFERENT SHAPES. The bumper is a wide
   landscape pill at about 2.6:1. The trigger is taller than it is
   wide, with a squared-off rounded top, straight parallel sides,
   and a bottom that bulges outward into the paddle the finger
   actually pulls. Drawing both as the same rounded rectangle with
   a different label — which is what this shell did — throws away
   the one difference that tells them apart at a glance.

   OPTIONS is three equal horizontal bars, printed above the
   button, at a 9:1 length-to-thickness ratio with gaps twice the
   bar thickness. Not tapering, not on a button outline. (The word
   "OPTIONS" was the DualShock 4; the bars are the DualSense.)

   CREATE is a fan of three equal rays converging downward towards
   the button, at 0° and ±39.6° from vertical, butt-cut. It has
   nothing in common with any "share" icon.

   THE TOUCHPAD carries the light bar on the DualSense: the strips
   moved from the top of the controller onto the pad's left and
   right edges. Drawn with them it reads as a DualSense; drawn as a
   bare rounded rectangle it reads as a DualShock 4.

   THE STICK is a ring with a centre disc at 0.69 of the ring's
   diameter. The reference knocks the L/R letter out of a filled
   disc; this draws the disc outlined with the letter inside it
   instead, because a knockout needs a mask and a mask at hint-bar
   size is a grey smudge. `stick` is the click form, which the
   reference draws as the disc with no letter at all.

   THE PS BUTTON IS NOT DRAWN, AND MUST NOT BE. The mark on it is
   the PlayStation Family Mark, a registered trademark of Sony
   Interactive Entertainment — and the four face shapes are
   separately registered as the Shapes Logo, so "draw the four
   symbols instead" is not a way round it either. `ps` here is the
   genre-standard neutral guide glyph: a small filled dot inside a
   large ring. It is deliberately a different silhouette from
   `stick`, whose disc is far larger relative to its ring. If
   somebody later "fixes" this back to a P-and-S monogram they
   will have introduced a trademark infringement, not corrected an
   inaccuracy.

   Reference: Sony's PS5 button-function and trademark pages,
   Wikipedia's DualSense article (monochrome buttons, Share→Create,
   light bar on the touchpad edges), and geometry measured out of
   Shinmera's PromptFont — which matters because it ships separate
   -ps and -ps5 files and therefore models the DualShock 4 →
   DualSense change explicitly — cross-checked against Wikimedia
   Commons' PlayStation shape SVGs. */

/* ═══ The library's wire ═══════════════════════════════════════
   Handed to ui/library.js the same way, and for the same reason, the
   explorer's is handed to ui/files.js — read the long note on Files
   below for the full argument. In one line: library.js's second probe
   is `chrome.webview.hostObjects.arcLibrary`, and under WebView2 that
   probe can never fail, because hostObjects is a Proxy that
   manufactures a property for any name asked of it. Left to guess, the
   rail picks a bridge that does not exist and every command dies at
   call time with a COM error instead of at detection time with a
   sentence. The first v7 bench run says exactly that:
   "library: lib.list failed: Element not found. (0x80070490)" — from a
   host whose LibraryApi worker was up and had served zero requests.

   So the choice is made here instead. window.arcLibraryApi is
   library.js's FIRST probe, so defining it settles the matter before
   the Proxy is ever consulted, and it is defined ABOVE the
   ArcLibrary.initial()/load() calls because load() picks its transport
   on the first command it sends.

   The transport itself is the host's {type:"lib"} message channel,
   answered on the host's LibraryApi worker thread — never its UI
   thread. A cold scan is seconds long; on the UI thread that is a
   frozen television with a live pad going nowhere. */
const LibraryWire = (function(){
  let seq = 0;
  let wired = false;
  const pending = new Map();
  const TIMEOUT = 60000;    // lib.scan hands back a jobId at once; the polls are quick

  function wire(){
    if (wired) return true;
    try{
      if (!(window.chrome && chrome.webview && typeof chrome.webview.postMessage === "function"))
        return false;
      chrome.webview.addEventListener("message", ev => {
        let d = ev ? ev.data : null;
        if (typeof d === "string"){ try{ d = JSON.parse(d); }catch(e){ return; } }
        if (!d || d.type !== "lib.reply" || !d.reqId) return;
        const p = pending.get(d.reqId);
        if (!p){ hostLog("lib: reply for unknown reqId " + d.reqId + " (timed out already?)"); return; }
        pending.delete(d.reqId);
        clearTimeout(p.timer);
        p.resolve(d);                      /* the envelope as-is; library.js reads it */
      });
      wired = true;
    }catch(err){ report("library wire", err); }
    return wired;
  }

  /* library.js calls this with the command already serialised and reads
     an envelope (object or JSON text) back off the promise. */
  window.arcLibraryApi = function(json){
    return new Promise((resolve, reject) => {
      let cmd;
      try{ cmd = (typeof json === "string") ? JSON.parse(json) : (json || {}); }
      catch(e){ reject(new Error("the library command was not JSON: " + e.message)); return; }
      if (!wire()){
        reject(new Error("There is no host to ask. The library needs the ShellHostWeb "
                       + "build that carries LibraryApi."));
        return;
      }
      const id = "lib-" + (++seq);
      cmd.reqId = id;                      // the host echoes it back inside the envelope
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("The host did not answer '" + (cmd.cmd || "?") + "' within "
                         + (TIMEOUT / 1000) + " seconds."));
      }, TIMEOUT);
      pending.set(id, { resolve, timer });
      try{ chrome.webview.postMessage(JSON.stringify({ type:"lib", reqId:id, command:cmd })); }
      catch(err){ clearTimeout(timer); pending.delete(id); reject(err); }
    });
  };

  return { wire };
})();

/* Per-glyph so the wordmark can be typeset rather than typed in:
   each character carries its own delay, and the whole lockup is
   assembled before the first step fires. */
const BRAND = "PC1";
function paintWordmark(){
  const el = $("#wordmark");
  el.innerHTML = "";
  BRAND.split("").forEach((ch, i) => {
    const s = document.createElement("span");
    s.textContent = ch;
    s.style.animationDelay = (0.18 + i * 0.09) + "s";
    el.appendChild(s);
  });
}

let bootTimers = [];
const runBoot = safe("runBoot", function(){
  bootTimers.forEach(clearTimeout);
  bootTimers = [];

  const boot = $("#boot"), fill = $("#fill");
  boot.classList.remove("gone");
  fill.style.width = "0%";
  $("#pctText").textContent = "0%";
  $("#stepText").textContent = STEPS[0][0];
  $("#bootBar").setAttribute("aria-valuenow", "0");
  $("#shell").classList.remove("live");
  Overlay.closeAll();
  paintWordmark();
  try{ if (window.ArcFeel) ArcFeel.boot(); }catch(e){}

  const scale = RM ? 0.25 : 1;
  let at = 900 * scale;

  STEPS.forEach(([label, pct, hold]) => {
    bootTimers.push(setTimeout(safe("bootStep", () => {
      $("#stepText").textContent = label;
      fill.style.width = pct + "%";
      $("#pctText").textContent = pct + "%";
      $("#bootBar").setAttribute("aria-valuenow", String(pct));
    }), at));
    at += hold * scale;
  });

  /* The rule stays on screen a beat after it fills — the lockup is
     the logo, and cutting the instant it completes never lets you
     see it as one. */
  bootTimers.push(setTimeout(safe("bootEnd", () => {
    boot.classList.add("gone");

    try{ if (window.ArcFeel) ArcFeel.bootDone(); }catch(e){}
    Focus.repaint();
  }), at + 420 * scale));
});

/* ═══ Host bridge ═════════════════════════════════════════
   The native host injects a shim at document-created time that owns
   window.arcPost and forwards semantic pad actions. Two host
   generations are supported:

     v2 (shipping)  drives the page's own functions — select(),
                    setTab(), toggleCC(), closeCC() — and synthesises
                    arrow keys while an overlay is open. Those four
                    entry points are kept as adapters onto the focus
                    manager so the live binary keeps working.
     v3 (this tree) calls window.arcPad(action) for everything and
                    understands {type:"power"} and {type:"sysinfo"}.

   Anything the host does not send is picked up from the Gamepad API,
   which WebView2 does expose for the DualSense — but only for actions
   the host has never sent, so the two paths can never double-fire. */
let padInfo = null, padInfoAt = -1e9;
const padInfoWaiters = [];

const Host = (function(){
  const caps = { power:false, sysinfo:false, nav:false, sys:false, padinfo:false, fs:false,
                 lib:false, browser:false, known:false };
  const hostOwned = new Set(["left","right","launch","back","tabPlay","tabMedia","cc"]);
  let sysinfo = null;
  const sysListeners = [];

  function post(o){
    try{
      if (typeof window.arcPost === "function"){ window.arcPost(o); return true; }
      if (window.chrome && window.chrome.webview){
        window.chrome.webview.postMessage(JSON.stringify(o));
        return true;
      }
    }catch(e){}
    hostLog("post dropped (no host): " + JSON.stringify(o));
    return false;
  }

  function onSysinfo(fn){
    sysListeners.push(fn);
    if (sysinfo) { try{ fn(sysinfo); }catch(e){} }
  }

  function handle(m){
    if (!m || !m.type) return;
    if (m.type === "hostinfo"){
      caps.power   = !!(m.caps && m.caps.indexOf("power")   >= 0);
      caps.sysinfo = !!(m.caps && m.caps.indexOf("sysinfo") >= 0);
      caps.nav     = !!(m.caps && m.caps.indexOf("nav")     >= 0);
      caps.sys     = !!(m.caps && m.caps.indexOf("sys")     >= 0);
      caps.padinfo = !!(m.caps && m.caps.indexOf("padinfo") >= 0);
      caps.fs      = !!(m.caps && m.caps.indexOf("fs")      >= 0);
      caps.lib     = !!(m.caps && m.caps.indexOf("lib")     >= 0);
      caps.browser = !!(m.caps && m.caps.indexOf("browser") >= 0);
      if (caps.nav) ["up","down","square","triangle","guide"].forEach(a => hostOwned.add(a));
      caps.known = true;
      hostLog("hostinfo caps=" + (m.caps || []).join(","));
      return;
    }
    if (m.type === "sysinfo"){
      sysinfo = m.data || m;
      hostLog("sysinfo received");
      sysListeners.forEach(fn => { try{ fn(sysinfo); }catch(e){} });
      return;
    }
    /* The system-control channel. The payload is SystemApi's own envelope,
       correlated by the reqId it echoes back. */
    if (m.type === "sysres"){ Sys._settle(m.payload); return; }
    /* The file-system channel. The message IS FileApi's envelope with a
       type bolted on; Files hands it to the explorer untouched. */
    if (m.type === "fs.reply"){ Files._settle(m); return; }
    /* The browser's channel. Tab state, navigation, crashes, and every
       message the injected navigation layer sends from inside a web page,
       relayed by the host with the tab stamped on it. */
    /* --browse=<url> on the host's command line. An automation hook, not a
       product feature: the pad vocabulary cannot type an address, so this is
       how an unattended run gets inside a real web page to test navigation
       on it. It goes through the ordinary ACT entry point, so what it
       exercises is exactly what a human pressing Cross exercises. */
    if (m.type === "browse"){
      hostLog("host asked for the browser at " + m.url);
      ACT.openBrowser(m.url || "");
      return;
    }
    /* ── App lifecycle ─────────────────────────────────────
       The host owns process state and pushes it here. Three
       messages, all host->page:
         apps          what is running, foreground and background
         guide{ev:menu} a short press of PS with something open
         shellforward   the shell was pulled in front of an app
         app{ev:...}    the result of resume / minimise / close */
    if (m.type === "apps"){ Apps.handle(m); return; }
    if (m.type === "guide"){
      if (m.ev === "menu") openGuideMenu(m.app);
      return;
    }
    if (m.type === "shellforward"){
      hostLog("host brought the shell forward (" + (m.reason || "?") + ")" +
              (m.app ? " over " + m.app : ""));
      return;
    }
    if (m.type === "app"){
      if (m.ev === "resume" && m.ok === false) toast("Could not bring " + (m.title || "it") + " back.");
      if (m.ev === "close"){
        toast(m.ok ? (m.title || "It") + " was closed." : "Nothing was left to close.");
      }
      return;
    }
    if (m.type === "browser"){
      try{ if (window.ArcBrowser) ArcBrowser.hostMessage(m); }
      catch(err){ report("browser message", err); }
      return;
    }
    if (m.type === "padinfo"){
      padInfo = m.data || null;
      padInfoAt = performance.now();
      padInfoWaiters.splice(0).forEach(fn => { try{ fn(padInfo); }catch(e){} });
      return;
    }
    if (m.type === "powerAck"){ caps.power = true; return; }
    /* pad messages: only ours to handle when no shim is present.
       The v2/v3 shims consume them and call back into the page. */
    if (m.type === "pad" && !window.__arcShim) Input.pad(m.action);
  }

  /* Restart and shut down have a legacy path: the host maps process
     exit 2 -> restart device and exit 3 -> shut down via Shell
     Launcher. If the running host has no power channel, fall back to
     it rather than leaving a dead button. Sleep and sign-out have no
     legacy equivalent and say so instead of pretending. */
  const LEGACY_EXIT = { restart:2, shutdown:3 };
  function power(action){
    hostLog("power request: " + action);
    post({ type:"power", action:action });
    if (caps.power) return;
    const code = LEGACY_EXIT[action];
    setTimeout(safe("powerFallback", () => {
      if (caps.power) return;
      if (code != null){
        hostLog("power " + action + ": host has no power channel, using legacy exit " + code);
        post({ type:"exit", code:code, target:"power:" + action });
      } else {
        toast("Sleep and sign out need host build v3 — this host has no power channel.");
        hostLog("power " + action + ": unsupported on this host build");
      }
    }), 900);
  }

  return { post, handle, power, caps, hostOwned, onSysinfo, get sys(){ return sysinfo; } };
})();

try{
  if (window.chrome && window.chrome.webview){
    window.chrome.webview.addEventListener("message", safe("hostMessage", (ev) => {
      let d = ev ? ev.data : null;
      if (typeof d !== "string"){ try{ d = JSON.stringify(d); }catch(e){ return; } }
      let m = null;
      try{ m = JSON.parse(d); }catch(e){ return; }
      Host.handle(m);
    }));

    /* Ask for the capability list now, because only now can we hear the
       answer.

       The host's shim posts {type:"ready"} at document-created time and the
       host replies with hostinfo immediately — but *this* listener does not
       exist until this inline script runs, a hundred-odd milliseconds later.
       A host->page message that lands before any listener is attached is not
       queued by WebView2; it is dropped. So on a slow first paint the reply
       is simply lost, and every Host.caps stays false on a host that has the
       lot: the About panel reports an older host than the one running, the
       fs/browser/system channels are declared missing, and Host.power()
       takes its legacy exit-code path instead of the power channel.

       It is intermittent, which is the worst version of it. On the bench,
       bench-v5-settings.log has the shim's ready at 04:55:40.886 and the
       page's "shell ready" at 04:55:41.011 with no hostinfo line at all,
       while bench-v5-rail.log got the reply 138 ms after ready and was fine.

       Sending "ready" rather than inventing a request verb is deliberate:
       every shipped host from v2 on answers "ready" with hostinfo, so this
       repairs the binaries already deployed instead of only the ones rebuilt
       from this tree. Handling it twice costs nothing — handle() just
       re-reads the same caps — so the unsolicited reply stays harmless on
       the runs where it does arrive in time. */
    hostLog("asking host for capabilities — page listener attached");
    Host.post({ type:"ready", target: location.href });
  }
}catch(e){ hostLog("could not attach host message listener: " + e); }

/* ═══ System-control client ══════════════════════════════
   The page's half of the SystemApi bridge.

     Sys.call("audio.setVolume", {level:.4})   -> Promise<data>
     Sys.job("wifi.scan", {}, {onProgress})    -> Promise<result>

   Three properties this has to have, because the alternative on a
   television is a screen that has silently stopped meaning anything:

   * Nothing here can freeze the shell. Every request is a message plus
     a callback; the host answers on its own thread. Slow commands come
     back immediately as a jobId and Sys.job polls them, so even a
     two-minute Windows Update search leaves the pad live throughout.
   * Every request has a deadline. A host that never answers produces a
     rejected promise with a sentence in it, not a spinner forever.
   * No failure is silent. Rejections carry .code and .detail from the
     OS, and Sys.say() turns both into something a human can act on —
     a bare HRESULT is never the only thing on screen. */
const Sys = (function(){
  let seq = 0;
  const pending = new Map();

  function err(code, detail, data){
    const e = new Error(detail || code);
    e.code = code || "error";
    e.detail = detail || "";
    if (data) e.data = data;
    return e;
  }

  /* Codes SystemApi returns that mean something specific to a human.
     Anything not listed falls back to the detail string, which the API
     writes in English on purpose. */
  const SAY = {
    wifi_unavailable:  "No Wi-Fi adapter found on this machine.",
    no_wifi_adapter:   "No Wi-Fi adapter found on this machine.",
    no_such_interface: "That wireless adapter is no longer present.",
    bt_unavailable:    "No Bluetooth radio found on this machine.",
    no_bt_radio:       "No Bluetooth radio found on this machine.",
    elevation_required:"This needs administrator rights, which the shell does not have.",
    access_denied:     "Windows refused this to the shell's account.",
    mode_not_supported:"The display rejected that mode, so nothing was changed.",
    hdr_unsupported:   "This display or its driver does not expose HDR to Windows.",
    no_search_yet:     "No update search has run yet in this session.",
    timeout:           "The host did not answer in time.",
    no_host:           "This page is not running inside the PC1 host.",
    sys_unavailable:   "The host could not start its system-control thread.",
    unknown_command:   "This build of the host does not know that command.",
    host_too_old:      "The running host build has no system channel — it cannot read or change Windows.",
    bad_json:          "The host could not parse the request (a bug in the shell).",
    no_such_job:       "That background job is no longer known to the host."
  };

  /* One sentence, always. code + detail, never a bare HRESULT alone. */
  function say(e){
    if (!e) return "Unknown failure.";
    const code = e.code || "error";
    const head = SAY[code] || null;
    const detail = (e.detail || e.message || "").trim();
    if (head && detail && detail.toLowerCase() !== head.toLowerCase())
      return head + " (" + detail + ")";
    if (head) return head;
    if (detail) return detail + " [" + code + "]";
    return "Failed: " + code;
  }

  function call(cmd, args, opts){
    opts = opts || {};
    const ms = opts.timeout || 20000;
    return new Promise((resolve, reject) => {
      /* An older host answers nothing at all to {"type":"sys"} — it just
         logs it as unhandled. Waiting twenty seconds to discover that is
         not a failure mode worth having, and the host has already told us
         what it can do. Say it now, in one sentence, instead. */
      if (Host.caps.known && !Host.caps.sys){
        reject(err("host_too_old",
          "this host build answers pad and power but has no system channel; "
          + "'" + cmd + "' cannot be run until the shell is repointed at a host that has one"));
        return;
      }
      const id = "s" + (++seq);
      const msg = Object.assign({}, args || {}, { type:"sys", reqId:id, cmd:cmd });
      const rec = { resolve, reject, cmd };
      rec.timer = setTimeout(safe("sys timeout", () => {
        if (!pending.has(id)) return;
        pending.delete(id);
        hostLog("sys TIMEOUT " + cmd + " after " + ms + " ms");
        reject(err("timeout", "'" + cmd + "' did not answer within " + Math.round(ms / 1000) + " seconds"));
      }), ms);
      pending.set(id, rec);
      if (!Host.post(msg)){
        clearTimeout(rec.timer);
        pending.delete(id);
        reject(err("no_host", "no host bridge on this page — system settings need the PC1 host"));
      }
    });
  }

  /* Called from Host.handle when a {"type":"sysres"} arrives. */
  function _settle(payload){
    try{
      if (!payload || typeof payload !== "object"){
        hostLog("sys response with no payload — dropped");
        return;
      }
      const id = payload.reqId;
      const rec = id ? pending.get(id) : null;
      if (!rec){
        /* A late answer to something that already timed out. Log it —
           silence here is how a "nothing happens" bug hides. */
        hostLog("sys response for unknown reqId '" + id + "' (late or duplicate) — dropped");
        return;
      }
      pending.delete(id);
      clearTimeout(rec.timer);
      if (payload.ok) rec.resolve(payload.data || {});
      else rec.reject(err(payload.error, payload.detail, payload.data));
    }catch(e){ report("sys settle", e); }
  }

  /* Start a job command and poll it to completion.
     onProgress({percent, phase, elapsedMs}) fires on every poll, so a
     panel can show real movement rather than an indeterminate wait. */
  function job(cmd, args, opts){
    opts = opts || {};
    const every = opts.pollMs || 700;
    const deadline = performance.now() + (opts.timeout || 150000);
    return call(cmd, args, { timeout: opts.startTimeout || 20000 }).then(d => {
      if (!d || !d.jobId) return d;               // not actually async on this build
      const jobId = d.jobId;
      if (opts.onStart) { try{ opts.onStart(jobId); }catch(e){} }
      return new Promise((resolve, reject) => {
        let stopped = false;
        const cancelled = () => opts.isCancelled && opts.isCancelled();
        function tick(){
          if (stopped) return;
          if (cancelled()){ stopped = true; reject(err("cancelled", "the panel moved on before the job finished")); return; }
          if (performance.now() > deadline){
            stopped = true;
            reject(err("timeout", "'" + cmd + "' was still running after "
              + Math.round((opts.timeout || 150000) / 1000) + " seconds"));
            return;
          }
          call("job.status", { jobId: jobId }, { timeout: 15000 }).then(j => {
            if (stopped) return;
            if (opts.onProgress){
              try{ opts.onProgress({ percent:j.percent|0, phase:j.phase || "", elapsedMs:j.elapsedMs|0 }); }
              catch(e){}
            }
            if (j.state === "running"){ setTimeout(tick, every); return; }
            stopped = true;
            if (j.state === "done") resolve(j.result || {});
            else if (j.state === "cancelled") reject(err("cancelled", "the job was cancelled"));
            else reject(err(j.error || "job_failed", j.detail || ("job ended in state '" + j.state + "'")));
          }).catch(e => { if (!stopped){ stopped = true; reject(e); } });
        }
        setTimeout(tick, 250);
      });
    });
  }

  function cancel(jobId){
    if (!jobId) return Promise.resolve({});
    return call("job.cancel", { jobId: jobId }, { timeout: 8000 }).catch(() => ({}));
  }

  return { call, job, cancel, say, _settle, get inflight(){ return pending.size; } };
})();

/* The pad the HOST is reading over raw HID — battery included, which no
   web API exposes. Resolves to null on a host that cannot answer, and
   the Controllers panel says so rather than leaving a blank. */
function padSnapshot(maxAgeMs){
  return new Promise(resolve => {
    if (padInfo && performance.now() - padInfoAt < (maxAgeMs || 2000)){ resolve(padInfo); return; }
    let done = false;
    padInfoWaiters.push(d => { if (!done){ done = true; resolve(d); } });
    Host.post({ type:"padinfo" });
    setTimeout(() => { if (!done){ done = true; resolve(padInfo); } }, 1200);
  });
}

/* ═══ Input device tracking ══════════════════════════════
   The hint bar teaches whichever device the human is actually
   holding. Synthetic keyboard events (isTrusted === false) come from
   the v2 shim translating pad input, so they count as pad, not key. */
const Input = (function(){
  let device = "pad";                 // the shipped device has no keyboard
  function set(d){
    if (d === device) return;
    device = d;
    hostLog("input device -> " + d);
    Hints.render();
  }
  function pad(action, phase, button){
    set("pad");
    return Nav.action(action, phase, button);
  }
  return { pad, set, get device(){ return device; } };
})();

/* ═══ On-screen keyboard bridge ══════════════════════════
   ArcOSK is a modal: while it is up it gets every action first and
   nothing behind it moves, even for actions it does not recognise.

   It is given the literal button rather than the shell's semantic
   action wherever the host tells us one, because the two disagree on
   purpose: L1/R1 switch views in the shell and move the text caret in
   the keyboard, Options opens the control centre in the shell and
   commits the field in the keyboard. ArcOSK's own alias table maps
   both spellings, so a host that sends only the semantic name still
   works — this just makes the shoulder buttons do the right thing.

   Directions are not given to beginRepeat(): the host is already the
   repeat authority for those and sends a stream of "repeat" phases.
   Square (backspace) is the one that wants holding, and the host does
   not auto-repeat face buttons, so that one is handed over properly. */
const OSK_HOLD = new Set(["square", "backspace"]);
const OSK = {
  isOpen(){
    try{ return !!(window.ArcOSK && window.ArcOSK.isOpen()); }
    catch(e){ return false; }
  },
  /* returns a string when it consumed the action, null when it did not */
  route(action, phase, button){
    if (!this.isOpen()) return null;
    const a = button || action;
    if (phase === "release"){
      try{ window.ArcOSK.endRepeat(); }catch(e){}
      return "osk: release";
    }
    if (phase === "press" && OSK_HOLD.has(a)){
      window.ArcOSK.beginRepeat(a);
      return "osk: " + a + " (hold to repeat)";
    }
    const took = window.ArcOSK.handleAction(a);
    return took ? ("osk: " + a) : ("osk: ignored " + a + " (modal, not passed through)");
  },
  open(cfg){
    if (!window.ArcOSK){
      toast("On-screen keyboard is not loaded — osk.js missing next to index.html.");
      hostLog("ArcOSK missing; cannot open '" + (cfg && cfg.title) + "'");
      return false;
    }
    hostLog("OSK open: " + (cfg && cfg.title));
    return window.ArcOSK.open(cfg);
  }
};

/* ═══ File explorer bridge ═══════════════════════════════
   ArcFiles is modal on exactly the same terms as ArcOSK, one layer
   further in: the keyboard can be up *over* the explorer (renaming a
   file), so the keyboard is still asked first and the explorer only
   sees what the keyboard did not take.

   Like the keyboard, it is handed the literal pad button where the
   host gives us one. The two vocabularies disagree deliberately —
   L1/R1 switch tabs on the home screen and page the list in the
   explorer, Square opens app details on the home screen and marks a
   file in the explorer — and ArcFiles' own alias table understands
   both spellings, so a host that only sends semantic names still
   works.
