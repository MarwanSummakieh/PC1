             so the chip shows both glyphs.
   There is no separate `guide` row any more; PS *is* `cc` here. */
const HINTS = {
  navAll:  { pad:["dpad"],              key:["↑","↓","←","→"], label:"Navigate" },
  navLR:   { pad:["dpadLR"],            key:["←","→"],         label:"Navigate" },
  navUD:   { pad:["dpadUD"],            key:["↑","↓"],         label:"Move" },
  select:  { pad:["cross"],             key:["↵"],             label:"Select" },
  launch:  { pad:["cross"],             key:["↵"],             label:() => launchWord() },
  confirm: { pad:["cross"],             key:["↵"],             label:"Confirm" },
  back:    { pad:["circle"],            key:["Esc"],           label:"Back" },
  close:   { pad:["circle"],            key:["Esc"],           label:"Close" },
  cancel:  { pad:["circle"],            key:["Esc"],           label:"Cancel" },
  tabs:    { pad:["l1","r1"],           key:["Tab"],           label:"Switch view" },
  cc:      { pad:["ps"],                key:["C"],             label:"Control centre" },
  details: { pad:["square"],            key:["X"],             label:"Details" },
  /* The grant sheet's two. "Hold" is in the label rather than implied
     by the glyph because holding is the whole difference between this
     sheet and every other confirmation in the shell, and a chip that
     read "Allow" would be teaching the wrong gesture. */
  holdOK:  { pad:["cross"],             key:["↵"],             label:"Hold to allow" },
  deny:    { pad:["circle"],            key:["Esc"],           label:"Deny" },
  appOpt:  { pad:["options"],          key:["O"],             label:"Options" }
};

/* What Cross will do to the tile the cursor is on, in one word.

   The hero used to say this on the button itself ("Launch" / "Open" /
   "Resume"); with the button gone the rail says HALF of it — a running
   tile wears its "Running" pill — and this says the other half, which
   is that pressing Cross on that tile goes back to it rather than
   starting a second copy. Defensive to the last line because it runs
   inside the hint renderer, which runs on the first focus repaint of
   boot, before `tab`/`idx` have been initialised. */
function launchWord(){
  try{
    const app = (APPS[tab] || [])[idx];
    if (!app) return "Launch";
    return isRunningId(app.id) ? "Resume" : (app.action || "Launch");
  }catch(e){ return "Launch"; }
}

/* ═══ The library's wire ═══════════════════════════════════════
   Handed to ui/library.js the same way, and for the same reason, the
   explorer's is handed to ui/files.js — read the long note on Files
   below for the full argument. In one line: library.js's second probe
   is `chrome.webview.hostObjects.mosLibrary`, and under WebView2 that
   probe can never fail, because hostObjects is a Proxy that
   manufactures a property for any name asked of it. Left to guess, the
   rail picks a bridge that does not exist and every command dies at
   call time with a COM error instead of at detection time with a
   sentence. The first v7 bench run says exactly that:
   "library: lib.list failed: Element not found. (0x80070490)" — from a
   host whose LibraryApi worker was up and had served zero requests.

   So the choice is made here instead. window.mosLibraryApi is
   library.js's FIRST probe, so defining it settles the matter before
   the Proxy is ever consulted, and it is defined ABOVE the
   MarwanLibrary.initial()/load() calls because load() picks its transport
   on the first command it sends.

   The transport itself is the host's {type:"lib"} message channel,
   answered on the host's LibraryApi worker thread — never its UI
   thread. A cold scan is seconds long; on the UI thread that is a
   frozen television with a live pad going nowhere. */
const LibraryWire = (function(){
  let seq = 0;
  let wired = false;
  const pending = new Map();
  const TIMEOUT = 60000;    // lib.scan hands back a jobId at once; the polls are quick

  function wire(){
    if (wired) return true;
    try{
      if (!(window.chrome && chrome.webview && typeof chrome.webview.postMessage === "function"))
        return false;
      chrome.webview.addEventListener("message", ev => {
        let d = ev ? ev.data : null;
        if (typeof d === "string"){ try{ d = JSON.parse(d); }catch(e){ return; } }
        if (!d || d.type !== "lib.reply" || !d.reqId) return;
        const p = pending.get(d.reqId);
        if (!p){ hostLog("lib: reply for unknown reqId " + d.reqId + " (timed out already?)"); return; }
        pending.delete(d.reqId);
        clearTimeout(p.timer);
        p.resolve(d);                      /* the envelope as-is; library.js reads it */
      });
      wired = true;
    }catch(err){ report("library wire", err); }
    return wired;
  }

  /* library.js calls this with the command already serialised and reads
     an envelope (object or JSON text) back off the promise. */
  window.mosLibraryApi = function(json){
    return new Promise((resolve, reject) => {
      let cmd;
      try{ cmd = (typeof json === "string") ? JSON.parse(json) : (json || {}); }
      catch(e){ reject(new Error("the library command was not JSON: " + e.message)); return; }
      if (!wire()){
        reject(new Error("There is no host to ask. The library needs the ShellHostWeb "
                       + "build that carries LibraryApi."));
        return;
      }
      const id = "lib-" + (++seq);
      cmd.reqId = id;                      // the host echoes it back inside the envelope
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("The host did not answer '" + (cmd.cmd || "?") + "' within "
                         + (TIMEOUT / 1000) + " seconds."));
      }, TIMEOUT);
      pending.set(id, { resolve, timer });
      try{ chrome.webview.postMessage(JSON.stringify({ type:"lib", reqId:id, command:cmd })); }
      catch(err){ clearTimeout(timer); pending.delete(id); reject(err); }
    });
  };

  return { wire };
})();

/* The rail's contents, scanned rather than invented.
   ui/library.js asks the host what is actually installed and returns tiles
   in the shape this file already consumes: {id,name,icon,art,eyebrow,title,
   desc,tags,facts,action,run}. `icon` and `art` are keys into ICON and G
   below - nothing new is introduced.

   Every generated tile carries `run`, so doLaunch() never reaches
   {type:"launch"} for a library entry: launching goes through lib.launch,
   which returns a real pid and says whether it is the game or a launcher
   stub that is about to exit.

   APPS is `let`, not `const`: the cached scan paints first and the fresh
   one replaces it a moment later. On a machine with nothing installed the
   Play tab is a single tile that says so - an empty array would break
   APPS[tab][0], centre() and selectTile's modulo, and would tell the
   viewer less than a sentence does. */
/* `toast` goes across with the two openers: a tile that is a live readout
   — the scanning one — has something to say when it is pressed, and the
   library has no other way to say it. */
let APPS = MarwanLibrary.initial({
  files:   () => ACT.openFiles(),
  browser: () => ACT.openBrowser(),
  toast:   (t) => toast(t)
});

MarwanLibrary.onUpdate = safe("library update", function(next){
  APPS = next;
  /* Every tab is guaranteed at least one tile by ui/library.js — an empty
     array breaks APPS[tab][0], centre() and selectTile's modulo — so this
     is a belt-and-braces landing, not the ordinary path. The tab strip is
     repainted with it: falling back to Play while the Apps tab still reads
     as selected is a screen that disagrees with itself. */
  if (!APPS[tab] || !APPS[tab].length){ tab = "play"; if ($("#tabs")) paintTabs(); }
  if (!$("#rail")) return;                 /* boot has not built the DOM yet */

  /* Where the cursor should land has to be decided BEFORE buildRail()
     destroys every tile. Afterwards the focused node is detached, and
     Focus.current() answers with whichever neighbour is still in the
     document — which for the rail means the hero buttons above it. That
     is what "the shell
     comes up with no ring on the rail" was: not a focus bug, a scan
     landing a moment after the first paint and quietly taking the cursor
     with it. Same argument as setTabTo(), same fix. */
  const cur  = Focus.top() === homeScope ? (Focus.current(homeScope) || {}).el : null;
  const away = cur && !cur.classList.contains("tile") ? cur : null;

  buildRail();
  selectTile(Math.min(idx, APPS[tab].length - 1), true);
  refreshHomeItems(away || $("#rail").children[idx] || null);
});

MarwanLibrary.load();

/* ═══ Start-up ═══════════════════════════════════════════
   THE BOOT SEQUENCE IS boot.html, AND IT IS NOT IN THIS FILE. What
   stood here was a full second copy of it — the same six steps, the
   same mark painting itself in, the same wipe — run on load, straight
   after boot.html had finished playing the first one. The machine
   booted twice, in front of you, every single time.

   What that sequence also did, and the reason deleting the call to it
   was never enough on its own, is put the shell into its live state at
   the end. Nothing does that now because nothing has to: #shell is
   live in the stylesheet, so this document's first paint IS the home
   screen (see the note on #shell).

   The one piece of it worth keeping was its last frame: the signature
   cue. That fires once, at the bottom of this file, on the frame the
   home screen is first on screen.

   WHICH DOCUMENT THE MACHINE STARTS AT IS THE HOST'S DECISION, not this
   file's. The host plays boot.html when the OS has only just come up, and
   loads this page directly when the shell is merely being relaunched — a
   redeploy, or Shell Launcher restarting it after a crash — because a
   console that has just recovered should be back on the home screen
   rather than re-introducing itself. See ResolveStartUrl in
   ShellHostWeb.cs. Nothing here navigates to boot.html; the shell no
   longer carries a control that could. */

/* ═══ Host bridge ═════════════════════════════════════════
   The native host injects a shim at document-created time that owns
   window.mosPost and forwards semantic pad actions. Two host
   generations are supported:

     v2 (shipping)  drives the page's own functions — select(),
                    setTab(), toggleCC(), closeCC() — and synthesises
                    arrow keys while an overlay is open. Those four
                    entry points are kept as adapters onto the focus
                    manager so the live binary keeps working.
     v3 (this tree) calls window.mosPad(action) for everything and
                    understands {type:"power"} and {type:"sysinfo"}.

   Anything the host does not send is picked up from the Gamepad API,
   which WebView2 does expose for the DualSense — but only for actions
   the host has never sent, so the two paths can never double-fire. */
let padInfo = null, padInfoAt = -1e9;
const padInfoWaiters = [];

const Host = (function(){
  const caps = { power:false, sysinfo:false, nav:false, sys:false, padinfo:false, fs:false,
                 lib:false, browser:false, known:false };
  /* tabApps is in the list although no shipping host sends it: L1/R1 arrive
     as tabPlay/tabMedia and always will, because those are the host's wire
     names. It is here so that a host which ever does send it cannot also be
     shadowed by the Gamepad API supplement below. */
  const hostOwned = new Set(["left","right","launch","back","tabPlay","tabMedia","tabApps","cc"]);
  let sysinfo = null;
  const sysListeners = [];
  /* One-shot waiters for {type:"hapticAck"} — see hapticStatus(). */
  const hapticWaiters = [];

  /* The host's two silent refusals, in the shell's own words. SetSuspendState
     and ExitWindowsEx both return a bool and both can say no — a driver that
     vetoes the suspend, a policy that blocks the log-off — so without this
     the screen simply stayed where it was after a confirmed press. */
  const POWER_FAIL = {
    sleep:   "Windows refused to go to rest mode.",
    rest:    "Windows refused to go to rest mode.",
    signout: "Windows refused to sign out.",
    logoff:  "Windows refused to sign out."
  };

  function post(o){
    try{
      if (typeof window.mosPost === "function"){ window.mosPost(o); return true; }
      if (window.chrome && window.chrome.webview){
        window.chrome.webview.postMessage(JSON.stringify(o));
        return true;
      }
    }catch(e){}
    hostLog("post dropped (no host): " + JSON.stringify(o));
    return false;
  }

  function onSysinfo(fn){
    sysListeners.push(fn);
    if (sysinfo) { try{ fn(sysinfo); }catch(e){} }
  }

  function handle(m){
    if (!m || !m.type) return;
    if (m.type === "hostinfo"){
      caps.power   = !!(m.caps && m.caps.indexOf("power")   >= 0);
      caps.sysinfo = !!(m.caps && m.caps.indexOf("sysinfo") >= 0);
      caps.nav     = !!(m.caps && m.caps.indexOf("nav")     >= 0);
      caps.sys     = !!(m.caps && m.caps.indexOf("sys")     >= 0);
      caps.padinfo = !!(m.caps && m.caps.indexOf("padinfo") >= 0);
      caps.fs      = !!(m.caps && m.caps.indexOf("fs")      >= 0);
      caps.lib     = !!(m.caps && m.caps.indexOf("lib")     >= 0);
      caps.browser = !!(m.caps && m.caps.indexOf("browser") >= 0);
      if (caps.nav) ["up","down","square","triangle","guide"].forEach(a => hostOwned.add(a));
      caps.known = true;
      hostLog("hostinfo caps=" + (m.caps || []).join(","));
      return;
    }
    if (m.type === "sysinfo"){
      sysinfo = m.data || m;
      hostLog("sysinfo received");
      sysListeners.forEach(fn => { try{ fn(sysinfo); }catch(e){} });
      return;
    }
    /* The system-control channel. The payload is SystemApi's own envelope,
       correlated by the reqId it echoes back. */
    if (m.type === "sysres"){ Sys._settle(m.payload); return; }
    /* The file-system channel. The message IS FileApi's envelope with a
       type bolted on; Files hands it to the explorer untouched. */
    if (m.type === "fs.reply"){ Files._settle(m); return; }
    /* The browser's channel. Tab state, navigation, crashes, and every
       message the injected navigation layer sends from inside a web page,
       relayed by the host with the tab stamped on it. */
    /* --browse=<url> on the host's command line. An automation hook, not a
       product feature: the pad vocabulary cannot type an address, so this is
       how an unattended run gets inside a real web page to test navigation
       on it. It goes through the ordinary ACT entry point, so what it
       exercises is exactly what a human pressing Cross exercises. */
    if (m.type === "browse"){
      hostLog("host asked for the browser at " + m.url);
      ACT.openBrowser(m.url || "");
      return;
    }
    /* ── App lifecycle ─────────────────────────────────────
       The host owns process state and pushes it here. Three
       messages, all host->page:
         apps          what is running, foreground and background
         guide{ev:menu} a short press of PS with something open
         shellforward   the shell was pulled in front of an app
         app{ev:...}    the result of resume / minimise / close */
    if (m.type === "apps"){ Apps.handle(m); return; }
    if (m.type === "guide"){
      if (m.ev === "menu") openGuideMenu(m.app);
      return;
    }
    if (m.type === "shellforward"){
      hostLog("host brought the shell forward (" + (m.reason || "?") + ")" +
              (m.app ? " over " + m.app : ""));
      return;
    }
    if (m.type === "app"){
      if (m.ev === "resume" && m.ok === false) toast("Could not bring " + (m.title || "it") + " back.");
      if (m.ev === "close"){
        toast(m.ok ? (m.title || "It") + " was closed." : "Nothing was left to close.");
      }
      return;
    }
    if (m.type === "browser"){
      try{ if (window.MarwanBrowser) MarwanBrowser.hostMessage(m); }
      catch(err){ report("browser message", err); }
      return;
    }
    /* ── Pointer mode ──────────────────────────────────────
       The host drives a real Windows cursor with the pad when the front
       window is not the shell's — an installer, a launcher's sign-in. That
       is entirely host-side, because nothing this page draws can appear over
       another process's window. The single thing it cannot do out there is
       TYPE: this machine's only keyboard is the one in osk.js. So Triangle
       makes the host bring the shell forward and send this, the shell puts
       the keyboard up, and the answer goes back for the host to type into
       the window it remembered. */
    if (m.type === "ptr"){
      if (m.ev === "type") openPointerKeyboard(m.title || "");
      return;
    }
    if (m.type === "padinfo"){
      padInfo = m.data || null;
      padInfoAt = performance.now();
      padInfoWaiters.splice(0).forEach(fn => { try{ fn(padInfo); }catch(e){} });
      return;
    }
    if (m.type === "powerAck"){ caps.power = true; return; }
    /* …and the other half of that channel: the host asked Windows and
       Windows said no. The shell has already closed the overlay and told
       the human it was asking, so this is the only thing that can correct
       that sentence. */
    if (m.type === "powerFail"){
      const said = POWER_FAIL[m.action] || ("Windows refused to " + (m.action || "do that") + ".");
      hostLog("power " + (m.action || "?") + ": the host reports Windows refused it");
      toast(said);
      return;
    }
    /* The pad's motors, answering. Only {"cmd":"status"} is ever
       acknowledged — playing an effect is fire-and-forget by design — so
       this is the one place a haptic claim can be checked. */
    if (m.type === "hapticAck"){
      hapticWaiters.splice(0).forEach(fn => { try{ fn(m); }catch(e){} });
      return;
    }
    /* pad messages: only ours to handle when no shim is present.
       The v2/v3 shims consume them and call back into the page. */
    if (m.type === "pad" && !window.__mosShim) Input.pad(m.action);
  }

  /* Restart and shut down have a legacy path: the host maps process
     exit 2 -> restart device and exit 3 -> shut down via Shell
     Launcher. If the running host has no power channel, fall back to
     it rather than leaving a dead button. Sleep and sign-out have no
     legacy equivalent and say so instead of pretending. */
  const LEGACY_EXIT = { restart:2, shutdown:3 };
  function power(action){
    hostLog("power request: " + action);
    post({ type:"power", action:action });
    if (caps.power) return;
    const code = LEGACY_EXIT[action];
    setTimeout(safe("powerFallback", () => {
      if (caps.power) return;
      if (code != null){
        hostLog("power " + action + ": host has no power channel, using legacy exit " + code);
        post({ type:"exit", code:code, target:"power:" + action });
      } else {
        toast("Sleep and sign out need host build v3 — this host has no power channel.");
        hostLog("power " + action + ": unsupported on this host build");
      }
    }), 900);
  }

  /* What the host's own writer knows about the pad's motors, or null when
     nothing answered. Null is a real answer and the callers say so rather
     than assuming silence means failure or means success: with no host at
     all — this page in a plain browser — there is nothing to report.

     Resolves rather than rejects, and always resolves exactly once. */
  function hapticStatus(ms){
    return new Promise(resolve => {
      let done = false;
      const settle = (v) => { if (done) return; done = true; resolve(v); };
      hapticWaiters.push(settle);
      if (!post({ type:"haptic", cmd:"status" })){ settle(null); return; }
      setTimeout(() => settle(null), ms || 900);
    });
  }

  return { post, handle, power, caps, hostOwned, onSysinfo, hapticStatus,
           get sys(){ return sysinfo; } };
})();

try{
  if (window.chrome && window.chrome.webview){
    window.chrome.webview.addEventListener("message", safe("hostMessage", (ev) => {
      let d = ev ? ev.data : null;
      if (typeof d !== "string"){ try{ d = JSON.stringify(d); }catch(e){ return; } }
      let m = null;
      try{ m = JSON.parse(d); }catch(e){ return; }
      Host.handle(m);
    }));

    /* Ask for the capability list now, because only now can we hear the
       answer.

       The host's shim posts {type:"ready"} at document-created time and the
       host replies with hostinfo immediately — but *this* listener does not
       exist until this inline script runs, a hundred-odd milliseconds later.
       A host->page message that lands before any listener is attached is not
       queued by WebView2; it is dropped. So on a slow first paint the reply
       is simply lost, and every Host.caps stays false on a host that has the
       lot: the About panel reports an older host than the one running, the
       fs/browser/system channels are declared missing, and Host.power()
       takes its legacy exit-code path instead of the power channel.

       It is intermittent, which is the worst version of it. On the bench,
       bench-v5-settings.log has the shim's ready at 04:55:40.886 and the
       page's "shell ready" at 04:55:41.011 with no hostinfo line at all,
       while bench-v5-rail.log got the reply 138 ms after ready and was fine.

       Sending "ready" rather than inventing a request verb is deliberate:
       every shipped host from v2 on answers "ready" with hostinfo, so this
       repairs the binaries already deployed instead of only the ones rebuilt
       from this tree. Handling it twice costs nothing — handle() just
       re-reads the same caps — so the unsolicited reply stays harmless on
       the runs where it does arrive in time. */
    hostLog("asking host for capabilities — page listener attached");
    Host.post({ type:"ready", target: location.href });
  }
}catch(e){ hostLog("could not attach host message listener: " + e); }

/* ═══ System-control client ══════════════════════════════
   The page's half of the SystemApi bridge.

     Sys.call("audio.setVolume", {level:.4})   -> Promise<data>
     Sys.job("wifi.scan", {}, {onProgress})    -> Promise<result>

   Three properties this has to have, because the alternative on a
   television is a screen that has silently stopped meaning anything:

   * Nothing here can freeze the shell. Every request is a message plus
     a callback; the host answers on its own thread. Slow commands come
     back immediately as a jobId and Sys.job polls them, so even a
     two-minute Windows Update search leaves the pad live throughout.
   * Every request has a deadline. A host that never answers produces a
     rejected promise with a sentence in it, not a spinner forever.
   * No failure is silent. Rejections carry .code and .detail from the
     OS, and Sys.say() turns both into something a human can act on —
     a bare HRESULT is never the only thing on screen. */
const Sys = (function(){
  let seq = 0;
  const pending = new Map();

  function err(code, detail, data){
    const e = new Error(detail || code);
    e.code = code || "error";
    e.detail = detail || "";
    if (data) e.data = data;
    return e;
  }

  /* Codes SystemApi returns that mean something specific to a human.
     Anything not listed falls back to the detail string, which the API
     writes in English on purpose. */
  const SAY = {
    wifi_unavailable:  "No Wi-Fi adapter found on this machine.",
    no_wifi_adapter:   "No Wi-Fi adapter found on this machine.",
    no_such_interface: "That wireless adapter is no longer present.",
    bt_unavailable:    "No Bluetooth radio found on this machine.",
    no_bt_radio:       "No Bluetooth radio found on this machine.",
    elevation_required:"This needs administrator rights, which the shell does not have.",
    access_denied:     "Windows refused this to the shell's account.",
    mode_not_supported:"The display rejected that mode, so nothing was changed.",
    hdr_unsupported:   "This display or its driver does not expose HDR to Windows.",
    no_search_yet:     "No update search has run yet in this session.",
    timeout:           "The host did not answer in time.",
    no_host:           "This page is not running inside the MarwanOS host.",
    sys_unavailable:   "The host could not start its system-control thread.",
    unknown_command:   "This build of the host does not know that command.",
    host_too_old:      "The running host build has no system channel — it cannot read or change Windows.",
    bad_json:          "The host could not parse the request (a bug in the shell).",
    no_such_job:       "That background job is no longer known to the host.",
    /* The privileged-action broker's own codes. Each one is a different
       machine state and they must not collapse into "it did not work":
       not installed, installed but its task would not start, and
       started but never finished are three different things to do
       next. */
    broker_unavailable:"No privileged-action broker is set up on this machine, so the shell cannot have this done for you.",
    broker_start_failed:"The broker's task would not start.",
    broker_timeout:    "The broker took the request and never finished it.",
    bad_request:       "The shell asked the broker for something it will not accept (a bug in the shell)."
  };

  /* One sentence, always. code + detail, never a bare HRESULT alone.

     elevation_required is the one code whose honest sentence depends on
     the machine rather than on the failure: where a privileged-action
     broker was authorised at setup, the shell CAN get this done, and
     saying "the shell does not have those rights" full stop would be
     true about the process and wrong about the console. Admin.ready()
     is the cached answer to admin.status; it is false until a probe has
     come back, so the pessimistic sentence is what a machine with no
     broker — and a shell that has not asked yet — always sees. */
  function say(e){
    if (!e) return "Unknown failure.";
    const code = e.code || "error";
    let head = SAY[code] || null;
    if (code === "elevation_required" && brokerReady())
      head = "This needs administrator rights. The shell can ask the MarwanOS broker to do it for you.";
    const detail = (e.detail || e.message || "").trim();
    if (head && detail && detail.toLowerCase() !== head.toLowerCase())
      return head + " (" + detail + ")";
    if (head) return head;
    if (detail) return detail + " [" + code + "]";
    return "Failed: " + code;
  }

  function call(cmd, args, opts){
    opts = opts || {};
    const ms = opts.timeout || 20000;
    return new Promise((resolve, reject) => {
      /* An older host answers nothing at all to {"type":"sys"} — it just
         logs it as unhandled. Waiting twenty seconds to discover that is
         not a failure mode worth having, and the host has already told us
         what it can do. Say it now, in one sentence, instead. */
      if (Host.caps.known && !Host.caps.sys){
        reject(err("host_too_old",
          "this host build answers pad and power but has no system channel; "
          + "'" + cmd + "' cannot be run until the shell is repointed at a host that has one"));
        return;
      }
      const id = "s" + (++seq);
      const msg = Object.assign({}, args || {}, { type:"sys", reqId:id, cmd:cmd });
      const rec = { resolve, reject, cmd };
      rec.timer = setTimeout(safe("sys timeout", () => {
        if (!pending.has(id)) return;
        pending.delete(id);
        hostLog("sys TIMEOUT " + cmd + " after " + ms + " ms");
        reject(err("timeout", "'" + cmd + "' did not answer within " + Math.round(ms / 1000) + " seconds"));
      }), ms);
      pending.set(id, rec);
      if (!Host.post(msg)){
        clearTimeout(rec.timer);
        pending.delete(id);
        reject(err("no_host", "no host bridge on this page — system settings need the MarwanOS host"));
      }
    });
  }

  /* Called from Host.handle when a {"type":"sysres"} arrives. */
  function _settle(payload){
    try{
      if (!payload || typeof payload !== "object"){
        hostLog("sys response with no payload — dropped");
        return;
      }
      const id = payload.reqId;
      const rec = id ? pending.get(id) : null;
      if (!rec){
        /* A late answer to something that already timed out. Log it —
           silence here is how a "nothing happens" bug hides. */
        hostLog("sys response for unknown reqId '" + id + "' (late or duplicate) — dropped");
        return;
      }
      pending.delete(id);
      clearTimeout(rec.timer);
      if (payload.ok) rec.resolve(payload.data || {});
      else rec.reject(err(payload.error, payload.detail, payload.data));
    }catch(e){ report("sys settle", e); }
  }

  /* Start a job command and poll it to completion.
     onProgress({percent, phase, elapsedMs}) fires on every poll, so a
     panel can show real movement rather than an indeterminate wait. */
  function job(cmd, args, opts){
    opts = opts || {};
    const every = opts.pollMs || 700;
    const deadline = performance.now() + (opts.timeout || 150000);
    return call(cmd, args, { timeout: opts.startTimeout || 20000 }).then(d => {
      if (!d || !d.jobId) return d;               // not actually async on this build
      const jobId = d.jobId;
      if (opts.onStart) { try{ opts.onStart(jobId); }catch(e){} }
      return new Promise((resolve, reject) => {
        let stopped = false;
        const cancelled = () => opts.isCancelled && opts.isCancelled();
        function tick(){
          if (stopped) return;
          if (cancelled()){ stopped = true; reject(err("cancelled", "the panel moved on before the job finished")); return; }
          if (performance.now() > deadline){
            stopped = true;
            reject(err("timeout", "'" + cmd + "' was still running after "
              + Math.round((opts.timeout || 150000) / 1000) + " seconds"));
            return;
          }
          call("job.status", { jobId: jobId }, { timeout: 15000 }).then(j => {
            if (stopped) return;
            if (opts.onProgress){
              /* line/lines are the broker's: admin.request's progress
                 events carry the worker's own latest log line, which is
                 the only thing on screen during a ten-minute install
                 that is actually evidence rather than reassurance. Any
                 command that does not send them leaves them empty. */
              try{ opts.onProgress({ percent:j.percent|0, phase:j.phase || "", elapsedMs:j.elapsedMs|0,
                                     line:j.line || "", lines:j.lines|0, raw:j }); }
              catch(e){}
            }
            if (j.state === "running"){ setTimeout(tick, every); return; }
            stopped = true;
            if (j.state === "done") resolve(j.result || {});
            else if (j.state === "cancelled") reject(err("cancelled", "the job was cancelled"));
            else reject(err(j.error || "job_failed", j.detail || ("job ended in state '" + j.state + "'")));
          }).catch(e => { if (!stopped){ stopped = true; reject(e); } });
        }
        setTimeout(tick, 250);
      });
    });
  }

  function cancel(jobId){
    if (!jobId) return Promise.resolve({});
    return call("job.cancel", { jobId: jobId }, { timeout: 8000 }).catch(() => ({}));
  }

  return { call, job, cancel, say, _settle, get inflight(){ return pending.size; } };
})();

/* ═══ The privileged-action broker ═══════════════════════
   The shell runs as a standard user and always will: it is the Windows
   shell for an account with no administrator token, which is the whole
   reason a stray press cannot damage the machine. Windows' own answer
   to "this needs elevation" is the UAC consent dialogue, and that
   dialogue is drawn on the secure desktop, which discards synthetic
   input and has no pad support of any kind. On a console with no
   keyboard it is a screen you cannot answer.

   So the elevation happens ONCE, at provisioning: a SYSTEM scheduled
   task (provisioning/04-install-broker.ps1) that reads request files
   out of a queue this account may create files in and nothing else.
   The shell asks it for a short, fixed list of verbs — install a
   package from a signed manifest, install pending Windows updates,
   forget a wireless profile, drop a Bluetooth pairing — and can ask
   for nothing else, because the worker rejects anything not on the
   list before it looks at the arguments.

   What lives here is only the shell's half: is there a broker at all,
   what may it install, and one call to run a verb. Every one of these
   is an ordinary unprivileged SystemApi command; the elevation is
   entirely on the other side of the queue.

   status() never rejects. Every caller is asking "can I offer this",
   and an old host that has never heard of admin.status is answering
   exactly the same thing as a machine with no broker: no. Turning that
   into a rejection would push the same "no" into a catch block at
   every call site. */
const Admin = (function(){
  const FRESH = 20000;
  let last = null, at = -1e9, inflight = null;

  function status(maxAgeMs){
    const age = maxAgeMs === undefined ? FRESH : maxAgeMs;
    if (last && performance.now() - at < age) return Promise.resolve(last);
    if (inflight) return inflight;
    inflight = Sys.call("admin.status", {}, { timeout: 15000 }).then(d => {
      last = d || { available:false, reason:"the host answered nothing" };
      at = performance.now();
      inflight = null;
      hostLog("broker: " + (last.available
        ? ("available at " + (last.root || "?") + " (" + (last.worker || "?") + " worker, "
           + (last.packageCount || 0) + " packages)")
        : ("not available — " + (last.reason || "no reason given"))));
      return last;
    }, e => {
      last = { available:false, reason: Sys.say(e), unreachable:true };
      at = performance.now();
      inflight = null;
      hostLog("broker: status could not be read — " + Sys.say(e));
      return last;
    });
    return inflight;
  }

  /* Synchronous, for the places that cannot wait on a promise — Sys.say
     being the one that matters. False until a probe has answered. */
  function ready(){ return !!(last && last.available); }

  return {
    status, ready,
    get last(){ return last; },
    catalog(){ return Sys.call("admin.catalog", {}, { timeout: 20000 }); },
    /* A job: the broker's worker is a scheduled task and an install is
       minutes, not milliseconds. onProgress sees the worker's own log
       lines as it writes them. */
    request(args, opts){
      return Sys.job("admin.request", args || {}, Object.assign({
        timeout: (args && args.verb === "updates.install") ? 3600000 : 900000,
        pollMs: 800,
        startTimeout: 30000
      }, opts || {}));
    }
  };
})();
function brokerReady(){ try{ return Admin.ready(); }catch(e){ return false; } }

/* The pad the HOST is reading over raw HID — battery included, which no
   web API exposes. Resolves to null on a host that cannot answer, and
   the Controllers panel says so rather than leaving a blank. */
function padSnapshot(maxAgeMs){
  return new Promise(resolve => {
    if (padInfo && performance.now() - padInfoAt < (maxAgeMs || 2000)){ resolve(padInfo); return; }
    let done = false;
    padInfoWaiters.push(d => { if (!done){ done = true; resolve(d); } });
    Host.post({ type:"padinfo" });
    setTimeout(() => { if (!done){ done = true; resolve(padInfo); } }, 1200);
  });
}

/* ═══ Input device tracking ══════════════════════════════
   The hint bar teaches whichever device the human is actually
   holding. Synthetic keyboard events (isTrusted === false) come from
   the v2 shim translating pad input, so they count as pad, not key. */
const Input = (function(){
  let device = "pad";                 // the shipped device has no keyboard
  function set(d){
    if (d === device) return;
    device = d;
    hostLog("input device -> " + d);
    Hints.render();
  }
  function pad(action, phase, button){
    set("pad");
    return Nav.action(action, phase, button);
  }
  return { pad, set, get device(){ return device; } };
})();

/* ═══ On-screen keyboard bridge ══════════════════════════
   MarwanOSK is a modal: while it is up it gets every action first and
   nothing behind it moves, even for actions it does not recognise.

   It is given the literal button rather than the shell's semantic
   action wherever the host tells us one, because the two disagree on
   purpose: L1/R1 switch views in the shell and move the text caret in
   the keyboard, Options opens a title's options menu in the shell and
   commits the field in the keyboard. MarwanOSK's own alias table maps
   both spellings, so a host that sends only the semantic name still
   works — this just makes the shoulder buttons do the right thing.

   Directions are not given to beginRepeat(): the host is already the
   repeat authority for those and sends a stream of "repeat" phases.
   Square (backspace) is the one that wants holding, and the host does
   not auto-repeat face buttons, so that one is handed over properly. */
const OSK_HOLD = new Set(["square", "backspace"]);
const OSK = {
  isOpen(){
    try{ return !!(window.MarwanOSK && window.MarwanOSK.isOpen()); }
    catch(e){ return false; }
  },
  /* returns a string when it consumed the action, null when it did not */
  route(action, phase, button){
    if (!this.isOpen()) return null;
    const a = button || action;
    if (phase === "release"){
      try{ window.MarwanOSK.endRepeat(); }catch(e){}
      return "osk: release";
    }
    if (phase === "press" && OSK_HOLD.has(a)){
      window.MarwanOSK.beginRepeat(a);
      return "osk: " + a + " (hold to repeat)";
    }
    const took = window.MarwanOSK.handleAction(a);
    return took ? ("osk: " + a) : ("osk: ignored " + a + " (modal, not passed through)");
  },
  open(cfg){
    if (!window.MarwanOSK){
      toast("On-screen keyboard is not loaded — osk.js missing next to index.html.");
      hostLog("MarwanOSK missing; cannot open '" + (cfg && cfg.title) + "'");
      return false;
    }
    hostLog("OSK open: " + (cfg && cfg.title));
    return window.MarwanOSK.open(cfg);
  }
};

/* ═══ File explorer bridge ═══════════════════════════════
   MarwanFiles is modal on exactly the same terms as MarwanOSK, one layer
   further in: the keyboard can be up *over* the explorer (renaming a
   file), so the keyboard is still asked first and the explorer only
   sees what the keyboard did not take.

   Like the keyboard, it is handed the literal pad button where the
   host gives us one. The two vocabularies disagree deliberately —
   L1/R1 switch tabs on the home screen and page the list in the
   explorer, Square opens app details on the home screen and marks a
   file in the explorer — and MarwanFiles' own alias table understands
   both spellings, so a host that only sends semantic names still
   works.

   Directions are not passed to beginRepeat(): the host owns repeat and
   sends a stream of "repeat" phases, and doubling that up would scroll
   at two different speeds at once. Nothing in the explorer wants a
   held face button (a long Cross would open a folder and then open
   whatever landed under the cursor inside it), so unlike the keyboard
   there is no hold set here at all — but endRepeat() is still called on
   release, because a host that does auto-repeat face buttons must not
   leave a timer running behind a closed explorer. */
const Files = (function(){

  /* ── The wire ────────────────────────────────────────────
     MarwanFiles can auto-detect its own transport, and here it must not be
     allowed to. Its second probe is `chrome.webview.hostObjects.mosFiles`,
     and under WebView2 that check can never fail: hostObjects is a
     JavaScript Proxy that manufactures a property for any name asked of
     it, so a host object that was never registered is indistinguishable
     from one that was. Left to itself the explorer selects a bridge that
     does not exist and every command dies at call time with a COM error,
     instead of at detection time with a sentence a human can read. The
     bench log for the first v5 run says exactly that:
     "transport=hostObject connected=true" from a host that registered no
     such object.

     Even when the host object IS registered (--file-host-object) it is
     the wrong transport for this process. AddHostObjectToScript
     dispatches the call onto the host's UI thread, and FileApi blocks —
     one directory sweep and the television is frozen with a live pad
     going nowhere.

     So the shell hands the explorer a transport instead of letting it
     guess: the host's {type:"fs"} message channel, answered from a
     background worker thread. This is the same protocol files.js would
     have chosen third; writing it here is what makes the choice
     deterministic. */
  let seq = 0;
  const pending = new Map();
  const TIMEOUT = 45000;      // a sweep of a cold 2 TB disk is allowed to be slow

  function send(cmd){
    return new Promise((resolve, reject) => {
      const id = "fs-" + (++seq);
      cmd.reqId = id;                       // the host echoes it back inside the envelope
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("The host did not answer '" + (cmd.cmd || "?") + "' within "
                         + (TIMEOUT / 1000) + " seconds."));
      }, TIMEOUT);
      pending.set(id, { resolve, timer });
      if (!Host.post({ type:"fs", reqId:id, command:cmd })){
        clearTimeout(timer);
        pending.delete(id);
        reject(new Error("There is no host to ask. The file explorer needs the ShellHostWeb "
                       + "build that carries FileApi."));
      }
    });
  }

  /* Called by Host.handle for every {type:"fs.reply"}. The envelope is
     handed over as-is: MarwanFiles reads .ok/.data/.error/.detail off it and
     turns a failure into prose itself, so nothing is interpreted here. */
  function settle(m){
    if (!m || !m.reqId) return;
    const p = pending.get(m.reqId);
    if (!p){ hostLog("fs: reply for unknown reqId " + m.reqId + " (timed out already?)"); return; }
    pending.delete(m.reqId);
    clearTimeout(p.timer);
    p.resolve(m);
  }

  let installed = false;
  function install(){
    if (installed || !window.MarwanFiles) return installed;
    try{
      window.MarwanFiles.setTransport(send);
      installed = true;
      hostLog("MarwanFiles bridge: shell-supplied transport over the host's {type:\"fs\"} channel"
            + " (answered on the host's FileApi worker thread, not its UI thread)");
    }catch(err){ report("files setTransport", err); }
    return installed;
  }

  return {
    _settle: settle,
    install,

    isOpen(){
      try{ return !!(window.MarwanFiles && window.MarwanFiles.isOpen()); }
      catch(e){ return false; }
    },

    /* returns a string when it consumed the action, null when it did not */
    route(action, phase, button){
      if (!this.isOpen()) return null;
      const a = button || action;
      if (phase === "release"){
        try{ window.MarwanFiles.endRepeat(); }catch(e){}
        return "files: release";
      }
      const took = window.MarwanFiles.handleAction(a);
      return took ? ("files: " + a) : ("files: ignored " + a + " (modal, not passed through)");
    },

    open(cfg){
      if (!window.MarwanFiles){
        toast("File explorer is not loaded — files.js missing next to index.html.");
        hostLog("MarwanFiles missing; cannot open the explorer");
        return false;
      }
      if (!install()){
        toast("The file bridge could not be connected.");
        return false;
      }
      /* Only worth a line when the host actually told us its capabilities
         and "fs" was not among them. A host that never got its hostinfo
         through has said nothing either way, and guessing out loud would
         be a false alarm on a bridge that then works. Either way the
         explorer opens: its own error text is a better explanation than
         anything this can predict. */
      if (Host.caps.known && !Host.caps.fs)
        hostLog("Files: this host does not advertise the fs capability; opening anyway");
      hostLog("Files open");
      return window.MarwanFiles.open(cfg);
    }
  };
})();

/* ═══ Browser bridge ═════════════════════════════════════
   MarwanBrowser draws the browser's chrome in this WebView; the pages
   themselves live in a second WebView2 the host owns. From the
   shell's point of view it is one more modal layer, ordered
   between the keyboard (which can be up over it, to type an
   address) and the explorer (which cannot be up at the same time
   as it).

   Everything it needs from the shell it gets through one bridge
   object, handed over once at startup: how to reach the host, how
   to open the keyboard, and where to write a log line. That is the
   whole coupling — browser.js has no other knowledge of this file. */
const Browser = {
  ready: false,

  install(){
    if (this.ready || !window.MarwanBrowser) return this.ready;
    MarwanBrowser.attach({
      post:      (o) => Host.post(o),
      osk:       (cfg) => OSK.open(cfg),
      oskIsOpen: () => OSK.isOpen(),
      /* The shell's consent sheet, handed over rather than reimplemented:
         a page asking for the camera and Settings asking to install
         software are the same question and must look, sound and be
         answered identically. browser.js hides the content view first —
         nothing it draws can appear over a child window — and this is
         drawn above the browser's own chrome; see .grant-layer. */
      grant:     (opts) => Grant.ask(opts),
      /* …and the way back out of one: the host withdraws a permission
         request when the page navigates away, the tab closes or its own
         deadline expires, and the sheet has to go with it. */
      grantDrop: (token) => Grant.drop(token),
      log:       (t) => hostLog(t),
      toast:     (t) => toast(t),
      /* A finished download, shown where it landed. The browser must close
         first and not merely be covered: its pages are a child window the
         explorer cannot be drawn over, so leaving it up would put the file
         list behind a web page. Returning false hands the problem back —
         browser.js then names the path instead of pretending. */
      files:     (folder) => {
        if (!folder || !window.MarwanFiles) return false;
        hostLog("browser: showing a download in Files -> " + folder);
        MarwanBrowser.close();
        return Files.open({ path: folder }) !== false;
      }
    });
    this.ready = true;
    hostLog("MarwanBrowser " + (MarwanBrowser.version || "?") + " attached");
    return true;
  },

  isOpen(){
    try{ return !!(window.MarwanBrowser && MarwanBrowser.isOpen()); }
    catch(e){ return false; }
  },

  /* The browser's pages are a child window of the host's, and a child
     window is drawn over everything this document can paint — so a control
     centre opened on top of a web page is a control centre nobody can see.
     browser.js's answer is shellHold(): it hides its own chrome and
     suspends the content window for as long as the shell needs the screen.
     Placed once on the way in, lifted once on the way out; `held` is what
     makes "once" true. Guarded on the method existing, because an older
     browser.js next to this page must not throw here. */
  held: false,

  hold(on){
    on = !!on;
    if (on === this.held) return false;
    try{
      if (!window.MarwanBrowser || typeof MarwanBrowser.shellHold !== "function") return false;
      MarwanBrowser.shellHold(on);
      this.held = on;
      hostLog("browser: " + (on ? "stepped aside for a shell overlay" : "given the screen back"));
      return true;
    }catch(err){ report("browser shellHold", err); return false; }
  },

  /* returns a string when it consumed the action, null when it did not.
     The browser is modal while it is the thing on screen — the home rail
     must not move underneath a web page — but it is NOT modal over the
     shell's own overlay: while the control centre is up, every press
     belongs to the focus stack, which is the only way PS can reach the
     control centre from inside a web page at all. */
  route(action, phase, button){
    if (!this.isOpen()) return null;
    if (Overlay.isOpen()){
      this.hold(true);
      return null;
    }
    const a = button || action;
    const took = MarwanBrowser.handleAction(a, phase);
    /* Not consumed means the browser has no meaning for it and the shell
       does — `guide` is the whole reason this branch exists. Returning null
       lets Nav.action reach its own table rather than answering "passed",
       which would have been a nudge and a dead button. */
    return took ? ("browser: " + a) : null;
  },

  /* Called at the end of every action: whatever just happened, the browser
     is either behind a shell overlay or it is not, and it should be hidden
     for exactly as long as that is true. Circle at the root of the control
     centre and Overlay.closeAll() from anywhere both land here. */
  syncOverlay(){
    if (!this.isOpen()){ this.held = false; return; }
    this.hold(Overlay.isOpen());
  },

  open(url){
    if (!window.MarwanBrowser){
      toast("Browser is not loaded — browser.js missing next to index.html.");
      hostLog("MarwanBrowser missing; cannot open the browser");
      return false;
    }
    if (Host.caps.known && !Host.caps.browser){
      toast("This host build has no browser channel.");
      hostLog("browser: host does not advertise the browser capability");
      return false;
    }
    this.install();
    hostLog("Browser open" + (url ? ": " + url : ""));
    return MarwanBrowser.open({
      url: url || "",
      onExit: safe("browser exit", () => {
        hostLog("browser: closed, restoring shell focus");
        Focus.repaint();
      })
    });
  }
};

/* ═══ Focus manager ══════════════════════════════════════
   A stack of scopes. Each scope owns an ordered set of focusables
   carrying explicit grid metadata (data-nav="row,col"); "back" always
   means "pop this scope". Geometric position is only consulted when a
   focusable declares data-nav="auto", so a list never depends on
   guessing where its rows landed. */
const Focus = (function(){
  const stack = [];

  function top(){ return stack.length ? stack[stack.length - 1] : null; }
  function isLive(it){ return it.el.isConnected && it.el.getAttribute("aria-disabled") !== "true"; }
  function live(sc){ return sc.items.filter(isLive); }

  /* sc.index indexes sc.items, NOT the filtered live list. Indexing the
     filtered list looks tidier and is a trap: removing one node from the
     DOM silently renumbers every item after it, so the cursor jumps to a
     neighbour without anything having moved. If the focused item has
     gone away, take the nearest surviving one in declaration order. */
  function current(sc){
    sc = sc || top();
    if (!sc || !sc.items.length) return null;
    const it = sc.items[sc.index];
    if (it && isLive(it)) return it;
    for (let d = 1; d <= sc.items.length; d++){
      const after = sc.items[sc.index + d], before = sc.items[sc.index - d];
      if (after && isLive(after)) return after;
      if (before && isLive(before)) return before;
    }
    return null;
  }

  /* Collect focusables under a root. Explicit grid metadata wins;
     data-nav="auto" falls back to measured position, bucketed so
     items on the same visual line share a row. */
  function collect(root){
    const out = [];
    root.querySelectorAll("[data-nav]").forEach(el => {
      const raw = (el.getAttribute("data-nav") || "").trim();
      let r = NaN, c = NaN;
      if (raw && raw !== "auto"){
        const p = raw.split(",");
        r = parseFloat(p[0]); c = parseFloat(p[1]);
      }
      if (!isFinite(r) || !isFinite(c)){
        const b = el.getBoundingClientRect();
        r = Math.round(b.top / Math.max(8, b.height || 8));
        c = Math.round(b.left / 8);
      }
      out.push({ el, r, c });
    });
    out.sort((a, b) => (a.r - b.r) || (a.c - b.c));
    return out;
  }

  function indexOfEl(sc, el){
    for (let i = 0; i < sc.items.length; i++) if (sc.items[i].el === el) return i;
    return -1;
  }

  function push(sc){
    sc.items = sc.items || [];
    sc.index = sc.index || 0;
    stack.push(sc);
    hostLog("scope push " + sc.id + " (" + live(sc).length + " focusables, depth " + stack.length + ")");
    repaint();
    return sc;
  }

  function pop(){
    if (stack.length <= 1) return false;
    const sc = stack.pop();
    hostLog("scope pop " + sc.id + " -> " + (top() ? top().id : "(none)"));
    try{ if (sc.onPop) sc.onPop(); }catch(err){ report("scope " + sc.id + " onPop", err); }
    repaint();
    return true;
  }

  function popTo(id){
    let guard = 0;
    while (stack.length > 1 && top().id !== id && guard++ < 16) pop();
  }

  function replaceItems(sc, items, keepEl){
    syncItems(sc, items, keepEl);
    repaint();
  }

  /* Same thing without the repaint, for callers that are already inside
     one — an onFocus hook that rebuilds part of its own scope (the
     settings content pane) must not re-enter repaint(), which would
     call the hook again, and again. keepEl should be read BEFORE the
     caller touches the DOM. */
  function syncItems(sc, items, keepEl){
    const keep = keepEl || (current(sc) || {}).el;
    sc.items = items;
    const i = keep ? indexOfEl(sc, keep) : -1;
    sc.index = i >= 0 ? i : Math.min(sc.index, Math.max(0, items.length - 1));
  }

  function focusEl(el, silent){
    const sc = top(); if (!sc) return;
    const i = indexOfEl(sc, el);
    if (i < 0) return;
    sc.index = i;
    const it = sc.items[i];
    if (it){ sc.memo = sc.memo || {}; sc.memo[it.r] = it.c; }
    repaint(silent);
  }

  /* Directional step.

     Horizontal stays on its own row. Wrapping is opt-in per row —
     the rail has always wrapped, but a two-item row like Play/Media
     must not, or "left" visibly moves the cursor to the right.

     Vertical picks the nearest row in that direction, then the column
     it remembers for that row (falling back to the nearest column).
     The memory is what makes leaving the rail and coming back land on
     the tile you left rather than on the first one. */
  function move(dx, dy){
    const sc = top(); if (!sc) return false;
    const l = live(sc); if (!l.length) return false;
    const cur = current(sc); if (!cur) return false;
    sc.memo = sc.memo || {};

    /* A focusable may claim an axis for itself — a volume slider wants
       left/right to mean "quieter/louder", not "leave this row". It is
       a property on the element rather than a special case in here, so
       the focus manager still knows nothing about sliders. Returning
       true means consumed; the handler owns its own repaint. */
    if (typeof cur.el.__mosAdjust === "function"){
      try{
        if (cur.el.__mosAdjust(dx, dy) === true){
          /* Say what actually happened: "moved right" would be a lie in
             the trace when the press changed a value instead. */
          hostLog("adjust " + describe(cur.el) + " " + (dx > 0 ? "up" : "down"));
          return true;
        }
      }catch(err){ report("adjust " + describe(cur.el), err); return true; }
    }

    let best = null;

    sc.memoRow = sc.memoRow || {};

    if (dx && sc.crossColumns){
      /* Two-pane layouts (a settings category list beside its content
         pane) are two independent vertical lists that happen to sit
         side by side. Their row numbers are their own, so "same row"
         means nothing across them: move to the nearest column in the
         direction, landing on the row remembered for that column, or
         at its top the first time. */
      let col = null;
      for (const it of l){
        const dc = it.c - cur.c;
        if (Math.sign(dc) !== Math.sign(dx)) continue;
        if (col === null || Math.abs(dc) < Math.abs(col - cur.c)) col = it.c;
      }
      if (col !== null){
        const remembered = sc.memoRow[col];
        let bestD = Infinity;
        for (const it of l){
          if (it.c !== col) continue;
          if (remembered != null){
            const d = Math.abs(it.r - remembered);
            if (d < bestD){ bestD = d; best = it; }
          } else if (!best || it.r < best.r) best = it;
        }
      }
    } else if (dx){
      let bestD = Infinity;
      for (const it of l){
        if (it === cur || it.r !== cur.r) continue;
        const dc = it.c - cur.c;
        if (Math.sign(dc) !== Math.sign(dx)) continue;
        if (Math.abs(dc) < bestD){ bestD = Math.abs(dc); best = it; }
      }
      const wraps = sc.wrapX === true || (Array.isArray(sc.wrapX) && sc.wrapX.indexOf(cur.r) >= 0);
      if (!best && wraps){
        for (const it of l){
          if (it === cur || it.r !== cur.r) continue;
          if (!best || (dx > 0 ? it.c < best.c : it.c > best.c)) best = it;
        }
      }
    } else {
      // In a two-pane scope, up/down stays inside the pane it is in.
      const lock = !!sc.crossColumns;
      let row = null;
      for (const it of l){
        if (lock && it.c !== cur.c) continue;
        const dr = it.r - cur.r;
        if (Math.sign(dr) !== Math.sign(dy)) continue;
        if (row === null || Math.abs(dr) < Math.abs(row - cur.r)) row = it.r;
      }
      if (row === null && sc.wrapY){
        for (const it of l){
          if (lock && it.c !== cur.c) continue;
          if (it.r === cur.r) continue;
          if (row === null || (dy > 0 ? it.r < row : it.r > row)) row = it.r;
        }
      }
      if (row !== null){
        const want = lock ? cur.c : (sc.memo[row] != null ? sc.memo[row] : cur.c);
        let bestD = Infinity;
        for (const it of l){
          if (it.r !== row) continue;
          if (lock && it.c !== cur.c) continue;
          const d = Math.abs(it.c - want);
          if (d < bestD){ bestD = d; best = it; }
        }
      }
    }
    if (!best) return false;

    sc.memo[best.r] = best.c;
    sc.memoRow[best.c] = best.r;
    sc.index = indexOfEl(sc, best.el);
    repaint();
    return true;
  }

  function activate(){
    const sc = top(); if (!sc) return "no scope";
    const it = current(sc); if (!it) return "nothing focused";
    if (it.el.getAttribute("aria-disabled") === "true") return "focused item is disabled";
    if (sc.activate){
      const r = sc.activate(it);
      if (r !== false) return r || ("activated " + describe(it.el));
    }
    const act = it.el.dataset.act;
    if (act && ACT[act]){ ACT[act](it.el, it); return "activated " + describe(it.el); }
    return "no action bound to " + describe(it.el);
  }

  function back(){
    const sc = top();
    if (sc && sc.onBack){
      const r = sc.onBack();
      if (r !== false) return r || ("left " + sc.id);
    }
    if (stack.length > 1){ const id = sc.id; pop(); return "left " + id; }
    return "already at the shell root";
  }

  function describe(el){
    return (el.id ? "#" + el.id : "") + (el.dataset.label ? " " + el.dataset.label : "")
         + (!el.id && !el.dataset.label ? (el.className || el.tagName) : "");
  }

  function ensureVisible(el){
    try{
      if (!el.scrollIntoView) return;
      el.scrollIntoView({ block:"nearest", inline:"nearest", behavior: RM ? "auto" : "smooth" });
    }catch(e){
      try{ el.scrollIntoView(false); }catch(e2){}
    }
  }

  let lastKey = "";

  /* Every element THIS manager currently has a ring on, and nothing else.

     It used to clear the attribute document-wide:

         document.querySelectorAll("[data-focus]").forEach(e => e.removeAttribute(...))

     which was a bug the moment a second focus manager moved into the same
     document. The browser's chrome (ui/browser.js) and the explorer's rows
     (ui/files.js) paint the same attribute on their own elements, under
     their own cursors, in this same DOM. A shell repaint — and a dozen
     ordinary things trigger one, down to a hint re-render — silently took
     the ring off whatever the human was actually on. On the browser that
     read as "I cannot reach the address bar": the cursor was there, and
     nothing on the screen said so. It reproduced as two screenshots of
     genuinely different focus positions coming out byte-identical.

     The clear is now scoped to what this manager owns: the elements it
     painted last time. It cannot reach an element it never touched, so a
     nested manager's ring survives whatever the shell repaints behind it.
     The stack is swept as well, which costs one attribute check per
     focusable and closes the one gap references alone would leave — an
     item whose scope was rebuilt around it between repaints. */
  let painted = [];

  function clearOwnFocus(){
    for (const el of painted){
      try{ el.removeAttribute("data-focus"); }catch(e){}
    }
    painted.length = 0;
    for (const sc of stack){
      for (const it of (sc.items || [])){
        const el = it && it.el;
        if (el && el.hasAttribute && el.hasAttribute("data-focus")) el.removeAttribute("data-focus");
      }
    }
  }

  function repaint(silent){
    try{
      clearOwnFocus();
      stack.forEach((sc, i) => {
        const it = current(sc);
        if (!it) return;
        sc.index = indexOfEl(sc, it.el);          // normalise after any DOM churn
        it.el.setAttribute("data-focus", i === stack.length - 1 ? "on" : "stale");
        painted.push(it.el);
      });
      const sc = top(); if (!sc) return;
      const it = current(sc);
      if (it){
        if (sc.onFocus) sc.onFocus(it);
        else ensureVisible(it.el);
        try{ it.el.focus({ preventScroll:true }); }catch(e){}
        const key = sc.id + "|" + describe(it.el);
        if (!silent && key !== lastKey){ lastKey = key; hostLog("focus " + key); }
      }
      Hints.render();
    }catch(err){ report("focus repaint", err); }
  }

  return { push, pop, popTo, top, current, collect, move, activate, back, focusEl,
           replaceItems, syncItems, repaint, ensureVisible, depth: () => stack.length,
           has: (id) => stack.some(s => s.id === id) };
})();

/* ═══ Hint bar ═══════════════════════════════════════════
   The tutorial surface: it shows what is valid *here*, and it is
   right by construction because it is rendered from the scope. */
const Hints = (function(){
  function chip(id){
    const h = HINTS[id];
    if (!h) return "";
    const marks = Input.device === "pad"
      ? h.pad.map(glyphSVG).join("")
      : h.key.map(k => '<span class="key">' + k + "</span>").join("");
    if (!marks) return "";
    /* A label may be a closure — the Cross chip reads "Resume" when the
       focused title is already open. Evaluated here, at render, so it
       cannot go stale the way a cached string would. */
    let label = h.label;
    if (typeof label === "function"){
      try{ label = label(); }catch(err){ report("hint label", err); label = ""; }
    }
    return '<span class="hint"><span class="hint-glyphs">' + marks + "</span>" + escHTML(label) + "</span>";
  }
  function render(){
    try{
      const sc = Focus.top();
      const ids = (sc && sc.hints) || [];
      $("#hintChips").innerHTML = ids.map(chip).join("");
    }catch(err){ report("hint render", err); }
  }
  return { render, chip };
})();

/* ═══ Shell state ════════════════════════════════════════ */
/* The rail's views, in the order the tabs are drawn and therefore in the
   order L1 and R1 walk them. It is the one list: the markup's data-nav
   columns, the tab row's column memory and the shoulder-button cycle all
   read their position out of it, so adding a fourth view is a line here
   and a button in the <nav>, not a hunt through the router. */
const TABS = ["play", "media", "apps"];
let tab = "play", idx = 0, artFlip = 0;

function remPx(){
  const v = parseFloat(getComputedStyle(document.documentElement).fontSize);
  return isFinite(v) && v > 0 ? v : 16;
}
/* Computed, not measured: every tile ahead of the focused one is at its
   collapsed width, so the offset is exact even while widths are still
   animating — measuring offsetLeft mid-transition reads the old layout.
   The tokens are unitless multipliers of 1rem so this survives scaling. */
function railStep(){
  const cs = getComputedStyle(document.documentElement);
  const t = parseFloat(cs.getPropertyValue("--cover-u"));
  const g = parseFloat(cs.getPropertyValue("--gap-u"));
  return ((isFinite(t) ? t : 7) + (isFinite(g) ? g : .875)) * remPx();
}
function centre(){
  $("#rail").style.transform = `translateX(${-(idx * railStep())}px)`;
}

/* A tile is built with NO inline background at all, and that is a
   correctness requirement rather than a style one.

   The old code set `background:` inline on .tile-art. An inline
   `background` shorthand also resets background-size, -position and
   -repeat to their initial values, and inline beats every rule in a
   stylesheet — so ui/library.css's `background-size:cover` never
   applied to a single cover, and `background-repeat:no-repeat` never
   applied to a single extracted icon. On the development laptop the
   visible result was that Counter-Strike and Dota were shown as
   unscaled crops of their own top-left corners, and that 2XKO, League
   of Legends, Teamfight Tactics and TEKKEN 8 had their icons TILED
   four-up across the box. It was the single biggest reason the rail
   read as generated rather than designed, and no numeric check on this
   screen could ever have caught it.

   The face is now chosen by ui/library.js as a class — a real cover, a
   portrait generated from the executable's icon, or a colour field for
   the tiles that have no artwork by nature — and everything about how
   it is drawn lives in ui/library.css. */
function buildRail(){
  const rail = $("#rail");
  rail.innerHTML = "";
  APPS[tab].forEach((app, i) => {
    const t = document.createElement("button");
    t.className = "tile face-field";
    t.setAttribute("aria-current", i === idx ? "true" : "false");
    t.setAttribute("aria-label", app.name);
    t.setAttribute("data-nav", "3," + i);
    t.dataset.act = "railPick";
    t.dataset.label = "tile:" + app.id;
    t.innerHTML =
      `<div class="tile-art"></div>` +
      `<div class="tile-mark"></div>` +
      `<div class="tile-glyph"><svg viewBox="0 0 24 24">${ICON[app.icon]}</svg></div>` +
      `<div class="tile-dim"></div>` +
      `<div class="tile-sheen"></div>` +
      `<div class="tile-name">${app.name}</div>` +
      (app.badge ? `<span class="tile-badge">${app.badge}</span>` : "");
    t.addEventListener("click", safe("tile click", (ev) => {
      if (ev.detail === 0) return;
      Input.set("key");
      selectTile(i);
      Focus.focusEl(t);
    }));
    rail.appendChild(t);
  });
  /* A rebuild throws the running marks away with the old tiles, so put
     them back before anything is painted. Guarded because buildRail runs
     during boot, before Apps exists. */
  try{ if (typeof applyRunningMarks === "function") applyRunningMarks(); }catch(e){}
  centre();
}

/* The rail's own selection. Deliberately NOT called select(): the v2
   shim owns the global name window.select, and a function declaration
   of the same name would be replaced by that adapter — which then
   calls itself. */
function selectTile(i, instant){
  const list = APPS[tab];
  idx = (i + list.length) % list.length;
  [...$("#rail").children].forEach((t, n) =>
    t.setAttribute("aria-current", n === idx ? "true" : "false"));
  requestAnimationFrame(centre);
  paintHero(list[idx], instant);
  rememberRow(3, idx);
}

/* Keep the home scope's column memory honest: arriving at the tab row
   from below should land on the tab that is actually selected, and
   arriving at the rail should land on the tile that is actually
   current — not on wherever the cursor happened to be two rows up. */
function rememberRow(row, col){
  if (!homeScope) return;
  homeScope.memo = homeScope.memo || {};
  homeScope.memo[row] = col;
}

/* The whole screen's ground, changed by moving one place along the
   rail. ui/library.js hands back the focused title's cover, the
   stretched downsample of it and the colour it is mostly made of;
   this puts them on the two pairs of cross-fading layers and sets
   --accent, which is what the eyebrow rule reads.

   Guarded on `token` because the art arrives asynchronously and a
   person on a pad moves faster than a 600×900 JPEG decodes: without
   it, walking briskly down the rail and stopping leaves whichever
   cover happened to finish last on screen rather than the one under
   the cursor. */
let artToken = 0;

function applyArt(art){
  const nextW = artFlip ? $("#wash0") : $("#wash1");
  const prevW = artFlip ? $("#wash1") : $("#wash0");
  const nextK = artFlip ? $("#key0")  : $("#key1");
  const prevK = artFlip ? $("#key1")  : $("#key0");
  artFlip ^= 1;

  if (art && art.wash) nextW.style.backgroundImage = `url("${art.wash}")`;
  nextW.classList.toggle("on", !!(art && art.wash));
  prevW.classList.remove("on");

  /* Only a REAL cover is worth showing sharp and full height. A
     generated portrait blown up to 122vh is a 300px canvas stretched
     across a television, so those titles get the wash and nothing
     else — which is a quieter screen, not a broken one. */
  const key = art && art.hasCover ? art.cover : null;
  if (key) nextK.style.backgroundImage = `url("${key}")`;
  nextK.classList.toggle("on", !!key);
  prevK.classList.remove("on");

  if (art && art.accent) document.documentElement.style.setProperty("--accent", art.accent);
}

function paintHero(app, instant){
  const token = ++artToken;
  if (window.MarwanLibrary && MarwanLibrary.art){
    Promise.resolve(MarwanLibrary.art(app)).then(safe("paintHero art", (art) => {
      if (token === artToken) applyArt(art);
    }), () => {});
  }

  const swap = $("#heroSwap"), side = $("#heroMeta");
  const write = safe("paintHero", () => {
    $("#heroEyebrow").textContent = app.eyebrow;
    $("#heroTitle").textContent   = app.title;
    $("#heroDesc").textContent    = app.desc;
    /* The hidden shim button's label, kept honest for the trace. The
       human reads the same fact off the tile's Running pill and off the
       Cross chip in the hint bar (see launchWord). */
    const lbl = $("#launchLabel");
    if (lbl) lbl.textContent = isRunningId(app.id) ? "Resume" : app.action;

    /* Capability tags are deliberately NOT rendered. They were static
       prose about what a thing can do ("Controller navigation", "Native
       file operations", "Started by the client") — true, but never news,
       and a row of them competed with the title for the eye every time
       the focus moved. The scan still carries `tags`, and the details
       panel still lists them under Capabilities; the home screen shows
       the title, what it is, and what is true right now. */
    const tagsEl = $("#heroTags");
    if (tagsEl) tagsEl.innerHTML = "";

    /* The fact table on the right. `live` names the label whose value
       is a running state rather than a static one, so it is picked out
       in the semantic green — matching by label, not by index, because
       an index silently points at the wrong row the moment a fact is
       inserted above it. */
    side.innerHTML = (app.facts || [])
      .map(([k, v]) =>
        `<div class="hero-fact${app.live === k ? " live" : ""}">` +
        `<span class="hero-fact-k">${escHTML(k)}</span>` +
        `<span class="hero-fact-v">${escHTML(v)}</span></div>`)
      .join("");

    swap.classList.remove("out");
    side.classList.remove("out");
  });
  if (instant || RM) { write(); return; }
  swap.classList.add("out");
  side.classList.add("out");
  setTimeout(write, 180);
}

function paintTabs(){
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
}

function setTabTo(name){
  if (!APPS[name] || name === tab) return;
  /* Decide the landing spot before buildRail() destroys every tile. */
  const focused = Focus.top() === homeScope ? (Focus.current(homeScope) || {}).el : null;
  const keep = focused && focused.classList.contains("tile") ? null : focused;

  tab = name; idx = 0;
  paintTabs();
  buildRail();
  paintHero(APPS[tab][0]);
  rememberRow(1, Math.max(0, TABS.indexOf(tab)));
  rememberRow(3, 0);
  refreshHomeItems(keep);
}

/* L1 and R1 walk the tabs rather than naming one each, which is what
   changed the moment there were three of them. The wire names stay
   tabPlay/tabMedia because they are the host's — see the router. */
function cycleTab(delta){
  const at = TABS.indexOf(tab);
  const next = TABS[((at < 0 ? 0 : at) + delta + TABS.length) % TABS.length];
  setTabTo(next);
  return tab;
}

/* ── The home scope ───────────────────────────────────────
   Four logical rows: status-bar buttons, tabs, hero actions, rail.
   Up/down crosses them, left/right walks within one. The rail wraps
   because a console rail always has. */
function homeItems(){
  return Focus.collect($("#shell"));
}
/* anchorEl may be passed explicitly by a caller that is about to
   destroy the currently focused node (a tab switch rebuilds the whole
   rail): the anchor has to be decided before the DOM changes, not
   read back out of it afterwards. Anything unusable lands on the
   rail's current selection rather than falling off the end. */
function refreshHomeItems(anchorEl){
  const sc = homeScope;
  if (!sc) return;
  let anchor = arguments.length ? anchorEl
             : (Focus.top() === sc ? (Focus.current(sc) || {}).el : null);
  if (!anchor || !anchor.isConnected) anchor = $("#rail").children[idx] || null;
  Focus.replaceItems(sc, homeItems(), anchor);
}

const homeScope = {
  id: "home",
  items: [],
  index: 0,
  wrapX: [3],                                    // only the rail wraps
  memo: { 1:0, 3:0 },                            // active tab, current tile
  /* The whole control scheme of the home screen, in order of how often
     it is used. "launch" renders as Cross + Launch/Open/Resume, so the
     one thing the hero button used to say is still said. */
  hints: ["navAll", "launch", "tabs", "appOpt", "cc"],
  onFocus(it){
    const el = it.el;
    if (el.classList.contains("tile")){
      const i = [...$("#rail").children].indexOf(el);
      if (i >= 0 && i !== idx) selectTile(i);
      centre();
      return;                                    // the rail scrolls itself
    }
    if (el.classList.contains("tab") && el.dataset.tab !== tab){
      setTabTo(el.dataset.tab);                    // focusing a tab switches view
      return;
    }
    Focus.ensureVisible(el);
  },
  onBack(){
    hostLog("back at home root — nothing to leave");
    return "already at the shell root";
  }
};

/* ═══ Overlay: control centre and panels ═════════════════ */
const Overlay = (function(){
  const el = () => $("#cc");

  function sync(){
    const open = Focus.depth() > 1;
    el().classList.toggle("open", open);           // the v2 shim reads this class
    el().setAttribute("aria-hidden", open ? "false" : "true");
    el().dataset.view = Focus.has("cc") && Focus.depth() === 2 ? "cc" : (open ? "panel" : "cc");

    /* A full-screen panel is a SCREEN, not a card floating over the home
       screen, and two things follow.

       The scrim goes nearly opaque, because a blurred rail of cover art
       showing through a settings screen is noise with nothing to say.

       And the overlay stops at the top of the hint bar instead of
       covering it. The hint bar lives inside #shell, which has its own
       opacity and scale and therefore its own stacking context, so no
       z-index on the footer can lift it above an overlay painted later
       in the document — the only way for it to stay lit is for the
       overlay not to be there. Its height is measured rather than
       assumed because .hints wraps on a narrow panel. */
    const stack = $("#panelStack");
    const top = stack.children.length ? stack.children[stack.children.length - 1] : null;
    const full = open && !!(top && top.classList.contains("panel-full"));
    el().classList.toggle("full", full);
    if (full){
      const h = $(".hints");
      el().style.setProperty("--hint-h", (h ? h.offsetHeight : 0) + "px");
    }
  }
  function closeAll(){
    let guard = 0;
    while (Focus.depth() > 1 && guard++ < 16) Focus.pop();
    $("#panelStack").innerHTML = "";
    sync();
  }
  /* The same predicate sync() paints from, named — anything above the home
     scope is the overlay, whether that is the control centre itself or six
     panels deep inside Settings. The .open class is a consequence of this,
     not the source of it, so nothing reads the class back. */
  function isOpen(){ return Focus.depth() > 1; }
  return { sync, closeAll, isOpen };
})();

/* ── Control centre scope ─────────────────────────────── */
function buildCC(){
  const row = $("#ccRow");
  row.innerHTML = "";
  CC_ITEMS.forEach((it, i) => {
    const b = document.createElement("button");
    b.className = "cc-item";
    b.setAttribute("aria-label", it.label);
    b.setAttribute("data-nav", "0," + i);
    b.dataset.act = "ccPick";
    b.dataset.panel = it.panel;
    b.dataset.label = "cc:" + it.id;
    b.innerHTML = `<svg viewBox="0 0 24 24">${it.icon}</svg>`;
    b.addEventListener("mouseenter", safe("cc hover", () => {
      if (Focus.top() && Focus.top().id === "cc"){ Input.set("key"); Focus.focusEl(b); }
    }));
    row.appendChild(b);
  });
}
function paintCCLabel(){
  const sc = Focus.top();
  if (!sc || sc.id !== "cc") return;
  const cur = Focus.current(sc);
  const i = cur ? [...$("#ccRow").children].indexOf(cur.el) : 0;
  const it = CC_ITEMS[Math.max(0, i)];
  $("#ccRow").querySelectorAll(".cc-item").forEach((b, n) =>
    b.setAttribute("aria-current", n === i ? "true" : "false"));
  if (it) $("#ccLabel").innerHTML = it.label + "<small>" + it.sub + "</small>";
}

function openCC(startId){
  if (Focus.has("cc")) { Focus.popTo("cc"); Overlay.sync(); return; }
  const items = Focus.collect($("#ccRow"));
  const sc = Focus.push({
    id: "cc",
    items,
    index: 0,
    wrapX: true,
    hints: ["navLR", "select", "back"],
    onFocus(){ paintCCLabel(); },
    onPop(){ Overlay.sync(); }
  });
  if (startId){
    const b = [...$("#ccRow").children].find(x => x.dataset.label === "cc:" + startId);
    if (b) Focus.focusEl(b);
  }
  Overlay.sync();
  paintCCLabel();
}
function toggleOverlay(){
  if (Focus.depth() > 1){ Overlay.closeAll(); return "overlay closed"; }
  openCC();
  return "control centre opened";
}

/* ═══ Panels ═════════════════════════════════════════════
   Every panel is built into a detached node first: if a builder
   throws, the shell shows an error card whose back button still
   works rather than pushing a half-built scope. */
function panelShell(title, sub, eyebrow){
  const sec = document.createElement("section");
  sec.className = "panel";
  sec.innerHTML =
    '<header class="panel-head">' +
      '<div class="panel-eyebrow">' + (eyebrow || "Control centre") + "</div>" +
      '<h2 class="panel-title"></h2>' +
      (sub ? '<p class="panel-sub"></p>' : "") +
    "</header>" +
    '<div class="panel-body"></div>';
  sec.querySelector(".panel-title").textContent = title;
  if (sub) sec.querySelector(".panel-sub").textContent = sub;
  return sec;
}

function rowEl(o, r, c){
  const b = document.createElement("button");
  b.className = "row" + (o.tone ? " " + o.tone : "");
  b.setAttribute("data-nav", r + "," + c);
  b.dataset.act = o.act || "noop";
  if (o.arg) b.dataset.arg = o.arg;
