function fmtUptime(ms){
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + "d " + h + "h " + m + "m";
  if (h) return h + "h " + m + "m";
  return m + "m";
}
function fmtOffset(min){
  const sign = min < 0 ? "-" : "+", a = Math.abs(min);
  return "UTC" + sign + String(Math.floor(a / 60)).padStart(2, "0") + ":" + String(a % 60).padStart(2, "0");
}

/* ── Measured facts ─────────────────────────────────────── */
let measuredHz = 0;
function measureHz(){
  let n = 0;
  const t0 = performance.now();
  function step(){
    n++;
    if (performance.now() - t0 < 480) requestAnimationFrame(step);
    else measuredHz = Math.round(n / ((performance.now() - t0) / 1000));
  }
  requestAnimationFrame(step);
}
function displayFacts(){
  const dpr = devicePixelRatio || 1;
  return [
    ["Viewport",        innerWidth + " × " + innerHeight + " CSS px"],
    ["Device pixels",   Math.round(innerWidth * dpr) + " × " + Math.round(innerHeight * dpr)],
    ["Scale factor",    dpr.toFixed(2) + "×"],
    ["Screen",          screen.width + " × " + screen.height],
    ["Colour depth",    screen.colorDepth + "-bit"],
    ["Refresh rate",    measuredHz ? measuredHz + " Hz (measured)" : "measuring…"],
    ["Dynamic range",   matchMedia("(dynamic-range: high)").matches ? "High (HDR)" : "Standard"],
    ["Colour gamut",    matchMedia("(color-gamut: p3)").matches ? "Display-P3 or wider" : "sRGB"],
    ["Root scale",      remPx().toFixed(2) + " px / rem"]
  ];
}
function padFacts(){
  const out = [];
  try{
    const gp = navigator.getGamepads ? navigator.getGamepads() : [];
    let n = 0;
    for (const p of gp){
      if (!p) continue;
      n++;
      out.push(["Slot " + p.index, (p.id || "unknown").replace(/\s*\(.*$/, "")]);
      out.push(["Mapping", p.mapping || "(none)"]);
      out.push(["Controls", p.buttons.length + " buttons, " + p.axes.length + " axes"]);
    }
    if (!n) out.push(["Controllers", "none visible to the page"]);
  }catch(e){ out.push(["Controllers", "unavailable: " + e.message]); }
  out.push(["Host pad channel", Host.caps.nav
    ? "full (directions, face buttons, shoulders, phases)"
    : "legacy (left/right/cross/circle/L1/R1/options only)"]);
  out.push(["System channel", Host.caps.sys ? "live" : "not offered by this host build"]);
  return out;
}

/* ═══ Confirmation ═══════════════════════════════════════ */
const POWER_COPY = {
  restart:  { title:"Restart the machine?",  sub:"Everything running closes. Anything unsaved is lost.", go:"Restart" },
  shutdown: { title:"Shut down the machine?", sub:"Everything running closes and the machine powers off.", go:"Shut down" },
  signout:  { title:"Sign out?",              sub:"This Windows session ends and the sign-in screen returns.", go:"Sign out" }
};
function confirmPower(action){
  const copy = POWER_COPY[action] || { title:"Are you sure?", sub:"", go:"Confirm" };
  const node = panelShell(copy.title, copy.sub, "Confirm");
  node.classList.add("confirm");
  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  /* Cancel is column 0 and takes focus: the safe answer is the one
     already selected, and confirming is a deliberate move sideways. */
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = "Cancel";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "back"; no.dataset.label = "cancel";
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = copy.go;
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "power"; go.dataset.arg = action;
  go.dataset.label = "confirm:" + action;
  [no, go].forEach(b => b.addEventListener("click", safe("confirm click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.querySelector(".panel-body").remove();
  node.appendChild(acts);
  pushPanel("confirm:" + action, node, { hints:["navLR", "confirm", "cancel"] });
}

/* ═══ Activation table ═══════════════════════════════════ */
const ACT = {
  noop(){},
  back(){ Focus.back(); },

  /* Rows built at runtime carry their behaviour as a closure on the
     element rather than a name in this table — a settings pane's rows
     depend on what the OS just said, and cannot be enumerated here. */
  run(el){
    if (typeof el.__arcRun !== "function"){ hostLog("run: no closure on " + (el.dataset.label || el.className)); return; }
    try{ el.__arcRun(el); }
    catch(err){ report("row " + (el.dataset.label || "action"), err); }
  },
  replay(){ runBoot(); },

  railPick(el){
    const i = [...$("#rail").children].indexOf(el);
    if (i >= 0) selectTile(i);
    doLaunch();
  },
  launch(){ doLaunch(); },
  appOptions(){ openAppOptions(); },

  openSettings(){ openCC("settings"); openPanel("settings"); },
  openPower(){ openCC("power"); openPanel("power"); },

  ccPick(el){
    const p = el.dataset.panel;
    if (p) openPanel(p);
  },
  settingsCat(el){ ACT.settingsCatId(el.dataset.arg); },
  settingsCatId(id){
    if (Focus.top() && Focus.top().id === "panel:settings") return;   // the pane already follows focus
    if (Focus.has("panel:settings") && settingsGoto){
      Focus.popTo("panel:settings");
      settingsGoto(id);
      return;
    }
    if (!Focus.has("cc")) openCC("settings");
    Focus.popTo("cc");
    const sc = openPanel("settings");
    if (sc && settingsGoto) settingsGoto(id);
  },
  powerConfirm(el){ confirmPower(el.dataset.arg); },
  power(el){
    const a = el.dataset.arg;
    Overlay.closeAll();
    Host.power(a);
    toast("Power: " + a + " requested.");
  },
  deviceName(){
    OSK.open({
      title: "Device name",
      value: deviceName,
      mode: "text",
      maxLength: 32,
      placeholder: "e.g. Living room",
      commitLabel: "Save",
      onCommit: safe("osk commit", (v) => setDeviceName(v)),
      onCancel: safe("osk cancel", () => hostLog("OSK cancelled — device name unchanged"))
    });
  },
  /* The file explorer. It is its own modal world with its own scope
     stack and its own hint bar, so the shell does not push a Focus
     scope for it — the router in Nav.action() is what makes it modal.

     What the shell does owe it is the way back. ArcFiles calls onExit
     after it has torn its own DOM down, and Focus.repaint() puts the
     ring and the real DOM focus back on whatever was underneath: the
     Storage row in Settings, or the home tile, depending on where the
     human came in from. Without it the explorer closes onto a screen
     with no cursor and the next D-pad press goes nowhere visible. */
  openFiles(){
    const cameFrom = Focus.top() ? Focus.top().id : "(nothing)";
    Files.open({
      title: "Files",
      onExit: safe("files exit", () => {
        hostLog("files: closed, returning focus to " + cameFrom);
        Focus.repaint();
      })
    });
  },

  /* The browser. Same shape as openFiles(): its own modal world, its
     own controller model, and Focus.repaint() on the way out. */
  openBrowser(url){
    Browser.open(typeof url === "string" ? url : "");
  },

  stub(el){
    const what = el.dataset.arg || el.dataset.label || "This control";
    toast(what + " is a stub — navigation works, the action is not implemented yet.");
    hostLog("stub activated: " + what);
  }
};

/* The launch path, unchanged in substance: #btnLaunch is still the
   thing that posts {type:launch} and the host still job-tracks the
   child and forces the foreground back afterwards. */
let launching = false;
/* The v2 shim owns a capture-phase Enter handler that posts {type:launch}
   before the page sees the key at all, and it cannot be unhooked from
   here. Rather than send a second message and spawn two children, note
   that it already fired and let it stand. v3 routes Enter through
   arcPad() like every other action and this window is never open. */
let shimEnterAt = -1e9;
function doLaunch(){
  if (performance.now() - shimEnterAt < 250){
    hostLog("launch already posted by the v2 shim's Enter handler — not duplicating");
    return;
  }
  if (launching) return;
  launching = true;
  setTimeout(() => { launching = false; }, 600);
  const b = $("#btnLaunch");
  b.classList.add("pressed");
  setTimeout(() => b.classList.remove("pressed"), 160);

  /* A tile carrying `run` is built into the shell rather than being a
     child process — the explorer is the first of them. It must not
     reach {type:launch}, or the host would spawn the placeholder child
     underneath it. */
  const app = APPS[tab][idx];
  if (typeof app.run === "function"){
    hostLog("open (in-shell): " + app.id);
    try{ app.run(); }
    catch(err){ report("tile run " + app.id, err); }
    return;
  }
  hostLog("launch: " + app.id);
  Host.post({ type:"launch", target:"" });
}

function openAppOptions(){
  const app = APPS[tab][idx];
  const node = panelShell(app.title, "Per-app options. The shape is here; the actions are not built yet.", "Options");
  const body = node.querySelector(".panel-body");
  [
    { label:"Launch",            sub:app.action + " " + app.name, icon:"steam",  act:"launchFromPanel" },
    { label:"Pin to the front",  sub:"Stub",                      icon:"info",   act:"stub", arg:"Pin to the front" },
    { label:"App settings",      sub:"Stub",                      icon:"gear",   act:"stub", arg:"App settings" }
  ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
  if (!Focus.has("cc")){
    /* Options is reachable straight from the home row, so it opens its
       own overlay level without going through the control centre. */
  }
  pushPanel("appOptions", node, { hints:["navUD", "select", "back"] });
}
ACT.launchFromPanel = function(){ Overlay.closeAll(); doLaunch(); };

/* ═══ Semantic action router ═════════════════════════════
   One table, whatever the source: host pad message, Gamepad API
   fallback, or keyboard. Everything returns a short string so the
   host log reads as a trace of what the page actually did. */
const Nav = (function(){
  const table = {
    left:  () => Focus.move(-1, 0) ? "moved left"  : "no target to the left",
    right: () => Focus.move( 1, 0) ? "moved right" : "no target to the right",
    up:    () => Focus.move(0, -1) ? "moved up"    : "no target above",
    down:  () => Focus.move(0,  1) ? "moved down"  : "no target below",
    launch:   () => Focus.activate(),
    select:   () => Focus.activate(),
    back:     () => Focus.back(),
    cc:       () => toggleOverlay(),
    tabPlay:  () => { if (Focus.depth() > 1) return "tabs are a home-screen control"; setTabTo("play");  return "tab=play"; },
    tabMedia: () => { if (Focus.depth() > 1) return "tabs are a home-screen control"; setTabTo("media"); return "tab=media"; },
    square:   () => { openAppOptions(); return "opened details"; },
    triangle: () => { if (Focus.depth() > 1) return "options is a home-screen control"; openAppOptions(); return "opened app options"; },
    guide:    () => { toggleOverlay(); return "guide -> control centre"; }
  };
  function action(name, phase, button){
    /* The keyboard is modal and comes first. */
    try{
      const took = OSK.route(name, phase, button);
      if (took !== null) return took;
    }catch(err){ report("osk route " + name, err); }

    /* Then the explorer, which is modal over the whole shell but under
       the keyboard: renaming a file puts the keyboard on top of it. */
    try{
      const took = Files.route(name, phase, button);
      if (took !== null) return took;
    }catch(err){ report("files route " + name, err); }

    /* Then the browser, on the same terms. The two are never up at once
       (each is reached from the home rail, and each is modal), so their
       order here is only a formality — but it has to be after the
       keyboard, because typing an address is the keyboard over the
       browser and the keyboard must get the keys. */
    try{
      const took = Browser.route(name, phase, button);
      if (took !== null) return took;
    }catch(err){ report("browser route " + name, err); }

    if (phase === "release") return "release (the shell acts on press)";
    const fn = table[name];
    if (!fn) return "unknown action '" + name + "'";
    try{ return String(fn()); }
    catch(err){ report("action " + name, err); return "action " + name + " failed (contained)"; }
  }
  return { action, table };
})();

/* window.arcPad is the v3 shim's single entry point. phase is
   press/repeat/release and button is the literal pad button, both
   absent on the v2 host. */
window.arcPad = function(action, phase, button){
  Host.hostOwned.add(action);
  return Input.pad(action, phase, button);
};

/* ── v2 shim adapters ─────────────────────────────────────
   The shipping host drives these four names directly. Keeping them as
   thin adapters onto the focus manager is what lets the new UI run on
   the binary that is already the Windows shell.

   Note the naming: the shell's own functions are selectTile /
   setTabTo / toggleOverlay, never select / setTab / toggleCC. A
   top-level function declaration and window.<same name> are one
   binding, so an adapter that called the "internal" name would call
   itself until the stack ran out. */
window.select = safe("shim select", function(i, instant){
  Input.set("pad");
  const cur = idx;
  const d = i - cur;
  const sc = Focus.top();
  const onRail = sc === homeScope && (Focus.current(sc) || {}).el &&
                 Focus.current(sc).el.classList.contains("tile");
  if (sc && sc.id === "home" && !onRail && (d === 1 || d === -1))
    return Nav.action(d > 0 ? "right" : "left");
  selectTile(i, instant);
  const el = $("#rail").children[idx];
  if (sc && sc.id === "home" && el) Focus.focusEl(el);
  return "rail index " + idx;
});
window.setTab   = safe("shim setTab",   function(name){ Input.set("pad"); setTabTo(name); return "tab=" + tab; });
window.toggleCC = safe("shim toggleCC", function(){ Input.set("pad"); return toggleOverlay(); });
window.closeCC  = safe("shim closeCC",  function(){ Input.set("pad"); return Focus.back(); });

/* ═══ Gamepad API supplement ═════════════════════════════
   WebView2 does surface the DualSense through navigator.getGamepads
   (the host log confirms it: standard mapping, 18 buttons). The host's
   raw-HID path is authoritative, so this only ever emits actions the
   host has never sent — which on the v2 binary means up/down and the
   remaining face buttons, and on v3 means nothing at all. */
(function gamepadSupplement(){
  const MAP = { 2:"square", 3:"triangle", 12:"up", 13:"down", 16:"guide" };
  const AXIS_V = 1, DEAD = .55;
  const FIRST = 400, NEXT = 200;
  let prev = {}, vDir = 0, vAt = 0;

  function emit(action, phase){
    if (Host.hostOwned.has(action)) return;      // the host owns it; never double-fire
    const r = Input.pad(action, phase, action);
    if (phase !== "release" && phase !== "repeat")
      hostLog("pad(gamepad-api) " + action + " -> " + r);
  }

  function poll(){
    try{
      const gp = navigator.getGamepads ? navigator.getGamepads() : null;
      if (gp){
        let pad = null;
        for (const p of gp) if (p && p.connected){ pad = p; break; }
        if (pad){
          for (const k in MAP){
            const i = +k, down = !!(pad.buttons[i] && pad.buttons[i].pressed);
            if (down && !prev[i]) emit(MAP[i], "press");
            else if (!down && prev[i]) emit(MAP[i], "release");
            prev[i] = down;
          }
          const ay = pad.axes.length > AXIS_V ? pad.axes[AXIS_V] : 0;
          const dir = ay <= -DEAD ? -1 : (ay >= DEAD ? 1 : 0);
          const now = performance.now();
          if (dir !== vDir){
            const was = vDir;
            vDir = dir;
            if (dir){ emit(dir < 0 ? "up" : "down", "press"); vAt = now + FIRST; }
            else if (was) emit(was < 0 ? "up" : "down", "release");
          } else if (dir && now >= vAt){
            emit(dir < 0 ? "up" : "down", "repeat");
            vAt = now + NEXT;
          }
        }
      }
    }catch(e){ /* a poll must never be able to stop the loop */ }
    setTimeout(poll, 40);
  }
  poll();
})();

/* ═══ Clock ══════════════════════════════════════════════ */
function tick(){
  const d = new Date();
  $("#clock").textContent =
    String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
}

/* ═══ Keyboard ═══════════════════════════════════════════
   Still a debugging convenience, per the brief. Synthetic events
   (isTrusted === false) are the v2 shim relaying the pad, so they must
   not flip the hint bar to key caps. */
addEventListener("keydown", safe("keydown", (e) => {
  if (e.isTrusted !== false) Input.set("key"); else Input.set("pad");

  /* ArcOSK installs its own capture-phase handler and stops the keys it
     uses. The ones it does not use must still not reach the shell, or
     "c" would open the control centre behind an open keyboard. */
  if (OSK.isOpen()) return;

  switch (e.key){
    case "Escape":    e.preventDefault(); Nav.action("back"); return;
    case "ArrowLeft": e.preventDefault(); Nav.action("left"); return;
    case "ArrowRight":e.preventDefault(); Nav.action("right"); return;
    case "ArrowUp":   e.preventDefault(); Nav.action("up"); return;
    case "ArrowDown": e.preventDefault(); Nav.action("down"); return;
    case "Enter":
      e.preventDefault();
      if (e.isTrusted && window.__arcShim && !Host.caps.nav) shimEnterAt = performance.now();
      Nav.action("launch");
      return;
    case " ":         e.preventDefault(); Nav.action("select"); return;
    case "Tab":
      e.preventDefault();
      Nav.action(tab === "play" ? "tabMedia" : "tabPlay");
      return;
  }
  const k = e.key.toLowerCase();
  if (k === "b"){ runBoot(); return; }
  if (k === "c"){ e.preventDefault(); Nav.action("cc"); return; }
  if (k === "x"){ e.preventDefault(); Nav.action("square"); return; }
  if (k === "o"){ e.preventDefault(); Nav.action("triangle"); return; }
  if (k === "g"){ e.preventDefault(); Nav.action("guide"); return; }
}));

/* ═══ Wiring ═════════════════════════════════════════════ */
document.querySelectorAll(".tab").forEach(t =>
  t.addEventListener("click", safe("tab click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key");
    setTabTo(t.dataset.tab);
    Focus.focusEl(t);
  })));

/* #btnLaunch keeps its id and its meaning. The v2 shim calls .click()
   on it for Cross, which arrives as a synthetic click (detail === 0) —
   that must mean "activate whatever is focused", not "always launch",
   now that Cross also drives menus. Registering here, at parse time,
   puts this listener ahead of the shim's own, and stopping propagation
   keeps exactly one launch message on the wire. */
$("#btnLaunch").addEventListener("click", safe("launch click", (ev) => {
  ev.stopImmediatePropagation();
  ev.preventDefault();
  if (ev.detail === 0){ Input.set("pad"); Nav.action("launch"); return; }
  Input.set("key");
  Focus.focusEl($("#btnLaunch"));
  doLaunch();
}), false);

$("#btnOptions").addEventListener("click", safe("options click", (ev) => {
  if (ev.detail === 0) return;
  Input.set("key"); Focus.focusEl($("#btnOptions")); openAppOptions();
}));
$("#btnSettings").addEventListener("click", safe("settings click", (ev) => {
  if (ev.detail === 0) return;
  Input.set("key"); ACT.openSettings();
}));
$("#btnPower").addEventListener("click", safe("power click", (ev) => {
  if (ev.detail === 0) return;
  Input.set("key"); ACT.openPower();
}));
$("#cc").addEventListener("click", safe("cc backdrop", (e) => {
  if (e.target.id === "cc"){ Input.set("key"); Overlay.closeAll(); }
}));
$("#btnReplay").addEventListener("click", safe("replay click", (ev) => {
  if (ev.detail === 0) return;
  Input.set("key"); runBoot();
}));

let resizeTimer = 0;
addEventListener("resize", safe("resize", () => {
  centre();
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(safe("resize settle", () => {
    centre();
    const sc = Focus.top();
    if (sc && sc.id === "panel:display"){ Focus.pop(); openPanel("display"); }
  }), 220);
}));

/* ═══ Go ═════════════════════════════════════════════════ */
buildRail();
buildCC();
paintHero(APPS.play[0], true);
tick();
setInterval(tick, 15000);
measureHz();

Focus.push(homeScope);
refreshHomeItems();
(function focusRailFirst(){
  const el = $("#rail").children[idx];
  if (el) Focus.focusEl(el, true);
})();
Overlay.sync();
Hints.render();

Host.post({ type:"sysinfo" });          // v3 answers; v2 logs it as unhandled
Host.onSysinfo(safe("apply sysinfo", (s) => {
  if (s.user){ $("#userName").textContent = s.user; $("#avatarSmall").textContent = (s.user[0] || "?").toUpperCase(); }
  if (s.diskFree) $("#chipStorage").textContent = s.diskFree;
  if (s.netType)  $("#chipNet").textContent = s.netType;
}));

/* The status bar's two chips, from the same system channel the Settings
   screen uses — so the summary and the detail can never disagree. They
   keep whatever the host's cheaper sysinfo put there if this fails. */
function refreshChips(){
  Sys.call("net.status", {}, { timeout: 8000 }).then(n => {
    const r = n.reachability || {};
    const kind = n.connectionType === "wifi" ? "Wi-Fi" : (n.connectionType === "ethernet" ? "Wired" : "Network");
    $("#chipNet").textContent = r.internet ? kind : (r.connected ? kind + " · local only" : "Offline");
  }, () => {});
  Sys.call("sys.storage", {}, { timeout: 8000 }).then(s => {
    const c = (s.drives || []).filter(d => d.ready && d.fixed)[0];
    if (c) $("#chipStorage").textContent = fmtBytes(c.freeBytes) + " free";
  }, () => {});
}
setTimeout(safe("chips", refreshChips), 1500);
setInterval(safe("chips", refreshChips), 120000);

hostLog("shell ready — focus manager live, " + (Input.device) + " hints, root scale " + remPx().toFixed(2) + "px"
      + ", viewport " + innerWidth + "x" + innerHeight
      + ", keyboard " + (window.ArcOSK ? ("ArcOSK " + (window.ArcOSK.version || "?")) : "NOT LOADED (osk.js missing)")
      + ", explorer " + (window.ArcFiles ? ("ArcFiles " + (window.ArcFiles.version || "?")) : "NOT LOADED (files.js missing)")
      + ", browser " + (window.ArcBrowser ? ("ArcBrowser " + (window.ArcBrowser.version || "?")) : "NOT LOADED (browser.js missing)"));

/* Connect the explorer to the host now rather than on first open, so the
   choice of transport is a startup fact in the host log instead of a
   surprise the first time somebody presses Cross on the Files tile. */
try{
  Files.install();
  if (window.ArcFiles && typeof ArcFiles.probe === "function"){
    const p = ArcFiles.probe();
    hostLog("ArcFiles bridge confirmed: transport=" + p.transport + " connected=" + p.connected);
  }
}catch(err){ report("files install", err); }

try{ Browser.install(); }catch(err){ report("browser install", err); }

runBoot();
</script>
