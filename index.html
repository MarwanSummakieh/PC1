   Directions are not passed to beginRepeat(): the host owns repeat and
   sends a stream of "repeat" phases, and doubling that up would scroll
   at two different speeds at once. Nothing in the explorer wants a
   held face button (a long Cross would open a folder and then open
   whatever landed under the cursor inside it), so unlike the keyboard
   there is no hold set here at all — but endRepeat() is still called on
   release, because a host that does auto-repeat face buttons must not
   leave a timer running behind a closed explorer. */
const Files = (function(){

  /* ── The wire ────────────────────────────────────────────
     ArcFiles can auto-detect its own transport, and here it must not be
     allowed to. Its second probe is `chrome.webview.hostObjects.arcFiles`,
     and under WebView2 that check can never fail: hostObjects is a
     JavaScript Proxy that manufactures a property for any name asked of
     it, so a host object that was never registered is indistinguishable
     from one that was. Left to itself the explorer selects a bridge that
     does not exist and every command dies at call time with a COM error,
     instead of at detection time with a sentence a human can read. The
     bench log for the first v5 run says exactly that:
     "transport=hostObject connected=true" from a host that registered no
     such object.

     Even when the host object IS registered (--file-host-object) it is
     the wrong transport for this process. AddHostObjectToScript
     dispatches the call onto the host's UI thread, and FileApi blocks —
     one directory sweep and the television is frozen with a live pad
     going nowhere.

     So the shell hands the explorer a transport instead of letting it
     guess: the host's {type:"fs"} message channel, answered from a
     background worker thread. This is the same protocol files.js would
     have chosen third; writing it here is what makes the choice
     deterministic. */
  let seq = 0;
  const pending = new Map();
  const TIMEOUT = 45000;      // a sweep of a cold 2 TB disk is allowed to be slow

  function send(cmd){
    return new Promise((resolve, reject) => {
      const id = "fs-" + (++seq);
      cmd.reqId = id;                       // the host echoes it back inside the envelope
      const timer = setTimeout(() => {
        pending.delete(id);
        reject(new Error("The host did not answer '" + (cmd.cmd || "?") + "' within "
                         + (TIMEOUT / 1000) + " seconds."));
      }, TIMEOUT);
      pending.set(id, { resolve, timer });
      if (!Host.post({ type:"fs", reqId:id, command:cmd })){
        clearTimeout(timer);
        pending.delete(id);
        reject(new Error("There is no host to ask. The file explorer needs the ShellHostWeb "
                       + "build that carries FileApi."));
      }
    });
  }

  /* Called by Host.handle for every {type:"fs.reply"}. The envelope is
     handed over as-is: ArcFiles reads .ok/.data/.error/.detail off it and
     turns a failure into prose itself, so nothing is interpreted here. */
  function settle(m){
    if (!m || !m.reqId) return;
    const p = pending.get(m.reqId);
    if (!p){ hostLog("fs: reply for unknown reqId " + m.reqId + " (timed out already?)"); return; }
    pending.delete(m.reqId);
    clearTimeout(p.timer);
    p.resolve(m);
  }

  let installed = false;
  function install(){
    if (installed || !window.ArcFiles) return installed;
    try{
      window.ArcFiles.setTransport(send);
      installed = true;
      hostLog("ArcFiles bridge: shell-supplied transport over the host's {type:\"fs\"} channel"
            + " (answered on the host's FileApi worker thread, not its UI thread)");
    }catch(err){ report("files setTransport", err); }
    return installed;
  }

  return {
    _settle: settle,
    install,

    isOpen(){
      try{ return !!(window.ArcFiles && window.ArcFiles.isOpen()); }
      catch(e){ return false; }
    },

    /* returns a string when it consumed the action, null when it did not */
    route(action, phase, button){
      if (!this.isOpen()) return null;
      const a = button || action;
      if (phase === "release"){
        try{ window.ArcFiles.endRepeat(); }catch(e){}
        return "files: release";
      }
      const took = window.ArcFiles.handleAction(a);
      return took ? ("files: " + a) : ("files: ignored " + a + " (modal, not passed through)");
    },

    open(cfg){
      if (!window.ArcFiles){
        toast("File explorer is not loaded — files.js missing next to index.html.");
        hostLog("ArcFiles missing; cannot open the explorer");
        return false;
      }
      if (!install()){
        toast("The file bridge could not be connected.");
        return false;
      }
      /* Only worth a line when the host actually told us its capabilities
         and "fs" was not among them. A host that never got its hostinfo
         through has said nothing either way, and guessing out loud would
         be a false alarm on a bridge that then works. Either way the
         explorer opens: its own error text is a better explanation than
         anything this can predict. */
      if (Host.caps.known && !Host.caps.fs)
        hostLog("Files: this host does not advertise the fs capability; opening anyway");
      hostLog("Files open");
      return window.ArcFiles.open(cfg);
    }
  };
})();

/* ═══ Browser bridge ═════════════════════════════════════
   ArcBrowser draws the browser's chrome in this WebView; the pages
   themselves live in a second WebView2 the host owns. From the
   shell's point of view it is one more modal layer, ordered
   between the keyboard (which can be up over it, to type an
   address) and the explorer (which cannot be up at the same time
   as it).

   Everything it needs from the shell it gets through one bridge
   object, handed over once at startup: how to reach the host, how
   to open the keyboard, and where to write a log line. That is the
   whole coupling — browser.js has no other knowledge of this file. */
const Browser = {
  ready: false,

  install(){
    if (this.ready || !window.ArcBrowser) return this.ready;
    ArcBrowser.attach({
      post:      (o) => Host.post(o),
      osk:       (cfg) => OSK.open(cfg),
      oskIsOpen: () => OSK.isOpen(),
      log:       (t) => hostLog(t),
      toast:     (t) => toast(t),
      /* A finished download, shown where it landed. The browser must close
         first and not merely be covered: its pages are a child window the
         explorer cannot be drawn over, so leaving it up would put the file
         list behind a web page. Returning false hands the problem back —
         browser.js then names the path instead of pretending. */
      files:     (folder) => {
        if (!folder || !window.ArcFiles) return false;
        hostLog("browser: showing a download in Files -> " + folder);
        ArcBrowser.close();
        return Files.open({ path: folder }) !== false;
      }
    });
    this.ready = true;
    hostLog("ArcBrowser " + (ArcBrowser.version || "?") + " attached");
    return true;
  },

  isOpen(){
    try{ return !!(window.ArcBrowser && ArcBrowser.isOpen()); }
    catch(e){ return false; }
  },

  /* returns a string when it consumed the action, null when it did not.
     The browser is modal: once it is up it takes everything, including
     actions it has no meaning for, because the home rail must not move
     underneath a web page. */
  route(action, phase, button){
    if (!this.isOpen()) return null;
    const a = button || action;
    const took = ArcBrowser.handleAction(a, phase);
    return took ? ("browser: " + a) : ("browser: passed " + a);
  },

  open(url){
    if (!window.ArcBrowser){
      toast("Browser is not loaded — browser.js missing next to index.html.");
      hostLog("ArcBrowser missing; cannot open the browser");
      return false;
    }
    if (Host.caps.known && !Host.caps.browser){
      toast("This host build has no browser channel.");
      hostLog("browser: host does not advertise the browser capability");
      return false;
    }
    this.install();
    hostLog("Browser open" + (url ? ": " + url : ""));
    return ArcBrowser.open({
      url: url || "",
      onExit: safe("browser exit", () => {
        hostLog("browser: closed, restoring shell focus");
        Focus.repaint();
      })
    });
  }
};

/* ═══ Focus manager ══════════════════════════════════════
   A stack of scopes. Each scope owns an ordered set of focusables
   carrying explicit grid metadata (data-nav="row,col"); "back" always
   means "pop this scope". Geometric position is only consulted when a
   focusable declares data-nav="auto", so a list never depends on
   guessing where its rows landed. */
const Focus = (function(){
  const stack = [];

  function top(){ return stack.length ? stack[stack.length - 1] : null; }
  function isLive(it){ return it.el.isConnected && it.el.getAttribute("aria-disabled") !== "true"; }
  function live(sc){ return sc.items.filter(isLive); }

  /* sc.index indexes sc.items, NOT the filtered live list. Indexing the
     filtered list looks tidier and is a trap: removing one node from the
     DOM silently renumbers every item after it, so the cursor jumps to a
     neighbour without anything having moved. If the focused item has
     gone away, take the nearest surviving one in declaration order. */
  function current(sc){
    sc = sc || top();
    if (!sc || !sc.items.length) return null;
    const it = sc.items[sc.index];
    if (it && isLive(it)) return it;
    for (let d = 1; d <= sc.items.length; d++){
      const after = sc.items[sc.index + d], before = sc.items[sc.index - d];
      if (after && isLive(after)) return after;
      if (before && isLive(before)) return before;
    }
    return null;
  }

  /* Collect focusables under a root. Explicit grid metadata wins;
     data-nav="auto" falls back to measured position, bucketed so
     items on the same visual line share a row. */
  function collect(root){
    const out = [];
    root.querySelectorAll("[data-nav]").forEach(el => {
      const raw = (el.getAttribute("data-nav") || "").trim();
      let r = NaN, c = NaN;
      if (raw && raw !== "auto"){
        const p = raw.split(",");
        r = parseFloat(p[0]); c = parseFloat(p[1]);
      }
      if (!isFinite(r) || !isFinite(c)){
        const b = el.getBoundingClientRect();
        r = Math.round(b.top / Math.max(8, b.height || 8));
        c = Math.round(b.left / 8);
      }
      out.push({ el, r, c });
    });
    out.sort((a, b) => (a.r - b.r) || (a.c - b.c));
    return out;
  }

  function indexOfEl(sc, el){
    for (let i = 0; i < sc.items.length; i++) if (sc.items[i].el === el) return i;
    return -1;
  }

  function push(sc){
    sc.items = sc.items || [];
    sc.index = sc.index || 0;
    stack.push(sc);
    hostLog("scope push " + sc.id + " (" + live(sc).length + " focusables, depth " + stack.length + ")");
    repaint();
    return sc;
  }

  function pop(){
    if (stack.length <= 1) return false;
    const sc = stack.pop();
    hostLog("scope pop " + sc.id + " -> " + (top() ? top().id : "(none)"));
    try{ if (sc.onPop) sc.onPop(); }catch(err){ report("scope " + sc.id + " onPop", err); }
    repaint();
    return true;
  }

  function popTo(id){
    let guard = 0;
    while (stack.length > 1 && top().id !== id && guard++ < 16) pop();
  }

  function replaceItems(sc, items, keepEl){
    syncItems(sc, items, keepEl);
    repaint();
  }

  /* Same thing without the repaint, for callers that are already inside
     one — an onFocus hook that rebuilds part of its own scope (the
     settings content pane) must not re-enter repaint(), which would
     call the hook again, and again. keepEl should be read BEFORE the
     caller touches the DOM. */
  function syncItems(sc, items, keepEl){
    const keep = keepEl || (current(sc) || {}).el;
    sc.items = items;
    const i = keep ? indexOfEl(sc, keep) : -1;
    sc.index = i >= 0 ? i : Math.min(sc.index, Math.max(0, items.length - 1));
  }

  function focusEl(el, silent){
    const sc = top(); if (!sc) return;
    const i = indexOfEl(sc, el);
    if (i < 0) return;
    sc.index = i;
    const it = sc.items[i];
    if (it){ sc.memo = sc.memo || {}; sc.memo[it.r] = it.c; }
    repaint(silent);
  }

  /* Directional step.

     Horizontal stays on its own row. Wrapping is opt-in per row —
     the rail has always wrapped, but a two-item row like Play/Media
     must not, or "left" visibly moves the cursor to the right.

     Vertical picks the nearest row in that direction, then the column
     it remembers for that row (falling back to the nearest column).
     The memory is what makes leaving the rail and coming back land on
     the tile you left rather than on the first one. */
  function move(dx, dy){
    const sc = top(); if (!sc) return false;
    const l = live(sc); if (!l.length) return false;
    const cur = current(sc); if (!cur) return false;
    sc.memo = sc.memo || {};

    /* A focusable may claim an axis for itself — a volume slider wants
       left/right to mean "quieter/louder", not "leave this row". It is
       a property on the element rather than a special case in here, so
       the focus manager still knows nothing about sliders. Returning
       true means consumed; the handler owns its own repaint. */
    if (typeof cur.el.__arcAdjust === "function"){
      try{
        if (cur.el.__arcAdjust(dx, dy) === true){
          /* Say what actually happened: "moved right" would be a lie in
             the trace when the press changed a value instead. */
          hostLog("adjust " + describe(cur.el) + " " + (dx > 0 ? "up" : "down"));
          return true;
        }
      }catch(err){ report("adjust " + describe(cur.el), err); return true; }
    }

    let best = null;

    sc.memoRow = sc.memoRow || {};

    if (dx && sc.crossColumns){
      /* Two-pane layouts (a settings category list beside its content
         pane) are two independent vertical lists that happen to sit
         side by side. Their row numbers are their own, so "same row"
         means nothing across them: move to the nearest column in the
         direction, landing on the row remembered for that column, or
         at its top the first time. */
      let col = null;
      for (const it of l){
        const dc = it.c - cur.c;
        if (Math.sign(dc) !== Math.sign(dx)) continue;
        if (col === null || Math.abs(dc) < Math.abs(col - cur.c)) col = it.c;
      }
      if (col !== null){
        const remembered = sc.memoRow[col];
        let bestD = Infinity;
        for (const it of l){
          if (it.c !== col) continue;
          if (remembered != null){
            const d = Math.abs(it.r - remembered);
            if (d < bestD){ bestD = d; best = it; }
          } else if (!best || it.r < best.r) best = it;
        }
      }
    } else if (dx){
      let bestD = Infinity;
      for (const it of l){
        if (it === cur || it.r !== cur.r) continue;
        const dc = it.c - cur.c;
        if (Math.sign(dc) !== Math.sign(dx)) continue;
        if (Math.abs(dc) < bestD){ bestD = Math.abs(dc); best = it; }
      }
      const wraps = sc.wrapX === true || (Array.isArray(sc.wrapX) && sc.wrapX.indexOf(cur.r) >= 0);
      if (!best && wraps){
        for (const it of l){
          if (it === cur || it.r !== cur.r) continue;
          if (!best || (dx > 0 ? it.c < best.c : it.c > best.c)) best = it;
        }
      }
    } else {
      // In a two-pane scope, up/down stays inside the pane it is in.
      const lock = !!sc.crossColumns;
      let row = null;
      for (const it of l){
        if (lock && it.c !== cur.c) continue;
        const dr = it.r - cur.r;
        if (Math.sign(dr) !== Math.sign(dy)) continue;
        if (row === null || Math.abs(dr) < Math.abs(row - cur.r)) row = it.r;
      }
      if (row === null && sc.wrapY){
        for (const it of l){
          if (lock && it.c !== cur.c) continue;
          if (it.r === cur.r) continue;
          if (row === null || (dy > 0 ? it.r < row : it.r > row)) row = it.r;
        }
      }
      if (row !== null){
        const want = lock ? cur.c : (sc.memo[row] != null ? sc.memo[row] : cur.c);
        let bestD = Infinity;
        for (const it of l){
          if (it.r !== row) continue;
          if (lock && it.c !== cur.c) continue;
          const d = Math.abs(it.c - want);
          if (d < bestD){ bestD = d; best = it; }
        }
      }
    }
    if (!best) return false;

    sc.memo[best.r] = best.c;
    sc.memoRow[best.c] = best.r;
    sc.index = indexOfEl(sc, best.el);
    repaint();
    return true;
  }

  function activate(){
    const sc = top(); if (!sc) return "no scope";
    const it = current(sc); if (!it) return "nothing focused";
    if (it.el.getAttribute("aria-disabled") === "true") return "focused item is disabled";
    if (sc.activate){
      const r = sc.activate(it);
      if (r !== false) return r || ("activated " + describe(it.el));
    }
    const act = it.el.dataset.act;
    if (act && ACT[act]){ ACT[act](it.el, it); return "activated " + describe(it.el); }
    return "no action bound to " + describe(it.el);
  }

  function back(){
    const sc = top();
    if (sc && sc.onBack){
      const r = sc.onBack();
      if (r !== false) return r || ("left " + sc.id);
    }
    if (stack.length > 1){ const id = sc.id; pop(); return "left " + id; }
    return "already at the shell root";
  }

  function describe(el){
    return (el.id ? "#" + el.id : "") + (el.dataset.label ? " " + el.dataset.label : "")
         + (!el.id && !el.dataset.label ? (el.className || el.tagName) : "");
  }

  function ensureVisible(el){
    try{
      if (!el.scrollIntoView) return;
      el.scrollIntoView({ block:"nearest", inline:"nearest", behavior: RM ? "auto" : "smooth" });
    }catch(e){
      try{ el.scrollIntoView(false); }catch(e2){}
    }
  }

  let lastKey = "";

  /* Every element THIS manager currently has a ring on, and nothing else.

     It used to clear the attribute document-wide:

         document.querySelectorAll("[data-focus]").forEach(e => e.removeAttribute(...))

     which was a bug the moment a second focus manager moved into the same
     document. The browser's chrome (ui/browser.js) and the explorer's rows
     (ui/files.js) paint the same attribute on their own elements, under
     their own cursors, in this same DOM. A shell repaint — and a dozen
     ordinary things trigger one, down to a hint re-render — silently took
     the ring off whatever the human was actually on. On the browser that
     read as "I cannot reach the address bar": the cursor was there, and
     nothing on the screen said so. It reproduced as two screenshots of
     genuinely different focus positions coming out byte-identical.

     The clear is now scoped to what this manager owns: the elements it
     painted last time. It cannot reach an element it never touched, so a
     nested manager's ring survives whatever the shell repaints behind it.
     The stack is swept as well, which costs one attribute check per
     focusable and closes the one gap references alone would leave — an
     item whose scope was rebuilt around it between repaints. */
  let painted = [];

  function clearOwnFocus(){
    for (const el of painted){
      try{ el.removeAttribute("data-focus"); }catch(e){}
    }
    painted.length = 0;
    for (const sc of stack){
      for (const it of (sc.items || [])){
        const el = it && it.el;
        if (el && el.hasAttribute && el.hasAttribute("data-focus")) el.removeAttribute("data-focus");
      }
    }
  }

  function repaint(silent){
    try{
      clearOwnFocus();
      stack.forEach((sc, i) => {
        const it = current(sc);
        if (!it) return;
        sc.index = indexOfEl(sc, it.el);          // normalise after any DOM churn
        it.el.setAttribute("data-focus", i === stack.length - 1 ? "on" : "stale");
        painted.push(it.el);
      });
      const sc = top(); if (!sc) return;
      const it = current(sc);
      if (it){
        if (sc.onFocus) sc.onFocus(it);
        else ensureVisible(it.el);
        try{ it.el.focus({ preventScroll:true }); }catch(e){}
        const key = sc.id + "|" + describe(it.el);
        if (!silent && key !== lastKey){ lastKey = key; hostLog("focus " + key); }
      }
      Hints.render();
    }catch(err){ report("focus repaint", err); }
  }

  return { push, pop, popTo, top, current, collect, move, activate, back, focusEl,
           replaceItems, syncItems, repaint, ensureVisible, depth: () => stack.length,
           has: (id) => stack.some(s => s.id === id) };
})();

/* ═══ Hint bar ═══════════════════════════════════════════
   The tutorial surface: it shows what is valid *here*, and it is
   right by construction because it is rendered from the scope. */
const Hints = (function(){
  function chip(id){
    const h = HINTS[id];
    if (!h) return "";
    const marks = Input.device === "pad"
      ? h.pad.map(glyphSVG).join("")
      : h.key.map(k => '<span class="key">' + k + "</span>").join("");
    if (!marks) return "";
    return '<span class="hint"><span class="hint-glyphs">' + marks + "</span>" + h.label + "</span>";
  }
  /* Only the chips are re-rendered. #btnReplay is a real focusable and
     must survive, so it is static markup that never gets replaced. */
  function render(){
    try{
      const sc = Focus.top();
      const ids = (sc && sc.hints) || [];
      $("#hintChips").innerHTML = ids.map(chip).join("");
      const rk = $("#replayKey");
      if (rk) rk.style.display = Input.device === "pad" ? "none" : "";
    }catch(err){ report("hint render", err); }
  }
  return { render, chip };
})();

/* ═══ Shell state ════════════════════════════════════════ */
let tab = "play", idx = 0, artFlip = 0;

function remPx(){
  const v = parseFloat(getComputedStyle(document.documentElement).fontSize);
  return isFinite(v) && v > 0 ? v : 16;
}
/* Computed, not measured: every tile ahead of the focused one is at its
   collapsed width, so the offset is exact even while widths are still
   animating — measuring offsetLeft mid-transition reads the old layout.
   The tokens are unitless multipliers of 1rem so this survives scaling. */
function railStep(){
  const cs = getComputedStyle(document.documentElement);
  const t = parseFloat(cs.getPropertyValue("--cover-u"));
  const g = parseFloat(cs.getPropertyValue("--gap-u"));
  return ((isFinite(t) ? t : 7) + (isFinite(g) ? g : .875)) * remPx();
}
function centre(){
  $("#rail").style.transform = `translateX(${-(idx * railStep())}px)`;
}

/* A tile is built with NO inline background at all, and that is a
   correctness requirement rather than a style one.

   The old code set `background:` inline on .tile-art. An inline
   `background` shorthand also resets background-size, -position and
   -repeat to their initial values, and inline beats every rule in a
   stylesheet — so ui/library.css's `background-size:cover` never
   applied to a single cover, and `background-repeat:no-repeat` never
   applied to a single extracted icon. On the development laptop the
   visible result was that Counter-Strike and Dota were shown as
   unscaled crops of their own top-left corners, and that 2XKO, League
   of Legends, Teamfight Tactics and TEKKEN 8 had their icons TILED
   four-up across the box. It was the single biggest reason the rail
   read as generated rather than designed, and no numeric check on this
   screen could ever have caught it.

   The face is now chosen by ui/library.js as a class — a real cover, a
   portrait generated from the executable's icon, or a colour field for
   the tiles that have no artwork by nature — and everything about how
   it is drawn lives in ui/library.css. */
function buildRail(){
  const rail = $("#rail");
  rail.innerHTML = "";
  APPS[tab].forEach((app, i) => {
    const t = document.createElement("button");
    t.className = "tile face-field";
    t.setAttribute("aria-current", i === idx ? "true" : "false");
    t.setAttribute("aria-label", app.name);
    t.setAttribute("data-nav", "3," + i);
    t.dataset.act = "railPick";
    t.dataset.label = "tile:" + app.id;
    t.innerHTML =
      `<div class="tile-art"></div>` +
      `<div class="tile-arc"></div>` +
      `<div class="tile-mark"></div>` +
      `<div class="tile-glyph"><svg viewBox="0 0 24 24">${ICON[app.icon]}</svg></div>` +
      `<div class="tile-dim"></div>` +
      `<div class="tile-sheen"></div>` +
      `<div class="tile-name">${app.name}</div>` +
      (app.badge ? `<span class="tile-badge">${app.badge}</span>` : "");
    t.addEventListener("click", safe("tile click", (ev) => {
      if (ev.detail === 0) return;
      Input.set("key");
      selectTile(i);
      Focus.focusEl(t);
    }));
    rail.appendChild(t);
  });
  /* A rebuild throws the running marks away with the old tiles, so put
     them back before anything is painted. Guarded because buildRail runs
     during boot, before Apps exists. */
  try{ if (typeof applyRunningMarks === "function") applyRunningMarks(); }catch(e){}
  centre();
}

/* The rail's own selection. Deliberately NOT called select(): the v2
   shim owns the global name window.select, and a function declaration
   of the same name would be replaced by that adapter — which then
   calls itself. */
function selectTile(i, instant){
  const list = APPS[tab];
  idx = (i + list.length) % list.length;
  [...$("#rail").children].forEach((t, n) =>
    t.setAttribute("aria-current", n === idx ? "true" : "false"));
  requestAnimationFrame(centre);
  paintHero(list[idx], instant);
  rememberRow(3, idx);
}

/* Keep the home scope's column memory honest: arriving at the tab row
   from below should land on the tab that is actually selected, and
   arriving at the rail should land on the tile that is actually
   current — not on wherever the cursor happened to be two rows up. */
function rememberRow(row, col){
  if (!homeScope) return;
  homeScope.memo = homeScope.memo || {};
  homeScope.memo[row] = col;
}

/* The whole screen's ground, changed by moving one place along the
   rail. ui/library.js hands back the focused title's cover, the
   stretched downsample of it and the colour it is mostly made of;
   this puts them on the two pairs of cross-fading layers and sets
   --accent, which is what the arc mark and the eyebrow rule read.

   Guarded on `token` because the art arrives asynchronously and a
   person on a pad moves faster than a 600×900 JPEG decodes: without
   it, walking briskly down the rail and stopping leaves whichever
   cover happened to finish last on screen rather than the one under
   the cursor. */
let artToken = 0;

function applyArt(art){
  const nextW = artFlip ? $("#wash0") : $("#wash1");
  const prevW = artFlip ? $("#wash1") : $("#wash0");
  const nextK = artFlip ? $("#key0")  : $("#key1");
  const prevK = artFlip ? $("#key1")  : $("#key0");
  artFlip ^= 1;

  if (art && art.wash) nextW.style.backgroundImage = `url("${art.wash}")`;
  nextW.classList.toggle("on", !!(art && art.wash));
  prevW.classList.remove("on");

  /* Only a REAL cover is worth showing sharp and full height. A
     generated portrait blown up to 122vh is a 300px canvas stretched
     across a television, so those titles get the wash and the arc and
     nothing else — which is a quieter screen, not a broken one. */
  const key = art && art.hasCover ? art.cover : null;
  if (key) nextK.style.backgroundImage = `url("${key}")`;
  nextK.classList.toggle("on", !!key);
  prevK.classList.remove("on");
  document.documentElement.classList.toggle("art-none", !key);

  if (art && art.accent) document.documentElement.style.setProperty("--accent", art.accent);
}

function paintHero(app, instant){
  const token = ++artToken;
  if (window.ArcLibrary && ArcLibrary.art){
    Promise.resolve(ArcLibrary.art(app)).then(safe("paintHero art", (art) => {
      if (token === artToken) applyArt(art);
    }), () => {});
  }

  const swap = $("#heroSwap"), side = $("#heroMeta");
  const write = safe("paintHero", () => {
    $("#heroEyebrow").textContent = app.eyebrow;
    $("#heroTitle").textContent   = app.title;
    $("#heroDesc").textContent    = app.desc;
    /* "Resume" when this app is already open — the hero button is the
       one place the human looks before pressing Cross. */
    $("#launchLabel").textContent = isRunningId(app.id) ? "Resume" : app.action;

    /* Capability tags on the left, under the description. */
    $("#heroTags").innerHTML = (app.tags || [])
      .map(t => `<span class="chip">${escHTML(t)}</span>`).join("");

    /* The fact table on the right. `live` names the label whose value
       is a running state rather than a static one, so it is picked out
       in the semantic green — matching by label, not by index, because
       an index silently points at the wrong row the moment a fact is
       inserted above it. */
    side.innerHTML = (app.facts || [])
      .map(([k, v]) =>
        `<div class="hero-fact${app.live === k ? " live" : ""}">` +
        `<span class="hero-fact-k">${escHTML(k)}</span>` +
        `<span class="hero-fact-v">${escHTML(v)}</span></div>`)
      .join("");

    swap.classList.remove("out");
    side.classList.remove("out");
  });
  if (instant || RM) { write(); return; }
  swap.classList.add("out");
  side.classList.add("out");
  setTimeout(write, 180);
}

function setTabTo(name){
  if (!APPS[name] || name === tab) return;
  /* Decide the landing spot before buildRail() destroys every tile. */
  const focused = Focus.top() === homeScope ? (Focus.current(homeScope) || {}).el : null;
  const keep = focused && focused.classList.contains("tile") ? null : focused;

  tab = name; idx = 0;
  document.querySelectorAll(".tab").forEach(t =>
    t.setAttribute("aria-selected", String(t.dataset.tab === tab)));
  buildRail();
  paintHero(APPS[tab][0]);
  rememberRow(1, tab === "play" ? 0 : 1);
  rememberRow(3, 0);
  refreshHomeItems(keep);
}

/* ── The home scope ───────────────────────────────────────
   Four logical rows: status-bar buttons, tabs, hero actions, rail.
   Up/down crosses them, left/right walks within one. The rail wraps
   because a console rail always has. */
function homeItems(){
  return Focus.collect($("#shell"));
}
/* anchorEl may be passed explicitly by a caller that is about to
   destroy the currently focused node (a tab switch rebuilds the whole
   rail): the anchor has to be decided before the DOM changes, not
   read back out of it afterwards. Anything unusable lands on the
   rail's current selection rather than falling off the end. */
function refreshHomeItems(anchorEl){
  const sc = homeScope;
  if (!sc) return;
  let anchor = arguments.length ? anchorEl
             : (Focus.top() === sc ? (Focus.current(sc) || {}).el : null);
  if (!anchor || !anchor.isConnected) anchor = $("#rail").children[idx] || null;
  Focus.replaceItems(sc, homeItems(), anchor);
}

const homeScope = {
  id: "home",
  items: [],
  index: 0,
  wrapX: [3],                                    // only the rail wraps
  memo: { 1:0, 3:0 },                            // active tab, current tile
  hints: ["navAll", "launch", "tabs", "cc", "appOpt"],
  onFocus(it){
    const el = it.el;
    if (el.classList.contains("tile")){
      const i = [...$("#rail").children].indexOf(el);
      if (i >= 0 && i !== idx) selectTile(i);
      centre();
      return;                                    // the rail scrolls itself
    }
    if (el.classList.contains("tab") && el.dataset.tab !== tab){
      setTabTo(el.dataset.tab);                    // focusing a tab switches view
      return;
    }
    Focus.ensureVisible(el);
  },
  onBack(){
    hostLog("back at home root — nothing to leave");
    return "already at the shell root";
  }
};

/* ═══ Overlay: control centre and panels ═════════════════ */
const Overlay = (function(){
  const el = () => $("#cc");

  function sync(){
    const open = Focus.depth() > 1;
    el().classList.toggle("open", open);           // the v2 shim reads this class
    el().setAttribute("aria-hidden", open ? "false" : "true");
    el().dataset.view = Focus.has("cc") && Focus.depth() === 2 ? "cc" : (open ? "panel" : "cc");
  }
  function closeAll(){
    let guard = 0;
    while (Focus.depth() > 1 && guard++ < 16) Focus.pop();
    $("#panelStack").innerHTML = "";
    sync();
  }
  return { sync, closeAll };
})();

/* ── Control centre scope ─────────────────────────────── */
function buildCC(){
  const row = $("#ccRow");
  row.innerHTML = "";
  CC_ITEMS.forEach((it, i) => {
    const b = document.createElement("button");
    b.className = "cc-item" + (it.on ? " on" : "");
    b.setAttribute("aria-label", it.label);
    b.setAttribute("data-nav", "0," + i);
    b.dataset.act = "ccPick";
    b.dataset.panel = it.panel;
    b.dataset.label = "cc:" + it.id;
    b.innerHTML = `<svg viewBox="0 0 24 24">${it.icon}</svg>`;
    b.addEventListener("mouseenter", safe("cc hover", () => {
      if (Focus.top() && Focus.top().id === "cc"){ Input.set("key"); Focus.focusEl(b); }
    }));
    row.appendChild(b);
  });
}
function paintCCLabel(){
  const sc = Focus.top();
  if (!sc || sc.id !== "cc") return;
  const cur = Focus.current(sc);
  const i = cur ? [...$("#ccRow").children].indexOf(cur.el) : 0;
  const it = CC_ITEMS[Math.max(0, i)];
  $("#ccRow").querySelectorAll(".cc-item").forEach((b, n) =>
    b.setAttribute("aria-current", n === i ? "true" : "false"));
  if (it) $("#ccLabel").innerHTML = it.label + "<small>" + it.sub + "</small>";
}

function openCC(startId){
  if (Focus.has("cc")) { Focus.popTo("cc"); Overlay.sync(); return; }
  const items = Focus.collect($("#ccRow"));
  const sc = Focus.push({
    id: "cc",
    items,
    index: 0,
    wrapX: true,
    hints: ["navLR", "select", "back"],
    onFocus(){ paintCCLabel(); },
    onPop(){ Overlay.sync(); }
  });
  if (startId){
    const b = [...$("#ccRow").children].find(x => x.dataset.label === "cc:" + startId);
    if (b) Focus.focusEl(b);
  }
  Overlay.sync();
  paintCCLabel();
}
function toggleOverlay(){
  if (Focus.depth() > 1){ Overlay.closeAll(); return "overlay closed"; }
  openCC();
  return "control centre opened";
}

/* ═══ Panels ═════════════════════════════════════════════
   Every panel is built into a detached node first: if a builder
   throws, the shell shows an error card whose back button still
   works rather than pushing a half-built scope. */
function panelShell(title, sub, eyebrow){
  const sec = document.createElement("section");
  sec.className = "panel";
  sec.innerHTML =
    '<header class="panel-head">' +
      '<div class="panel-eyebrow">' + (eyebrow || "Control centre") + "</div>" +
      '<h2 class="panel-title"></h2>' +
      (sub ? '<p class="panel-sub"></p>' : "") +
    "</header>" +
    '<div class="panel-body"></div>';
  sec.querySelector(".panel-title").textContent = title;
  if (sub) sec.querySelector(".panel-sub").textContent = sub;
  return sec;
}

function rowEl(o, r, c){
  const b = document.createElement("button");
  b.className = "row" + (o.tone ? " " + o.tone : "");
  b.setAttribute("data-nav", r + "," + c);
  b.dataset.act = o.act || "noop";
  if (o.arg) b.dataset.arg = o.arg;
  b.dataset.label = o.label;
  if (o.disabled) b.setAttribute("aria-disabled", "true");
  b.innerHTML =
    (o.icon ? '<span class="row-ico"><svg viewBox="0 0 24 24">' + (ICON[o.icon] || "") + "</svg></span>" : "") +
    '<span class="row-text"><b></b>' + (o.sub ? "<small></small>" : "") + "</span>" +
    (o.tail ? '<span class="row-tail"></span>' : "");
  b.querySelector(".row-text b").textContent = o.label;
  if (o.sub)  b.querySelector(".row-text small").textContent = o.sub;
  if (o.tail) b.querySelector(".row-tail").textContent = o.tail;
  b.addEventListener("click", safe("row click", (ev) => {
    if (ev.detail === 0) return;                 // synthetic click: the pad path handles it
    Input.set("key");
    Focus.focusEl(b);
    Focus.activate();
  }));
  return b;
}

function factsEl(pairs){
  const d = document.createElement("div");
  d.className = "facts";
  pairs.forEach(([k, v]) => {
    const f = document.createElement("div");
    f.className = "fact";
    const s = document.createElement("span"); s.textContent = k;
    const b = document.createElement("b");    b.textContent = v;
    f.appendChild(s); f.appendChild(b);
    d.appendChild(f);
  });
  return d;
}
function noteEl(html){
  const n = document.createElement("div");
  n.className = "note";
  n.innerHTML = html;
  return n;
}

function pushPanel(id, node, opts){
  const stackEl = $("#panelStack");
  [...stackEl.children].forEach(c => c.classList.add("behind"));
  stackEl.appendChild(node);
  requestAnimationFrame(() => node.classList.add("in"));

  const items = Focus.collect(node);
  /* opts may carry its own teardown as onClose. It must not be able to
     replace onPop, or a panel that wanted a callback would leak its
     node into the DOM forever. */
  const extra = Object.assign({}, opts || {});
  const onClose = extra.onClose;
  delete extra.onClose;
  delete extra.onPop;
  const sc = Focus.push(Object.assign({
    id: "panel:" + id,
    items,
    index: 0,
    hints: ["navUD", "select", "back"],
    onPop(){
      try{ if (onClose) onClose(); }catch(err){ report("panel " + id + " onClose", err); }
      node.remove();
      const rest = $("#panelStack").children;
      if (rest.length) rest[rest.length - 1].classList.remove("behind");
      Overlay.sync();
    }
  }, extra));
  Overlay.sync();
  return sc;
}

function openPanel(id){
  let node;
  try{
    const build = PANEL_BUILD[id];
    if (!build) throw new Error("no panel named '" + id + "'");
    const r = build();
    node = r.node;
    return pushPanel(id, node, r.scope);
  }catch(err){
    report("panel " + id, err);
    const fail = panelShell("Panel unavailable", "This panel failed to open. The rest of the shell is unaffected.", "Error");
    fail.querySelector(".panel-body").appendChild(
      rowEl({ label:"Back", sub:String(err && err.message ? err.message : err), icon:"info", act:"back" }, 0, 0));
    return pushPanel(id + ":error", fail, { hints:["select","back"] });
  }
}

/* ── Device name ──────────────────────────────────────────
   The one setting in this tree that is genuinely editable, and the
   proof that the on-screen keyboard round-trips: open() -> the human
   types -> onCommit -> stored -> shown. It is deliberately a
   shell-local label, not the Windows computer name; renaming a
   machine is a privileged operation and belongs to the host, not to
   a text field in a placeholder panel. */
let deviceName = "";
try{ deviceName = localStorage.getItem("arc.deviceName") || ""; }catch(e){}

let settingsRepaint = null;             // set while the settings panel is up
let settingsGoto = null;                // jump the open settings panel to a category

function setDeviceName(v){
  deviceName = (v || "").trim().slice(0, 32);
  try{
    if (deviceName) localStorage.setItem("arc.deviceName", deviceName);
    else localStorage.removeItem("arc.deviceName");
  }catch(e){ hostLog("device name not persisted: " + e); }
  hostLog("device name committed: '" + deviceName + "'");
  toast(deviceName ? ("Device name set to “" + deviceName + "”") : "Device name cleared");
  try{ if (settingsRepaint) settingsRepaint(); }catch(err){ report("settings repaint", err); }
  Focus.repaint();
}

/* ── Placeholder discipline ───────────────────────────────
   Nothing in a panel may look like a reading unless it is one.
   A value the shell cannot obtain says so, and says who could. */
const PLACEHOLDER = "— not read from this system";
function hostValue(key, fallbackLabel){
  const s = Host.sys;
  if (s && s[key] != null && s[key] !== "") return String(s[key]);
  return fallbackLabel || PLACEHOLDER;
}

/* ═══ Settings atoms ═════════════════════════════════════
   Small builders shared by every category, so "reading…",
   "unavailable" and "this is what the OS said" look the same
   everywhere and can never be confused with a real reading. */

function statEl(text, kind, spinning){
  const d = document.createElement("div");
  d.className = "stat" + (kind ? " " + kind : "");
  if (spinning){ const s = document.createElement("span"); s.className = "spin"; d.appendChild(s); }
  const t = document.createElement("span"); t.textContent = text;
  d.appendChild(t);
  d.__text = t;
  return d;
}
function setStat(el, text, kind, spinning){
  if (!el) return;
  el.className = "stat" + (kind ? " " + kind : "");
  const spin = el.querySelector(".spin");
  if (spinning && !spin) el.insertBefore(Object.assign(document.createElement("span"), { className:"spin" }), el.firstChild);
  if (!spinning && spin) spin.remove();
  if (el.__text) el.__text.textContent = text;
}

/* An error card. Always three things: what failed, what the system
   said, and the machine-readable code — never a bare HRESULT alone. */
function errEl(title, e){
  const d = document.createElement("div");
  d.className = "err";
  const b = document.createElement("b"); b.textContent = title;
  const p = document.createElement("div"); p.textContent = Sys.say(e);
  d.appendChild(b); d.appendChild(p);
  if (e && e.code){
    const c = document.createElement("code");
    c.textContent = e.code;
    d.appendChild(c);
  }
  return d;
}

/* A row whose action is a closure rather than a name in ACT. */
function actionRow(o, r, c){
  const spec = Object.assign({}, o, { act: o.run ? "run" : (o.act || "noop") });
  if (o.tailHTML && !spec.tail) spec.tail = " ";      // rowEl only makes the tail span if asked
  const b = rowEl(spec, r, c);
  if (o.run) b.__arcRun = o.run;
  if (o.tailHTML) b.querySelector(".row-tail").innerHTML = o.tailHTML;
  return b;
}

/* Five bars, filled to the measured level. bars is 0-4 as Windows
   reports it (wlan signal quality bucketed), so 0 lights one bar. */
function sigHTML(bars){
  let out = '<span class="sig">';
  for (let i = 0; i < 5; i++) out += '<i class="' + (i <= bars ? "lit" : "") + '"></i>';
  return out + "</span>";
}
function tagHTML(text, cls){
  return '<span class="tag' + (cls ? " " + cls : "") + '">' + escHTML(text) + "</span>";
}
function escHTML(s){
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function fmtBytes(n){
  if (typeof n !== "number" || !isFinite(n) || n < 0) return "—";
  if (n >= 1099511627776) return (n / 1099511627776).toFixed(2) + " TB";
  if (n >= 1073741824)    return (n / 1073741824).toFixed(1)  + " GB";
  if (n >= 1048576)       return (n / 1048576).toFixed(0)     + " MB";
  return n + " B";
}
function fmtHz(v){
  if (typeof v !== "number" || !isFinite(v) || v <= 0) return "—";
  return (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(3).replace(/0+$/, "")) + " Hz";
}
function orDash(v){ return (v === null || v === undefined || v === "") ? "—" : String(v); }

/* A drive card: name, label, a bar, and the numbers under it. */
function driveEl(d){
  const box = document.createElement("div");
  box.className = "drive";
  const pct = typeof d.usedPercent === "number" ? d.usedPercent : 0;
  const top = document.createElement("div");
  top.className = "drive-top";
  const b = document.createElement("b");
  b.textContent = (d.name || "?") + (d.label ? "  " + d.label : "");
  const s = document.createElement("span");
  s.textContent = fmtBytes(d.freeBytes) + " free of " + fmtBytes(d.totalBytes);
  top.appendChild(b); top.appendChild(s);
  const bar = document.createElement("div");
  bar.className = "bar" + (pct >= 90 ? " hot" : "");
  const fill = document.createElement("i");
  fill.style.width = Math.max(0, Math.min(100, pct)) + "%";
  bar.appendChild(fill);
  const sub = document.createElement("div");
  sub.className = "drive-sub";
  sub.textContent = [
    (d.driveType || "?"),
    d.removable ? "removable" : "internal",
    (d.fileSystem || ""),
    pct + "% used"
  ].filter(Boolean).join(" · ");
  box.appendChild(top); box.appendChild(bar); box.appendChild(sub);
  return box;
}

/* ── A slider that is a focusable row ─────────────────────
   Left/right adjust it, and it claims those directions through
   __arcAdjust so the focus manager stays generic. Cross toggles mute
   where the caller supplies one. The write is debounced: the pad can
   emit repeats faster than an audio endpoint wants to be written. */
function sliderRow(o, r, c){
  const b = document.createElement("button");
  b.className = "row slider" + (o.muted ? " muted" : "");
  b.setAttribute("data-nav", r + "," + c);
  b.dataset.act = "run";
  b.dataset.label = o.label;
  b.innerHTML =
    '<span class="slider-head"><b></b><span></span></span>' +
    '<span class="slider-track"><i class="slider-fill"></i></span>' +
    '<span class="slider-hint"></span>';
  const nameEl = b.querySelector(".slider-head b");
  const valEl  = b.querySelector(".slider-head span");
  const fillEl = b.querySelector(".slider-fill");
  const hintEl = b.querySelector(".slider-hint");
  nameEl.textContent = o.label;
  hintEl.textContent = o.hint || "";

  let value = Math.max(0, Math.min(1, typeof o.value === "number" ? o.value : 0));
  let pendingTimer = 0, inflight = false, dirty = false;

  function paint(){
    const pct = Math.round(value * 100);
    valEl.textContent = o.muted ? pct + "%  ·  muted" : pct + "%";
    fillEl.style.width = pct + "%";
    b.classList.toggle("muted", !!o.muted);
  }
  paint();

  function flush(){
    if (!o.commit) return;
    if (inflight){ dirty = true; return; }
    inflight = true;
    const v = value;
    Promise.resolve()
      .then(() => o.commit(v))
      .catch(e => { toast(Sys.say(e)); hostLog("slider '" + o.label + "' commit failed: " + Sys.say(e)); })
      .then(() => {
        inflight = false;
        if (dirty){ dirty = false; flush(); }
      });
  }

  b.__arcAdjust = function(dx){
    if (!dx) return false;                       // up/down still leave the row
    const step = o.step || 0.05;
    const next = Math.max(0, Math.min(1, Math.round((value + dx * step) * 1000) / 1000));
    /* At the end of the track the press is NOT consumed. In a two-pane
       layout that is the escape hatch: pushing left at 0% crosses back
       to the category list instead of doing nothing at all. */
    if (Math.abs(next - value) < 1e-6) return false;
    value = next;
    paint();
    clearTimeout(pendingTimer);
    pendingTimer = setTimeout(flush, 120);
    return true;
  };
  b.__arcRun = function(){ if (o.activate) o.activate(b); };
  b.__arcSetMuted = function(m){ o.muted = m; paint(); };
  b.addEventListener("click", safe("slider click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  }));
  return b;
}

/* ── A pushed list to choose from ─────────────────────────
   Wi-Fi networks, display modes, time zones, output devices: all the
   same shape, so all the same navigation. Its own scope, so Circle
   means "never mind" and lands you back exactly where you were. */
function pickerPanel(o){
  const node = panelShell(o.title, o.sub, o.eyebrow || "Settings");
  const bodyEl = node.querySelector(".panel-body");
  const head = o.status ? bodyEl.appendChild(statEl(o.status, o.statusKind, o.statusSpin)) : null;
  const list = document.createElement("div");
  bodyEl.appendChild(list);

  /* items === undefined means "leave the rows alone, only the status
     line changed" — a scan ticking its elapsed time must not blank the
     list it has already found. */
  function paint(items, statusText, statusKind, spinning){
    if (items !== undefined){
      list.innerHTML = "";
      items.forEach((it, i) => {
        list.appendChild(actionRow({
          label: it.label, sub: it.sub, tail: it.tail, tailHTML: it.tailHTML,
          icon: it.icon, tone: it.tone, disabled: it.disabled,
          run: () => { if (o.onPick) o.onPick(it, i); }
        }, i, 0));
      });
      if (!items.length) list.appendChild(statEl(o.emptyText || "Nothing to show.", "bad"));
    }
    if (head && statusText !== undefined) setStat(head, statusText, statusKind, spinning);
    const sc = Focus.top();
    if (sc && sc.id === "panel:" + (o.id || "picker")){
      Focus.syncItems(sc, Focus.collect(node), (Focus.current(sc) || {}).el);
      Focus.repaint();
    }
  }
  paint(o.items || []);
  if (o.note) bodyEl.appendChild(noteEl(o.note));

  const sc = pushPanel(o.id || "picker", node, { hints:["navUD", "select", "back"] });
  return { scope: sc, node, paint, close(){ if (Focus.top() === sc) Focus.pop(); } };
}

/* ── A yes/no that is not about power ─────────────────────
   Same shape as the power confirmation and the same safe default:
   Cancel is focused, confirming is a deliberate move sideways. */
function confirmAction(o){
  const node = panelShell(o.title, o.sub, o.eyebrow || "Confirm");
  node.classList.add("confirm");
  const acts = document.createElement("div");
  acts.className = "confirm-actions";
  const no = document.createElement("button");
  no.className = "cbtn no"; no.textContent = o.cancelLabel || "Cancel";
  no.setAttribute("data-nav", "0,0"); no.dataset.act = "run"; no.dataset.label = "cancel";
  no.__arcRun = () => { Focus.back(); if (o.onCancel) o.onCancel(); };
  const go = document.createElement("button");
  go.className = "cbtn go"; go.textContent = o.goLabel || "Confirm";
  go.setAttribute("data-nav", "0,1"); go.dataset.act = "run"; go.dataset.label = "confirm";
  go.__arcRun = () => { Focus.back(); if (o.onConfirm) o.onConfirm(); };
  [no, go].forEach(b => b.addEventListener("click", safe("confirm click", (ev) => {
    if (ev.detail === 0) return;
    Input.set("key"); Focus.focusEl(b); Focus.activate();
  })));
  acts.appendChild(no); acts.appendChild(go);
  node.querySelector(".panel-body").remove();
  node.appendChild(acts);
  return pushPanel("confirm:" + (o.id || "action"), node, { hints:["navLR", "confirm", "cancel"] });
}

/* A modal "working…" card for an operation that has to finish before
   the human can do anything else (connecting to Wi-Fi, pairing). */
function busyPanel(title, sub){
  const node = panelShell(title, sub, "Working");
  const body = node.querySelector(".panel-body");
  const st = statEl("Starting…", null, true);
  body.appendChild(st);
  /* Deliberately no focusables: Circle still pops the scope, so the
     human is never trapped, but there is nothing to press by mistake. */
  const sc = pushPanel("busy", node, { hints:["cancel"], items:[] });
  return {
    scope: sc,
    say(text, kind, spinning){ setStat(st, text, kind, spinning === undefined ? true : spinning); },
    close(){ if (Focus.top() === sc) Focus.pop(); }
  };
}

const PANEL_BUILD = {

  /* Power. Restart and shut down are two presses, never one: a stray
     Cross on a console must not take the machine down mid-game. */
  power(){
    const node = panelShell("Power", "Rest keeps the session in memory. Restart and shut down ask again before they act.");
    const body = node.querySelector(".panel-body");
    [
      { label:"Rest mode",  sub:"Suspend to RAM — wake with the controller or the power button", icon:"rest",    act:"power",  arg:"sleep" },
      { label:"Restart",    sub:"Close everything and reboot the machine",                        icon:"restart", act:"powerConfirm", arg:"restart",  tone:"danger" },
      { label:"Shut down",  sub:"Close everything and power off",                                 icon:"shut",    act:"powerConfirm", arg:"shutdown", tone:"danger" },
      { label:"Sign out",   sub:"End this Windows session and return to the sign-in screen",      icon:"signout", act:"powerConfirm", arg:"signout",  tone:"danger" }
    ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
    if (!Host.caps.power)
      body.appendChild(noteEl("Restart and shut down route through the host's Shell Launcher exit codes on this build. " +
        "<b>Rest mode and sign out need host build v3</b> and will say so if the running host cannot do them."));
    return { node };
  },

  /* Profile. Real values when the host reports them, a labelled
     placeholder when it does not — never an invented user name. */
  profile(){
    const node = panelShell("Profile", "The Windows account this shell is running as.");
    const body = node.querySelector(".panel-body");

    const head = document.createElement("div");
    head.className = "profile";
    const user = hostValue("user", "(host has not reported the user)");
    head.innerHTML = '<div class="avatar"></div><div class="profile-id"><b></b><small></small></div>';
    head.querySelector(".avatar").textContent = (user[0] || "?").toUpperCase();
    head.querySelector("b").textContent = user;
    head.querySelector("small").textContent =
      hostValue("machine", "(host has not reported the machine name)") + " · " + hostValue("os", "Windows");
    body.appendChild(head);

    body.appendChild(factsEl([
      ["Account",  user],
      ["Machine",  hostValue("machine")],
      ["Domain",   hostValue("domain")],
      ["OS build", hostValue("os")],
      ["Uptime",   hostValue("uptime")]
    ]));
    [
      { label:"Switch user",      sub:"Stub — the account picker is not built yet", icon:"swap",    act:"stub", arg:"Switch user" },
      { label:"Account settings", sub:"Opens Settings → About",                     icon:"gear",    act:"settingsCat", arg:"about" },
      { label:"Sign out",         sub:"End this Windows session",                   icon:"signout", act:"powerConfirm", arg:"signout", tone:"danger" }
    ].forEach((o, i) => body.appendChild(rowEl(o, i, 0)));
    if (!Host.sys) body.appendChild(noteEl("<b>Placeholder values above.</b> The running host build does not report system information; host v3 fills these in."));
    return { node };
  },

  /* Settings. A category rail on the left, a content pane on the right,
     both pad-navigable, left/right crossing between them — and every
     pane reading and writing the real machine through Sys. */
  settings(){
    const node = panelShell("Settings",
      "Everything here reads the running machine. Anything the hardware cannot do says so instead of pretending.");
    const body = node.querySelector(".panel-body");
    const wrap = document.createElement("div");
    wrap.className = "settings";
    const cats = document.createElement("nav"); cats.className = "set-cats";
    const pane = document.createElement("div"); pane.className = "set-pane";
    wrap.appendChild(cats); wrap.appendChild(pane);
    body.appendChild(wrap);

    SET_CATS.forEach((c, i) => {
      cats.appendChild(rowEl({ label:c.label, sub:c.sub, icon:c.icon, act:"settingsCat", arg:c.id }, i, 0));
    });

    let shownCat = null;
    let paintSeq = 0;                     // guards a late async render of a pane you left
    let stale = false;                    // the pane changed while a picker sat on top of us

    /* Re-collect the scope's focusables after the pane's DOM changed.
       withRepaint is false while we are INSIDE repaint() (the scope's
       own onFocus hook calls paintPane) and true from an async
       continuation, which is not.

       A pane very often changes while something is stacked above it —
       a picker commits a setting and asks for a repaint before it pops.
       Syncing then would be syncing the wrong scope, so it is deferred:
       the flag is cleared the moment this scope is the top one again. */
    function sync(withRepaint){
      const sc0 = Focus.top();
      if (!sc0 || sc0.id !== "panel:settings"){ stale = true; return; }
      const keep = (Focus.current(sc0) || {}).el;
      Focus.syncItems(sc0, Focus.collect(node), keep && keep.isConnected ? keep : null);
      stale = false;
      if (withRepaint) Focus.repaint();
    }

    /* Called from the scope's onFocus hook, so it must be idempotent and
       must not re-enter repaint() during its synchronous part. */
    function paintPane(catId, force){
      const cat = SET_CATS.find(c => c.id === catId) || SET_CATS[0];
      if (cat.id === shownCat && !force) return;
      shownCat = cat.id;
      const mySeq = ++paintSeq;

      const sc0 = Focus.top();
      const keep = sc0 && sc0.id === "panel:settings" ? (Focus.current(sc0) || {}).el : null;
      pane.innerHTML = "";                       // read `keep` first: this removes nodes
      const h = document.createElement("h3"); h.textContent = cat.label;
      const p = document.createElement("p");  p.textContent = cat.blurb;
      pane.appendChild(h); pane.appendChild(p);
      cats.querySelectorAll(".row").forEach((r, i) =>
        r.setAttribute("aria-current", String(SET_CATS[i].id === cat.id)));

      let rowN = 0;
      const ctx = {
        pane,
        /* alive() is the whole reason a slow pane cannot corrupt a fast
           one: every async continuation checks it before touching the
           DOM, so walking down the category list while Wi-Fi is still
           scanning simply abandons the scan's render. */
        alive(){ return mySeq === paintSeq && pane.isConnected; },
        sec(title){ const e = document.createElement("h4"); e.textContent = title; pane.appendChild(e); return e; },
        add(el){ if (el) pane.appendChild(el); return el; },
        facts(pairs){ const e = factsEl(pairs); pane.appendChild(e); return e; },
        stat(text, kind, spinning){ const e = statEl(text, kind, spinning); pane.appendChild(e); return e; },
        note(html){ const e = noteEl(html); pane.appendChild(e); return e; },
        err(title, e){ const n = errEl(title, e); pane.appendChild(n); return n; },
        /* Rows are numbered as they are appended, all in column 1: the
           pane is one vertical list beside the category list. */
        row(o){ const b = actionRow(o, rowN++, 1); pane.appendChild(b); return b; },
        slider(o){ const b = sliderRow(o, rowN++, 1); pane.appendChild(b); return b; },
        sync(){ if (ctx.alive()) sync(true); },
        refresh(){ if (ctx.alive()) paintPane(cat.id, true); }
      };

      /* The synchronous part is done; hand the pane to the category and
         let it fill in from the OS. Nothing below can throw into the
         focus manager: a builder that fails renders an error card and
         the rest of the shell is untouched. */
      sync(false);
      Promise.resolve()
        .then(() => cat.build(ctx))
        .then(() => { if (ctx.alive()) sync(true); })
        .catch(e => {
          if (!ctx.alive()) return;
          hostLog("settings pane '" + cat.id + "' failed: " + (e && e.code ? e.code : "") + " " + (e && e.message));
          ctx.err("This section could not be read", e);
          sync(true);
        });
    }

    paintPane(SET_CATS[0].id);
    /* Let an action that changes what a pane shows (committing a name
       through the keyboard, applying a setting) force a redraw without
       knowing anything about this closure. */
    settingsRepaint = function(){ if (shownCat) paintPane(shownCat, true); };
    settingsGoto = function(id){
      const i = SET_CATS.findIndex(c => c.id === id);
      if (i < 0) return false;
      const el = cats.children[i];
      if (!el) return false;
      Focus.focusEl(el);
      return true;
    };

    return {
      node,
      scope: {
        hints: ["navAll", "select", "back"],
        crossColumns: true,             // category list | content pane
        onClose(){ settingsRepaint = null; settingsGoto = null; },
        onFocus(it){
          const el = it.el;
          /* First focus after a picker popped: the pane may have been
             rebuilt underneath us while it was on top. Re-collect before
             anything else, or half the rows are nodes that no longer
             exist and the cursor falls into a gap. */
          if (stale){
            stale = false;
            const sc0 = Focus.top();
            if (sc0 && sc0.id === "panel:settings")
              Focus.syncItems(sc0, Focus.collect(node), el.isConnected ? el : null);
          }
          if (el.parentElement === cats){
            const i = [...cats.children].indexOf(el);
            if (SET_CATS[i]) paintPane(SET_CATS[i].id);
          }
          Focus.ensureVisible(el);
        }
      }
    };
  },

  /* The control-centre quick panels are the same real state as the
     Settings categories, cut down to what you would want without
     leaving what you were doing. They share the builders, so the two
     can never drift apart. */
  display(){
    const node = panelShell("Display", "What Windows is driving this panel with, right now.");
    fillAsync(node, "display", (ctx) =>
      Sys.call("display.list").then(d => {
        const m = (d.displays || [])[0];
        if (!m){ ctx.stat("Windows reported no displays.", "bad"); return; }
        const hdr = m.hdr || {};
        ctx.facts([
          ["Display",    orDash(m.name)],
          ["Resolution", orDash(m.resolution)],
          ["Refresh",    fmtHz(m.refreshHz)],
          ["Scale",      m.scalePercent ? m.scalePercent + "%" : "—"],
          ["HDR",        !hdr.queryable ? "not exposed" : (!hdr.supported ? "unsupported" : (hdr.enabled ? "On" : "Off"))]
        ]);
        ctx.row({ label:"Resolution and refresh rate", sub:"Reverts itself unless you confirm the change",
                  tail:m.resolution, icon:"info", run: () => displayModePicker(m) });
        ctx.row({ label:"All display settings", sub:"Opens Settings → Display", icon:"gear",
                  run: () => ACT.settingsCatId("display") });
      }).catch(e => { ctx.err("Displays could not be read", e); }));
    return { node };
  },

  net(){

    fillAsync(node, "net", (ctx) =>

  sound(){

    fillAsync(node, "sound", (ctx) =>
      Sys.call("audio.devices").then(a => {
        const outs = a.outputs || [];
        const cur = outs.filter(o => o.isDefault)[0] || outs[0];
